async function feed(){const r=await db.from('posts').select('id,user_id,body,image_url,created_at').order('created_at',{ascending:false}).range(0,19);if(r.error)return `<div class="card empty">Feed unavailable: ${esc(r.error.message)}</div>`;const ps=r.data||[],ids=[...new Set(ps.map(x=>x.user_id))],mp={};if(ids.length){const q=await db.from('profiles').select('*').in('id',ids);(q.data||[]).forEach(p=>mp[p.id]=p)}return `<div class="stories card"><div class="story"><div class="storyRing"><div class="avatar">＋</div></div>Create</div>${ids.slice(0,10).map(id=>`<div class="story"><div class="storyRing">${av(mp[id])}</div>${esc(mp[id]?.username||'user')}</div>`).join('')}</div><div class="card composer"><div class="row">${av(meP)}<div><b>What is on your mind?</b><div class="tiny muted">Share something with your world.</div></div></div><textarea id="body" placeholder="Say something..."></textarea><div class="composebar"><label class="btn file">＋ Photo<input id="photo" type="file" accept="image/*"></label><label class="btn file">▶ Reel<input id="reelFile" type="file" accept="video/*"></label><span id="fname" class="tiny muted grow"></span><button class="btn primary" id="postBtn">Post</button></div></div>${ps.length?ps.map(p=>{const pp=mp[p.user_id]||{};return `<article class="card post"><div class="row posthead">${av(pp)}<div class="grow"><b>${esc(pp.display_name||pp.username||'User')}${badge(pp)}</b><div class="tiny muted">@${esc(pp.username||'user')} · ${new Date(p.created_at).toLocaleDateString()}</div></div><button class="icon" data-report="${p.id}">•••</button></div>${p.body?`<div class="posttext">${esc(p.body)}</div>`:''}${p.image_url?`<img class="postimg" loading="lazy" src="${esc(p.image_url)}">`:''}<div class="postactions"><button class="action" data-like="${p.id}">♡ Like</button><button class="action" data-comment="${p.id}">○ Comment</button><button class="action" data-share="${p.id}">↗ Share</button><button class="action" data-save="${p.id}">☆ Save</button></div></article>`}).join(''):`<div class="card empty">No posts yet.<br>Be the first voice on YOCEWOR.</div>`}`}

async function explore(){return `<div class="card pad"><h2>Explore</h2><div class="tabs"><button class="tab active">People</button><button class="tab">Trending</button><button class="tab">Topics</button></div><div class="search"><input id="q" class="field" placeholder="Search people or usernames"><button class="btn primary" id="searchBtn">Search</button></div><div id="results"></div></div>`}
async function doSearch(){const q=$('#q').value.trim();if(!q)return;const r=await db.from('profiles').select('*').or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).limit(30);$('#results').innerHTML=(r.data||[]).map(p=>`<div class="result">${av(p)}<div class="grow"><b>${esc(p.display_name||p.username)}${badge(p)}</b><div class="tiny muted">@${esc(p.username)}</div></div>${p.id!==me.id?`<button class="btn" data-follow="${p.id}">Follow</button>`:''}</div>`).join('')||`<div class="empty">No people found.</div>`;document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=async()=>{const r=await db.from('follows').upsert({follower_id:me.id,following_id:b.dataset.follow},{onConflict:'follower_id,following_id'});if(!r.error){b.textContent='Following';b.disabled=true}})}
async function reels(){const r=await db.from('reels').select('*').order('created_at',{ascending:false}).limit(20);return `<div class="card pad"><div class="row"><div class="grow"><h2 style="margin:0">Reels</h2><div class="tiny muted">Short videos from the YOCEWOR community.</div></div><label class="btn primary file">＋ Upload<input id="reelUpload" type="file" accept="video/*"></label></div></div><div style="height:12px"></div>${(r.data||[]).map(x=>`<article class="reel">${x.media_url.match(/\.(mp4|webm|mov)(\?|$)/i)?`<video src="${esc(x.media_url)}" controls playsinline style="width:100%;max-height:720px"></video>`:`<img src="${esc(x.media_url)}">`}<div class="reelCaption"><b>YOCEWOR Reel</b><div>${esc(x.caption||'')}</div></div></article>`).join('')||`<div class="card empty">No reels yet. Upload the first one.</div>`}`}
async function uploadReel(file){try{const url=await upload(file,'reels');const r=await db.from('reels').insert({user_id:me.id,media_url:url,caption:''});if(r.error)throw r.error;toast('Reel uploaded');route('reels')}catch(e){toast(e.message)}}
async function messages(){const cm=await db.from('conversation_members').select('conversation_id').eq('user_id',me.id);const ids=(cm.data||[]).map(x=>x.conversation_id);let conv=[];if(ids.length){const q=await db.from('conversations').select('*').in('id',ids).order('updated_at',{ascending:false});conv=q.data||[]}return `<div class="card pad"><div class="row"><div class="grow"><h2 style="margin:0">Messages</h2><div class="tiny muted">Private conversations.</div></div><button class="btn primary" id="newChat">New message</button></div><div style="margin-top:14px">${conv.length?conv.map(c=>`<button class="result" style="width:100%;background:transparent;border:0;color:inherit;text-align:left" data-chat="${c.id}"><b>Conversation</b><span class="grow"></span><span class="tiny muted">${new Date(c.updated_at).toLocaleString()}</span></button>`).join(''):`<div class="empty">No conversations yet. Find someone in Explore and start a message.</div>`}</div></div>`}
async function openChat(cid){const r=await db.from('messages').select('*').eq('conversation_id',cid).order('created_at',{ascending:true}).limit(100);const msgs=r.data||[];$('#modal').innerHTML=`<div class="modal"><div class="card modalbox chat"><div class="row"><b class="grow">Conversation</b><button class="icon" id="closeChat">×</button></div><div class="chatbody" id="chatbody">${msgs.map(m=>`<div class="msg ${m.sender_id===me.id?'mine':''}">${esc(m.body)}</div>`).join('')}</div><div class="chatbar"><input id="msg" class="field" placeholder="Write a message..."><button class="btn primary" id="sendMsg">Send</button></div></div></div>`;$('#closeChat').onclick=()=>$('#modal').innerHTML='';$('#sendMsg').onclick=async()=>{const body=$('#msg').value.trim();if(!body)return;const q=await db.from('messages').insert({conversation_id:cid,sender_id:me.id,body,message_type:'text'});if(q.error)toast(q.error.message);else openChat(cid)}}
async function notifications(){const r=await db.from('notifications').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(50);return `<div class="card pad"><h2>Notifications</h2>${(r.data||[]).map(n=>`<div class="result">${logo()}<div class="grow"><b>${esc(n.title||n.type)}</b><div>${esc(n.message||'Activity on your account')}</div><div class="tiny muted">${new Date(n.created_at).toLocaleString()}</div></div></div>`).join('')||`<div class="empty">You're all caught up.</div>`}</div>`}
async function profilePage(){const [pc,fo,fi]=await Promise.all([db.from('posts').select('id',{count:'exact',head:true}).eq('user_id',me.id),db.from('follows').select('follower_id',{count:'exact',head:true}).eq('following_id',me.id),db.from('follows').select('following_id',{count:'exact',head:true}).eq('follower_id',me.id)]);return `<div class="card profileHero"><div class="row">${av(meP)}<div class="grow"><h2 style="margin:0">${esc(meP.display_name)}${badge(meP)}</h2><div class="muted">@${esc(meP.username)}</div><p>${esc(meP.bio||'Your voice. Your world.')}</p></div><button class="btn" id="editProfile">Edit Profile</button></div><div class="profileStats"><div><strong>${pc.count||0}</strong><span class="tiny muted">Posts</span></div><div><strong>${fo.count||0}</strong><span class="tiny muted">Followers</span></div><div><strong>${fi.count||0}</strong><span class="tiny muted">Following</span></div></div><div class="card pad" style="margin-top:18px"><b>Verification</b><p class="tiny muted">${meP.is_verified?'Your account is verified.':'Apply for a YOCEWOR verification offer.'}</p><button class="btn primary" id="verifyBtn">${meP.is_verified?'Verified':'Verification & offers'}</button></div></div>`}
function settings(){return `<div class="card pad"><h2>Settings</h2><div class="setting"><div><b>Private account</b><div class="tiny muted">Only approved followers can see private content.</div></div><button class="switch" id="private"><i></i></button></div><div class="setting"><div><b>Notifications</b><div class="tiny muted">Likes, comments and follows.</div></div><button class="switch" id="notif"><i></i></button></div><h3>Appearance</h3><div class="themeGrid">${Object.entries(themes).map(([k,v])=>`<button class="theme" data-theme="${k}"><i style="--x:${v[0]};--y:${v[1]};--z:${v[2]}"></i>${k}</button>`).join('')}</div><div class="setting"><b>Logout</b><button class="btn" id="logout">Logout</button></div></div>`}
async function loadSettings(){const r=await db.from('user_settings').select('*').eq('user_id',me.id).maybeSingle();const s=r.data||{is_private:false,notifications_enabled:true};['private','notif'].forEach((id,i)=>{const b=$('#'+id);if(s[i===0?'is_private':'notifications_enabled'])b.classList.add('on');b.onclick=async()=>{b.classList.toggle('on');const val=b.classList.contains('on');const patch=i===0?{is_private:val}:{notifications_enabled:val};await db.from('user_settings').upsert({user_id:me.id,...patch},{onConflict:'user_id'})}});$('#logout').onclick=logout}
function help(){return `<div class="card pad"><h2>Help Center</h2><p class="muted">Need help? YOCEWOR support is here.</p><div class="setting"><div><b>AI Support</b><div class="tiny muted">Ask about login, posts, profile, messages or safety.</div></div><button class="btn primary" id="aiHelp">Start chat</button></div><div class="setting"><div><b>Report a problem</b><div class="tiny muted">Create a support ticket for a human review.</div></div><button class="btn" id="ticket">Create ticket</button></div><div class="tiny muted" style="margin-top:18px">Never share your password, OTP or payment PIN with support.</div></div>`}
function aiHelp(){const qs=['I cannot login','My post is not uploading','My account has a problem','I want to report abuse'];$('#modal').innerHTML=`<div class="modal"><div class="card modalbox"><div class="row"><b class="grow">YOCEWOR AI Support</b><button class="icon" id="x">×</button></div><div class="comments" style="margin-top:12px"><div class="comment"><div class="bubble"><b>YOCEWOR Support</b><div>Tell me what happened. I can guide you through the app and create a support ticket when needed.</div></div></div>${qs.map(q=>`<button class="btn" style="margin:5px" data-q="${q}">${q}</button>`).join('')}</div></div></div>`;$('#x').onclick=()=>$('#modal').innerHTML='';document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>toast('Support guidance: check your connection, refresh once, then retry. If it continues, create a ticket.'))}
async function ticket(){const s=prompt('Describe the problem');if(!s)return;const r=await db.from('support_tickets').insert({user_id:me.id,subject:'User support request',category:'app',status:'open'});if(r.error)toast(r.error.message);else toast('Support ticket created')}
async function route(v){view=v;bottom();const p=$('#page');if(v==='home'){p.innerHTML=await feed();bindFeed();return}if(v==='create'){p.innerHTML=await feed();bindFeed();$('#body')?.focus();return}if(v==='explore'){p.innerHTML=await explore();$('#searchBtn').onclick=doSearch;return}if(v==='reels'){p.innerHTML=await reels();$('#reelUpload')?.addEventListener('change',e=>uploadReel(e.target.files[0]));return}if(v==='messages'){p.innerHTML=await messages();document.querySelectorAll('[data-chat]').forEach(x=>x.onclick=()=>openChat(x.dataset.chat));return}if(v==='notifications'){p.innerHTML=await notifications();return}if(v==='profile'){p.innerHTML=await profilePage();$('#editProfile').onclick=()=>toast('Profile editor ready for the next profile-media pass');$('#verifyBtn').onclick=()=>{if(meP.is_verified)toast('Your verification is active');else route('verify')};return}if(v==='settings'){p.innerHTML=settings();await loadSettings();return}if(v==='help'){p.innerHTML=help();$('#aiHelp').onclick=aiHelp;$('#ticket').onclick=ticket;return}if(v==='verify'){p.innerHTML=`<div class="card pad"><h2>Verification offers</h2><p class="muted">Tell YOCEWOR about your public presence. We review the information and can issue an individual offer. Real payment is not enabled yet.</p><label>Full name</label><input id="vfName" class="field" value="${esc(meP.display_name)}"><label>Category</label><input id="vfCat" class="field" placeholder="Creator, business, public figure..."><label>Audience size</label><input id="vfAud" class="field" type="number"><label>Profile / website</label><input id="vfUrl" class="field" placeholder="https://..."><label>About you</label><textarea id="vfAbout" class="field" style="min-height:120px"></textarea><button class="btn primary" id="vfSend">Submit application</button></div>`;$('#vfSend').onclick=async()=>{const r=await db.from('verification_offer_profiles').upsert({user_id:me.id,full_name:$('#vfName').value,category:$('#vfCat').value,audience_size:Number($('#vfAud').value||0),profile_url:$('#vfUrl').value,about:$('#vfAbout').value,offer_currency:'INR',offer_status:'pending'},{onConflict:'user_id'});if(r.error)toast(r.error.message);else toast('Application submitted')}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-view]');if(n)route(n.dataset.view);const t=e.target.closest('[data-theme]');if(t){theme(t.dataset.theme);toast('Theme changed')}});
async function logout(){await db.auth.signOut();boot()}
async function boot(){const s=await db.auth.getSession();me=s.data.session?.user||null;if(!me){$('#topActions').innerHTML='';$('#bottom').innerHTML='';root.innerHTML=landing();$('#signup').onclick=()=>{root.innerHTML=auth('signup');bindAuth('signup')};$('#login').onclick=()=>{root.innerHTML=auth('login');bindAuth('login')};return}meP=await profile(me.id);$('#topActions').innerHTML=av(meP)+`<button class="icon" id="logoutTop">↪</button>`;$('#logoutTop').onclick=logout;root.innerHTML=shell();route('home')}
db.auth.onAuthStateChange(()=>setTimeout(boot,0));$('#brand').onclick=e=>{e.preventDefault();route(me?'home':'home')};boot();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
