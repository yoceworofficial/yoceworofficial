<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>YOCEWOR Content Manager</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px;position:sticky;top:0;z-index:1000}.wrap{max-width:1100px;margin:auto;padding:16px}.owner-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.owner-nav a{color:#fff;text-decoration:none;padding:9px 12px;border:1px solid #ffffff33;border-radius:10px;font-size:13px;font-weight:800}.owner-nav a.active{background:#fff;color:#102a43}.status{display:inline-flex;padding:6px 10px;border-radius:20px;background:#e9f7ef;color:#16844b;font-weight:800;font-size:12px}.frame{width:100%;height:calc(100vh - 170px);min-height:760px;border:0;display:block;background:#f3f6fa}.error{color:#b42318;font-weight:800}@media(max-width:650px){.owner-nav{display:grid;grid-template-columns:1fr 1fr}.owner-nav a{text-align:center}.frame{height:calc(100vh - 220px)}}.hide{display:none}</style></head><body><header class="top"><div class="wrap"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><h1 style="margin:0">📝 YOCEWOR CONTENT MANAGER</h1><div style="color:#dbe8f5;font-size:13px">Content Control Center</div></div><span id="role" class="status">VERIFYING…</span></div><nav class="owner-nav"><a href="/owner-dashboard.html">🏠 Home</a><a href="/dashboard.html">📊 Dashboard</a><a href="/team-management-live.html">👥 Team</a><a class="active" href="/content-owner.html">📝 Content</a><a href="/departments.html">🏢 Departments</a><a href="/important-notice.html">📢 Important Notice</a><a href="/live-notice.html">🔴 Live Notice</a><a href="/settings.html">⚙️ Settings</a><a href="/activity-audit.html">🧾 Activity / Audit</a><a href="/">🚪 Logout</a></nav></div></header><main class="wrap"><section id="guard" style="background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 16px #0001">Access verify हो रहा है…</section><section id="app" class="hide"><iframe id="contentFrame" class="frame" src="/content-live-fixed.html?embedded=1" title="YOCEWOR Content Management"></iframe></section></main><script src="/owner-auth-v6.js?content-owner-v1"></script><script>const $=id=>document.getElementById(id);function hideHeader(){try{const d=$('contentFrame').contentDocument;if(!d||!d.body)return;let s=d.getElementById('owner-content-cleanup');if(!s){s=d.createElement('style');s.id='owner-content-cleanup';s.textContent='html body>header.top,body>header.top{display:none!important}body{padding-top:0!important}';(d.head||d.documentElement).appendChild(s)}}catch(e){}}async function boot(){try{const auth=window.YOCEWOR_AUTH;if(!auth)throw Error('Authentication service unavailable.');const me=await auth.requireRole('owner');$('guard').classList.add('hide');$('app').classList.remove('hide');$('role').textContent='● '+String(me.role||'owner').toUpperCase()+' ACTIVE';const f=$('contentFrame');f.addEventListener('load',()=>{hideHeader();setTimeout(hideHeader,200);setTimeout(hideHeader,700);setTimeout(hideHeader,1500)});setTimeout(hideHeader,100)}catch(e){$('guard').innerHTML='<span class="error">'+e.message+'</span><br><br><button onclick="location.reload()">Retry</button>'}}boot();document.querySelector('a[href="/"]').onclick=async e=>{e.preventDefault();await window.YOCEWOR_AUTH.signOut();location.href='/'};</script></body></html>
