<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Job Draft</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#182235}.wrap{max-width:800px;margin:24px auto;padding:16px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 3px 16px #0001}label{display:block;font-weight:700;margin-top:12px}input,textarea,select,button{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #ccd5e0;border-radius:8px}textarea{min-height:100px}button{background:#174a7c;color:#fff;font-weight:700;border:0;margin-top:18px}.status{margin-bottom:14px}</style></head><body><main class="wrap"><div class="card"><h1>Recruitment Job Draft</h1><div id="status" class="status">Checking Editor access…</div><form id="form" hidden><label>Job Title<input id="title" required></label><label>Department<input id="department"></label><label>Start Date<input id="start_date" type="date"></label><label>Last Date<input id="last_date" type="date"></label><label>Eligibility<textarea id="eligibility"></textarea></label><label>Application / Official Link<input id="official_url" type="url"></label><label>Details<textarea id="details"></textarea></label><button>Save Draft / Submit for Review</button></form></div></main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn',{auth:{persistSession:true,autoRefreshToken:true}});(async()=>{const s=document.getElementById('status'),{data:{user}}=await db.auth.getUser();if(!user){s.textContent='Login required.';return}const {data:a}=await db.from('admin_users').select('role,is_active').eq('user_id',user.id).maybeSingle();if(String(a?.role||'').toLowerCase()!=='editor'||a.is_active===false){s.textContent='Access denied — Editor account required.';return}s.textContent='Editor verified.';document.getElementById('form').hidden=false;document.getElementById('form').onsubmit=async e=>{e.preventDefault();const payload={title:document.getElementById('title').value,department:document.getElementById('department').value,start_date:document.getElementById('start_date').value||null,last_date:document.getElementById('last_date').value||null,eligibility:document.getElementById('eligibility').value,official_url:document.getElementById('official_url').value||null,details:document.getElementById('details').value,published:false};const {data,error}=await db.from('jobs').insert(payload).select().single();if(error){s.textContent='Could not save draft: '+error.message;return}s.textContent='Draft saved successfully. Job ID: '+data.id;e.target.reset()}})();</script></body></html>
