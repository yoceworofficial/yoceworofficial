<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Job Draft</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#182235}.wrap{max-width:800px;margin:24px auto;padding:16px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 3px 16px #0001}label{display:block;font-weight:700;margin-top:12px}input,textarea,button{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #ccd5e0;border-radius:8px}textarea{min-height:90px}button{background:#174a7c;color:#fff;font-weight:700;border:0;margin-top:18px}.status{margin-bottom:14px}.hint{font-size:13px;color:#65758b}</style></head><body><main class="wrap"><div class="card"><h1>Recruitment Job Draft</h1><div id="status" class="status">Checking Editor access…</div><form id="form" hidden><label>Job Title<input id="title" required></label><label>Department<input id="department"></label><label>Start Date<input id="start_date" type="date"></label><label>Last Date<input id="last_date" type="date"></label><label>Eligibility<textarea id="eligibility"></textarea></label><label>Vacancy Details<textarea id="vacancy_details"></textarea></label><label>Application Fee<textarea id="application_fee"></textarea></label><label>Age Limit<textarea id="age_limit"></textarea></label><label>Selection Process<textarea id="selection_process"></textarea></label><label>Salary / Pay<textarea id="salary"></textarea></label><label>Important Documents<textarea id="important_documents"></textarea></label><label>Official Apply Link<input id="official_url" type="url"></label><label>Notification PDF Link<input id="notification_url" type="url"></label><label>Full Details<textarea id="details"></textarea></label><button>Save Draft / Submit for Review</button></form></div></main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn',{auth:{persistSession:true,autoRefreshToken:true}});(async()=>{const s=document.getElementById('status'),{data:{user}}=await db.auth.getUser();if(!user){s.textContent='Login required.';return}const {data:a}=await db.from('admin_users').select('role,is_active').eq('user_id',user.id).maybeSingle();if(String(a?.role||'').toLowerCase()!=='editor'||a.is_active===false){s.textContent='Access denied — Editor account required.';return}s.textContent='Editor verified.';document.getElementById('form').hidden=false;document.getElementById('form').onsubmit=async e=>{e.preventDefault();const g=id=>document.getElementById(id).value.trim();const payload={title:g('title'),department:g('department'),start_date:g('start_date')||null,last_date:g('last_date')||null,eligibility:g('eligibility'),vacancy_details:g('vacancy_details'),application_fee:g('application_fee'),age_limit:g('age_limit'),selection_process:g('selection_process'),salary:g('salary'),important_documents:g('important_documents'),official_url:g('official_url')||null,notification_url:g('notification_url')||null,details:g('details'),published:false};const {data,error}=await db.from('jobs').insert(payload).select().single();if(error){s.textContent='Could not save draft: '+error.message;return}s.textContent='Draft saved successfully. Job ID: '+data.id;e.target.reset()}})();</script></body></html>
