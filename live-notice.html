<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Notice | YOCEWOR</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.nav a{color:#fff;text-decoration:none;padding:8px 12px;border:1px solid #ffffff33;border-radius:10px;font-size:13px;font-weight:700}.nav a.active{background:#fff;color:#102a43}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #0001}input,textarea{width:100%;padding:10px;border:1px solid #d7dee8;border-radius:9px;margin:5px 0 10px}textarea{min-height:120px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#102a43;color:#fff;font-weight:700;cursor:pointer}.green{background:#16844b}.danger{background:#a51d22}.muted{color:#65758b;font-size:13px}.item{padding:12px 0;border-bottom:1px solid #e6ebf1}.status{display:inline-block;padding:6px 10px;border-radius:20px;background:#e9f7ef;color:#16844b;font-weight:700;font-size:12px}.error{color:#b42318;font-weight:700}@media(max-width:650px){.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.nav a{text-align:center}}</style></head><body><header class="top"><div class="wrap"><h1>🔴 Live Notice</h1><nav class="nav"><a href="/owner-dashboard.html">🏠 Home</a><a href="/dashboard.html">📊 Dashboard</a><a href="/team-management-live.html">👥 Team</a><a href="/content.html">📝 Content</a><a href="/departments.html">🏢 Departments</a><a href="/important-notice.html">📢 Important Notice</a><a class="active" href="/live-notice.html">🔴 Live Notice</a><a href="/settings.html">⚙️ Settings</a><a href="/activity-audit.html">🧾 Activity / Audit</a><a href="/" id="logout">🚪 Logout</a></nav></div></header><main class="wrap"><section id="guard" class="card">Owner access verify हो रहा है…</section><section id="app" style="display:none"><section class="card"><h2>＋ New Live Notice</h2><input id="title" placeholder="Live notice title"><textarea id="body" placeholder="Live notice content"></textarea><input id="image" placeholder="Optional image URL"><button class="btn green" id="save">Publish Live Notice</button><div id="msg" class="muted"></div></section><section class="card"><h2>🔴 Live Notices</h2><div id="list">Loading…</div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://mzntgjyecymcpzciklfk.supabase.co',KEY='sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sb-mzntgjyecymcpzciklfk-auth-token'}}),$=id=>document.getElementById(id);async function token(){const s=await db.auth.getSession();return s.data?.session?.access_token||null}async function fn(action,extra={}){const t=await token();if(!t)throw Error('Login session missing. Please login again.');const r=await db.functions.invoke('team-management',{body:{action,...extra},headers:{Authorization:'Bearer '+t,apikey:KEY}});if(r.error)throw r.error;if(r.data?.error)throw Error(r.data.error);return r.data}async function owner(){const m=await fn('me');if(String(m.role||'').toLowerCase()!=='owner')throw Error('Owner access required');return m}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function refresh(){const r=await db.from('jobs').select('*').eq('type','Live Notice').order('updated_at',{ascending:false});if(r.error){$('list').textContent=r.error.message;return}$('list').innerHTML=(r.data||[]).map(x=>'<div class="item"><b>'+esc(x.title)+'</b> <span class="status">'+(x.published?'LIVE':'OFF')+'</span><br><span class="muted">'+esc(x.description||x.main_content||'')+'</span><br><button class="btn danger" onclick="toggle(\''+x.id+'\','+x.published+')">'+(x.published?'Turn Off':'Make Live')+'</button></div>').join('')||'<span class="muted">No live notices.</span>'}async function toggle(id,p){const r=await db.from('jobs').update({published:!p,published_at:!p?new Date().toISOString():null}).eq('id',id);if(r.error)alert(r.error.message);refresh()}$('save').onclick=async()=>{try{const m=await owner(),title=$('title').value.trim(),body=$('body').value.trim();if(!title||!body)throw Error('Title and content are required.');const r=await db.from('jobs').insert({title,type:'Live Notice',description:body,main_content:body,category:'Live Notice',featured_image:$('image').value.trim()||null,published:true,published_at:new Date().toISOString(),slug:'live-'+Date.now(),created_by:m.user_id});if(r.error)throw r.error;$('msg').textContent='✅ Live';$('title').value='';$('body').value='';$('image').value='';refresh()}catch(e){$('msg').textContent='❌ '+e.message}}$('logout').onclick=async e=>{e.preventDefault();await db.auth.signOut();location.href='/'};owner().then(()=>{$('guard').style.display='none';$('app').style.display='block';refresh()}).catch(e=>$('guard').innerHTML='<span class="error">'+e.message+'</span>');</script></body></html>
