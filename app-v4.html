async function comments(id){const r=await db.from('comments').select('*').eq('post_id',id).order('created_at');const cs=r.data||[];$('#modal').innerHTML='<div class="modal"><div class="card modalbox"><div class="row"><h2 class="grow">Comments</h2><button class="icon" id="x">×</button></div><div class="comments">'+(cs.length?cs.map(c=>'<div class="comment"><div class="bubble">'+esc(c.body)+(c.user_id===me.id?'<br><button class="btn danger tiny" data-del-comment="'+c.id+'">Delete</button>':'')+'</div></div>').join(''):'<div class="empty">No comments yet.</div>')+'</div><div class="row"><input id="cb" class="field" placeholder="Write a comment"><button class="btn primary" id="cs">Send</button></div></div></div>';$('#x').onclick=()=>$('#modal').innerHTML='';$('#cs').onclick=async()=>{const b=$('#cb').value.trim();if(!b)return;const q=await db.from('comments').insert({post_id:id,user_id:me.id,body:b});if(q.error)toast(q.error.message);else comments(id)};document.querySelectorAll('[data-del-comment]').forEach(b=>b.onclick=async()=>{const q=await db.from('comments').delete().eq('id',b.dataset.delComment).eq('user_id',me.id);if(q.error)toast(q.error.message);else comments(id)})}
async function like(id){const q=await db.from('likes').select('post_id').eq('post_id',id).eq('user_id',me.id).maybeSingle();const r=q.data?await db.from('likes').delete().eq('post_id',id).eq('user_id',me.id):await db.from('likes').insert({post_id:id,user_id:me.id});if(r.error)toast(r.error.message);else route('home')}async function save(id){const r=await db.from('saved_posts').upsert({user_id:me.id,post_id:id},{onConflict:'user_id,post_id'});toast(r.error?r.error.message:'Saved')}
async function explore(){return '<div class="card sidecard"><h2>'+t('explore')+'</h2><div class="row"><input id="q" class="field" placeholder="Search people"><button class="btn primary" id="search">Search</button></div><div id="results"></div></div>'}async function search(){const q=$('#q').value.trim();if(!q)return;const r=await db.from('profiles').select('*').or('username.ilike.%'+q+'%,display_name.ilike.%'+q+'%').limit(30);$('#results').innerHTML=(r.data||[]).map(p=>'<div class="result">'+av(p)+'<div class="grow"><b>'+esc(p.display_name)+badge(p)+'</b><div class="tiny muted">@'+esc(p.username)+'</div></div>'+(p.id!==me.id?'<button class="btn" data-follow="'+p.id+'">Follow</button><button class="btn" data-msg="'+p.id+'">Message</button><button class="btn danger" data-block="'+p.id+'">Block</button>':'')+'</div>').join('')||'<div class="empty">No people found.</div>';document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=async()=>{const p=await profile(b.dataset.follow),status=p.is_private?'pending':'accepted',r=await db.from('follows').upsert({follower_id:me.id,following_id:b.dataset.follow,status},{onConflict:'follower_id,following_id'});if(!r.error)b.textContent=status==='pending'?'Requested':'Following';else toast(r.error.message)});document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>block(b.dataset.block));document.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>startChat(b.dataset.msg))}
async function block(id){const r=await db.from('blocks').upsert({blocker_id:me.id,blocked_id:id},{onConflict:'blocker_id,blocked_id'});toast(r.error?r.error.message:'User blocked')} 
async function reels(){const r=await db.from('reels').select('*').order('created_at',{ascending:false}).limit(30);let h='<div class="card sidecard"><div class="row"><div class="grow"><h2>'+t('reels')+'</h2><div class="tiny muted">Create, watch and share reels.</div></div><label class="btn primary file">＋ Upload<input id="rf" type="file" accept="video/*"></label></div></div>';h+=(r.data||[]).map(x=>'<article class="reel">'+(x.media_url?(x.media_url.match(/\.(mp4|webm|mov)(\?|$)/i)?'<video src="'+esc(x.media_url)+'" controls playsinline></video>':'<img src="'+esc(x.media_url)+'">'):'<div class="reelposter"><div><div class="y">Y</div><h2>YOCEWOR</h2></div></div>')+'<div class="caption"><b>YOCEWOR'+(x.user_id===me.id?' Reel':' Official')+'</b><div>'+esc(x.caption||'Your Voice. Your World.')+'</div><div class="bar"><button class="btn" data-share-reel="'+x.id+'">Share</button>'+(x.user_id===me.id?'<button class="btn danger" data-del-reel="'+x.id+'">Delete</button>':'')+'</div></div></article>').join('')||'<div class="card empty">No reels yet.</div>';return h}async function uploadReel(f){try{const u=await upload(f,'reels');const r=await db.from('reels').insert({user_id:me.id,media_url:u,caption:'',visibility:'public',engagement_visibility:'public',allow_download:true});if(r.error)throw r.error;toast('Reel uploaded');route('reels')}catch(e){toast(e.message)}}async function delReel(id){if(!confirm('Delete your reel?'))return;const r=await db.from('reels').delete().eq('id',id).eq('user_id',me.id);if(r.error)toast(r.error.message);else route('reels')}
async function stories(){const r=await db.from('stories').select('*').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(40);const ss=r.data||[];$('#modal').innerHTML='<div class="modal"><div class="card modalbox"><div class="row"><h2 class="grow">Stories</h2><button class="icon" id="x">×</button></div><label class="btn primary file">＋ Add Story<input id="sf" type="file" accept="image/*,video/*"></label><div style="margin-top:12px">'+(ss.length?ss.map(s=>'<div class="result"><div class="grow"><b>'+esc(s.caption||'YOCEWOR Story')+'</b><div class="tiny muted">'+new Date(s.created_at).toLocaleString()+'</div></div><button class="btn" data-story="'+s.id+'">View</button>'+(s.user_id===me.id?'<button class="btn danger" data-del-story="'+s.id+'">Delete</button>':'')+'</div>').join(''):'<div class="empty">No active stories.</div>')+'</div></div></div>';$('#x').onclick=()=>$('#modal').innerHTML='';$('#sf').onchange=e=>uploadStory(e.target.files[0]);document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>viewStory(b.dataset.story));document.querySelectorAll('[data-del-story]').forEach(b=>b.onclick=()=>delStory(b.dataset.delStory))}async function uploadStory(f){try{const u=await upload(f,'stories'),r=await db.from('stories').insert({user_id:me.id,media_url:u,media_type:f.type.startsWith('video/')?'video':'image',caption:'',expires_at:new Date(Date.now()+86400000).toISOString(),visibility:'public',engagement_visibility:'public',allow_download:true});if(r.error)throw r.error;toast('Story added');stories()}catch(e){toast(e.message)}}async function delStory(id){if(!confirm('Delete your story?'))return;const r=await db.from('stories').delete().eq('id',id).eq('user_id',me.id);if(r.error)toast(r.error.message);else stories()}async function viewStory(id){const r=await db.from('stories').select('*').eq('id',id).maybeSingle();if(r.error||!r.data)return;await db.from('story_views').upsert({story_id:id,viewer_id:me.id},{onConflict:'story_id,viewer_id'});const s=r.data;$('#modal').innerHTML='<div class="modal"><div class="card modalbox" style="text-align:center"><button class="icon" id="x" style="float:right">×</button><div style="clear:both"></div>'+(s.media_type==='video'?'<video src="'+esc(s.media_url)+'" controls autoplay style="max-width:100%;max-height:70vh"></video>':'<img src="'+esc(s.media_url)+'" style="max-width:100%;max-height:70vh;border-radius:14px">')+'<p>'+esc(s.caption||'')+'</p><button class="btn" id="downloadStory">Download</button></div></div>';$('#x').onclick=()=>$('#modal').innerHTML='';$('#downloadStory').onclick=()=>window.open(s.media_url,'_blank')}
async function messages(){const r=await db.from('conversation_members').select('conversation_id').eq('user_id',me.id);const ids=(r.data||[]).map(x=>x.conversation_id);return '<div class="card sidecard"><h2>'+t('messages')+'</h2><div class="tiny muted">Private messages.</div>'+(ids.length?ids.map(id=>'<button class="result" style="width:100%;background:transparent;border:0;color:#fff" data-chat="'+id+'"><b>Conversation</b></button>').join(''):'<div class="empty">Find a person in Explore and tap Message.</div>')+'</div>'}async function startChat(target){try{const cm=await db.from('conversation_members').select('conversation_id').eq('user_id',me.id);let cid=null;for(const x of cm.data||[]){const q=await db.from('conversation_members').select('user_id').eq('conversation_id',x.conversation_id);const a=(q.data||[]).map(y=>y.user_id);if(a.includes(target)&&a.includes(me.id)&&a.length===2){cid=x.conversation_id;break}}if(!cid){const c=await db.from('conversations').insert({}).select('id').single();if(c.error)throw c.error;cid=c.data.id;await db.from('conversation_members').insert([{conversation_id:cid,user_id:me.id},{conversation_id:cid,user_id:target}])}openChat(cid)}catch(e){toast(e.message)}}async function openChat(id){const r=await db.from('messages').select('*').eq('conversation_id',id).order('created_at');$('#modal').innerHTML='<div class="modal"><div class="card modalbox chat"><div class="row"><b class="grow">Messages</b><button class="icon" id="x">×</button></div><div class="chatbody">'+(r.data||[]).map(m=>'<div class="msg '+(m.sender_id===me.id?'mine':'')+'">'+esc(m.body)+'</div>').join('')+'</div><div class="chatbar"><input id="msg" class="field" placeholder="Message"><button class="btn primary" id="send">Send</button></div></div></div>';$('#x').onclick=()=>$('#modal').innerHTML='';$('#send').onclick=async()=>{const b=$('#msg').value.trim();if(!b)return;const q=await db.from('messages').insert({conversation_id:id,sender_id:me.id,body:b,message_type:'text'});if(q.error)toast(q.error.message);else openChat(id)}}
async function settings(){const r=await db.from('user_settings').select('*').eq('user_id',me.id).maybeSingle(),s=r.data||{is_private:false,notifications_enabled:true};return '<div class="card sidecard"><h2>'+t('settings')+'</h2><div class="setting"><div><b>'+t('language')+'</b><div class="tiny muted">Change app language.</div></div>'+langSel()+'</div><div class="setting"><div><b>Private account</b><div class="tiny muted">Approve followers before they see private content.</div></div><button class="switch '+(s.is_private?'on':'')+'" id="private"><i></i></button></div><div class="setting"><div><b>Notifications</b><div class="tiny muted">Likes, comments, follows and messages.</div></div><button class="switch '+(s.notifications_enabled!==false?'on':'')+'" id="notif"><i></i></button></div><div class="setting"><div><b>Close Friends</b><div class="tiny muted">Choose people for private stories.</div></div><button class="btn" id="cf">Manage</button></div><div class="setting"><div><b>Blocked accounts</b><div class="tiny muted">Block/unblock users.</div></div><button class="btn" id="blocks">Manage</button></div><div class="setting"><div><b>Theme</b><div class="themegrid">'+Object.entries(themes).map(([k,v])=>'<button class="theme" data-theme="'+k+'"><i style="--x:'+v[0]+';--y:'+v[1]+';--z:'+v[2]+'"></i>'+k+'</button>').join('')+'</div></div></div><div class="latest"><b>Latest Update</b><div class="tiny muted">YOCEWOR v4.0 • 10 Aug 2026</div><div class="copy"><code id="cc">privacy • delete-own-content • story/reel downloads • social login • official account</code><button class="btn" id="cp">Copy</button></div></div><button class="btn danger" id="logout">'+t('logout')+'</button></div>'}async function bindSettings(){const pb=$('#private'),nb=$('#notif');pb.onclick=async()=>{const on=!pb.classList.contains('on');const r=await db.from('user_settings').upsert({user_id:me.id,is_private:on},{onConflict:'user_id'});if(r.error)toast(r.error.message);else{pb.classList.toggle('on');mp.is_private=on}};nb.onclick=async()=>{const on=!nb.classList.contains('on');const r=await db.from('user_settings').upsert({user_id:me.id,notifications_enabled:on},{onConflict:'user_id'});if(!r.error)nb.classList.toggle('on')};$('#lang').onchange=e=>{lang=e.target.value;localStorage.yLang=lang;boot()};$('#logout').onclick=logout;$('#cp').onclick=()=>navigator.clipboard?.writeText($('#cc').textContent).then(()=>toast('Copied'));$('#cf').onclick=closeFriends;$('#blocks').onclick=blockedList;document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{setTheme(b.dataset.theme);toast('Theme changed')})}
async function closeFriends(){const r=await db.from('close_friends').select('friend_id').eq('user_id',me.id);const ids=(r.data||[]).map(x=>x.friend_id);const p=await db.from('profiles').select('id,username,display_name').neq('id',me.id).limit(50);$('#modal').innerHTML='<div class="modal"><div class="card modalbox"><div class="row"><h2 class="grow">Close Friends</h2><button class="icon" id="x">×</button></div>'+(p.data||[]).map(u=>'<div class="result"><div class="grow"><b>'+esc(u.display_name)+'</b><div class="tiny muted">@'+esc(u.username)+'</div></div><button class="btn '+(ids.includes(u.id)?'primary':'')+'" data-cf="'+u.id+'">'+(ids.includes(u.id)?'Added':'Add')+'</button></div>').join('')+'</div></div>';$('#x').onclick=()=>$('#modal').innerHTML='';document.querySelectorAll('[data-cf]').forEach(b=>b.onclick=async()=>{if(ids.includes(b.dataset.cf)){await db.from('close_friends').delete().eq('user_id',me.id).eq('friend_id',b.dataset.cf);b.textContent='Add';b.classList.remove('primary')}else{await db.from('close_friends').insert({user_id:me.id,friend_id:b.dataset.cf});b.textContent='Added';b.classList.add('primary');ids.push(b.dataset.cf)}})}async function blockedList(){const r=await db.from('blocks').select('blocked_id').eq('blocker_id',me.id);$('#modal').innerHTML='<div class="modal"><div class="card modalbox"><div class="row"><h2 class="grow">Blocked Accounts</h2><button class="icon" id="x">×</button></div>'+(r.data||[]).map(b=>'<div class="result"><code>'+b.blocked_id+'</code><button class="btn" data-unblock="'+b.blocked_id+'">Unblock</button></div>').join('')||'<div class="empty">No blocked accounts.</div>'+'</div></div>';$('#x').onclick=()=>$('#modal').innerHTML='';document.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=async()=>{await db.from('blocks').delete().eq('blocker_id',me.id).eq('blocked_id',b.dataset.unblock);blockedList()})}
async function profilePage(){const r=await db.from('posts').select('id',{count:'exact',head:true}).eq('user_id',me.id);return '<div class="card sidecard"><div class="row">'+av(mp)+'<div class="grow"><h2 style="margin:0">'+esc(mp.display_name)+badge(mp)+'</h2><div class="muted">@'+esc(mp.username)+'</div><p>'+esc(mp.bio||'Your Voice. Your World.')+'</p></div><button class="btn" id="edit">Edit</button></div><div class="stats"><b>'+(r.count||0)+'<span class="tiny muted"> Posts</span></b><b>Followers</b><b>Following</b></div><button class="btn primary" style="margin-top:15px" id="myStories">My Stories</button></div>'}function editProfile(){const n=prompt('Display name',mp.display_name),u=prompt('Username',mp.username),b=prompt('Bio',mp.bio||'');if(!n||!u)return;db.from('profiles').update({display_name:n,username:u.toLowerCase(),bio:b||''}).eq('id',me.id).then(r=>{if(r.error)toast(r.error.message);else{mp=Object.assign(mp,{display_name:n,username:u.toLowerCase(),bio:b||''});route('profile')}})}
async function notifications(){const r=await db.from('notifications').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(50);return '<div class="card sidecard"><h2>'+t('notifications')+'</h2>'+(r.data||[]).map(n=>'<div class="result"><div class="grow"><b>'+esc(n.title||n.type||'Activity')+'</b><div>'+esc(n.message||'Activity on your account')+'</div></div></div>').join('')||'<div class="empty">All caught up.</div>'+'</div>'}async function help(){return '<div class="card sidecard"><h2>Help Center</h2><div class="setting"><b>Community Guidelines</b><button class="btn" id="guide">Read</button></div><div class="setting"><b>Report a problem</b><button class="btn" id="ticket">Create ticket</button></div></div>'}
async function route(v){view=v;$('#bottom').innerHTML=bottom();const p=$('#page');if(v==='home'||v==='create'){p.innerHTML=await feed();bindFeed();return}if(v==='explore'){p.innerHTML=await explore();$('#search').onclick=search;return}if(v==='reels'){p.innerHTML=await reels();$('#rf')?.addEventListener('change',e=>uploadReel(e.target.files[0]));document.querySelectorAll('[data-del-reel]').forEach(b=>b.onclick=()=>delReel(b.dataset.delReel));return}if(v==='messages'){p.innerHTML=await messages();document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>openChat(b.dataset.chat));return}if(v==='notifications'){p.innerHTML=await notifications();return}if(v==='profile'){p.innerHTML=await profilePage();$('#edit').onclick=editProfile;$('#myStories').onclick=stories;return}if(v==='settings'){p.innerHTML=await settings();bindSettings();return}if(v==='help'){p.innerHTML=await help();$('#guide').onclick=()=>toast('Guidelines: no scams, fake engagement, harassment, hate, illegal abuse or security bypass. Two warnings may lead to a ban after review.');return}}
function bindFeed(){document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>like(b.dataset.like));document.querySelectorAll('[data-comment]').forEach(b=>b.onclick=()=>comments(b.dataset.comment));document.querySelectorAll('[data-del-post]').forEach(b=>b.onclick=()=>delPost(b.dataset.delPost));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save));document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{const u=location.href.split('#')[0]+'#post-'+b.dataset.share;navigator.share?navigator.share({title:'YOCEWOR',url:u}):navigator.clipboard?.writeText(u).then(()=>toast('Link copied'))});$('#post')?.addEventListener('click',createPost);document.querySelectorAll('[data-official-story]').forEach(b=>b.onclick=stories)}
async function logout(){await db.auth.signOut();boot()}async function boot(){try{const s=await db.auth.getSession();me=s.data.session?.user||null;$('#actions').innerHTML=me?langSel()+av(mp||{})+'<button class="icon" id="gear">'+I.settings+'</button><button class="icon" id="out">↪</button>':langSel();$('#lang').onchange=e=>{lang=e.target.value;localStorage.yLang=lang;boot()};if(!me){root.innerHTML=landing();$('#signup').onclick=()=>{root.innerHTML=auth('signup');bindAuth('signup')};$('#login').onclick=()=>{root.innerHTML=auth('login');bindAuth('login')};return}mp=await profile(me.id);$('#actions').innerHTML=langSel()+av(mp)+'<button class="icon" id="gear">'+I.settings+'</button><button class="icon" id="out">↪</button>';$('#lang').onchange=e=>{lang=e.target.value;localStorage.yLang=lang;boot()};$('#gear').onclick=()=>route('settings');$('#out').onclick=logout;root.innerHTML=shell();$('#copy').onclick=()=>navigator.clipboard?.writeText($('#copycode').textContent).then(()=>toast('Copied'));await route('home')}catch(e){root.innerHTML='<div class="wrap" style="padding:40px"><div class="card sidecard"><h2>YOCEWOR could not load</h2><p class="muted">'+esc(e.message)+'</p><button class="btn primary" onclick="location.reload()">Reload</button></div></div>'}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)route(b.dataset.v);});$('#brand').onclick=e=>{e.preventDefault();if(me)route('home')};setTimeout(()=>$('#splash').classList.add('hide'),1700);setTimeout(()=>$('#splash').remove(),2200);boot();
</script></body></html>
