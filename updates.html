<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>नई Updates | YOCEWOR</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f3f6f9;color:#17202a}.wrap{width:min(1180px,94%);margin:auto}.head{background:#fff;border-bottom:4px solid #f58220}.headin{padding:16px 0}.brand{font-size:25px;font-weight:900;color:#073b72;text-decoration:none}.nav{background:#073b72}.nav a{display:inline-block;color:#fff;text-decoration:none;padding:12px}.bar{background:#fff;padding:10px 0}.barin{display:flex;gap:8px}.bar input,.bar select{padding:10px;border:1px solid #b9c5d0}.bar input{flex:1}.section{padding:20px 0}.title{background:#073b72;color:#fff;border-left:5px solid #f58220;padding:11px 15px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:11px}.job{background:#fff;border:1px solid #d7dee6;border-top:3px solid #16844b;padding:15px}.job h2{font-size:16px;line-height:1.4;color:#17324d}.tag{display:inline-block;background:#edf3f8;color:#073b72;font-size:10px;font-weight:800;padding:5px 7px}.dept{font-size:12px;color:#596773}.img{width:100%;max-height:210px;object-fit:cover;border-radius:8px;margin-top:10px}.links{display:grid;grid-template-columns:1fr;gap:7px;margin-top:10px}.links a{padding:9px;text-align:center;text-decoration:none;background:#f5f7fa;border:1px solid #d7dee6;color:#344454;font-size:11px;font-weight:800}.links .open{background:#073b72;color:#fff}.empty{background:#fff;border:1px solid #d7dee6;padding:45px;text-align:center;color:#596773}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.barin{flex-direction:column}}</style></head><body><header class="head"><div class="wrap headin"><a class="brand" href="index.html">YOCEWOR</a></div></header><nav class="nav"><div class="wrap"><a href="index.html">⌂ होम</a><a href="updates.html">नई Updates</a></div></nav><div class="bar"><div class="wrap barin"><input id="search" placeholder="भर्ती / परीक्षा / विभाग खोजें..."><select id="type"><option value="all">सभी Updates</option><option>Recruitment</option><option>Result</option><option>Admit Card</option><option>Exam / Syllabus</option><option>Exam / Date</option><option>Admission</option><option>Scholarship</option><option>Government Scheme</option><option>General Notice</option></select></div></div><main class="wrap"><section class="section"><div class="title">📢 नवीनतम Updates</div><div id="list" class="grid"></div><div id="empty" class="empty" hidden>अभी कोई published update उपलब्ध नहीं है।</div></section></main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn');let jobs=[];const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let q=await db.from('jobs').select('*').eq('published',true).order('updated_at',{ascending:false});if(q.error){$('empty').hidden=false;$('empty').textContent='Updates load नहीं हुए।';return}jobs=q.data||[];render()}function render(){let q=$('search').value.toLowerCase().trim(),t=$('type').value,a=jobs.filter(x=>(t==='all'||x.type===t)&&(!q||(x.title+' '+(x.department||'')+' '+(x.qualification||'')+' '+(x.category||'')).toLowerCase().includes(q)));$('list').innerHTML=a.map(x=>'<article class="job"><span class="tag">'+esc((x.type||'UPDATE').toUpperCase())+'</span><h2>'+esc(x.title)+'</h2><div class="dept">'+esc(x.department||'')+'</div>'+(x.featured_image?'<img class="img" src="'+esc(x.featured_image)+'" alt="'+esc(x.title)+'" loading="lazy">':'')+'<div class="links"><a class="open" href="job.html?id='+encodeURIComponent(x.id)+'">पूरी जानकारी →</a></div></article>').join('');$('empty').hidden=!!a.length}load();$('search').on
