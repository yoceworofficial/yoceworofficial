ticle class="job"><span class="tag">'+esc(label)+'</span><h2>'+esc(x.title)+'</h2><div class="dept">'+esc(x.department||'')+'</div>'+(x.featured_image?'<img class="img" src="'+esc(x.featured_image)+'" alt="'+esc(x.title)+'" loading="lazy">':'')+'<div class="links"><a href="job-details.html?id='+encodeURIComponent(x.id)+'">पूरी जानकारी →</a></div></article>'}).join('');$('empty').hidden=!!a.length}load().catch(()=>{$('empty').hidden=false;$('empty').textContent='Updates load नहीं हुए।'});$('search').oninput=render;$('type').onchange=render;</script></body></html>
