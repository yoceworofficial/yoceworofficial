<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Staff ID Card</title><style>@media print{body{background:#fff}.actions{display:none!important}}body{font-family:system-ui;margin:0;background:#eef2f6;color:#172033}.wrap{max-width:560px;margin:28px auto;padding:16px}.card{background:#fff;border:1px solid #d6dde6;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #0001}.head{padding:18px;text-align:center;border-bottom:1px solid #e3e8ef}.body{padding:20px}.row{display:flex;justify-content:space-between;gap:18px;padding:9px 0;border-bottom:1px solid #edf0f4}.label{font-weight:700}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}button{padding:11px;border:0;border-radius:9px;background:#174a7c;color:#fff;font-weight:700}.status{text-align:center;margin:12px 0;color:#667085}</style></head><body><main class="wrap"><div id="status" class="status">Checking staff account…</div><section id="card" class="card" hidden><div class="head"><h1>YOCEWOR</h1><div>OFFICIAL STAFF ID CARD</div></div><div class="body"><div class="row"><span class="label">Name</span><span id="name"></span></div><div class="row"><span class="label">User ID</span><span id="uid"></span></div><div class="row"><span class="label">Role</span><span id="role"></span></div><div class="row"><span class="label">Designation</span><span id="designation"></span></div><div class="row"><span class="label">Department</span><span id="department"></span></div><div class="row"><span class="label">Joining Date</span><span id="joining"></span></div><div class="row"><span class="label">Card Number</span><span id="cardno"></span></div><div class="actions"><button onclick="window.print()">Print ID Card</button><button onclick="history.back()">Back</button></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn',{auth:{persistSession:true,autoRefreshToken:true}});(async()=>{const s=document.getElementById('status');const {data:{user}}=await db.auth.getUser();if(!user){s.textContent='Login required.';return}const {data:a}=await db.from('admin_users').select('user_id,role,is_active,full_name,designation,department_id,joining_date').eq('user_id',user.id).maybeSingle();if(!a?.is_active||!['owner','gm','admin','editor'].includes(String(a.role).toLowerCase())){s.textContent='Unauthorized or inactive staff account.';return}const {data:c}=await db.from('team_id_cards').select('*').eq('user_id',user.id).maybeSingle();document.getElementById('name').textContent=a.full_name||user.user_metadata?.full_name||'—';document.getElementById('uid').textContent=user.id;document.getElementById('role').textContent=a.role;document.getElementById('designation').textContent=a.designation||'—';document.getElementById('department').textContent=a.department_id||'—';document.getElementById('joining').textContent=a.joining_date||'—';document.getElementById('cardno').textContent=c?.card_number||'—';document.getElementById('card').hidden=false;s.textContent=''})()</script></body></html>
