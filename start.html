<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07040f"><title>YOCEWOR — Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#2a1047,transparent 40%),radial-gradient(circle at 100% 40%,#171052,transparent 40%),#07040f;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center}.box{width:min(470px,calc(100% - 28px));padding:24px;background:#111526;border:1px solid #2b3047;border-radius:24px;box-shadow:0 20px 70px #0008}.logo{width:76px;height:76px;border-radius:24px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(135deg,#ffb300,#ff2f7e,#7c4dff);font-size:40px;font-weight:900}.center{text-align:center}.muted{color:#a7acc1}.tabs,.tw{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn,input{width:100%;box-sizing:border-box;border-radius:13px;padding:12px;margin-top:8px;background:#151a2b;color:#fff;border:1px solid #30364e}.btn{font-weight:800;cursor:pointer}.primary{border:0;background:linear-gradient(100deg,#ff6a00,#ff2f7e)}.msg{min-height:22px;color:#a7acc1;font-size:13px;margin-top:10px}.ok{color:#65e6a2}.bad{color:#ff8da5}.hidden{display:none}@media(max-width:520px){.tw{grid-template-columns:1fr}}</style></head><body><main class="box"><div class="logo">Y</div><div class="center"><h1>YOCEWOR</h1><p class="muted">Your Voice. Your World.</p></div><div class="tabs"><button id="lt" class="btn primary">Login</button><button id="st" class="btn">Create account</button></div><div id="form"></div><div id="msg" class="msg"></div></main><script>const sb=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn');let mode='login';const $=x=>document.querySelector(x),say=(x,c='')=>{$('#msg').className='msg '+c;$('#msg').textContent=x};function draw(){if(mode==='login'){$('#form').innerHTML='<input id="email" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="btn primary" id="go">Login</button><button class="btn" id="otp">Login with Email OTP</button><div class="tw"><button class="btn" id="google">Google</button><button class="btn" id="facebook">Facebook</button></div>'}else{$('#form').innerHTML='<input id="name" placeholder="Full name"><input id="user" placeholder="Username"><input id="email" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (8+ characters)"><button class="btn primary" id="go">Create account</button><button class="btn" id="otp">Create with Email OTP</button>'}$('#go').onclick=go;$('#otp').onclick=otp;$('#google')?.addEventListener('click',()=>oauth('google'));$('#facebook')?.addEventListener('click',()=>oauth('facebook'))}async function go(){try{const email=$('#email').value.trim().toLowerCase(),password=$('#pw').value;if(!email||!password)return say('Email और password भरें.');if(mode==='login'){const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;return done(r.data.user)}const user=$('#user').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,30}$/.test(user))return say('Username 3–30 letters, numbers या _ रखें.');if(password.length<8)return say('Password कम से कम 8 characters रखें.');const r=await sb.auth.signUp({email,password,options:{data:{username:user,display_name:$('#name').value.trim()||user}}});if(r.error)throw r.error;say(r.data.session?'Account created ✓':'Account created. Email verification पूरा करें.','ok')}catch(e){say(e.message||'Login failed','bad')}}async function otp(){try{const email=$('#email').value.trim().toLowerCase();if(!email)return say('Email डालें.');const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:mode==='signup'}});if(r.error)throw r.error;say('OTP आपके email पर भेज दिया गया है. इस स्क्रीन पर OTP verification provider के configured flow के अनुसार पूरा करें.','ok')}catch(e){say(e.message||'OTP failed','bad')}}async function oauth(p){try{const r=await sb.auth.signInWithOAuth({provider:p,options:{redirectTo:location.href}});if(r.error)throw r.error}catch(e){say(e.message||'OAuth login failed','bad')}}function done(u){$('#form').innerHTML='<div class="center"><h2>Login successful ✓</h2><p class="muted">'+(u?.email||'Account connected')+'</p><button class="btn primary" onclick="location.href=\'app-v4.html?v=direct-20260810-1\'">Open YOCEWOR</button></div>';say('Authentication working.','ok')}$('#lt').onclick=()=>{mode='login';$('#lt').className='btn primary';$('#st').className='btn';draw();say('')};$('#st').onclick=()=>{mode='signup';$('#st').className='btn primary';$('#lt').className='btn';draw();say('')};draw();sb.auth.getSession().then(({data})=>{if(data.session)done(data.session.user)});</script></body></html>
