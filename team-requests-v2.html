<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Team Request</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:25px auto;padding:16px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 20px #0001}label{display:block;font-weight:600;margin:12px 0 5px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd5e0;border-radius:8px}textarea{min-height:80px}button{margin-top:16px;background:#174a7c;color:#fff;border:0;font-weight:700}.msg{margin-top:12px;padding:10px;border-radius:8px;background:#eef3f8}</style></head><body><main class="wrap"><div class="card"><h1>Team Member Request</h1><p>Internal YOCEWOR onboarding / KYC request</p><form id="f"><label>Requested Role</label><select id="requested_role" required><option value="">Select</option><option value="admin">Admin</option><option value="editor">Editor</option></select><label>Department ID (optional)</label><input id="department_id"><label>Full Name</label><input id="full_name" required><label>Username</label><input id="username" required><label>Official Email</label><input id="official_email" type="email" required><label>Phone</label><input id="phone"><label>Address</label><textarea id="address"></textarea><label>Designation</label><input id="designation"><label>Joining Date</label><input id="joining_date" type="date"><label>Notes / KYC details</label><textarea id="notes"></textarea><button>Submit Request</button></form><div id="msg" class="msg">Checking authorization…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="team-requests-v2.js"></script><script>(async()=>{const m=document.getElementById('msg');const u=await YOCEWOR_TEAM_REQUESTS_V2.current();if(!u){m.textContent='Unauthorized or inactive account.';return}m.textContent='Signed in as '+u.role+'.';document.getElementById('f').onsubmit=async e=>{e.preventDefault();const g=id=>document.getElementById(id).value.trim();try{const r=await YOCEWOR_TEAM_REQUESTS_V2.submit({requested_role:g('requested_role'),department_id:g('department_id'),full_name:g('full_name'),username:g('username'),official_email:g('official_email'),phone:g('phone'),address:g('address'),designation:g('designation'),joining_date:g('joining_date'),notes:g('notes')});m.textContent='Request submitted. Status: pending. ID: '+r.id;e.target.reset()}catch(err){m.textContent='Request failed: '+(err.message||'Unknown error')}}})();</script></body></html>
