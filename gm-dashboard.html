<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR GM Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#182235}.top{background:#174a7c;color:#fff;padding:18px 22px}.wrap{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 16px #0001}.n{font-size:28px;font-weight:800}.muted{color:#65758b;font-size:13px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e8edf3}.danger{color:#b42318}button{padding:10px 14px;border:0;border-radius:9px;background:#174a7c;color:#fff;font-weight:700}a{color:#174a7c;font-weight:700}</style></head><body><header class="top"><div class="wrap"><b>YOCEWOR</b><div>General Manager Control Center</div></div></header><main class="wrap"><div id="guard" class="card">GM access verify हो रहा है…</div><div id="app" hidden><div class="grid"><div class="card"><div class="muted">Team Members</div><div id="teamCount" class="n">—</div></div><div class="card"><div class="muted">Active Members</div><div id="active" class="n">—</div></div><div class="card"><div class="muted">Pending Editor Requests</div><div id="requests" class="n">—</div></div><div class="card"><div class="muted">Published Jobs</div><div id="jobs" class="n">—</div></div></div><div class="card"><h3>GM Actions</h3><p><a href="team-approvals.html">Open Approval Center</a></p><p><a href="team-requests.html">Create Team Request</a></p><p><a href="id-card.html">My ID Card</a></p></div><div class="card"><h3>Team Status</h3><div id="team">Loading…</div></div><div class="card"><h3>Recent Activity</h3><div id="audit">Loading…</div></div></div></main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn',{auth:{persistSession:true,autoRefreshToken:true}});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function main(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='department-login.html';return}const {data:a}=await db.from('admin_users').select('role,is_active,username,display_name').eq('user_id',user.id).maybeSingle();if(String(a?.role||'').toLowerCase()!=='gm'||a.is_active===false){document.getElementById('guard').innerHTML='<b class="danger">Access denied</b><br>GM account required.';return}document.getElementById('guard').innerHTML='<b>GM verified</b> — '+esc(a.display_name||a.username||'GM');document.getElementById('app').hidden=false;const tm=await db.from('admin_users').select('role,is_active,username,display_name');const rows=tm.data||[];document.getElementById('teamCount').textContent=rows.length;document.getElementById('active').textContent=rows.filter(x=>x.is_active).length;const rq=await db.from('team_requests').select('id',{count:'exact',head:true}).eq('status','pending').eq('requested_role','editor');document.getElementById('requests').textContent=rq.count||0;const jp=await db.from('jobs').select('id',{count:'exact',head:true}).eq('published',true);document.getElementById('jobs').textContent=jp.count||0;document.getElementById('team').innerHTML=rows.filter(x=>String(x.role).toLowerCase()!=='owner').map(x=>`<div class="row"><span>${esc(x.display_name||x.username||'User')}</span><span>${esc(x.role)} · ${x.is_active?'Active':'Inactive'}</span></div>`).join('')||'No team users';const al=await db.from('team_audit_log').select('actor_role,action,created_at').order('created_at',{ascending:false}).limit(10);document.getElementById('audit').innerHTML=(al.data||[]).map(x=>`<div class="row"><span>${esc(x.action)}</span><span>${esc(x.actor_role)} · ${new Date(x.created_at).toLocaleString()}</span></div>`).join('')||'No activity'}main().catch(e=>{console.error(e);document.getElementById('guard').textContent='Dashboard data load failed.'});</script></body></html>
