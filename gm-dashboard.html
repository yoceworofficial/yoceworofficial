<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>YOCEWOR GM Home</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f4f7fb;color:#172235}.hero{background:linear-gradient(135deg,#102a43,#1d5275);color:#fff;padding:24px 18px}.wrap{max-width:1080px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{background:#ffffff20;border:1px solid #ffffff40;border-radius:30px;padding:7px 12px;font-size:12px;font-weight:800}.hero h1{font-size:27px;margin:10px 0 2px}.hero p{margin:0;color:#d9e7f2;font-size:13px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.nav a{background:#173d5c;color:#fff;text-decoration:none;padding:10px 13px;border-radius:9px;font-size:13px;font-weight:800}.nav a.active{background:#fff;color:#102a43}.main{padding:18px}.welcome{background:#fff;border-radius:18px;padding:22px;box-shadow:0 5px 22px #00000010}.welcome h2{margin:0 0 5px}.muted{color:#64748b;font-size:13px}.hide{display:none}.error{color:#b42318;font-weight:700}@media(max-width:600px){.hero h1{font-size:23px}.nav a{flex:1;text-align:center;min-width:42%}}</style></head><body><header class="hero"><div class="wrap"><div class="top"><div><span class="badge">● GM ACTIVE</span><h1>👔 YOCEWOR General Manager</h1><p>General Management Control Center</p></div></div><nav class="nav"><a class="active" href="/gm-dashboard.html?v=gm7">🏠 Home</a><a href="/team-management-live.html?v=gm7">👥 Manage Users</a><a href="/content.html?v=gm7">📝 Content</a><a href="/job-review.html?v=gm7">📊 Reports</a><a href="/admin.html?v=gm7">🛠️ Admins</a><a href="/" id="logout">🚪 Logout</a></nav></div></header><main class="wrap main"><section id="guard" class="welcome">GM access verify हो रहा है…</section><section id="app" class="welcome hide"><h2 id="welcome">Welcome, General Manager</h2><div class="muted" id="email"></div><p class="muted">YOCEWOR General Management official workspace.</p></section></main><script src="/owner-auth.js?gm7"></script><script>const $=id=>document.getElementById(id),auth=window.YOCEWOR_AUTH,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){try{if(!auth)throw Error('Authentication service unavailable.');const me=await auth.requireRole('gm');$('guard').classList.add('hide');$('app').classList.remove('hide');$('welcome').textContent='Welcome, '+(me.display_name||me.username||'General Manager');$('email').textContent=me.email||''}catch(e){$('guard').innerHTML='<span class="error">'+esc(e.message)+'</span><br><br><a href="/" class="muted">Login</a>'}}boot();$('logout').onclick=async e=>{e.preventDefault();try{await auth.signOut()}finally{location.href='/'}};</script></body></html>
