<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>YOCEWOR GM Home</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.muted{color:#65758b;font-size:13px}.status{display:inline-flex;align-items:center;gap:7px;background:#e9f7ef;color:#16844b;padding:6px 10px;border-radius:20px;font-weight:700;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #0001}.stat b{font-size:13px;color:#65758b}.stat strong{display:block;font-size:27px;margin-top:4px}.activity{padding:11px 0;border-bottom:1px solid #e6ebf1}.error{color:#b42318;font-weight:700}.hide{display:none}@media(max-width:600px){.top h1{font-size:22px}}</style></head><body><header class="top"><div class="wrap"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><h1 style="margin:0">👔 YOCEWOR GM HOME</h1><div style="color:#dbe8f5;font-size:13px">General Management Control Center</div></div><span class="status">● GM ACTIVE</span></div></div></header><main class="wrap"><section id="guard" class="card">GM access verify हो रहा है…</section><section id="app" class="hide"><section class="card"><h2 id="welcome">Welcome, General Manager</h2><div class="muted" id="email"></div></section><div class="grid"><section class="card stat"><b>👥 Team Members</b><strong id="teamCount">—</strong></section><section class="card stat"><b>📩 Pending Requests</b><strong id="requestCount">—</strong></section><section class="card stat"><b>📝 Published Content</b><strong id="contentCount">—</strong></section><section class="card stat"><b>📊 Reports / Review</b><strong id="reportCount">—</strong></section></div><section class="card"><h2>📋 Recent Team Activity</h2><div id="activity">Loading…</div></section></section></main><script src="/owner-auth.js?gm5"></script><script>const $=id=>document.getElementById(id),auth=window.YOCEWOR_AUTH,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(a){return auth.request(a)}async function boot(){try{if(!auth)throw Error('Authentication service unavailable.');const me=await auth.requireRole('gm');$('guard').classList.add('hide');$('app').classList.remove('hide');$('welcome').textContent='Welcome, '+(me.display_name||me.username||'General Manager');$('email').textContent=me.email||'';const t=await api('list_team'),rows=t.data||[];$('teamCount').textContent=rows.length;const q=await api('list_requests');$('requestCount').textContent=(q.data||[]).filter(x=>x.status==='pending').length;const c=await api('list_content'),items=c.data||[];$('contentCount').textContent=items.filter(x=>x.published===true||x.status==='published').length;$('reportCount').textContent=items.length;$('activity').innerHTML=rows.slice(0,8).map(x=>'<div class="activity">👤 <b>'+esc(x.display_name||x.username||'User')+'</b> — '+esc(x.role||'')+'</div>').join('')||'<span class="muted">No recent activity.</span>'}catch(e){$('guard').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}boot()</script></body></html>
