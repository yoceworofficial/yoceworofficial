<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Content Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,"Noto Sans Devanagari",sans-serif;margin:0;background:#eef3f7;color:#172333}.wrap{max-width:1180px;margin:auto;padding:14px}.top{background:#082f49;color:#fff}.card{background:#fff;border:1px solid #d9e2ea;border-radius:15px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f{margin:9px 0}.f label{font-weight:700;font-size:13px}.in{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd6df;border-radius:8px;margin-top:4px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin:7px 0}.linkrow{display:grid;grid-template-columns:1fr 1.3fr 1fr auto;gap:7px;margin:7px 0}.sub{background:#f7fafc;border:1px solid #dce5eb;border-radius:11px;padding:12px;margin:10px 0}.btn{border:0;border-radius:8px;padding:9px 12px;background:#0b5577;color:#fff;font-weight:800;cursor:pointer}.danger{background:#a12d3b}.sec{border-top:1px solid #e1e7ec;padding-top:14px;margin-top:16px}.preview{background:#fff;border:1px solid #d5dfe7;border-radius:10px;overflow:hidden}.hero{background:linear-gradient(135deg,#073653,#0c607f);color:#fff;padding:22px}.hero h1{font-size:29px;line-height:1.3}.body{padding:18px}.topic{padding:12px;background:#f7fafc;border:1px solid #dce5eb;border-radius:9px;line-height:1.7}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #d6e0e7;padding:8px;text-align:left;vertical-align:top}.table th{background:#f2f6f8}.item{padding:12px 0;border-bottom:1px solid #e2e8ed}.muted{color:#657687;font-size:13px}@media(max-width:700px){.grid,.row,.linkrow{grid-template-columns:1fr}.wrap{padding:9px}.hero{padding:16px}.hero h1{font-size:22px}.card{padding:12px}}
</style></head><body><header class="top"><div class="wrap"><b style="font-size:19px">📝 YOCEWOR Content Management</b><div style="font-size:12px;opacity:.8">Live • Supabase powered</div></div></header><main class="wrap"><section class="card"><div id="auth">Checking access…</div></section><section id="editor" class="card" hidden><h2>Create / Edit Content</h2><div class="f"><label>Content Type</label><select id="type" class="in"><option>Recruitment</option><option>Result</option><option>Admit Card</option><option>Answer Key</option><option>Exam / Syllabus</option><option>Exam / Date</option><option>Admission</option><option>Scholarship</option><option>Government Scheme</option><option>General Notice</option></select></div><div class="f"><label>Title</label><input id="title" class="in"></div><div class="f"><label>Short Description</label><textarea id="short" class="in" rows="3"></textarea></div><div class="grid"><div class="f"><label>Department</label><input id="department" class="in"></div><div class="f"><label>Category / Tags</label><input id="category" class="in"></div></div><div class="f"><label>Main Description / Introduction</label><textarea id="main" class="in" rows="6"></textarea></div><div class="sub"><b>🖼️ Featured Image</b><input id="image" class="in" type="file" accept="image/*"><div id="imagePreview"></div></div><div class="sub"><b>📊 Overview</b> <button class="btn" type="button" onclick="addRow('overview')">＋ Add Row</button><div id="overview"></div></div><div class="sub"><b>📅 Important Dates</b> <button class="btn" type="button" onclick="addRow('dates')">＋ Add Date</button><div id="dates"></div></div><div class="grid"><div class="f"><label>Eligibility / Qualification</label><textarea id="eligibility" class="in"></textarea></div><div class="f"><label>Application Fee</label><textarea id="fee" class="in"></textarea></div><div class="f"><label>Selection Process</label><textarea id="selection" class="in"></textarea></div></div><div class="f"><label>How to Apply / How to Check</label><textarea id="how" class="in" rows="4"></textarea></div><div class="f"><label>Documents / Additional Information</label><textarea id="docs" class="in" rows="4"></textarea></div><div class="sub"><b>📚 Detailed Sections</b> <button class="btn" type="button" onclick="addRow('sections')">＋ Add Section</button><div id="sections"></div></div><div class="sub"><b>🔗 Important Links</b> <button class="btn" type="button" onclick="addLink()">＋ Add Link</button><div id="links"></div></div><div class="sub"><b>🎥 YouTube Video</b> <button class="btn" type="button" onclick="addRow('youtube')">＋ Add Video</button><div id="youtube"></div></div><div class="sub"><b>❓ FAQ</b> <button class="btn" type="button" onclick="addRow('faqs')">＋ Add Question</button><div id="faqs"></div></div><div class="grid"><div class="f"><label>Publish Date</label><input id="publishDate" class="in" type="date"></div><div class="f"><label>Last Date</label><input id="lastDate" class="in" type="date"></div><div class="f"><label>Permanent URL / Slug</label><input id="slug" class="in"></div></div><div class="actions"><button class="btn" onclick="save(false)">🟡 Save Draft</button> <button class="btn" onclick="save(true)">📤 Publish / Update</button> <button class="btn" onclick="showPreview()">👁️ Preview</button> <button class="btn" onclick="newContent()">✖ New</button></div><p id="msg" class="muted"></p></section><section class="card"><h2>📋 Content Management</h2><div id="list" class="muted">Loading…</div></section><section id="pc" class="card" hidden><h2>👁️ Public Page Preview</h2><div id="preview" class="preview"></div></section></main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn');let editId=null,imgData='';const $=x=>document.getElementById(x),v=x=>($(x)?.value||'').trim(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function addRow(id,a='',b=''){let x=document.createElement('div');x.className='row';x.innerHTML='<input class="in a"><input class="in b"><button class="btn danger" type="button" onclick="this.parentElement.remove()">✕</button>';$(''+id).append(x);x.querySelector('.a').value=a;x.querySelector('.b').value=b}function addLink(a='',b='',c='Open Link'){let x=document.createElement('div');x.className='linkrow';x.innerHTML='<input class="in a" placeholder="Link name"><input class="in b" placeholder="https://..."><input class="in c" placeholder="Button Text"><button class="btn danger" type="button" onclick="this.parentElement.remove()">✕</button>';$('links').append(x);x.querySelector('.a').value=a;x.querySelector('.b').value=b;x.querySelector('.c').value=c}function pairs(id){return[...document.querySelectorAll('#'+id+' .row')].map(x=>[x.querySelector('.a').value.trim(),x.querySelector('.b').value.trim()]).filter(x=>x[0]||x[1])}function collect(){return{title:v('title'),type:v('type'),department:v('department'),category:v('category'),short_description:v('short'),main_content:v('main'),featured_image:imgData,overview:pairs('overview'),important_dates:pairs('dates'),eligibility:v('eligibility'),fee:v('fee'),selection_process:v('selection'),how_to_apply:v('how'),important_documents:v('docs'),detailed_sections:pairs('sections'),important_links:[...document.querySelectorAll('#links .linkrow')].map(x=>[x.querySelector('.a').value.trim(),x.querySelector('.b').value.trim(),x.querySelector('.c').value.trim()]).filter(x=>x[0]||x[1]),youtube_videos:pairs('youtube'),faqs:pairs('faqs'),publish_date:v('publishDate')||null,last_date:v('lastDate')||null,slug:v('slug')}}function newContent(){editId=null;imgData='';['title','department','category','short','main','eligibility','fee','selection','how','docs','publishDate','lastDate','slug'].forEach(x=>$(x).value='');['overview','dates','sections','links','youtube','faqs'].forEach(x=>$(x).replaceChildren());$('image').value='';$('imagePreview').innerHTML='';$('pc').hidden=true}async function save(pub){let o=collect();if(!o.title){$('msg').textContent='Title required';return}if(!o.slug)o.slug=o.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');let data={type:o.type,title:o.title,department:o.department||null,start_date:o.publish_date,last_date:o.last_date,qualification:o.eligibility||null,fee:o.fee||null,selection_process:o.selection_process||null,description:JSON.stringify(o),published:pub,short_description:o.short_description,category:o.category,main_content:o.main_content,featured_image:o.featured_image,overview:o.overview,important_dates:o.important_dates,detailed_sections:o.detailed_sections,important_links:o.important_links,youtube_videos:o.youtube_videos,faqs:o.faqs,how_to_apply:o.how_to_apply,important_documents:o.important_documents,publish_date:o.publish_date,slug:o.slug,video_url:o.youtube_videos[0]?.[1]||null};let q=editId?await db.from('jobs').update(data).eq('id',editId).select().single():await db.from('jobs').insert(data).select().single();if(q.error){$('msg').textContent='❌ '+q.error.message;return}editId=q.data.id;$('msg').textContent=pub?'✅ Published / updated successfully.':'✅ Draft saved successfully.';loadList()}async function loadItem(id){let q=await db.from('jobs').select('*').eq('id',id).single();if(q.error){$('msg').textContent='❌ '+q.error.message;return}let d=q.data,o={};try{o=JSON.parse(d.description||'{}')}catch{};editId=d.id;[['title',o.title||d.title],['department',o.department||d.department],['category',o.category||d.category],['short',o.short_description||d.short_description],['main',o.main_content||d.main_content],['eligibility',o.eligibility||d.qualification],['fee',o.fee||d.fee],['selection',o.selection_process||d.selection_process],['how',o.how_to_apply||d.how_to_apply],['docs',o.important_documents||d.important_documents],['publishDate',o.publish_date||d.publish_date],['lastDate',o.last_date||d.last_date],['slug',o.slug||d.slug]].forEach(x=>$(x[0]).value=x[1]||'');$('type').value=d.type||'Recruitment';imgData=d.featured_image||'';$('imagePreview').innerHTML=imgData?'<img src="'+esc(imgData)+'" style="max-width:100%;max-height:260px;border-radius:9px">':'';['overview','dates','sections','links','youtube','faqs'].forEach(x=>$(x).replaceChildren());(d.overview||[]).forEach(x=>addRow('overview',x[0],x[1]));(d.important_dates||[]).forEach(x=>addRow('dates',x[0],x[1]));(d.detailed_sections||[]).forEach(x=>addRow('sections',x[0],x[1]));(d.important_links||[]).forEach(x=>addLink(x[0],x[1],x[2]));(d.youtube_videos||[]).forEach(x=>addRow('youtube',x[0],x[1]));(d.faqs||[]).forEach(x=>addRow('faqs',x[0],x[1]));$('msg').textContent='✏️ Editing same record — no duplicate.';scrollTo({top:0,behavior:'smooth'})}async function deleteItem(id){if(!confirm('यह content permanently delete करना है?'))return;let q=await db.from('jobs').delete().eq('id',id);$('msg').textContent=q.error?'❌ '+q.error.message:'🗑️ Deleted';loadList()}async function loadList(){let q=await db.from('jobs').select('id,title,type,published,updated_at,slug').order('updated_at',{ascending:false});if(q.error){$('list').textContent='❌ '+q.error.message;return}$('list').innerHTML=(q.data||[]).map(x=>'<div class="item"><b>'+esc(x.title)+'</b> — '+(x.published?'Published':'Draft')+'<div class="muted">'+esc(x.type||'')+' • '+new Date(x.updated_at).toLocaleString('en-IN')+'</div><button class="btn" onclick="loadItem(\''+x.id+'\')">✏️ Edit / View</button> <button class="btn danger" onclick="deleteItem(\''+x.id+'\')">🗑️ Delete</button></div>').join('')||'No content yet'}function showPreview(){let o=collect(),h='<div class="hero"><div>'+esc(o.type)+'</div><h1>'+esc(o.title)+'</h1><div>'+esc(o.short_description)+'</div></div><div class="body">';if(o.featured_image)h+='<img src="'+esc(o.featured_image)+'" style="display:block;width:100%;max-height:430px;object-fit:cover">';if(o.main_content)h+='<div class="sec"><h3>इस अपडेट के बारे में</h3><div class="topic">'+esc(o.main_content).replace(/\n/g,'<br>')+'</div></div>';if(o.overview.length)h+='<div class="sec"><h3>मुख्य जानकारी</h3><table class="table">'+o.overview.map(x=>'<tr><th>'+esc(x[0])+'</th><td>'+esc(x[1])+'</td></tr>').join('')+'</table></div>';if(o.important_dates.length)h+='<div class="sec"><h3>महत्वपूर्ण तिथियाँ</h3><table class="table">'+o.important_dates.map(x=>'<tr><th>'+esc(x[0])+'</th><td>'+esc(x[1])+'</td></tr>').join('')+'</table></div>';[['eligibility','पात्रता / योग्यता'],['fee','आवेदन शुल्क'],['selection','चयन प्रक्रिया'],['how','आवेदन / जानकारी कैसे देखें'],['docs','अतिरिक्त जानकारी']].forEach(x=>{if(o[x[0]])h+='<div class="sec"><h3>'+x[1]+'</h3><div class="topic">'+esc(o[x[0]]).replace(/\n/g,'<br>')+'</div></div>'});o.detailed_sections.forEach(x=>{if(x[0]||x[1])h+='<div class="sec"><h3>📌 '+esc(x[0])+'</h3><div class="topic">'+esc(x[1]).replace(/\n/g,'<br>')+'</div></div>'});if(o.important_links.length)h+='<div class="sec"><h3>🔗 महत्वपूर्ण लिंक</h3>'+o.important_links.filter(x=>x[1]).map(x=>'<p><a href="'+esc(x[1])+'" target="_blank">'+esc(x[2]||x[0]||'Open Link')+' ↗</a></p>').join('')+'</div>';if(o.faqs.length)h+='<div class="sec"><h3>❓ FAQ</h3>'+o.faqs.map(x=>'<div class="topic"><b>'+esc(x[0])+'</b><br>'+esc(x[1])+'</div>').join('')+'</div>';h+='</div>';$('preview').innerHTML=h;$('pc').hidden=false}$('image').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{imgData=r.result;$('imagePreview').innerHTML='<img src="'+esc(imgData)+'" style="max-width:100%;max-height:260px;border-radius:9px">'};r.readAsDataURL(f)};(async()=>{let u=await db.auth.getUser();if(!u.data.user){$('auth').textContent='Login required.';return}let a=await db.from('admin_users').select('role,is_active').eq('user_id',u.data.user.id).maybeSingle(),role=String(a.data?.role||'').toLowerCase();if(!a.data||a.data.is_active===false||!['owner','admin','editor','gm'].includes(role)){$('auth').textContent='Access denied.';return}$('auth').textContent='✅ '+role+' access verified.';$('editor').hidden=false;loadList()})();</script></body></html>
