name: YOCEWOR bilingual homepage
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-homepage:
    if: ${{ !contains(github.event.head_commit.message, 'English-primary bilingual homepage') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add English primary language toggle
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<html lang="hi">', '<html lang="en">', 1)
          s = s.replace('<button class="lang" id="langBtn" type="button" onclick="toggleLang()">हिंदी</button>', '<button class="lang" id="langBtn" type="button" onclick="toggleLang()">हिंदी</button>', 1)
          marker = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          script = '''<script>\nlet hindi=false;\nfunction toggleLang(){\n  hindi=!hindi;\n  document.documentElement.lang=hindi?'hi':'en';\n  const btn=document.getElementById('langBtn'); if(btn) btn.textContent=hindi?'English':'हिंदी';\n  const map={\n    'मुख्य पृष्ठ':'Home','नवीनतम भर्ती':'Latest Jobs','लेटेस्ट अपडेट':'Latest Updates','एडमिट कार्ड':'Admit Card','रिजल्ट':'Results','भर्ती खोजें':'Search Jobs','महत्वपूर्ण सूचना':'Important Notice',\n    'नवीनतम भर्ती':'Latest Jobs','ताज़ा अपडेट':'Latest Updates','नवीनतम सरकारी भर्तियाँ':'Latest Government Jobs','प्रवेश पत्र और परीक्षा सूचना':'Admit Card and Exam Information','परीक्षा परिणाम और मेरिट':'Results and Merit','नवीनतम सरकारी अपडेट':'Latest Updates'\n  };\n  document.querySelectorAll('.nav a').forEach(a=>{if(!a.dataset.en){a.dataset.hi=a.textContent.trim();a.dataset.en=map[a.dataset.hi]||a.dataset.hi;}a.textContent=hindi?a.dataset.hi:a.dataset.en;});\n  const title=document.querySelector('.hero h2'); if(title){title.dataset.hi=title.dataset.hi||title.textContent; title.dataset.en='Government Jobs & Important Information'; title.textContent=hindi?title.dataset.hi:title.dataset.en;}\n  const text=document.querySelector('.hero p'); if(text){text.dataset.hi=text.dataset.hi||text.textContent; text.dataset.en='Find the latest government jobs, examinations, admit cards and results — clear, organized and in one place.'; text.textContent=hindi?text.dataset.hi:text.dataset.en;}\n  const search=document.querySelector('.search input'); if(search) search.placeholder=hindi?'भर्ती, परीक्षा या विभाग खोजें...':'Search jobs, exams or departments...';\n}\n</script>'''
          if 'function toggleLang()' not in s:
              s = s.replace(marker, script + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: English-primary bilingual homepage"
          git push
