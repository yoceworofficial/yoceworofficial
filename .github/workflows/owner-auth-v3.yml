name: Owner auth v3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch Owner auth reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('team-management-live.html'), Path('departments.html')]:
              if p.exists():
                  s=p.read_text(encoding='utf-8')
                  s=s.replace('/owner-auth.js','/owner-auth-v3.js')
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Add Answer Key router
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('job-details.html')
          s=p.read_text(encoding='utf-8')
          marker='YOCEWOR_ANSWER_KEY_ROUTER_V1'
          needle="const params=new URLSearchParams(location.search),id=params.get('id'),slug=params.get('slug')||location.pathname.split('/').filter(Boolean).pop();"
          if marker not in s:
              if needle not in s:
                  raise SystemExit('job-details query line not found')
              patch=needle+"""
          const YOCEWOR_ANSWER_KEY_ROUTER_V1=true;
          document.documentElement.style.visibility='hidden';
          (async()=>{
            try{
              const key=String(id||'').trim(), cleanSlug=String(slug||'').trim();
              let q=db.from('jobs').select('id,type').eq('published',true);
              q=key?q.eq('id',key):q.eq('slug',cleanSlug);
              const r=await q.maybeSingle();
              const t=String(r.data?.type||'').toLowerCase().replace(/[-\\s]+/g,'_');
              if(t==='answer_key'){
                const target='/answer-key-detail.html?'+(r.data?.id?'id='+encodeURIComponent(r.data.id):'slug='+encodeURIComponent(cleanSlug));
                location.replace(target);
                return;
              }
            }catch(e){}
            document.documentElement.style.visibility='visible';
          })();"""
              p.write_text(s.replace(needle,patch,1),encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'YOCEWOR Bot'
          git config user.email 'yoceworofficial@users.noreply.github.com'
          git add team-management-live.html departments.html job-details.html
          git diff --cached --quiet || git commit -m 'fix: route direct Answer Key details correctly'
          git push
