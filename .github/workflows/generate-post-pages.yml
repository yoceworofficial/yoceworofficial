name: Generate clean post pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths-ignore:
      - "*/index.html"
      - "**/index.html"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate published post pages
        env:
          SUPABASE_URL: https://mzntgjyecymcpzciklfk.supabase.co
        run: |
          node <<'NODE'
          (async () => {
          const fs = require('fs');
          const path = require('path');
          const cfg = fs.readFileSync('config.js','utf8');
          const url = (cfg.match(/supabaseUrl:\s*["']([^"']+)/) || [])[1];
          const key = (cfg.match(/supabasePublishableKey:\s*["']([^"']+)/) || [])[1];
          if (!url || !key) throw new Error('Supabase public config not found');
          const headers = { apikey: key, Authorization: 'Bearer ' + key };
          const esc = (value) => String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
          const r = await fetch(url + '/rest/v1/posts?select=slug,title,seo_title,seo_description,content_intro,featured_image_url,status,published_at,updated_at&status=eq.published&order=updated_at.desc&limit=1000', {headers});
          if (!r.ok) throw new Error('Supabase posts request failed: ' + r.status + ' ' + await r.text());
          const posts = await r.json();
          const template = fs.readFileSync('post.html','utf8');
          for (const post of posts) {
            const slug = String(post.slug || '').trim();
            if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) continue;
            const title = post.seo_title || post.title || 'YOCEWOR';
            const desc = post.seo_description || post.content_intro || post.title || 'YOCEWOR government information update';
            const image = post.featured_image_url || 'https://yocewor.in/images/default-share.svg';
            const canonical = 'https://yocewor.in/' + encodeURIComponent(slug) + '/';
            let html = template;
            html = html.replace(/<title>[^<]*<\/title>/i, '<title>' + esc(title) + '</title><link rel="canonical" href="' + canonical + '">');
            html = html.replace(/(<meta\s+name="description"\s+content=")[^"]*(")/i, '$1' + esc(desc) + '$2');
            html = html.replace(/(<meta\s+property="og:title"\s+content=")[^"]*(")/i, '$1' + esc(title) + '$2');
            html = html.replace(/(<meta\s+property="og:description"\s+content=")[^"]*(")/i, '$1' + esc(desc) + '$2');
            html = html.replace(/(<meta\s+property="og:url"\s+content=")[^"]*(")/i, '$1' + canonical + '$2');
            html = html.replace(/(<meta\s+property="og:image"\s+content=")[^"]*(")/i, '$1' + esc(image) + '$2');
            html = html.replace(/(<meta\s+name="twitter:title"\s+content=")[^"]*(")/i, '$1' + esc(title) + '$2');
            html = html.replace(/(<meta\s+name="twitter:description"\s+content=")[^"]*(")/i, '$1' + esc(desc) + '$2');
            html = html.replace(/(<meta\s+name="twitter:image"\s+content=")[^"]*(")/i, '$1' + esc(image) + '$2');
            fs.mkdirSync(slug, {recursive:true});
            fs.writeFileSync(path.join(slug,'index.html'), html);
          }
          const staticUrls = [
            '/', '/category.html?category=latest-jobs', '/category.html?category=admit-card',
            '/category.html?category=answer-key', '/category.html?category=result',
            '/category.html?category=exam-date', '/category.html?category=latest-news',
            '/category.html?category=sarkari-yojana', '/about.html', '/contact.html',
            '/privacy-policy.html', '/disclaimer.html', '/terms.html'
          ];
          const xmlEsc = (value) => String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
          const entries = staticUrls.map(p => ({loc:'https://yocewor.in' + p}))
            .concat(posts.filter(p => /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(String(p.slug||'').trim()))
              .map(p => ({loc:'https://yocewor.in/' + encodeURIComponent(String(p.slug).trim()) + '/', lastmod:p.updated_at || p.published_at || null})));
          const sitemap = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' +
            entries.map(e => '  <url><loc>' + xmlEsc(e.loc) + '</loc>' + (e.lastmod ? '<lastmod>' + xmlEsc(String(e.lastmod).slice(0,10)) + '</lastmod>' : '') + '</url>').join('\n') +
            '\n</urlset>\n';
          fs.writeFileSync('sitemap.xml', sitemap);
          console.log('Generated', posts.length, 'published post page(s) and refreshed sitemap.xml.');
          })();
          NODE
      - name: Validate generated renderer
        run: |
          test -f post.html
          grep -Fq 'const items=Array.isArray(c)?c:(Array.isArray(c.items)?c.items:[])' post.html
          grep -Fq 'if(s.section_type!=="links")' post.html
          echo "Renderer validation passed."
      - name: Commit generated pages
        run: |
          git config user.name "YOCEWOR Bot"
          git config user.email "yoceworofficial@users.noreply.github.com"
          git add -- */index.html sitemap.xml
          if git diff --cached --quiet; then echo "No generated page changes."; exit 0; fi
          git commit -m "chore: sync clean post pages"
          git push

# Triggered manually by the site-fix commit to regenerate and deploy all published post pages.
