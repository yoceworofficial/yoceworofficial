name: Generate clean post pages

on:
  workflow_dispatch:
  schedule:
    # Poll Supabase for Admin Panel changes every 5 minutes.
    - cron: "*/5 * * * *"
  push:
    paths-ignore:
      - "*/index.html"
      - "**/index.html"

permissions:
  contents: write

concurrency:
  group: generate-post-pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate fully pre-rendered published post pages
        run: node scripts/prerender-posts.js

      - name: Validate generated pages
        run: |
          test -f post.html
          test -f editorial-policy.html
          test -f candidate-guide.html
          test -f rrc-nwr-apprentice-recruitment-2026/index.html
          grep -Fq 'application/ld+json' rrc-nwr-apprentice-recruitment-2026/index.html
          ! grep -Fq 'root.innerHTML=html' rrc-nwr-apprentice-recruitment-2026/index.html
          ! grep -Fq 'function renderSection' rrc-nwr-apprentice-recruitment-2026/index.html
          ! grep -Fq '/config.js' rrc-nwr-apprentice-recruitment-2026/index.html
          ! grep -Fq '/app.js' rrc-nwr-apprentice-recruitment-2026/index.html
          grep -Fq 'rrc-nwr-apprentice-recruitment-2026' sitemap.xml
          grep -Fq 'post-list' index.html
          ! grep -Fq 'href="#"' itbp-head-constable-motor-mechanic-recruitment-2026/index.html
          ! grep -Fq 'href="#"' rrb-ntpc-under-graduate-recruitment-2026/index.html
          grep -Fq 'Candidate Guide' candidate-guide.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cfg = fs.readFileSync('config.js','utf8');
          const base = (cfg.match(/supabaseUrl:\s*["']([^"']+)/)||[])[1];
          const key = (cfg.match(/supabasePublishableKey:\s*["']([^"']+)/)||[])[1];
          if (!base || !key) throw new Error('Supabase public config missing');
          const headers = {apikey:key, Authorization:'Bearer '+key};
          const res = await fetch(base + '/rest/v1/posts?select=slug&status=eq.published&limit=1000',{headers});
          if (!res.ok) throw new Error('Published posts API failed: '+res.status);
          const posts = await res.json();
          const slugs = posts.map(p=>String(p.slug)).filter(Boolean);
          const sitemap = fs.readFileSync('sitemap.xml','utf8');
          const missing = slugs.filter(s => !sitemap.includes('https://yocewor.in/'+s+'/'));
          const dirs = slugs.filter(s => !fs.existsSync(s+'/'+ 'index.html'));
          if (missing.length) throw new Error('Published posts missing from sitemap: '+missing.join(', '));
          if (dirs.length) throw new Error('Published posts missing generated HTML: '+dirs.join(', '));
          const allowedStatic = new Set(['about.html','contact.html','privacy-policy.html','disclaimer.html','terms.html','editorial-policy.html','candidate-guide.html','education.html','news.html','search.html','author/yocewor-editorial-desk.html']);
          const localHref = /href=["']\/(?!category\/)([^"'#?]+?)\/["']/g;
          for (const slug of slugs) {
            const html=fs.readFileSync(slug+'/index.html','utf8');
            let m;
            while ((m=localHref.exec(html))) {
              const target=m[1];
              if (target===slug || target.startsWith('images/') || target.startsWith('styles') || target.startsWith('scripts/')) continue;
              if (!slugs.includes(target) && !allowedStatic.has(target)) {
                throw new Error('Broken internal article/static link in '+slug+': /'+target+'/');
              }
            }
          }
          console.log('Published-page integrity passed:', slugs.length, 'articles.');
          NODE
          echo "Static page validation passed."
      - name: Commit generated pages
        run: |
          git config user.name "YOCEWOR Bot"
          git config user.email "yoceworofficial@users.noreply.github.com"
          git add -- index.html sitemap.xml '*/index.html' 'category/*/index.html'
          if git diff --cached --quiet; then echo "No generated page changes."; exit 0; fi
          git commit -m "chore: sync pre-rendered post pages"
          git push

# Regenerate static pages after content, trust-signal, SEO template, and metadata changes.
