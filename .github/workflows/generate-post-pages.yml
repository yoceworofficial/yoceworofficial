name: Generate clean post pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths-ignore:
      - "*/index.html"
      - "**/index.html"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate fully pre-rendered published post pages
        run: node scripts/prerender-posts.js

      - name: Validate generated pages
        run: |
          test -f post.html
          test -f editorial-policy.html
          test -f candidate-guide.html
          test -f rrc-nwr-apprentice-recruitment-2026/index.html
          grep -Fq 'application/ld+json' rrc-nwr-apprentice-recruitment-2026/index.html
          grep -Fq 'rrc-nwr-apprentice-recruitment-2026' sitemap.xml
          grep -Fq 'post-list' index.html
          ! grep -Fq 'href="#"' itbp-head-constable-motor-mechanic-recruitment-2026/index.html
          ! grep -Fq 'href="#"' rrb-ntpc-under-graduate-recruitment-2026/index.html
          grep -Fq 'Candidate Guide' candidate-guide.html
          echo "Static page validation passed."
      - name: Commit generated pages
        run: |
          git config user.name "YOCEWOR Bot"
          git config user.email "yoceworofficial@users.noreply.github.com"
          git add -- index.html sitemap.xml '*/index.html' 'category/*/index.html'
          if git diff --cached --quiet; then echo "No generated page changes."; exit 0; fi
          git commit -m "chore: sync pre-rendered post pages"
          git push

# Regenerate static pages after content, trust-signal, SEO template, and metadata changes.
