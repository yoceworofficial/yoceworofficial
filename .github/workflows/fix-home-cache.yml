name: Fix Home Cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-home-cache:
    if: ${{ !contains(github.event.head_commit.message, '[home-cache-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update homepage cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'home-modern.css?v=20260909'
          new = 'home-modern.css?v=20260910'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit cache-busted homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix homepage CSS cache [home-cache-fix]'
          git push
