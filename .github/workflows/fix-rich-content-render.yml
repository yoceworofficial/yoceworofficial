name: YOCEWOR Rich Content Render Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'fix: render rich article HTML content' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch article renderer
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('job-details.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('function paragraphs(value){')
          end = s.index('function section(', start)
          new = r'''function paragraphs(value){
const t=clean(value);if(!t)return '<div class="empty">जानकारी उपलब्ध नहीं है।</div>';
const rich=/<\/?(h[1-6]|p|ul|ol|li|strong|b|em|i|br|a)\b/i.test(t);
if(rich){
  const box=document.createElement('div');box.innerHTML=t;
  const allowed=new Set(['H2','H3','H4','H5','H6','P','UL','OL','LI','STRONG','B','EM','I','BR','A']);
  box.querySelectorAll('script,style,iframe,object,embed,form,link,meta').forEach(el=>el.remove());
  box.querySelectorAll('*').forEach(el=>{
    if(!allowed.has(el.tagName)){el.replaceWith(...Array.from(el.childNodes));return;}
    [...el.attributes].forEach(a=>el.removeAttribute(a.name));
  });
  return box.innerHTML;
}
return t.split(/\n\s*\n|\n/).map(x=>x.trim()).filter(Boolean).map(x=>{if(/^[-•▪]/.test(x))return '<li>'+esc(x.replace(/^[-•▪]\s*/,''))+'</li>';return '<p class="para">'+esc(x)+'</p>';}).join('').replace(/(<li>[\s\S]*<\/li>)+/g,m=>'<ul class="bullet-list">'+m+'</ul>');
}
'''
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "YOCEWOR Bot"
          git config user.email "actions@users.noreply.github.com"
          git add job-details.html
          git diff --cached --quiet || git commit -m "fix: render rich article HTML content"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-rich-content-render.yml
          git add .github/workflows/fix-rich-content-render.yml
          git commit -m "chore: remove temporary render fix workflow"
          git push
