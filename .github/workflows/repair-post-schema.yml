name: Repair YOCEWOR posts schema

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch posts queries to actual schema
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Keep the UI's existing field names by aliasing the real DB columns.
          s = s.replace('caption,\n            media_url,\n            media_type,\n            privacy,\n            is_public,',
                        'caption:body,\n            media_url:image_url,')

          # Remove filters against the nonexistent is_public column from post queries.
          s = re.sub(r'\n\s*query\s*=\s*query\.eq\(\s*[\"\']is_public[\"\']\s*,\s*true\s*\);', '', s)
          s = re.sub(r'\n\s*query\s*=\s*query\.or\(\s*[\"\']is_public\.eq\.true,user_id\.eq\.\"\s*\+\s*currentUser\.id\s*\);', '', s)

          # The older feed loader uses a direct is_public filter.
          s = re.sub(r'\.eq\(\s*[\"\']is_public[\"\']\s*,\s*true\s*\)', '', s)

          # If a select explicitly requests caption/media fields, use the real columns with aliases.
          s = s.replace('caption, media_url, media_type, privacy, is_public',
                        'caption:body, media_url:image_url')

          if s == original:
              raise SystemExit('No expected posts-query pattern was found; refusing unsafe edit.')

          p.write_text(s, encoding='utf-8')

          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','index.html'], check=True)
          subprocess.run(['git','commit','-m','Fix feed for actual posts schema'], check=True)
          subprocess.run(['git','push'], check=True)

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/repair-post-schema.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary schema repair workflow' || true
          git push || true
