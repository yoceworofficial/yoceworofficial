name: YOCEWOR Premium Job Style

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  premium:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply YOCEWOR premium cards
        shell: python
        run: |
          from pathlib import Path
          p = Path('job-details.html')
          s = p.read_text(encoding='utf-8')
          marker = 'YOCEWOR_PREMIUM_JOB_STYLE_V1'
          if marker not in s:
              css = r'''<style id="yocewor-premium-job-style">
:root{--yo-p:#6d3df5;--yo-p2:#f04d8d;--yo-ink:#182235;--yo-muted:#6b778c;--yo-bg:#f5f7fb;--yo-card:#fff;--yo-line:#e6eaf2;--yo-soft:#f7f8fc;--yo-shadow:0 10px 28px rgba(32,35,60,.08)}
html,body{background:linear-gradient(180deg,#f7f8fc 0,#f3f6fb 100%);color:var(--yo-ink)}
body{font-family:Arial,"Noto Sans Devanagari","Mangal",sans-serif;line-height:1.7}
.top{background:linear-gradient(100deg,#17142c,#25204a 55%,#3a2457);border-bottom:0;box-shadow:0 5px 22px rgba(28,22,65,.2)}
.logo{border:0;background:linear-gradient(135deg,var(--yo-p),var(--yo-p2));box-shadow:0 5px 16px rgba(109,61,245,.35)}
.back{border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.08)}
main.wrap{padding-top:20px}
.hero{border:0!important;border-radius:20px!important;background:var(--yo-card)!important;box-shadow:var(--yo-shadow)!important;overflow:hidden!important;margin-bottom:20px!important}
.hero .cover,.hero .yo-featured-image{border-bottom:1px solid var(--yo-line)!important;background:#fff!important}
.hero .badge{background:linear-gradient(100deg,#f0ecff,#fff0f7);border:1px solid #e4dcff;color:#5b32cf;border-radius:999px;padding:6px 11px;font-size:11px}
.hero h1{color:var(--yo-ink);font-weight:900;letter-spacing:-.3px}
.hero>p,.lead{color:var(--yo-muted)}
.facts{border-top:0!important;margin-top:20px!important;gap:9px;padding:0 20px 4px}
.fact{border:1px solid var(--yo-line)!important;border-radius:13px;background:var(--yo-soft);padding:12px 13px!important}
.fact:nth-child(4n){border-right:1px solid var(--yo-line)!important}
.fact-label{color:#8993a6;font-size:10px;letter-spacing:.4px;text-transform:uppercase}
.fact-value{color:#242d40;font-weight:850}
.actions{padding:0 20px 20px;margin-top:16px}
.btn{border-radius:11px!important;padding:10px 15px!important;box-shadow:0 5px 12px rgba(20,25,50,.08)}
.apply{background:linear-gradient(100deg,#0d9b5b,#18b86e)!important}.notice-btn{background:linear-gradient(100deg,#20284a,#343c67)!important}.share{background:#59667b!important}.copy{background:linear-gradient(100deg,#6d3df5,#9a58e8)!important}
.section{background:var(--yo-card)!important;border:1px solid var(--yo-line)!important;border-radius:17px!important;margin:0 0 17px!important;box-shadow:var(--yo-shadow)!important;overflow:hidden!important}
.section-head{background:linear-gradient(100deg,#faf9ff,#f9fbff)!important;border-bottom:1px solid var(--yo-line)!important;padding:14px 17px!important}
.section-head .bar{width:5px!important;height:25px!important;border-radius:99px!important;background:linear-gradient(180deg,var(--yo-p),var(--yo-p2))!important}
.section-head h2{color:#222a3d!important;font-size:19px!important;font-weight:900!important}
.section-body{padding:17px!important}
.summary-grid{gap:11px!important}.summary-item{background:#fafbfe!important;border:1px solid var(--yo-line)!important;border-radius:12px!important;padding:12px 13px!important}.summary-item small{color:#8993a6!important}.summary-item strong{color:#273147!important}
.dates{border-collapse:separate!important;border-spacing:0!important;overflow:hidden;border:1px solid var(--yo-line);border-radius:12px}.dates th{background:linear-gradient(100deg,#29234b,#4a2e62)!important;padding:11px!important}.dates td{border:0!important;border-bottom:1px solid var(--yo-line)!important;padding:11px!important}.dates tr:last-child td{border-bottom:0!important}.dates tr:nth-child(even) td{background:#fafbfe!important}
.detail-block{padding:14px 0!important;border-bottom:1px solid var(--yo-line)!important}.detail-block h3{color:#4d2fc0!important;font-weight:900!important}
.steps{display:grid;gap:10px}.step{border:1px solid var(--yo-line)!important;border-radius:12px!important;background:#fafbfe!important;padding:12px 12px 12px 46px!important;margin:0!important}.step:before{background:linear-gradient(135deg,var(--yo-p),var(--yo-p2))!important;box-shadow:0 4px 10px rgba(109,61,245,.22)}
.notice{border:1px solid #f1d99a!important;border-left:5px solid #e4a51b!important;border-radius:12px!important;background:#fffaf0!important}
.links{gap:9px!important;border-top:0!important}.link{border:1px solid var(--yo-line)!important;border-radius:12px!important;background:#fafbfe!important;padding:12px!important}.link a{background:linear-gradient(100deg,#252b4c,#4a3a73)!important;border-radius:9px!important}
.social-box{border:1px solid var(--yo-line)!important;border-radius:14px!important;background:linear-gradient(135deg,#fafbff,#f4f1ff)!important}
.faq{border-bottom:1px solid var(--yo-line)!important}.faq summary{padding:13px 2px!important;color:#302b50!important}
.footer{color:#8a93a4!important}
@media(max-width:850px){.facts{grid-template-columns:repeat(2,1fr)!important}}
@media(max-width:560px){main.wrap{padding-top:10px}.hero{border-radius:15px!important}.facts{padding:0 14px 3px;gap:7px}.fact{border-radius:10px!important;padding:10px!important}.actions{padding:0 14px 15px}.section{border-radius:14px!important;margin-bottom:12px!important}.section-head{padding:12px 13px!important}.section-head h2{font-size:17px!important}.section-body{padding:13px!important}.summary-grid{grid-template-columns:1fr!important}.dates th,.dates td{padding:9px!important}.step{border-radius:10px!important}}
</style>'''
              s = s.replace('</head>', css + '\n<!-- ' + marker + ' -->\n</head>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit premium style
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add job-details.html
          git diff --cached --quiet || git commit -m 'Apply YOCEWOR premium job detail cards'
          git push
