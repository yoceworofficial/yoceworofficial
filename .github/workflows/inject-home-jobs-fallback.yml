name: Inject YOCEWOR Home Jobs Fallback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject fallback script into homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          if not p.exists():
              raise SystemExit('index.html not found')
          s=p.read_text(encoding='utf-8')
          tag='<script src="home-jobs-fallback.js?home-jobs-fallback-v1"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('index.html has no </body> marker')
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
              print('Injected home jobs fallback')
          else:
              print('Fallback already injected')
          PY
      - name: Commit homepage patch
        run: |
          if git diff --quiet; then
            echo 'No homepage patch needed.'
            exit 0
          fi
          git config user.name 'YOCEWOR Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix homepage published jobs loading [skip ci]'
          git push
