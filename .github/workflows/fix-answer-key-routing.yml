name: Fix Answer Key Routing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch job details router
        shell: python
        run: |
          from pathlib import Path

          path = Path('job-details.html')
          text = path.read_text(encoding='utf-8')
          marker = 'YOCEWOR_ANSWER_KEY_ROUTER_V1'

          if marker not in text:
              needle = "const params=new URLSearchParams(location.search),id=params.get('id'),slug=params.get('slug')||location.pathname.split('/').filter(Boolean).pop();"
              if needle not in text:
                  raise SystemExit('job-details query line not found')

              patch = needle + """
const YOCEWOR_ANSWER_KEY_ROUTER_V1=true;
document.documentElement.style.visibility='hidden';
(async()=>{
  try{
    const key=String(id||'').trim(), cleanSlug=String(slug||'').trim();
    let q=db.from('jobs').select('id,type').eq('published',true);
    q=key?q.eq('id',key):q.eq('slug',cleanSlug);
    const r=await q.maybeSingle();
    const t=String(r.data?.type||'').toLowerCase().replace(/[-\\s]+/g,'_');
    if(t==='answer_key'){
      const target='/answer-key-detail.html?'+(r.data?.id?'id='+encodeURIComponent(r.data.id):'slug='+encodeURIComponent(cleanSlug));
      location.replace(target);
      return;
    }
  }catch(e){}
  document.documentElement.style.visibility='visible';
})();"""
              text = text.replace(needle, patch, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit patched file
        shell: bash
        run: |
          git config user.name "YOCEWOR Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add job-details.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: route direct answer key detail links"
          git push