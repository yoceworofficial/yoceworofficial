name: YOCEWOR SEO and AdSense Guard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe public SEO and AdSense setup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          skip = {
              'admin.html','admin-dashboard.html','owner-dashboard.html','dashboard.html',
              'team-management-live.html','departments.html','department-login.html',
              'content.html','content-live-fixed.html','settings.html'
          }
          ads = '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2660794738235284" crossorigin="anonymous"></script>'
          root = Path('.')

          for p in root.rglob('*.html'):
              if any(part.startswith('.') for part in p.parts):
                  continue
              if p.name in skip:
                  continue
              text = p.read_text(encoding='utf-8')
              original = text

              if 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' not in text and '</head>' in text:
                  text = text.replace('</head>', ads + '\n</head>', 1)

              # Add canonical only to static public documents. Dynamic detail pages
              # determine their canonical from the current record/route and are skipped.
              if p.name not in {'job-details.html','answer-key-detail.html'} and '<link rel="canonical"' not in text and '</head>' in text:
                  rel = p.as_posix()
                  if rel == 'index.html':
                      rel = ''
                  canonical = 'https://yocewor.in/' + rel
                  text = text.replace('</head>', f'<link rel="canonical" href="{canonical}">\n</head>', 1)

              if text != original:
                  p.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes if needed
        shell: bash
        run: |
          git config user.name "YOCEWOR SEO Bot"
          git config user.email "actions@github.com"
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "No SEO/AdSense changes needed"
            exit 0
          fi
          git commit -m "Apply safe SEO canonical and AdSense setup"
          git push
