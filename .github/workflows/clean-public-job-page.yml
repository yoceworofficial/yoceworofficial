name: Clean Public Job Page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply premium public layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('job-details.html')
          s=p.read_text(encoding='utf-8')
          marker='YOCEWOR_PREMIUM_PUBLIC_LAYOUT_V2'
          if marker not in s:
              css=r'''<style id="yocewor-premium-public-layout">
/* YOCEWOR_PREMIUM_PUBLIC_LAYOUT_V2 */
.yo-premium-content{display:grid;gap:13px}.yo-card{border:1px solid #dfe8f1;border-radius:16px;background:linear-gradient(145deg,#fff,#f8fbff);padding:18px;box-shadow:0 5px 18px #173b5d0b}.yo-card-title{display:flex;align-items:center;gap:10px;margin:0 0 12px;color:#082f55;font-size:19px;font-weight:900}.yo-card-title:before{content:'';width:5px;height:27px;border-radius:99px;background:linear-gradient(#f59e0b,#f97316)}.yo-card p{margin:0 0 9px;color:#3d5062;font-size:15px}.yo-card p:last-child{margin-bottom:0}.yo-stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.yo-stat{border:1px solid #dfe8f1;border-radius:13px;padding:13px;background:#fff}.yo-stat b{display:block;color:#6b7b8c;font-size:11px;margin-bottom:3px}.yo-stat strong{display:block;color:#082f55;font-size:15px}.yo-highlight{background:linear-gradient(135deg,#eef7ff,#fff);border-color:#cfe2f5}.section{border-radius:16px;box-shadow:0 7px 25px #173b5d12}.section-head{padding:15px 18px}.section-head h2{font-weight:900}@media(max-width:700px){.yo-stat-grid{grid-template-columns:1fr}.yo-card{padding:15px}.section-body{padding:15px}}
</style>'''
              s=s.replace('</head>',css+'\n<!-- '+marker+' -->\n</head>',1)
              js=r'''<script id="yocewor-premium-content-v3">
(function(){
  const sep=/^[━─—\-_=]{5,}$/;
  const heading=/^(📌|📅|🎓|🎂|💳|🎯|💰|📄|📝|⚠️|🏆|📍)/;
  const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function card(title,lines){
    const stats=[]; lines.forEach(x=>{const m=x.match(/^([^:]{2,40}):\s*(.+)$/);if(m)stats.push([m[1],m[2]]);});
    let h='<article class="yo-card'+(/महत्वपूर्ण सूचना/.test(title)?' yo-highlight':'')+'"><h3 class="yo-card-title">'+esc(title)+'</h3>';
    if(stats.length>=2) h+='<div class="yo-stat-grid">'+stats.map(a=>'<div class="yo-stat"><b>'+esc(a[0])+'</b><strong>'+esc(a[1])+'</strong></div>').join('')+'</div>';
    else lines.forEach(x=>h+='<p>'+esc(x)+'</p>');
    return h+'</article>';
  }
  function convert(){document.querySelectorAll('.section-body').forEach(body=>{
    if(body.dataset.yoPremium==='1')return;
    const text=body.innerText||''; if(!/━{5,}/.test(text))return;
    const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean), groups=[]; let g=null;
    lines.forEach(x=>{if(sep.test(x))return;if(heading.test(x)){g={title:x,lines:[]};groups.push(g)}else if(g)g.lines.push(x)});
    if(groups.length<2)return;
    body.innerHTML='<div class="yo-premium-content">'+groups.map(x=>card(x.title,x.lines)).join('')+'</div>'; body.dataset.yoPremium='1';
  })}
  const run=()=>setTimeout(convert,250); new MutationObserver(run).observe(document.getElementById('app')||document.body,{childList:true,subtree:true});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
})();
</script>'''
              s=s.replace('</body>',js+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
      - name: Commit layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add job-details.html
          git diff --cached --quiet || git commit -m 'Upgrade all public job pages to premium YOCEWOR cards'
          git push
