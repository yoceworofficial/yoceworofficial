name: Fix HTML Tags In Job Content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch public job page HTML rendering
        shell: python
        run: |
          from pathlib import Path
          p = Path('job-details.html')
          s = p.read_text(encoding='utf-8')
          marker = 'YOCEWOR_HTML_CONTENT_RENDER_FIX_V1'
          if marker in s:
              print('Fix already present')
          else:
              js = r'''<script id="yocewor-html-content-render-fix">
/* YOCEWOR_HTML_CONTENT_RENDER_FIX_V1 */
(function(){
  const marker='data-yocewor-html-fixed';
  const allowed=new Set(['H2','H3','H4','P','UL','OL','LI','STRONG','B','EM','I','BR','A']);
  function cleanNode(node){
    if(node.nodeType!==Node.ELEMENT_NODE)return;
    if(!allowed.has(node.tagName)){
      const f=document.createDocumentFragment();
      while(node.firstChild)f.appendChild(node.firstChild);
      node.replaceWith(f); return;
    }
    [...node.attributes].forEach(a=>{
      if(node.tagName==='A' && a.name==='href'){
        try{const u=new URL(a.value,location.href); if(!/^https?:$/.test(u.protocol)) node.removeAttribute('href');}
        catch(e){node.removeAttribute('href');}
      }else if(!(node.tagName==='A' && a.name==='target')) node.removeAttribute(a.name);
    });
    [...node.children].forEach(cleanNode);
  }
  function render(root){
    if(!root || root.getAttribute(marker)==='1')return;
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];
    while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(text=>{
      const raw=text.nodeValue||'';
      if(!/<(?:h2|h3|h4|p|ul|ol|li|strong|b|em|i|br|a)\b/i.test(raw))return;
      const box=document.createElement('div');
      box.innerHTML=raw;
      [...box.children].forEach(cleanNode);
      if(box.childNodes.length)text.replaceWith(...box.childNodes);
    });
    root.setAttribute(marker,'1');
  }
  function run(){document.querySelectorAll('.section-body').forEach(render)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
  new MutationObserver(()=>setTimeout(run,50)).observe(document.getElementById('app')||document.body,{childList:true,subtree:true});
})();
</script>
'''
              s=s.replace('</body>', js + '</body>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add job-details.html
          git diff --cached --quiet || git commit -m 'Fix HTML tags shown as text in public job details'
          git push
