name: Apply YOCEWOR Public Theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared public metadata and preserve clean homepage
        shell: python
        run: |
          from pathlib import Path
          import re
          skip = {'index.html','admin.html','admin-dashboard.html','owner-dashboard.html','dashboard.html','team-management-live.html','departments.html','department-login.html','content.html','content-live-fixed.html','settings.html'}
          ads='<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2660794738235284" crossorigin="anonymous"></script>'
          for p in Path('.').rglob('*.html'):
              if any(part.startswith('.') for part in p.parts) or p.name in skip:
                  continue
              s=p.read_text(encoding='utf-8')
              original=s
              if 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' not in s and '</head>' in s:
                  s=s.replace('</head>',ads+'\n</head>',1)
              if '<link rel="canonical"' not in s and '</head>' in s:
                  rel=p.as_posix()
                  s=s.replace('</head>',f'<link rel="canonical" href="https://yocewor.in/{rel}">\n</head>',1)
              s=re.sub(r'(https://yocewor\.in/[^"<>]+?)/index\.html(["\'])',r'\1/\2',s)
              if s!=original:
                  p.write_text(s,encoding='utf-8')

          p=Path('job-details.html')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              tag='<script src="/job-template-v2.js?v=20260913"></script>'
              if tag not in s and '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
                  p.write_text(s,encoding='utf-8')
      - name: Commit metadata improvements
        run: |
          git config user.name "YOCEWOR Metadata Bot"
          git config user.email "actions@github.com"
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve clean YOCEWOR homepage"
          git push
