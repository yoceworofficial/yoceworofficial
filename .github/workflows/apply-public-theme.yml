name: Apply YOCEWOR Public Theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply public design, AdSense loader and canonical tags
        shell: python
        run: |
          from pathlib import Path
          skip = {'admin.html','admin-dashboard.html','owner-dashboard.html','dashboard.html','team-management-live.html','departments.html','department-login.html','content.html','content-live-fixed.html','settings.html'}
          theme='<link rel="stylesheet" href="/yocewor-theme.css">'
          ads='<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2660794738235284" crossorigin="anonymous"></script>'
          for p in Path('.').rglob('*.html'):
              if any(part.startswith('.') for part in p.parts) or p.name in skip:
                  continue
              s=p.read_text(encoding='utf-8')
              original=s
              if theme not in s and '</head>' in s:
                  s=s.replace('</head>',theme+'\n</head>',1)
              if 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' not in s and '</head>' in s:
                  s=s.replace('</head>',ads+'\n</head>',1)
              if p.name not in {'job-details.html','answer-key-detail.html'} and '<link rel="canonical"' not in s and '</head>' in s:
                  rel=p.as_posix()
                  if rel=='index.html': rel=''
                  s=s.replace('</head>',f'<link rel="canonical" href="https://yocewor.in/{rel}">\n</head>',1)
              if s!=original:
                  p.write_text(s,encoding='utf-8')
      - name: Commit public improvements
        run: |
          git config user.name "YOCEWOR Theme Bot"
          git config user.email "actions@github.com"
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply YOCEWOR public SEO and monetization setup"
          git push
