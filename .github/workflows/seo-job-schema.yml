name: YOCEWOR Recruitment SEO Schema

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add dynamic recruitment SEO signals
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('job-details.html')
          if not path.exists():
              raise SystemExit('job-details.html not found')

          text = path.read_text(encoding='utf-8')
          marker = 'YOCEWOR_RECRUITMENT_SEO_V2'
          if marker in text:
              raise SystemExit(0)

          anchor = 'const SOCIAL='
          if anchor not in text:
              raise SystemExit('job-details anchor not found')

          patch = r'''/* YOCEWOR_RECRUITMENT_SEO_V2 */
(async()=>{
  try{
    const norm=v=>String(v??'').trim();
    const first=(o,keys)=>{for(const k of keys){const v=o?.[k];if(v!==undefined&&v!==null&&String(v).trim()!=='')return v}return ''};
    const textOnly=v=>{const d=document.createElement('div');d.innerHTML=String(v??'');return (d.textContent||d.innerText||'').replace(/\s+/g,' ').trim()};
    const escHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const addMeta=(name,content)=>{if(!content)return;let m=document.querySelector('meta[name="'+name+'"]');if(!m){m=document.createElement('meta');m.name=name;document.head.appendChild(m)}m.content=content};
    const addLink=(rel,href)=>{let l=document.querySelector('link[rel="'+rel+'"]');if(!l){l=document.createElement('link');l.rel=rel;document.head.appendChild(l)}l.href=href};
    const setSchema=(id,obj)=>{let s=document.getElementById(id);if(!s){s=document.createElement('script');s.id=id;s.type='application/ld+json';document.head.appendChild(s)}s.textContent=JSON.stringify(obj)};

    const p=new URLSearchParams(location.search), key=norm(p.get('id')), requestedSlug=norm(p.get('slug'))||location.pathname.split('/').filter(Boolean).pop();
    let q=db.from('jobs').select('*').eq('published',true);
    q=key?q.eq('id',key):q.eq('slug',requestedSlug);
    const {data:job,error}=await q.maybeSingle();
    if(error||!job)return;

    const type=norm(job.type).toLowerCase().replace(/[\s-]+/g,'_');
    if(type==='answer_key')return;
    const title=norm(first(job,['title','post_title','name']))||'Government Recruitment';
    const slug=norm(first(job,['slug']))||requestedSlug;
    const canonical=slug?('https://yocewor.in/'+slug.replace(/^\/+|\/+$/g,'')+'/'):location.href.split('#')[0];
    const summary=textOnly(first(job,['summary','short_description','intro','description','content','details']));
    const dept=norm(first(job,['department','organization','employer','company','recruiting_organization','authority']));
    const locationValue=norm(first(job,['location','job_location','work_location','place','state','posting_location']));
    const datePosted=norm(first(job,['date_posted','publish_date','published_at','created_at'])).slice(0,10);
    const lastDate=norm(first(job,['last_date','application_last_date','closing_date','valid_through']));
    const vacancies=norm(first(job,['vacancies','vacancy','total_vacancies','posts']));
    const qualification=textOnly(first(job,['qualification','eligibility','educational_qualification','education']));
    const salary=textOnly(first(job,['salary','pay_scale','pay_level','salary_details']));
    const age=textOnly(first(job,['age_limit','age','age_limit_details']));
    const applyUrl=norm(first(job,['apply_url','application_url','apply_link']));

    document.title=title+' | YOCEWOR';
    addMeta('description', (summary||title+' — भर्ती की पात्रता, महत्वपूर्ण तिथियां, पद, आवेदन प्रक्रिया और आधिकारिक लिंक।').slice(0,300));
    addMeta('robots','index,follow,max-image-preview:large');
    addMeta('og:title',title+' | YOCEWOR');
    addMeta('og:description',(summary||title).slice(0,300));
    addMeta('og:url',canonical);
    addLink('canonical',canonical);

    setSchema('yocewor-breadcrumb-schema',{
      '@context':'https://schema.org','@type':'BreadcrumbList','itemListElement':[
        {'@type':'ListItem','position':1,'name':'YOCEWOR','item':'https://yocewor.in/'},
        {'@type':'ListItem','position':2,'name':'Latest Jobs','item':'https://yocewor.in/latest-jobs.html'},
        {'@type':'ListItem','position':3,'name':title}
      ]
    });

    const isJob=['job','recruitment','latest_jobs','state_government_jobs','central_government_jobs','government_jobs'].includes(type);
    const longDescription=textOnly(first(job,['description','content','details','summary','short_description']))||summary;
    if(!isJob || !datePosted || !dept || !locationValue || longDescription.length<80)return;

    const posting={
      '@context':'https://schema.org','@type':'JobPosting','url':canonical,
      'title':title,'description':'<p>'+escHtml(longDescription)+'</p>',
      'datePosted':datePosted,
      'hiringOrganization':{'@type':'Organization','name':dept},
      'jobLocation':{'@type':'Place','address':{'@type':'PostalAddress','addressLocality':locationValue,'addressCountry':'IN'}}
    };
    if(lastDate)posting.validThrough=lastDate.length>=10?lastDate:'2026-12-31';
    if(vacancies && /^\d+(?:\.\d+)?$/.test(vacancies.replace(/,/g,'')))posting.totalJobOpenings=Number(vacancies.replace(/,/g,''));
    if(applyUrl && /^https?:\/\//i.test(applyUrl))posting.directApply=false;
    if(salary)posting.baseSalary={'@type':'MonetaryAmount','currency':'INR','value':{'@type':'QuantitativeValue','value':salary}};
    setSchema('yocewor-jobposting-schema',posting);
  }catch(e){console.warn('YOCEWOR SEO schema:',e)}
})();
'''
          text = text.replace(anchor, patch + '\n' + anchor, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit SEO patch
        shell: bash
        run: |
          git config user.name "YOCEWOR Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add job-details.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add recruitment page SEO schema and canonical"
          git push
