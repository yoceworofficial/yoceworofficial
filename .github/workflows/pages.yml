name: Deploy YOCEWOR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Normalize Owner auth references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          version='owner-auth-20260831-6'
          files=[
            'owner-dashboard.html','dashboard.html','team-management-live.html','content.html',
            'departments.html','important-notice.html','live-notice.html','settings.html','activity-audit.html'
          ]
          for name in files:
            p=Path(name)
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            s=s.replace('/owner-auth-v3.js','/owner-auth.js')
            s=s.replace('/owner-auth.js?owner-auth-v2','/owner-auth.js?'+version)
            s=s.replace('/owner-auth.js?20260831-owner','/owner-auth.js?'+version)
            s=s.replace('/owner-auth.js','/owner-auth.js?'+version)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Refine job details side layout and cover image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('job-details.html')
          if p.exists():
            s=p.read_text(encoding='utf-8')
            css='''<style id="yocewor-side-layout">\nhtml,body{width:100%;max-width:100%;overflow-x:hidden!important}\n.wrap{width:100%;max-width:1080px;margin-left:auto;margin-right:auto;padding-left:20px;padding-right:20px}\n.hero,.content-card{width:100%;max-width:100%;margin-left:0;margin-right:0}\n.content-card{border-radius:10px}\n.content-card>.intro,.content-card>.grid,.content-card>.fee-grid,.content-card>.exam-grid,.content-card>.links,.content-card>.notice,.content-card>.steps,.content-card>.empty,.content-card>.section,.content-card>.faq{max-width:calc(100% - 32px);margin-left:16px;margin-right:16px}\n.link-row,.info,.section,.step,.highlight,.notice{min-width:0;max-width:100%}\n.link-info{min-width:0;max-width:100%}\n.link-action{flex:0 1 116px;min-width:96px;max-width:38%;white-space:normal;overflow-wrap:anywhere}\n.yocewor-job-cover{display:block;width:100%;height:auto;max-height:330px;object-fit:cover;border-radius:9px;margin:0 0 18px}\n@media(max-width:600px){.wrap{padding-left:14px;padding-right:14px}.hero{padding-left:13px;padding-right:13px}.content-card>.intro,.content-card>.grid,.content-card>.fee-grid,.content-card>.exam-grid,.content-card>.links,.content-card>.notice,.content-card>.steps,.content-card>.empty,.content-card>.section,.content-card>.faq{max-width:calc(100% - 26px);margin-left:13px;margin-right:13px}.link-row{gap:8px}.link-action{min-width:88px;max-width:36%;padding-left:7px;padding-right:7px}.content-card h2{padding-left:13px;padding-right:13px}.yocewor-job-cover{max-height:220px;margin-bottom:14px}}\n</style>'''
            if 'id="yocewor-side-layout"' in s:
              s=re.sub(r'<style id="yocewor-side-layout">.*?</style>',css,s,flags=re.S)
            else:
              s=s.replace('</head>',css+'</head>',1)
            marker='<img class="yocewor-job-cover" src="assets/yocewor-job-cover.svg" alt="YOCEWOR Job & Recruitment">'
            if 'class="yocewor-job-cover"' not in s:
              s=s.replace('<article class="hero">',marker+'<article class="hero">',1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Add Edit Content image uploader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('edit-content.html')
          if p.exists():
            s=p.read_text(encoding='utf-8')
            tag='<script src="/edit-image-upload.js?edit-image-upload-v1"></script>'
            if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
