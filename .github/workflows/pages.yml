name: Deploy YOCEWOR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Strengthen public SEO metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          public_names = {
            'index.html','latest-jobs.html','updates.html','important-notice.html','answer-key.html',
            'answer-key-detail.html','privacy.html','terms.html','contact.html','about.html','disclaimer.html',
            'advertise.html','community-guidelines.html','expired-jobs.html','search.html','live.html',
            'help.html'
          }
          labels = {
            'index.html':'YOCEWOR | सरकारी भर्ती एवं परीक्षा पोर्टल',
            'latest-jobs.html':'Latest Government Jobs 2026 | YOCEWOR',
            'updates.html':'Latest Government Job & Exam Updates | YOCEWOR',
            'important-notice.html':'Important Government Job Notices | YOCEWOR',
            'answer-key.html':'Answer Key 2026 | YOCEWOR',
            'answer-key-detail.html':'Answer Key Details | YOCEWOR',
            'about.html':'About YOCEWOR',
            'disclaimer.html':'Disclaimer | YOCEWOR',
            'privacy.html':'Privacy Policy | YOCEWOR',
            'terms.html':'Terms & Conditions | YOCEWOR',
            'contact.html':'Contact YOCEWOR',
            'advertise.html':'Advertise with YOCEWOR',
            'community-guidelines.html':'Community Guidelines | YOCEWOR',
            'expired-jobs.html':'Expired Government Jobs | YOCEWOR',
            'search.html':'Search Government Jobs & Exam Updates | YOCEWOR',
            'live.html':'Live Government Job & Exam Updates | YOCEWOR',
            'help.html':'Help | YOCEWOR'
          }

          def inject_once(s, marker, tag):
            if marker in s:
              return s
            return re.sub(r'</head>', tag+'\n</head>', s, count=1, flags=re.I)

          for p in Path('.').glob('*.html'):
            if p.name not in public_names:
              continue
            s=p.read_text(encoding='utf-8')
            if '<meta property="og:title"' not in s:
              title=labels.get(p.name,'YOCEWOR')
              s=re.sub(r'</head>', '<meta property="og:title" content="'+title.replace('"','&quot;')+'">\n</head>', s, count=1, flags=re.I)
            if '<meta property="og:site_name"' not in s:
              s=re.sub(r'</head>', '<meta property="og:site_name" content="YOCEWOR">\n</head>', s, count=1, flags=re.I)
            if '<meta name="robots"' not in s.lower():
              s=re.sub(r'</head>', '<meta name="robots" content="index,follow,max-image-preview:large">\n</head>', s, count=1, flags=re.I)
            if p.name != 'index.html' and '<link rel="canonical"' not in s:
              canonical='https://yocewor.in/'+p.name
              s=re.sub(r'</head>', '<link rel="canonical" href="'+canonical+'">\n</head>', s, count=1, flags=re.I)
            p.write_text(s,encoding='utf-8')

          # Homepage entity signals: WebSite + Organization + SearchAction.
          p=Path('index.html')
          if p.exists():
            s=p.read_text(encoding='utf-8')
            if 'id="yocewor-home-schema"' not in s:
              schema={
                '@context':'https://schema.org',
                '@graph':[
                  {'@type':'Organization','@id':'https://yocewor.in/#organization','name':'YOCEWOR','url':'https://yocewor.in/','description':'Government jobs and exam information portal.'},
                  {'@type':'WebSite','@id':'https://yocewor.in/#website','url':'https://yocewor.in/','name':'YOCEWOR','publisher':{'@id':'https://yocewor.in/#organization'},'potentialAction':{'@type':'SearchAction','target':'https://yocewor.in/search.html?q={search_term_string}','query-input':'required name=search_term_string'}}
                ]
              }
              tag='<script id="yocewor-home-schema" type="application/ld+json">'+json.dumps(schema,ensure_ascii=False,separators=(',',':'))+'</script>'
              s=re.sub(r'</head>',tag+'\n</head>',s,count=1,flags=re.I)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Apply YOCEWOR V2 public brand system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          public_names = {
            'index.html','latest-jobs.html','updates.html','important-notice.html','answer-key.html',
            'answer-key-detail.html','privacy.html','terms.html','contact.html','about.html','disclaimer.html',
            'advertise.html','community-guidelines.html','expired-jobs.html','search.html','live.html','live-notice.html',
            'help.html','job-details.html'
          }
          css_tag='<link rel="stylesheet" href="/yocewor-brand-v2.css?v=20260911">'
          icon_tag='<link rel="icon" href="/assets/yocewor-mark-v2.svg" type="image/svg+xml">'
          for p in Path('.').glob('*.html'):
            if p.name not in public_names:
              continue
            s=p.read_text(encoding='utf-8')
            if 'yocewor-brand-v2.css' not in s and re.search(r'</head>',s,flags=re.I):
              s=re.sub(r'</head>',css_tag+'\n</head>',s,count=1,flags=re.I)
            if 'yocewor-mark-v2.svg' not in s and re.search(r'</head>',s,flags=re.I):
              s=re.sub(r'</head>',icon_tag+'\n</head>',s,count=1,flags=re.I)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Normalize Owner auth references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          version='owner-auth-20260831-6'
          files=['owner-dashboard.html','dashboard.html','team-management-live.html','content.html','departments.html','important-notice.html','live-notice.html','settings.html','activity-audit.html']
          for name in files:
            p=Path(name)
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            s=s.replace('/owner-auth-v3.js','/owner-auth.js')
            s=s.replace('/owner-auth.js?owner-auth-v2','/owner-auth.js?'+version)
            s=s.replace('/owner-auth.js?20260831-owner','/owner-auth.js?'+version)
            s=s.replace('/owner-auth.js','/owner-auth.js?'+version)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Refine job details side layout and cover image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('job-details.html')
          if p.exists():
            s=p.read_text(encoding='utf-8')
            css='''<style id="yocewor-side-layout">\nhtml,body{width:100%;max-width:100%;overflow-x:hidden!important}\n.wrap{width:100%;max-width:1080px;margin-left:auto;margin-right:auto;padding-left:20px;padding-right:20px}\n.hero,.content-card{width:100%;max-width:100%;margin-left:0;margin-right:0}\n.content-card{border-radius:10px}\n.content-card>.intro,.content-card>.grid,.content-card>.fee-grid,.content-card>.exam-grid,.content-card>.links,.content-card>.notice,.content-card>.steps,.content-card>.empty,.content-card>.section,.content-card>.faq{max-width:calc(100% - 32px);margin-left:16px;margin-right:16px}\n.link-row,.info,.section,.step,.highlight,.notice{min-width:0;max-width:100%}\n.link-info{min-width:0;max-width:100%}\n.link-action{flex:0 1 116px;min-width:96px;max-width:38%;white-space:normal;overflow-wrap:anywhere}\n.yocewor-job-cover{display:block;width:100%;height:auto;max-height:330px;object-fit:cover;border-radius:9px;margin:0 0 18px}\n@media(max-width:600px){.wrap{padding-left:14px;padding-right:14px}.hero{padding-left:13px;padding-right:13px}.content-card>.intro,.content-card>.grid,.content-card>.fee-grid,.content-card>.exam-grid,.content-card>.links,.content-card>.notice,.content-card>.steps,.content-card>.empty,.content-card>.section,.content-card>.faq{max-width:calc(100% - 26px);margin-left:13px;margin-right:13px}.link-row{gap:8px}.link-action{min-width:88px;max-width:36%;padding-left:7px;padding-right:7px}.content-card h2{padding-left:13px;padding-right:13px}.yocewor-job-cover{max-height:220px;margin-bottom:14px}}\n</style>'''
            if 'id="yocewor-side-layout"' in s:
              s=re.sub(r'<style id="yocewor-side-layout">.*?</style>',css,s,flags=re.S)
            else:
              s=s.replace('</head>',css+'</head>',1)
            marker='<img class="yocewor-job-cover" src="assets/yocewor-job-cover.svg" alt="YOCEWOR Job & Recruitment">'
            if 'class="yocewor-job-cover"' not in s:
              s=s.replace('<article class="hero">',marker+'<article class="hero">',1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Add Edit Content image uploader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('edit-content.html')
          if p.exists():
            s=p.read_text(encoding='utf-8')
            tag='<script src="/edit-image-upload.js?edit-image-upload-v1"></script>'
            if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Mark internal tools noindex and add legal footer links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          internal_exact = {'admin.html','admin-dashboard.html','activity-audit.html','app-v2.html','change-password.html','content.html','content-live.html','content-live-fixed.html','content-owner.html','creator-engine.html','dashboard.html','department-login.html','departments.html','edit-content.html','editor.html','editor-dashboard.html','editor-job-submit.html','first-login.html','gm.html','gm-content.html','gm-dashboard.html','gm-manage-users.html','id-card.html','job.html','job-review.html','live-notice.html','login.html','owner.html','owner-control.html','owner-dashboard.html','owner-setup.html','settings.html','staff-id-card.html','team-approvals.html','team-login.html','team-management.html','team-management-live.html','team-management-v2.html','team-requests.html','team-requests-v2.html','verification.html','yocewor-v2.html','yocewor-v3.html'}
          public_names = {'index.html','latest-jobs.html','updates.html','important-notice.html','answer-key.html','answer-key-detail.html','privacy.html','terms.html','contact.html','about.html','disclaimer.html','advertise.html','community-guidelines.html','expired-jobs.html','search.html','live.html','live-notice.html','help.html','job-details.html'}
          legal = '<div class="yocewor-legal-links" style="margin-top:10px;font-size:12px"><a href="about.html">About</a> · <a href="disclaimer.html">Disclaimer</a> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a> · <a href="contact.html">Contact</a></div>'
          for p in Path('.').glob('*.html'):
            name=p.name; s=p.read_text(encoding='utf-8')
            if name in internal_exact:
              if 'name="robots"' not in s.lower():
                s=re.sub(r'<head(\s[^>]*)?>',lambda m:m.group(0)+'\n<meta name="robots" content="noindex,nofollow,noarchive">',s,count=1,flags=re.I)
              p.write_text(s,encoding='utf-8'); continue
            if name in public_names and 'class="yocewor-legal-links"' not in s:
              if re.search(r'</footer>',s,flags=re.I): s=re.sub(r'</footer>',legal+'\n</footer>',s,count=1,flags=re.I)
              elif name in {'privacy.html','terms.html','contact.html','about.html','disclaimer.html','advertise.html','community-guidelines.html'}: s=s.replace('</main>',legal+'\n</main>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Add AdSense verification and ads.txt to content-rich public pages only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          adsense = '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2660794738235284" crossorigin="anonymous"></script>'
          meta = '<meta name="google-adsense-account" content="ca-pub-2660794738235284">'
          ad_pages = {'index.html','job-details.html','answer-key-detail.html','about.html','disclaimer.html','privacy.html','terms.html','contact.html','advertise.html','community-guidelines.html','important-notice.html','updates.html'}
          for p in Path('.').glob('*.html'):
            if p.name not in ad_pages: continue
            s=p.read_text(encoding='utf-8')
            if 'client=ca-pub-2660794738235284' not in s and re.search(r'</head>',s,flags=re.I): s=re.sub(r'</head>',adsense+'\n</head>',s,count=1,flags=re.I)
            if 'name="google-adsense-account"' not in s and re.search(r'</head>',s,flags=re.I): s=re.sub(r'</head>',meta+'\n</head>',s,count=1,flags=re.I)
            p.write_text(s,encoding='utf-8')
          Path('ads.txt').write_text('google.com, pub-2660794738235284, DIRECT, f08c47fec0942fa0\n',encoding='utf-8')
          PY
      - name: Add Google Analytics tracking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          ga='''<!-- Google tag (gtag.js) -->\n          <script async src="https://www.googletagmanager.com/gtag/js?id=G-8PVG5XNL3H"></script>\n          <script>\n          window.dataLayer = window.dataLayer || [];\n          function gtag(){dataLayer.push(arguments);}\n          gtag('js', new Date());\n          gtag('config', 'G-8PVG5XNL3H');\n          </script>'''
          for p in Path('.').rglob('*.html'):
            if any(part in {'.git','node_modules','_site'} for part in p.parts): continue
            s=p.read_text(encoding='utf-8')
            if 'G-8PVG5XNL3H' not in s and re.search(r'</head>',s,flags=re.I):
              s=re.sub(r'</head>',ga+'\n</head>',s,count=1,flags=re.I); p.write_text(s,encoding='utf-8')
          PY
      - name: Inject homepage jobs fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          if p.exists():
            s=p.read_text(encoding='utf-8'); tag='<script src="home-jobs-fallback.js?home-jobs-fallback-v1"></script>'
            if tag not in s: s=s.replace('</body>',tag+'\n</body>',1); p.write_text(s,encoding='utf-8')
          PY
      - name: Verify AdSense files before publish
        run: |
          test -s ads.txt
          grep -F 'google.com, pub-2660794738235284, DIRECT, f08c47fec0942fa0' ads.txt
          grep -R -l -F 'client=ca-pub-2660794738235284' --include='*.html' . | head -1
          grep -R -l -F 'google-adsense-account' --include='*.html' . | head -1
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
