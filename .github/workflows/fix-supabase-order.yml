name: Fix YOCEWOR Supabase initialization order

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-supabase-order:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Supabase client initialization order') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move Supabase initialization before all app parts
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          bootstrap = '''<!-- YOCEWOR SAFE SUPABASE BOOTSTRAP -->
          <script>
          "use strict";

          if (!window.supabase || typeof window.supabase.createClient !== "function") {
            console.error("YOCEWOR: Supabase CDN did not load before initialization.");
          } else {
            var SUPABASE_URL = "https://mzntgjyecymcpzciklfk.supabase.co";
            var SUPABASE_ANON_KEY = "sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn";
            var yoceworSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            var supabaseClient = yoceworSupabase;
            var currentUser = null;
            var currentProfile = null;
            var MEDIA_BUCKET = "yocewor-media";

            window.SUPABASE_URL = SUPABASE_URL;
            window.SUPABASE_ANON_KEY = SUPABASE_ANON_KEY;
            window.yoceworSupabase = yoceworSupabase;
            window.supabaseClient = supabaseClient;
            window.currentUser = currentUser;
            window.currentProfile = currentProfile;
            window.MEDIA_BUCKET = MEDIA_BUCKET;

            window.YOCEWOR = window.YOCEWOR || {};
            window.YOCEWOR.supabaseConfig = { urlConfigured: true, keyConfigured: true };
            window.YOCEWOR.isSupabaseConfigured = function () { return true; };
            console.log("YOCEWOR: Supabase bootstrap ready");
          }
          </script>
          <!-- END YOCEWOR SAFE SUPABASE BOOTSTRAP -->
          '''

          text = re.sub(r'<!-- YOCEWOR SAFE SUPABASE BOOTSTRAP -->.*?<!-- END YOCEWOR SAFE SUPABASE BOOTSTRAP -->\s*', '', text, flags=re.S)

          late_re = (
              r'<!-- =====================================================\s*'
              r'YOCEWOR — FRONTEND \+ SUPABASE CONNECTION\s*'
              r'PART 1\s*'
              r'SUPABASE CLIENT INITIALIZATION\s*'
              r'===================================================== -->.*?'
              r'</script>\s*'
          )
          text, removed = re.subn(late_re, '', text, count=1, flags=re.S)

          part2_marker = "<!-- =====================================================\n     YOCEWOR — PART 2"
          pos = text.find(part2_marker)
          if pos < 0:
              raise SystemExit("First Part 2 marker not found; no changes made.")

          text = text[:pos] + bootstrap + "\n" + text[pos:]
          path.write_text(text, encoding="utf-8")
          print(f"Late Part 1 blocks removed: {removed}")

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          text = Path("index.html").read_text(encoding="utf-8")
          bootstrap = text.index("<!-- YOCEWOR SAFE SUPABASE BOOTSTRAP -->")
          part2 = text.index("<!-- =====================================================\n     YOCEWOR — PART 2")
          assert bootstrap < part2
          assert text.count("<!-- YOCEWOR SAFE SUPABASE BOOTSTRAP -->") == 1
          assert text.count("var yoceworSupabase") == 1
          assert text.count("var supabaseClient") == 1
          print("YOCEWOR Supabase order/scope fix validated.")

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change needed."
            exit 0
          fi
          git commit -m "Fix Supabase client initialization order"
          git push
