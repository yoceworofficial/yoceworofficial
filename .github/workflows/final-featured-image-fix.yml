name: Final Featured Image Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Wire featured image upload and public rendering
        shell: python
        run: |
          from pathlib import Path

          # 1) Content editor: keep the existing Image URL field, but make the
          # file picker actually upload to Supabase and fill that URL field.
          p = Path('content-live-fixed.html')
          s = p.read_text(encoding='utf-8')
          marker = 'YOCEWOR_FINAL_FEATURED_UPLOAD_V1'
          if marker not in s:
              inject = r'''\n<script id="yocewor-final-featured-upload">\n(function(){\n  const fileEl=document.getElementById('image');\n  const urlEl=document.getElementById('imageUrl');\n  const previewEl=document.getElementById('imagePreview');\n  if(!fileEl||!urlEl) return;\n  fileEl.addEventListener('change',async function(){\n    const file=this.files&&this.files[0];\n    if(!file) return;\n    if(!file.type||!file.type.startsWith('image/')){ this.value=''; alert('Please select an image file.'); return; }\n    if(file.size>8*1024*1024){ this.value=''; alert('Image must be 8 MB or smaller.'); return; }\n    const old=previewEl?previewEl.innerHTML:'';\n    if(previewEl) previewEl.innerHTML='<div class="status">⏳ Uploading image…</div>';\n    try{\n      const auth=await db.auth.getUser();\n      const uid=auth.data&&auth.data.user&&auth.data.user.id;\n      if(!uid) throw new Error('Login session not found.');\n      const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';\n      const path=uid+'/'+crypto.randomUUID()+'.'+ext;\n      const up=await db.storage.from('content-images').upload(path,file,{contentType:file.type,upsert:false});\n      if(up.error) throw up.error;\n      const pub=db.storage.from('content-images').getPublicUrl(path);\n      const publicUrl=pub.data&&pub.data.publicUrl;\n      if(!publicUrl) throw new Error('Could not create image URL.');\n      urlEl.value=publicUrl;\n      if(previewEl) previewEl.innerHTML='<img class="heroimg" src="'+esc(publicUrl)+'" alt="Featured image preview">';\n      const msg=document.getElementById('msg'); if(msg) msg.textContent='✅ Image uploaded. Save Draft or Publish / Update to keep it with this job.';\n    }catch(e){\n      if(previewEl) previewEl.innerHTML=old;\n      alert('Image upload failed: '+(e&&e.message?e.message:e));\n      this.value='';\n    }\n  });\n  urlEl.addEventListener('input',function(){\n    const u=this.value.trim();\n    if(previewEl) previewEl.innerHTML=u?'<img class="heroimg" src="'+esc(u)+'" alt="Featured image preview">':'';\n  });\n})();\n</script>\n'''
              s=s.replace('</body>',inject+'<!-- '+marker+' -->\n</body>',1)
              p.write_text(s,encoding='utf-8')

          # 2) Public job-details page: render the exact saved featured_image.
          p=Path('job-details.html')
          s=p.read_text(encoding='utf-8')
          marker='YOCEWOR_FINAL_PUBLIC_FEATURED_IMAGE_V1'
          if marker not in s:
              css='''<style id="yocewor-final-public-featured-image-css">.yo-featured-image{margin:0 0 18px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.yo-featured-image img{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;background:#fff}@media(max-width:600px){.yo-featured-image{margin:0 0 14px;border-radius:8px}.yo-featured-image img{max-height:none;height:auto}}</style>'''
              if 'yocewor-final-public-featured-image-css' not in s:
                  s=s.replace('</style></head>', '</style>'+css+'</head>',1)
              needle='<article class="hero"><span class="badge">📢 Latest Recruitment</span><h1>${esc(j.title)}</h1>'
              repl='<article class="hero">${j.featured_image?`<div class="yo-featured-image"><img src="${esc(j.featured_image)}" alt="${esc(j.title)}" loading="lazy"></div>`:``}<span class="badge">📢 Latest Recruitment</span><h1>${esc(j.title)}</h1>'
              if needle in s:
                  s=s.replace(needle,repl,1)
              else:
                  # Support the current source if the hero opening changed slightly.
                  needle2='<article class="hero"><span class="badge">📢 Latest Recruitment</span>'
                  repl2='<article class="hero">${j.featured_image?`<div class="yo-featured-image"><img src="${esc(j.featured_image)}" alt="${esc(j.title)}" loading="lazy"></div>`:``}<span class="badge">📢 Latest Recruitment</span>'
                  s=s.replace(needle2,repl2,1)
              s=s.replace('</script></body></html>','<!-- '+marker+' -->\n</script></body></html>',1)
              p.write_text(s,encoding='utf-8')

      - name: Commit final patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content-live-fixed.html job-details.html
          git diff --cached --quiet || git commit -m 'Wire featured image upload and render saved image'
          git push