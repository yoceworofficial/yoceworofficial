name: Deploy YOCEWOR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Apply final YOCEWOR architecture assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html','job-details.html'):
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              css='<link rel="stylesheet" href="/yocewor-final-architecture.css?v=20260916">'
              js='<script src="/yocewor-final-architecture.js?v=20260916"></script>'
              if css not in s:
                  s=s.replace('</head>',css+'\n</head>',1)
              if js not in s:
                  s=s.replace('</body>',js+'\n</body>',1)
              p.write_text(s,encoding='utf-8')

          p=Path('job.html')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              css='<link rel="stylesheet" href="/yocewor-job-master.css?v=20260914">'
              js='<script src="/yocewor-job-master.js?v=20260914"></script>'
              if css not in s:
                  s=s.replace('</head>',css+'\n</head>',1)
              if js not in s:
                  s=s.replace('</body>',js+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
