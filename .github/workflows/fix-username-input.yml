name: Validate YOCEWOR username input

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site files
        run: |
          test -f index.html
          test -f department-login.html
          test -f team-login.html
          test -f owner-dashboard.html
          echo "YOCEWOR site files validated successfully."
