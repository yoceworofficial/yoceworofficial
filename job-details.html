<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Job Details</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#182235}.top{background:#174a7c;color:#fff;padding:20px}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.row{padding:10px 0;border-bottom:1px solid #e8edf3}.label{font-weight:700}a.btn{display:inline-block;margin-top:14px;padding:12px 16px;border-radius:9px;background:#174a7c;color:#fff;text-decoration:none;font-weight:700}.muted{color:#65758b}</style></head><body><header class="top"><div class="wrap"><b>YOCEWOR</b><div>Government Recruitment Details</div></div></header><main class="wrap"><div id="status" class="card">Loading…</div><article id="detail" class="card" hidden><h1 id="title"></h1><div class="row"><span class="label">Department:</span> <span id="department"></span></div><div class="row"><span class="label">Start Date:</span> <span id="start"></span></div><div class="row"><span class="label">Last Date:</span> <span id="last"></span></div><div class="row"><span class="label">Eligibility:</span> <span id="eligibility"></span></div><div class="row"><span class="label">Details:</span><p id="details"></p></div><div id="apply"></div></article></main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function main(){const id=new URLSearchParams(location.search).get('id');if(!id)return document.getElementById('status').textContent='Job ID missing.';const {data:j,error}=await db.from('jobs').select('id,title,department,start_date,last_date,eligibility,official_url,details').eq('id',id).eq('published',true).maybeSingle();if(error||!j)return document.getElementById('status').textContent='Published job not found.';for(const [k,v] of Object.entries({title:j.title,department:j.department,start:j.start_date,last:j.last_date,eligibility:j.eligibility,details:j.details}))document.getElementById(k).textContent=v||'—';document.getElementById('apply').innerHTML=j.official_url?`<a class="btn" href="${esc(j.official_url)}" target="_blank" rel="noopener">Official Apply / Notification</a>`:'';document.getElementById('detail').hidden=false;document.getElementById('status').remove()}main().catch(()=>document.getElementById('status').textContent='Unable to load job details.');</script></body></html>
