<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Job Details</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#182235}.top{background:#174a7c;color:#fff;padding:20px}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.box{background:#f8fafc;border:1px solid #e5eaf0;border-radius:10px;padding:14px}.btn{display:inline-block;margin:6px 8px 0 0;padding:12px 16px;border-radius:9px;background:#174a7c;color:#fff;text-decoration:none;font-weight:700}.muted{color:#65758b}</style></head><body><header class="top"><div class="wrap"><b>YOCEWOR</b><div>Government Recruitment Details</div></div></header><main class="wrap"><div id="status" class="card">Loading…</div><article id="detail" hidden><section class="card"><h1 id="title"></h1><div class="grid"><div class="box"><b>Department</b><div id="department"></div></div><div class="box"><b>Start Date</b><div id="start"></div></div><div class="box"><b>Last Date</b><div id="last"></div></div><div class="box"><b>Eligibility / Qualification</b><div id="eligibility"></div></div><div class="box"><b>Vacancy Details</b><div id="vacancy"></div></div><div class="box"><b>Age Limit</b><div id="age"></div></div><div class="box"><b>Salary / Pay</b><div id="salary"></div></div></div></section><section class="card"><h2>Full Details</h2><p id="details"></p><div id="links"></div></section></article></main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function main(){const id=new URLSearchParams(location.search).get('id');if(!id)return document.getElementById('status').textContent='Job ID missing.';const {data:j,error}=await db.from('jobs').select('id,title,department,start_date,last_date,qualification,vacancies,age,salary,description,apply_url,notification_url,admit_url,result_url,video_url').eq('id',id).eq('published',true).maybeSingle();if(error||!j)return document.getElementById('status').textContent='Published job not found.';const val=(v)=>v!==undefined&&v!==null&&String(v).trim()!==''?v:'—';for(const [id2,v] of Object.entries({title:j.title,department:j.department,start:j.start_date,last:j.last_date,eligibility:j.qualification,vacancy:j.vacancies,age:j.age,salary:j.salary,details:j.description}))document.getElementById(id2).textContent=val(v);const links=[];if(j.apply_url)links.push(`<a class="btn" href="${esc(j.apply_url)}" target="_blank" rel="noopener">Official Apply</a>`);if(j.notification_url)links.push(`<a class="btn" href="${esc(j.notification_url)}" target="_blank" rel="noopener">Official Notification PDF</a>`);if(j.admit_url)links.push(`<a class="btn" href="${esc(j.admit_url)}" target="_blank" rel="noopener">Admit Card</a>`);if(j.result_url)links.push(`<a class="btn" href="${esc(j.result_url)}" target="_blank" rel="noopener">Result</a>`);if(j.video_url)links.push(`<a class="btn" href="${esc(j.video_url)}" target="_blank" rel="noopener">Video</a>`);document.getElementById('links').innerHTML=links.join('');document.getElementById('detail').hidden=false;document.getElementById('status').remove()}main().catch(()=>document.getElementById('status').textContent='Unable to load job details.');</script></body></html>
