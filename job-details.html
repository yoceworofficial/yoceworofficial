<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Job Details</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#182235}.top{background:#174a7c;color:#fff;padding:20px}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.box{background:#f8fafc;border:1px solid #e5eaf0;border-radius:10px;padding:14px}.btn{display:inline-block;margin:6px 8px 0 0;padding:12px 16px;border-radius:9px;background:#174a7c;color:#fff;text-decoration:none;font-weight:700}.muted{color:#65758b}</style></head><body><header class="top"><div class="wrap"><b>YOCEWOR</b><div>Government Recruitment Details</div></div></header><main class="wrap"><div id="status" class="card">Loading…</div><article id="detail" hidden><section class="card"><h1 id="title"></h1><div class="grid"><div class="box"><b>Department</b><div id="department"></div></div><div class="box"><b>Start Date</b><div id="start"></div></div><div class="box"><b>Last Date</b><div id="last"></div></div><div class="box"><b>Eligibility / Qualification</b><div id="eligibility"></div></div><div class="box"><b>Vacancy Details</b><div id="vacancy"></div></div><div class="box"><b>Age Limit</b><div id="age"></div></div><div class="box"><b>Salary / Pay</b><div id="salary"></div></div></div></section><section class="card"><h2>Full Details</h2><p id="details"></p><div id="links"></div></section></article></main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function main(){const p=new URLSearchParams(location.search);const id=p.get('id');const path=location.pathname.replace(/^\/+|\/+$/g,'');const slug=p.get('slug')||path.split('/').pop();let query=db.from('jobs').select('id,title,slug,department,start_date,last_date,qualification,vacancies,age,salary,description,apply_url,notification_url,admit_url,result_url,video_url').eq('published',true);let data,error;if(id){({data,error}=await query.eq('id',id).maybeSingle())}else{({data,error}=await query.eq('slug',slug).maybeSingle());if((error||!data)&&slug){const r=await db.from('jobs').select('id,title,slug,department,start_date,last_date,qualification,vacancies,age,salary,description,apply_url,notification_url,admit_url,result_url,video_url').eq('published',true).ilike('slug',slug).limit(1);data=r.data?.[0];error=r.error}}if(error||!data)return document.getElementById('status').textContent='Published job not found.';const val=v=>v!==undefined&&v!==null&&String(v).trim()!==''?v:'—';for(const [k,v] of Object.entries({title:data.title,department:data.department,start:data.start_date,last:data.last_date,eligibility:data.qualification,vacancy:data.vacancies,age:data.age,salary:data.salary,details:data.description}))document.getElementById(k).textContent=val(v);const links=[];if(data.apply_url)links.push(`<a class="btn" href="${esc(data.apply_url)}" target="_blank" rel="noopener">Official Apply</a>`);if(data.notification_url)links.push(`<a class="btn" href="${esc(data.notification_url)}" target="_blank" rel="noopener">Official Notification PDF</a>`);if(data.admit_url)links.push(`<a class="btn" href="${esc(data.admit_url)}" target="_blank" rel="noopener">Admit Card</a>`);if(data.result_url)links.push(`<a class="btn" href="${esc(data.result_url)}" target="_blank" rel="noopener">Result</a>`);if(data.video_url)links.push(`<a class="btn" href="${esc(data.video_url)}" target="_blank" rel="noopener">Video</a>`);document.getElementById('links').innerHTML=links.join('');document.getElementById('detail').hidden=false;document.getElementById('status').remove()}main().catch(()=>document.getElementById('status').textContent='Unable to load job details.');</script></body></html>
