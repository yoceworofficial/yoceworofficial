<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Job Details</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#182235}.top{background:#174a7c;color:#fff;padding:20px}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.row{padding:10px 0;border-bottom:1px solid #e8edf3}.label{font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.box{background:#f8fafc;border:1px solid #e5eaf0;border-radius:10px;padding:14px}.btn{display:inline-block;margin:6px 8px 0 0;padding:12px 16px;border-radius:9px;background:#174a7c;color:#fff;text-decoration:none;font-weight:700}.muted{color:#65758b}</style></head><body><header class="top"><div class="wrap"><b>YOCEWOR</b><div>Government Recruitment Details</div></div></header><main class="wrap"><div id="status" class="card">Loading…</div><article id="detail" hidden><section class="card"><h1 id="title"></h1><div class="grid"><div class="box"><b>Department</b><div id="department"></div></div><div class="box"><b>Start Date</b><div id="start"></div></div><div class="box"><b>Last Date</b><div id="last"></div></div><div class="box"><b>Eligibility</b><div id="eligibility"></div></div><div class="box"><b>Vacancy Details</b><div id="vacancy"></div></div><div class="box"><b>Application Fee</b><div id="fee"></div></div><div class="box"><b>Age Limit</b><div id="age"></div></div><div class="box"><b>Selection Process</b><div id="selection"></div></div><div class="box"><b>Salary / Pay</b><div id="salary"></div></div></div></section><section class="card"><h2>Full Details</h2><p id="details"></p><h3>Important Documents</h3><p id="documents"></p><div id="links"></div></section></article></main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function main(){const id=new URLSearchParams(location.search).get('id');if(!id)return document.getElementById('status').textContent='Job ID missing.';const {data:j,error}=await db.from('jobs').select('*').eq('id',id).eq('published',true).maybeSingle();if(error||!j)return document.getElementById('status').textContent='Published job not found.';const val=(...keys)=>{for(const k of keys)if(j[k]!==undefined&&j[k]!==null&&String(j[k]).trim()!=='')return j[k];return '—'};for(const [id2,keys] of Object.entries({title:['title'],department:['department'],start:['start_date'],last:['last_date'],eligibility:['eligibility'],vacancy:['vacancy_details','vacancies','vacancy'],fee:['application_fee','fee'],age:['age_limit','age'],selection:['selection_process','selection'],salary:['salary','pay_scale'],details:['details'],documents:['important_documents','documents']}))document.getElementById(id2).textContent=val(...keys);const links=[];if(j.official_url)links.push(`<a class="btn" href="${esc(j.official_url)}" target="_blank" rel="noopener">Official Apply</a>`);for(const k of ['notification_url','notification_pdf','pdf_url'])if(j[k]){links.push(`<a class="btn" href="${esc(j[k])}" target="_blank" rel="noopener">Official Notification PDF</a>`);break}document.getElementById('links').innerHTML=links.join('');document.getElementById('detail').hidden=false;document.getElementById('status').remove()}main().catch(()=>document.getElementById('status').textContent='Unable to load job details.');</script></body></html>
