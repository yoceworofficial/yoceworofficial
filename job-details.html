<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="YOCEWOR recruitment and government job details">
<title>YOCEWOR — Job Details</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#123f6b;--blue:#1769aa;--light:#f4f7fb;--line:#dbe4ee;--text:#1f2937;--muted:#64748b;--green:#168447;--orange:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--light);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.65}.top{background:linear-gradient(135deg,#0d355b,#1769aa);color:#fff;box-shadow:0 3px 14px #0b315522}.wrap{max-width:1080px;margin:auto;padding:0 16px}.brand{padding:16px 0}.brand strong{font-size:22px;letter-spacing:.5px}.brand span{display:block;font-size:13px;opacity:.86}.hero{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 8px 28px #193b5c12}.badge{display:inline-flex;background:#e8f2fb;color:var(--blue);font-weight:800;padding:5px 11px;border-radius:999px;font-size:12px}.hero h1{margin:10px 0 8px;color:var(--navy);font-size:clamp(25px,4vw,38px);line-height:1.2}.hero p{color:#536273;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.info{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px}.info b{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.45px}.info span{display:block;font-weight:750;color:#172b3d;margin-top:2px}.sharebar{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}button,.btn{appearance:none;border:0;border-radius:10px;padding:10px 15px;background:var(--navy);color:#fff;text-decoration:none;font-weight:750;cursor:pointer;font-size:14px}.wa{background:var(--green)}.tg{background:#1595cf}.content-card{background:#fff;border:1px solid var(--line);border-radius:16px;margin:16px 0;padding:22px;box-shadow:0 5px 20px #193b5c0a}.content-card h2{margin:0 0 15px;color:var(--navy);font-size:21px;border-bottom:2px solid #e8eef5;padding-bottom:10px}.intro{font-size:16px}.section{margin:16px 0;padding:16px;background:#fbfcfe;border:1px solid #e3eaf2;border-radius:13px}.section h3{margin:0 0 8px;color:#174f80;font-size:18px}.section p{margin:7px 0}.bullet{padding:0;margin:8px 0 0 20px}.steps{counter-reset:step;display:grid;gap:10px}.step{position:relative;padding:12px 14px 12px 48px;background:#f8fafc;border:1px solid var(--line);border-radius:12px}.step:before{counter-increment:step;content:counter(step);position:absolute;left:12px;top:11px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;text-align:center;line-height:26px;font-weight:800}.fee-grid,.exam-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.highlight{border-left:4px solid var(--orange);background:#fffaf0;padding:13px 15px;border-radius:10px}.notice{background:#fff7e6;border:1px solid #f4d58c;color:#5f470d;padding:15px;border-radius:12px}.links{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.links .btn{text-align:center}.faq{border:1px solid var(--line);border-radius:11px;margin:9px 0;overflow:hidden}.faq summary{cursor:pointer;padding:12px 14px;font-weight:800;background:#f8fafc;color:#173e62}.faq .answer{padding:12px 14px;background:#fff}.empty{color:var(--muted)}footer{padding:30px 0 50px;color:var(--muted);text-align:center;font-size:13px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:0 11px}.hero,.content-card{padding:17px;border-radius:13px}.grid,.fee-grid,.exam-grid,.links{grid-template-columns:1fr}.sharebar>*{flex:1 1 46%}.hero h1{font-size:25px}.content-card h2{font-size:19px}}
</style>
</head>
<body><header class="top"><div class="wrap brand"><strong>YOCEWOR</strong><span>Government Recruitment & Information Portal</span></div></header><main class="wrap" id="app"><div class="content-card">Loading job details…</div></main><footer>© YOCEWOR — Recruitment & Information Portal</footer>
<script>
const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn');
const params=new URLSearchParams(location.search);const id=params.get('id');const slug=params.get('slug')||location.pathname.split('/').filter(Boolean).pop();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').replace(/undefinedn/g,'\n').replace(/\\n/g,'\n').replace(/\r/g,'').trim();
const text=s=>esc(clean(s)).replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
const val=(v)=>esc(clean(v)||'—');
const arr=x=>Array.isArray(x)?x:[];
const overview=(x)=>{if(!x||typeof x!=='object'||Array.isArray(x))return '';return Object.entries(x).map(([k,v])=>`<div class="info"><b>${esc(k)}</b><span>${val(v)}</span></div>`).join('')};
const dates=x=>arr(x).map(v=>{let label=v.label||v[0]||'';let date=v.date||v[1]||v.value||'';return `<div class="info"><b>${esc(label)}</b><span>${val(date)}</span></div>`}).join('');
const links=x=>arr(x).map(v=>{let u=v.url||v[1]||'';let title=v.title||v[0]||'Official Link';let button=v.button||v[2]||'Open Link';return u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(button)} ↗<small style="display:block;font-weight:500;opacity:.8">${esc(title)}</small></a>`:''}).join('');
function section(title,body){return `<section class="content-card"><h2>${title}</h2>${body||'<div class="empty">जानकारी उपलब्ध नहीं है।</div>'}</section>`}
function richText(s){let t=clean(s);if(!t)return '<div class="empty">जानकारी उपलब्ध नहीं है।</div>';return `<div class="intro"><p>${text(t)}</p></div>`}
function detailSections(items){return arr(items).map(v=>`<div class="section"><h3>${esc(v.title||v[0]||'')}</h3><p>${text(v.content||v[1]||'')}</p></div>`).join('')}
function selectionFallback(j){if(clean(j.selection_process))return richText(j.selection_process);let s=arr(j.detailed_sections).find(x=>String(x.title||'').toLowerCase()==='selection process');return s?richText(s.content):'<div class="exam-grid"><div class="highlight"><b>Office Assistant</b><br>Preliminary Examination → Main Examination</div><div class="highlight"><b>Officer Scale-I</b><br>Preliminary → Main → Interview</div><div class="highlight"><b>Officer Scale-II</b><br>Single Online Examination → Interview</div><div class="highlight"><b>Officer Scale-III</b><br>Single Online Examination → Interview</div></div>'}
function howTo(s){let t=clean(s);if(!t)return '';let lines=t.split(/\n+/).map(x=>x.replace(/^\s*\d+[.)]\s*/,'').trim()).filter(Boolean);return `<div class="steps">${lines.map(x=>`<div class="step">${esc(x)}</div>`).join('')}</div>`}
async function run(){let q=db.from('jobs').select('*').eq('published',true);if(id)q=q.eq('id',id);else if(slug&&!slug.includes('.'))q=q.eq('slug',decodeURIComponent(slug));else throw Error('Job link missing');const {data:j,error}=await q.maybeSingle();if(error)throw error;if(!j)throw Error('Published job not found.');document.title=(j.title||'Job Details')+' — YOCEWOR';const share=location.href;
const meta=[['Department',j.department],['Category',j.category],['Type',j.type],['Start Date',j.start_date],['Last Date',j.last_date],['Vacancies',j.vacancies],['Age Limit',j.age],['Salary / Pay',j.salary],['Location',j.location],['Publish Date',j.publish_date]].filter(x=>x[1]);
const fallbackLinks=[j.apply_url,j.notification_url,j.admit_url,j.result_url].filter(Boolean).map((u,i)=>({url:u,title:['Apply Online','Notification','Admit Card','Result'][i],button:['Apply Now','View Notification','Admit Card','View Result'][i]}));
document.getElementById('app').innerHTML=`<article class="hero"><span class="badge">📢 Latest Recruitment</span><h1>${esc(j.title)}</h1><p>${text(j.short_description||j.description)}</p><div class="grid">${meta.map(x=>`<div class="info"><b>${esc(x[0])}</b><span>${val(x[1])}</span></div>`).join('')}</div><div class="sharebar"><button onclick="sharePage()">↗️ Share</button><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(j.title+' '+share)}">💬 WhatsApp</a><a class="btn tg" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(share)}&text=${encodeURIComponent(j.title)}">✈️ Telegram</a><button onclick="copyLink()">🔗 Copy Link</button></div></article>
${section('📌 भर्ती का परिचय',richText(j.main_content||j.description))}
${section('📊 Overview',`<div class="grid">${overview(j.overview)}</div>`)}
${section('📅 Important Dates',`<div class="grid">${dates(j.important_dates)}</div>`)}
${section('🎓 Eligibility / Qualification',richText(j.qualification))}
${section('💰 Application Fee',`<div class="fee-grid"><div class="highlight"><b>Application Fee</b><br>${text(j.fee)}</div><div class="highlight"><b>Payment Mode</b><br>Online payment as per the official notification.</div></div>`)}
${section('🎯 Selection Process',selectionFallback(j))}
${section('📝 How to Apply',howTo(j.how_to_apply)||richText('आवेदन प्रक्रिया की जानकारी official notification के अनुसार follow करें।'))}
${section('📄 Documents / Additional Information',richText(j.important_documents))}
${section('📚 Detailed Information',detailSections(j.detailed_sections))}
${section('🔗 Important Links',`<div class="links">${links([...arr(j.important_links),...fallbackLinks])}</div>`)}
${section('❓ Frequently Asked Questions',arr(j.faqs).map(v=>`<details class="faq"><summary>${esc(v.question||v[0]||'Frequently Asked Question')}</summary><div class="answer">${text(v.answer||v[1]||'')}</div></details>`).join(''))}
${section('🚨 Important Notice',`<div class="notice"><b>महत्वपूर्ण:</b> आवेदन करने से पहले official IBPS notification को ध्यानपूर्वक पढ़ें। Eligibility, age limit, vacancies, exam dates, fee और अन्य नियमों के लिए official notification को अंतिम स्रोत मानें।</div>`)}`}
function copyLink(){navigator.clipboard?.writeText(location.href);alert('Link copied successfully!')}
async function sharePage(){if(navigator.share){try{await navigator.share({title:document.title,url:location.href})}catch(e){}}else copyLink()}
run().catch(e=>document.getElementById('app').innerHTML=`<section class="content-card"><h2>YOCEWOR</h2><p>${esc(e.message||e)}</p></section>`);
</script></body></html>
