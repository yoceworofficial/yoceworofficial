.faq{border-bottom:1px solid var(--line)}.faq:last-child{border-bottom:0}.faq summary{cursor:pointer;padding:11px 2px;color:#173f61;font-weight:800;font-size:14px}.answer{padding:0 2px 12px;color:#445462;font-size:14px}.empty{color:var(--muted);font-size:14px}.footer{padding:25px 0 42px;text-align:center;color:#72808b;font-size:12px}

.yo-premium-content{display:grid;gap:14px}.yo-card{border:1px solid #d9e5ef;border-radius:17px;background:linear-gradient(145deg,#fff 0%,#f7fbff 100%);padding:18px;box-shadow:0 7px 22px #173b5d12}.yo-card-title{display:flex;align-items:center;gap:10px;margin:0 0 13px;color:#072d50;font-size:20px;font-weight:900;line-height:1.35}.yo-card-title:before{content:'';width:6px;height:29px;border-radius:99px;background:linear-gradient(#f59e0b,#f97316);flex:0 0 auto}.yo-card p{margin:0 0 9px;color:#34495b;font-size:15px}.yo-card p:last-child{margin-bottom:0}.yo-stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.yo-stat{border:1px solid #d9e5ef;border-radius:13px;padding:13px;background:#fff;box-shadow:0 3px 12px #173b5d09}.yo-stat b{display:block;color:#6b7b8c;font-size:11px;margin-bottom:3px}.yo-stat strong{display:block;color:#082f55;font-size:15px;line-height:1.55}.yo-highlight{background:linear-gradient(135deg,#fff8e7,#fff);border-color:#efd28a}.yo-list{display:grid;gap:8px}.yo-list-item{border:1px solid #dfe8f1;border-radius:12px;background:#fff;padding:11px 13px}.yo-list-item b{color:#0b5b96}.yo-step{position:relative;padding:12px 13px 12px 47px;border:1px solid #dfe8f1;border-radius:13px;background:#fff;margin-bottom:9px}.yo-step:last-child{margin-bottom:0}.yo-step:before{content:attr(data-step);position:absolute;left:10px;top:11px;width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,#0b5b96,#1677b8);color:#fff;text-align:center;line-height:27px;font-weight:900}
@media(max-width:850px){.facts{grid-template-columns:repeat(2,1fr)}.fact:nth-child(4n){border-right:1px solid var(--line)}.fact:nth-child(2n){border-right:0}.social-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.wrap{width:min(100%,94%)}.topin{padding:11px 0}.logo{width:40px;height:40px}.brand strong{font-size:20px}.back{font-size:11px;padding:6px 8px}.hero-main{padding:16px}.hero h1{font-size:25px}.lead{font-size:14px;line-height:1.7}.facts{grid-template-columns:1fr 1fr}.fact{padding:10px}.fact-label{font-size:10px}.fact-value{font-size:13px}.actions .btn{flex:1 1 45%}.section-head{padding:11px 13px}.section-head h2{font-size:18px}.section-body{padding:13px}.summary-grid{grid-template-columns:1fr}.dates th,.dates td{padding:8px;font-size:12px}.link{align-items:flex-start}.link a{padding:7px 8px}.cover img{max-height:none}.yo-card{padding:15px}.yo-card-title{font-size:18px}.yo-stat-grid{grid-template-columns:1fr}}

<script>
const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn');
const params=new URLSearchParams(location.search),id=params.get('id'),slug=params.get('slug')||location.pathname.split('/').filter(Boolean).pop();
const SOCIAL={instagram:'https://www.instagram.com/yocewor?igsi=cTE0NmozbWE1d3E5',channel:'https://whatsapp.com/channel/0029VaNA3EBJf05WBdLb1y2n',group:'https://chat.whatsapp.com/D6eEuFsxR0PHslMu8XWZfr?s=sw&p=a&ilr=0',telegram:'https://t.me/YOCEWOR'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').replace(/undefinedn/g,'\n').replace(/\\n/g,'\n').replace(/\r/g,'').trim();
const arr=x=>Array.isArray(x)?x:[];
const safeUrl=u=>{try{const x=new URL(String(u));return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}};
const labelMap={title:'भर्ती का नाम',summary:'संक्षिप्त जानकारी',location:'कार्य स्थान',vacancies:'कुल पद',department:'विभाग'};
function paragraphs(value){const t=clean(value);if(!t)return '<div class="empty">जानकारी उपलब्ध नहीं है।</div>';return t.split(/\n\s*\n|\n/).map(x=>x.trim()).filter(Boolean).map(x=>{if(/^[-•▪]/.test(x))return '<li>'+esc(x.replace(/^[-•▪]\s*/,''))+'</li>';return '<p class="para">'+esc(x)+'</p>';}).join('').replace(/(<li>[\s\S]*<\/li>)+/g,m=>'<ul class="bullet-list">'+m+'</ul>');}
function section(title,body){return '<section class="section"><div class="section-head"><span class="bar"></span><h2>'+title+'</h2></div><div class="section-body">'+(body||'<div class="empty">जानकारी उपलब्ध नहीं है।</div>')+'</div></section>';}
function fact(label,value){if(value===null||value===undefined||String(value).trim()==='')return '';return '<div class="fact"><span class="fact-label">'+esc(label)+'</span><span class="fact-value">'+esc(value)+'</span></div>';}
function datesTable(j){let d=arr(j.important_dates).map(v=>({label:v.label||v.name||v.title||v[0],date:v.date||v.value||v[1]})).filter(v=>v.label||v.date);if(!d.length){if(j.start_date)d.push({label:'आवेदन शुरू',date:j.start_date});if(j.last_date)d.push({label:'आवेदन की अंतिम तिथि',date:j.last_date});}if(!d.length)return '<div class="empty">महत्वपूर्ण तिथियों की जानकारी उपलब्ध नहीं है।</div>';return '<table class="dates"><thead><tr><th>कार्यक्रम</th><th>तिथि</th></tr></thead><tbody>'+d.map(v=>'<tr><td>'+esc(v.label||'—')+'</td><td>'+esc(v.date||'—')+'</td></tr>').join('')+'</tbody></table>';}
function overview(j){const o=j.overview&&typeof j.overview==='object'&&!Array.isArray(j.overview)?j.overview:{};let rows=[];Object.entries(o).forEach(([k,v])=>{if(v!==null&&v!==undefined&&String(v).trim()!=='')rows.push('<div class="summary-item"><small>'+esc(labelMap[k]||k)+'</small><strong>'+esc(v)+'</strong></div>')});if(!rows.length){[['विभाग',j.department],['पद',j.title],['कुल पद',j.vacancies],['कार्य स्थान',j.location]].forEach(x=>{if(x[1])rows.push('<div class="summary-item"><small>'+x[0]+'</small><strong>'+esc(x[1])+'</strong></div>')});}return '<div class="summary-grid">'+rows.join('')+'</div>';}
function detailBlocks(items){return arr(items).map(v=>{const h=v.heading||v.title||v.name||v[0]||'';const c=v.content||v.description||v[1]||'';if(!h&&!c)return '';return '<div class="detail-block">'+(h?'<h3>'+esc(h)+'</h3>':'')+paragraphs(c)+'</div>';}).join('')||'<div class="empty">विस्तृत जानकारी उपलब्ध नहीं है।</div>';}
function applySteps(value){const t=clean(value);if(!t)return '';let parts=t.split(/\s*→\s*|\n+/).map(x=>x.replace(/^\s*\d+[.)]\s*/,'').trim()).filter(Boolean);return '<div class="steps">'+parts.map(x=>'<div class="step">'+esc(x)+'</div>').join('')+'</div>';}
function linksHtml(j){let raw=[...arr(j.important_links)];[['Apply Online',j.apply_url,'आवेदन करें'],['Official Notification',j.notification_url,'नोटिफिकेशन देखें'],['Admit Card',j.admit_url,'एडमिट कार्ड'],['Result',j.result_url,'रिजल्ट देखें']].forEach(x=>{if(x[1])raw.push({title:x[0],url:x[1],button:x[2]})});const seen=new Set();const rows=raw.map(v=>{const u=safeUrl(v.url||v[1]);if(!u||seen.has(u))return '';seen.add(u);return '<div class="link"><div class="link-info"><span class="link-title">'+esc(v.title||v.text||v.label||v[0]||'Official Link')+'</span><span class="link-url">'+esc(u)+'</span></div><a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(v.button||v.action||'खोलें')+' ↗</a></div>';}).join('');return rows||'<div class="empty">आधिकारिक लिंक उपलब्ध नहीं हैं।</div>';}
function socialHtml(){return '<div class="social-box"><h3>📲 YOCEWOR से जुड़े रहें</h3><p>नई सरकारी भर्तियों और जरूरी अपडेट सीधे पाने के लिए हमारे चैनल से जुड़ें।</p><div class="social-grid"><a class="instagram" href="'+SOCIAL.instagram+'" target="_blank" rel="noopener">Instagram</a><a class="channel" href="'+SOCIAL.channel+'" target="_blank" rel="noopener">WhatsApp Channel</a><a class="group" href="'+SOCIAL.group+'" target="_blank" rel="noopener">WhatsApp Group</a><a class="telegram" href="'+SOCIAL.telegram+'" target="_blank" rel="noopener">Telegram</a></div></div>';}
function premiumizePlainContent(){document.querySelectorAll('.section-body').forEach(body=>{if(body.dataset.yoPremium==='1')return;const text=body.innerText||'';if(!/━{5,}/.test(text))return;const sep=/^[━─—\-_=]{5,}$/;const heading=/^(📌|📅|🎓|🎂|💳|🎯|💰|📄|📝|⚠️|🏆|📍)/;const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);const groups=[];let g=null;lines.forEach(x=>{if(sep.test(x))return;if(heading.test(x)){g={title:x,lines:[]};groups.push(g)}else if(g)g.lines.push(x)});if(groups.length<2)return;const make=(t,a)=>{const stats=[];a.forEach(x=>{const m=x.match(/^([^:]{2,40}):\s*(.+)$/);if(m)stats.push([m[1],m[2]])});let h='<article class="yo-card'+(/महत्वपूर्ण सूचना/.test(t)?' yo-highlight':'')+'"><h3 class="yo-card-title">'+esc(t)+'</h3>';if(stats.length>=2)h+='<div class="yo-stat-grid">'+stats.map(x=>'<div class="yo-stat"><b>'+esc(x[0])+'</b><strong>'+esc(x[1])+'</strong></div>').join('')+'</div>';else a.forEach(x=>h+='<p>'+esc(x)+'</p>');return h+'</article>'};body.innerHTML='<div class="yo-premium-content">'+groups.map(x=>make(x.title,x.lines)).join('')+'</div>';body.dataset.yoPremium='1'});}
async function run(){let q=db.from('jobs').select('*').eq('published',true);if(id)q=q.eq('id',id);else if(slug&&!slug.includes('.'))q=q.eq('slug',decodeURIComponent(slug));else throw Error('Job link missing');const {data:j,error}=await q.maybeSingle();if(error)throw error;if(!j)throw Error('Published job not found.');document.title=(j.title||'Recruitment Details')+' — YOCEWOR';
const share=location.href,sel=clean(j.selection_process)||arr(j.detailed_sections).find(v=>String(v.heading||v.title||'').toLowerCase().includes('selection'))?.content||'';const facts=[['विभाग',j.department],['पद का नाम',j.title],['कुल पद',j.vacancies],['आवेदन शुरू',j.start_date],['अंतिम तिथि',j.last_date],['योग्यता',j.qualification],['आयु सीमा',j.age],['मानदेय / वेतन',j.salary],['कार्य स्थान',j.location]].map(x=>fact(x[0],x[1])).join('');
