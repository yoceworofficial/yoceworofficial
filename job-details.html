<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="YOCEWOR recruitment and government job details"><title>YOCEWOR — Job Details</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#123f6b;--blue:#1769aa;--light:#f6f8fb;--line:#d9e1ea;--text:#1f2937;--muted:#64748b;--green:#168447;--orange:#ea7b18}*{box-sizing:border-box}body{margin:0;background:var(--light);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.6;text-align:left}.top{background:linear-gradient(135deg,#0d355b,#1769aa);color:#fff}.wrap{max-width:1080px;margin:auto;padding:0 18px}.brand{padding:15px 0}.brand strong{font-size:22px}.brand span{display:block;font-size:13px;opacity:.86}.hero{margin:20px 0 24px;background:#fff;border-bottom:3px solid var(--navy);padding:22px 0 20px}.badge{display:inline-block;background:#e8f2fb;color:var(--blue);font-weight:800;padding:4px 10px;border-radius:6px;font-size:12px}.hero h1{margin:10px 0 7px;color:var(--navy);font-size:clamp(25px,4vw,38px);line-height:1.2}.hero p{color:#536273;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line)}.info{background:transparent;border-bottom:1px solid var(--line);padding:10px 12px;min-height:64px}.info b{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.45px}.info span{display:block;font-weight:750;color:#172b3d;margin-top:2px}.sharebar{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}button,.btn{appearance:none;border:0;border-radius:7px;padding:9px 14px;background:var(--navy);color:#fff;text-decoration:none;font-weight:750;cursor:pointer;font-size:14px}.wa{background:var(--green)}.tg{background:#1595cf}.content-card{margin:0 0 24px;padding:0;background:transparent}.content-card h2{margin:0 0 13px;color:var(--navy);font-size:21px;line-height:1.3;border-bottom:2px solid var(--navy);padding:0 0 8px}.intro{font-size:16px}.intro p{margin:0}.section{margin:0;padding:10px 0;border:0;background:transparent}.section h3{margin:0 0 5px;color:#174f80;font-size:17px}.section p{margin:5px 0}.steps{display:grid;gap:0;counter-reset:step}.step{position:relative;padding:10px 10px 10px 38px;border-bottom:1px solid var(--line);background:transparent}.step:before{counter-increment:step;content:counter(step);position:absolute;left:0;top:10px;width:25px;height:25px;border-radius:50%;background:var(--blue);color:#fff;text-align:center;line-height:25px;font-weight:800}.fee-grid,.exam-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.highlight{border-left:4px solid var(--orange);background:transparent;padding:10px 13px}.notice{background:#fff7e6;border-left:4px solid #e6a400;color:#5f470d;padding:12px 14px}.links{display:grid;gap:0}.link-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 0;border-bottom:1px solid var(--line);background:transparent}.link-info{min-width:0}.link-title{display:block;color:#173e62;font-weight:800;font-size:15px;line-height:1.35}.link-sub{display:block;color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.link-action{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:116px;padding:8px 13px;border-radius:7px;color:#fff;text-decoration:none;font-weight:800;font-size:13px;background:#0f766e}.link-row:nth-child(4n+2) .link-action{background:#2563eb}.link-row:nth-child(4n+3) .link-action{background:#7c3aed}.link-row:nth-child(4n) .link-action{background:#ea580c}.faq{border-bottom:1px solid var(--line);margin:0;overflow:hidden}.faq summary{cursor:pointer;padding:11px 0;font-weight:800;color:#173e62}.faq .answer{padding:0 0 12px;background:transparent}.empty{color:var(--muted)}footer{padding:20px 0 45px;color:var(--muted);font-size:13px;text-align:center}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:0 12px}.hero{margin-top:14px;padding:18px 0}.grid,.fee-grid,.exam-grid{grid-template-columns:1fr}.sharebar>*{flex:1 1 46%}.hero h1{font-size:25px}.content-card h2{font-size:19px}.link-row{gap:10px;padding:11px 0}.link-title{font-size:14px}.link-sub{font-size:10px}.link-action{min-width:100px;padding:8px 9px;font-size:12px}}
</style></head>
<body><header class="top"><div class="wrap brand"><strong>YOCEWOR</strong><span>Government Recruitment & Information Portal</span></div></header><main class="wrap" id="app"><div class="content-card">Loading job details…</div></main><footer>© YOCEWOR — Recruitment & Information Portal</footer>
<script>
const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn');const p=new URLSearchParams(location.search),id=p.get('id'),slug=p.get('slug')||location.pathname.split('/').filter(Boolean).pop();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=s=>String(s??'').replace(/undefinedn/g,'\n').replace(/\\n/g,'\n').replace(/\r/g,'').trim();const text=s=>esc(clean(s)).replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');const val=v=>esc(clean(v)||'—');const arr=x=>Array.isArray(x)?x:[];const section=(t,b)=>`<section class="content-card"><h2>${t}</h2>${b||'<div class="empty">जानकारी उपलब्ध नहीं है।</div>'}`;const overview=x=>x&&typeof x==='object'&&!Array.isArray(x)?Object.entries(x).map(([k,v])=>`<div class="info"><b>${esc(k)}</b><span>${val(v)}</span></div>`).join(''):'';const dates=x=>arr(x).map(v=>`<div class="info"><b>${esc(v.label||v[0]||'')}</b><span>${val(v.date||v[1]||v.value)}</span></div>`).join('');const rich=s=>{let t=clean(s);return t?`<div class="intro"><p>${text(t)}</p></div>`:'<div class="empty">जानकारी उपलब्ध नहीं है।</div>'};const how=s=>{let a=clean(s).split(/\n+/).map(x=>x.replace(/^\s*\d+[.)]\s*/,'').trim()).filter(Boolean);return a.length?`<div class="steps">${a.map(x=>`<div class="step">${esc(x)}</div>`).join('')}</div>`:''};const details=a=>arr(a).map(v=>`<div class="section"><h3>${esc(v.title||v[0]||'')}</h3><p>${text(v.content||v[1]||'')}</p></div>`).join('');const linkHtml=a=>{const seen=new Set();return arr(a).map(v=>{let u=v.url||v[1],t=v.title||v[0]||'Official Link',b=v.button||v[2]||'Open Link';if(!u||seen.has(u))return '';seen.add(u);return `<div class="link-row"><div class="link-info"><span class="link-title">${esc(t)}</span><span class="link-sub">${esc(u)}</span></div><a class="link-action" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(b)} ↗</a></div>`}).join('')};
async function run(){let q=db.from('jobs').select('*').eq('published',true);if(id)q=q.eq('id',id);else if(slug&&!slug.includes('.'))q=q.eq('slug',decodeURIComponent(slug));else throw Error('Job link missing');let{data:j,error}=await q.maybeSingle();if(error)throw error;if(!j)throw Error('Published job not found.');document.title=(j.title||'Job Details')+' — YOCEWOR';const share=location.href;const meta=[['Department',j.department],['Category',j.category],['Type',j.type],['Start Date',j.start_date],['Last Date',j.last_date],['Vacancies',j.vacancies],['Age Limit',j.age],['Salary / Pay',j.salary],['Location',j.location],['Publish Date',j.publish_date]].filter(x=>x[1]);const fallback=[j.apply_url,j.notification_url,j.admit_url,j.result_url].filter(Boolean).map((u,i)=>({url:u,title:['Apply Online','Notification','Admit Card','Result'][i],button:['Apply Now','View Notification','Admit Card','View Result'][i]}));const sel=clean(j.selection_process)||(()=>{let s=arr(j.detailed_sections).find(x=>String(x.title||'').toLowerCase()==='selection process');return s?.content||''})();document.getElementById('app').innerHTML=`<article class="hero"><span class="badge">📢 Latest Recruitment</span><h1>${esc(j.title)}</h1><p>${text(j.short_description||j.description)}</p><div class="grid">${meta.map(x=>`<div class="info"><b>${esc(x[0])}</b><span>${val(x[1])}</span></div>`).join('')}</div><div class="sharebar"><button onclick="sharePage()">↗️ Share</button><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(j.title+' '+share)}">💬 WhatsApp</a><a class="btn tg" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(share)}&text=${encodeURIComponent(j.title)}">✈️ Telegram</a><button onclick="copyLink()">🔗 Copy Link</button></div></article>${section('📌 भर्ती का परिचय',rich(j.main_content||j.description))}${section('📊 Overview',`<div class="grid">${overview(j.overview)}</div>`)}${section('📅 Important Dates',`<div class="grid">${dates(j.important_dates)}</div>`)}${section('🎓 Eligibility / Qualification',rich(j.qualification))}${section('💰 Application Fee',`<div class="fee-grid"><div class="highlight"><b>Application Fee</b><br>${text(j.fee)}</div><div class="highlight"><b>Payment Mode</b><br>Online payment as per the official notification.</div></div>`)}${section('🎯 Selection Process',sel?rich(sel):`<div class="exam-grid"><div class="highlight"><b>Office Assistant</b><br>Preliminary Examination → Main Examination</div><div class="highlight"><b>Officer Scale-I</b><br>Preliminary → Main → Interview</div><div class="highlight"><b>Officer Scale-II</b><br>Single Online Examination → Interview</div><div class="highlight"><b>Officer Scale-III</b><br>Single Online Examination → Interview</div></div>`)}${section('📝 How to Apply',how(j.how_to_apply)||rich('आवेदन प्रक्रिया की जानकारी official notification के अनुसार follow करें।'))}${section('📄 Documents / Additional Information',rich(j.important_documents))}${section('📚 Detailed Information',details(j.detailed_sections))}${section('🔗 Important Links',`<div class="links">${linkHtml([...arr(j.important_links),...fallback])}</div>`)}${section('❓ Frequently Asked Questions',arr(j.faqs).map(v=>`<details class="faq"><summary>${esc(v.question||v[0]||'Frequently Asked Question')}</summary><div class="answer">${text(v.answer||v[1]||'')}</div></details>`).join(''))}${section('🚨 Important Notice',`<div class="notice"><b>महत्वपूर्ण:</b> आवेदन करने से पहले official IBPS notification को ध्यानपूर्वक पढ़ें। Eligibility, age limit, vacancies, exam dates, fee और अन्य नियमों के लिए official notification को अंतिम स्रोत मानें।</div>`)}`}
function copyLink(){navigator.clipboard?.writeText(location.href);alert('Link copied successfully!')}async function sharePage(){if(navigator.share){try{await navigator.share({title:document.title,url:location.href})}catch(e){}}else copyLink()}run().catch(e=>document.getElementById('app').innerHTML=`<section class="content-card"><h2>YOCEWOR</h2><p>${esc(e.message||e)}</p></section>`);
</script></body></html>
