<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Job Details</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main id="app">Loading…</main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn');const id=new URLSearchParams(location.search).get('id');const slug=new URLSearchParams(location.search).get('slug')||location.pathname.split('/').filter(Boolean).pop();async function run(){let q=db.from('jobs').select('*').eq('published',true);if(id)q=q.eq('id',id);else if(slug&&!slug.includes('.'))q=q.eq('slug',decodeURIComponent(slug));else throw Error('Job link missing');const {data:j,error}=await q.maybeSingle();if(error)throw error;if(!j)throw Error('Published job not found.');document.title=(j.title||'Job Details')+' — YOCEWOR';const esc=s=>String(s??'').replace(/[&<>\\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[c]));const text=s=>esc(s||'—').replace(/\\n/g,'<br>');const arr=x=>Array.isArray(x)?x:[];const sec=(title,body)=>`<section><h2>${title}</h2><div>${body||'—'}</div></section>`;const pairs=x=>arr(x).map(v=>`<div class="box"><b>${esc(v[0]||v.label||v.title||'')}</b><div>${text(v[1]||v.value||v.content||v.date)}</div></div>`).join('');const links=arr(j.important_links).map(v=>{const u=v[1]||v.url||'';return `<p><a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${esc(v[2]||v.button||v[0]||'Open Link')} ↗</a></p>`}).join('');const share=location.href;document.getElementById('app').innerHTML=`<style>body{margin:0;font-family:Arial,sans-serif;background:#f2f5f8;color:#1b2a38}.top{background:#0b3d6e;color:white;padding:18px}.wrap{max-width:1000px;margin:auto;padding:0 16px}.card{background:white;border:1px solid #d4dde5;border-radius:10px;padding:20px;margin:16px 0}.hero h1{color:#0b3d6e;font-size:30px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.box{background:#f7f9fb;border:1px solid #e0e6eb;padding:12px}.btn,.share{display:inline-block;padding:10px 15px;border-radius:7px;background:#0b3d6e;color:white;text-decoration:none;border:0;font-weight:bold;margin:4px;cursor:pointer}.sharebar{padding-top:15px;border-top:1px solid #ddd}.wa{background:#16a34a}.tg{background:#229ed9}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero h1{font-size:24px}.btn,.share{width:100%;box-sizing:border-box;text-align:center}}</style><header class="top"><div class="wrap"><b>YOCEWOR</b><div>Government Recruitment & Information Portal</div></div></header><div class="wrap"><article class="card hero"><h1>${esc(j.title)}</h1><p>${text(j.short_description||j.description)}</p><div class="grid">${pairs([['Department',j.department],['Category',j.category],['Type',j.type],['Start Date',j.start_date],['Last Date',j.last_date],['Vacancies',j.vacancies],['Age Limit',j.age],['Salary / Pay',j.salary],['Location',j.location],['Publish Date',j.publish_date]])}</div><div class="sharebar"><button class="share" onclick="navigator.share?navigator.share({title:document.title,url:location.href}):navigator.clipboard.writeText(location.href)">↗️ Share</button><a class="share wa" target="_blank" href="https://wa.me/?text=${encodeURIComponent(j.title+' '+share)}">💬 WhatsApp</a><a class="share tg" target="_blank" href="https://t.me/share/url?url=${encodeURIComponent(share)}&text=${encodeURIComponent(j.title)}">✈️ Telegram</a><button class="share" onclick="navigator.clipboard.writeText(location.href)">🔗 Copy Link</button></div></article><div class="card">${sec('📌 भर्ती का परिचय',text(j.main_content||j.description))}</div><div class="card">${sec('📊 Overview',`<div class="grid">${pairs(j.overview)}</div>`)}</div><div class="card">${sec('📅 Important Dates',pairs(j.important_dates))}</div><div class="card">${sec('🎓 Eligibility / Qualification',text(j.qualification))}</div><div class="card">${sec('💰 Application Fee',text(j.fee))}</div><div class="card">${sec('🎯 Selection Process',text(j.selection_process))}</div><div class="card">${sec('📝 How to Apply / How to Check',text(j.how_to_apply))}</div><div class="card">${sec('📄 Documents / Additional Information',text(j.important_documents))}</div><div class="card">${sec('📚 Detailed Information',pairs(j.detailed_sections))}</div><div class="card">${sec('🔗 Important Links',links||[j.apply_url,j.notification_url,j.admit_url,j.result_url].filter(Boolean).map(u=>`<a class="btn" href="${esc(u)}" target="_blank">Official Link ↗</a>`).join(''))}</div><div class="card">${sec('❓ Frequently Asked Questions',arr(j.faqs).map(v=>`<p><b>${esc(v[0]||v.question)}</b><br>${text(v[1]||v.answer)}</p>`).join(''))}</div></div>`}run().catch(e=>document.getElementById('app').innerHTML='<div style="padding:30px;font-family:Arial"><h2>YOCEWOR</h2><p>'+String(e.message||e)+'</p></div>');</script></body></html>
