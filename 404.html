<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR</title><meta name="robots" content="index,follow"></head><body><main class="site-wrap article"><p>Loading…</p></main><script>(async()=>{const path=location.pathname.replace(/^\\/+|\\/+$/g,"");if(!path||path.includes(".")||path.split("/").length!==1){return}try{const r=await fetch("/post.html?slug="+encodeURIComponent(path),{cache:"no-store"});if(!r.ok)throw new Error("post");const html=await r.text();const doc=new DOMParser().parseFromString(html,"text/html");document.documentElement.replaceWith(doc.documentElement);for(const old of [...document.querySelectorAll("script")]){const s=document.createElement("script");for(const a of old.attributes)s.setAttribute(a.name,a.value);s.textContent=old.textContent;old.replaceWith(s)}}catch(e){document.querySelector("main").innerHTML="<h1>Page not found</h1><p>The requested update could not be found.</p><p><a href='/'>Go to YOCEWOR Home</a></p>"}})();</script></body></html>
