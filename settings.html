<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Settings | YOCEWOR</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.nav a{color:#fff;text-decoration:none;padding:8px 12px;border:1px solid #ffffff33;border-radius:10px;font-size:13px;font-weight:700}.nav a.active{background:#fff;color:#102a43}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #0001}.btn{border:0;border-radius:9px;padding:10px 14px;background:#102a43;color:#fff;font-weight:700;cursor:pointer}.green{background:#16844b}.muted{color:#65758b;font-size:13px}.error{color:#b42318;font-weight:700}label{display:block;margin:12px 0}@media(max-width:650px){.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.nav a{text-align:center}}</style></head><body><header class="top"><div class="wrap"><h1>⚙️ Settings</h1><nav class="nav"></nav></div></header><main class="wrap"><section id="guard" class="card">Owner access verify हो रहा है…</section><section id="app" style="display:none"><section class="card"><h2>🔐 Security</h2><p class="muted">Owner password reset email भेजें।</p><button class="btn" id="reset">Send Password Reset</button><div id="msg" class="muted"></div></section><section class="card"><h2>🔔 Preferences</h2><label><input id="notifications" type="checkbox"> Notifications enabled</label><label><input id="private" type="checkbox"> Private account setting</label><button class="btn green" id="save">Save Settings</button><div id="saveMsg" class="muted"></div></section></section></main><script src="/owner-auth-stable.js?settings-stable"></script><script>const $=id=>document.getElementById(id),auth=window.YOCEWOR_AUTH;function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c))}async function boot(){try{if(!auth)throw Error('Owner authentication service is unavailable.');const me=await auth.requireRole('owner');try{const r=await auth.request('get_settings');if(r.data){$('notifications').checked=!!r.data.notifications_enabled;$('private').checked=!!r.data.is_private}}catch(e){}$('guard').style.display='none';$('app').style.display='block';$('reset').onclick=async()=>{try{const r=await auth.request('send_password_reset');$('msg').textContent=r.message||'✅ Password reset email sent.'}catch(e){$('msg').textContent='❌ '+e.message}};$('save').onclick=async()=>{try{await auth.request('save_settings',{notifications_enabled:$('notifications').checked,is_private:$('private').checked});$('saveMsg').textContent='✅ Settings saved successfully.'}catch(e){$('saveMsg').textContent='❌ '+e.message}}}catch(e){$('guard').innerHTML='<span class="error">'+esc(e.message)+'</span><br><br><button class="btn" onclick="location.reload()">Retry</button>'}}boot();</script></body></html>
