<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Editor Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#182235}.top{background:#174a7c;color:#fff;padding:18px 22px}.wrap{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 3px 16px #0001}.n{font-size:28px;font-weight:800}.muted{color:#65758b;font-size:13px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e8edf3}a{color:#174a7c;font-weight:700}</style></head><body><header class="top"><div class="wrap"><b>YOCEWOR</b><div>Editor Work Center</div></div></header><main class="wrap"><div id="guard" class="card">Editor access verify हो रहा है…</div><div id="app" hidden><div class="grid"><div class="card"><div class="muted">Published Jobs</div><div id="published" class="n">—</div></div><div class="card"><div class="muted">Open Jobs</div><div id="open" class="n">—</div></div><div class="card"><div class="muted">My Recent Work</div><div id="work" class="n">—</div></div></div><div class="card"><h3>Editor Actions</h3><p><a href="id-card.html">My ID Card</a></p><p><a href="latest-jobs.html">Latest Jobs</a></p></div><div class="card"><h3>Recent Recruitment Work</h3><div id="list">Loading…</div></div></div></main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn',{auth:{persistSession:true,autoRefreshToken:true}});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function main(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='department-login.html';return}const {data:a}=await db.from('admin_users').select('role,is_active,username,display_name').eq('user_id',user.id).maybeSingle();if(String(a?.role||'').toLowerCase()!=='editor'||a.is_active===false){document.getElementById('guard').textContent='Access denied — Editor account required.';return}document.getElementById('guard').innerHTML='<b>Editor verified</b> — '+esc(a.display_name||a.username||'Editor');document.getElementById('app').hidden=false;const jp=await db.from('jobs').select('id,title,published,created_at').order('created_at',{ascending:false}).limit(10);const rows=jp.data||[];document.getElementById('published').textContent=rows.filter(x=>x.published).length;document.getElementById('open').textContent=rows.filter(x=>!x.published).length;document.getElementById('work').textContent=rows.length;document.getElementById('list').innerHTML=rows.map(x=>`<div class="row"><span>${esc(x.title||'Untitled')}</span><span>${x.published?'Published':'Draft'}</span></div>`).join('')||'No recruitment work found'}main().catch(()=>document.getElementById('guard').textContent='Dashboard data load failed.');</script></body></html>
