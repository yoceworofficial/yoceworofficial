<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>YOCEWOR GM Login</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:20px}.wrap{max-width:520px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:20px;margin-top:18px;box-shadow:0 3px 16px #0001}input{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #cbd6e2;border-radius:9px;font:inherit}.btn{width:100%;border:0;border-radius:9px;padding:12px;background:#102a43;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:10px;font-weight:700}.error{color:#b42318}</style></head><body><header class="top"><div class="wrap"><h2 style="margin:0">👔 YOCEWOR GM LOGIN</h2><div style="font-size:13px;color:#dbe8f5">General Manager Access</div></div></header><main class="wrap"><section class="card"><h2>🔐 GM Login</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button id="login" class="btn">Login</button><div id="msg" class="msg"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eyr4lUsn',{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id);async function go(){try{const s=await db.auth.getSession();if(!s.data.session)return;const r=await db.functions.invoke('team-management',{body:{action:'me'}});if(!r.error&&String(r.data?.role||'').toLowerCase()==='gm'){location.replace('/gm-dashboard.html?gmhome=6')}}catch(e){}}async function login(){const email=$('email').value.trim(),password=$('pass').value;if(!email||!password){$('msg').textContent='Email और Password दोनों भरें।';return}$('login').disabled=true;$('login').textContent='Logging in...';$('msg').textContent='';try{const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;const me=await db.functions.invoke('team-management',{body:{action:'me'}});if(me.error)throw me.error;if(String(me.data?.role||'').toLowerCase()!=='gm')throw Error('यह account GM account नहीं है।');location.replace('/gm-dashboard.html?gmhome=6')}catch(e){$('msg').innerHTML='<span class="error">'+String(e.message||'Login failed')+'</span>'}finally{$('login').disabled=false;$('login').textContent='Login'}}$('login').onclick=login;$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});go()})();</script></body></html>
