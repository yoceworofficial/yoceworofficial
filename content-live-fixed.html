<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOCEWOR Content Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f4f7fb;color:#172235}.wrap{max-width:1100px;margin:auto;padding:16px}.top{background:#102a43;color:#fff}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{margin:0;font-size:24px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.nav a{color:#fff;text-decoration:none;padding:8px 11px;border:1px solid #ffffff33;border-radius:9px}.card{background:#fff;border:1px solid #dde5ed;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0000000d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:5px}.input{width:100%;padding:11px;border:1px solid #cbd6e2;border-radius:9px;font:inherit;background:#fff}.builder{border:1px solid #dce4ec;border-radius:12px;padding:14px;margin:14px 0;background:#fbfcfe}.builder-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.builder-head b{font-size:16px}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin:8px 0}.linkrow{display:grid;grid-template-columns:1fr 1.4fr .9fr auto;gap:8px;margin:8px 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer;background:#102a43;color:#fff}.secondary{background:#64748b}.danger{background:#b42318}.successbtn{background:#176b35}.status{padding:10px 12px;border-radius:9px;background:#eef4f8;margin-bottom:12px}.success{background:#eaf7ee;color:#176b35}.error{background:#fff0f0;color:#a51d1d}.item{padding:13px 0;border-bottom:1px solid #e8edf2}.muted{font-size:13px;color:#68778b}.hidden{display:none}.preview{border:1px solid #dde5ed;border-radius:14px;padding:18px}.hero{padding:18px;background:#102a43;color:#fff;border-radius:10px}.hero h1{font-size:clamp(24px,5vw,40px);line-height:1.2}.topic{padding:12px;background:#f7fafc;border:1px solid #dce5eb;border-radius:9px;line-height:1.75}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #d6e0e7;padding:9px;text-align:left;vertical-align:top}.table th{background:#f2f6f8;width:35%}.heroimg{display:block;width:100%;max-height:430px;object-fit:cover;border-radius:10px;margin-top:12px}.list-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}@media(max-width:700px){.wrap{padding:10px}.card{padding:13px}.grid,.row,.linkrow{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.nav{display:grid;grid-template-columns:1fr 1fr}.nav a{text-align:center}.builder-head{align-items:flex-start;flex-direction:column}.builder-head .btn{width:auto}.actions .btn{width:100%}.list-actions .btn{width:auto}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="topbar"><h1>📝 YOCEWOR Content Management</h1><span style="font-size:13px;opacity:.85">Live • Supabase powered</span></div><nav class="nav"><a href="/owner-dashboard.html">🏠 Home</a><a href="/dashboard.html">📊 Dashboard</a><a href="/team-management-live.html">👥 Team</a><a href="/departments.html">🏢 Departments</a><a href="/content-live-fixed.html">📝 Content</a></nav></div></header>
<main class="wrap"><div id="status" class="status">Checking login…</div>
<section id="manager" class="hidden">
<section class="card"><div class="actions"><button class="btn secondary" id="newBtn">＋ New Content</button><button class="btn secondary" id="refreshBtn">↻ Refresh</button><button class="btn" id="logoutBtn">Logout</button></div></section>
<section class="card"><h2 id="formTitle">Create Content</h2><input id="editId" type="hidden">
<div class="field"><label>Content Type</label><select id="type" class="input"><option>Recruitment</option><option>Result</option><option>Admit Card</option><option>Answer Key</option><option>Exam / Syllabus</option><option>Exam / Date</option><option>Admission</option><option>Scholarship</option><option>Government Scheme</option><option>General Notice</option></select></div>
<div class="field"><label>Title</label><input id="title" class="input"></div><div class="field"><label>Short Description</label><textarea id="short" class="input" rows="3"></textarea></div>
<div class="grid"><div class="field"><label>Department</label><input id="department" class="input"></div><div class="field"><label>Category</label><input id="category" class="input"></div></div>
<div class="field"><label>Tags (comma separated)</label><input id="tags" class="input"></div><div class="field"><label>Main Description / Introduction</label><textarea id="main" class="input" rows="7"></textarea></div>
<div class="builder"><div class="builder-head"><b>🖼️ Featured Image</b></div><input id="image" class="input" type="file" accept="image/*"><input id="imageUrl" class="input" placeholder="या image URL डालें"><div id="imagePreview"></div></div>
<div class="builder"><div class="builder-head"><b>📊 Overview</b><button class="btn" type="button" onclick="addPair('overview')">＋ Add Row</button></div><div id="overview"></div></div>
<div class="builder"><div class="builder-head"><b>📅 Important Dates</b><button class="btn" type="button" onclick="addPair('dates')">＋ Add Date</button></div><div id="dates"></div></div>
<div class="grid"><div class="field"><label>Eligibility / Qualification</label><textarea id="eligibility" class="input"></textarea></div><div class="field"><label>Application Fee</label><textarea id="fee" class="input"></textarea></div><div class="field"><label>Selection Process</label><textarea id="selection" class="input"></textarea></div></div>
<div class="field"><label>How to Apply / How to Check</label><textarea id="how" class="input" rows="5"></textarea></div><div class="field"><label>Documents / Additional Information</label><textarea id="docs" class="input" rows="5"></textarea></div>
<div class="builder"><div class="builder-head"><b>📚 Detailed Sections / Topics</b><button class="btn" type="button" onclick="addPair('sections')">＋ Add Section</button></div><div id="sections"></div></div>
<div class="builder"><div class="builder-head"><b>🔗 Important Links</b><button class="btn" type="button" onclick="addLink()">＋ Add Link</button></div><div id="links"></div></div>
<div class="builder"><div class="builder-head"><b>🎥 YouTube Video</b><button class="btn" type="button" onclick="addPair('youtube')">＋ Add Video</button></div><div id="youtube"></div></div>
<div class="builder"><div class="builder-head"><b>❓ FAQ</b><button class="btn" type="button" onclick="addPair('faqs')">＋ Add Question</button></div><div id="faqs"></div></div>
<div class="grid"><div class="field"><label>Publish Date</label><input id="publishDate" class="input" type="date"></div><div class="field"><label>Last Date</label><input id="lastDate" class="input" type="date"></div><div class="field"><label>Vacancies</label><input id="vacancies" class="input"></div><div class="field"><label>Age Limit</label><input id="age" class="input"></div><div class="field"><label>Salary / Pay</label><input id="salary" class="input"></div><div class="field"><label>Location</label><input id="location" class="input" value="All India"></div><div class="field"><label>Permanent URL / Slug</label><input id="slug" class="input"></div></div>
<div class="actions"><button class="btn secondary" id="draftBtn">🟡 Save Draft</button><button class="btn secondary" id="previewBtn">👁️ Preview</button><button class="btn successbtn" id="publishBtn">📤 Publish / Update</button><button class="btn danger" id="deleteBtn">🗑️ Delete</button></div><p id="msg" class="muted"></p></section>
<section class="card"><h2>📋 Content Management</h2><div id="list">Loading…</div></section><section id="pc" class="card hidden"><h2>👁️ Public Preview</h2><div id="preview" class="preview"></div></section>
</section></main>
<script>
const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let current=null,role='';const $=id=>document.getElementById(id),v=id=>($(id)?.value||'').trim(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const br=s=>esc(s).replace(/\n/g,'<br>');
function addPair(id,a='',b=''){let x=document.createElement('div');x.className='row';x.innerHTML='<input class="input a" placeholder="Label / Heading"><input class="input b" placeholder="Value / Content"><button class="btn danger rm" type="button">✕</button>';$(id).append(x);x.querySelector('.a').value=a;x.querySelector('.b').value=b;}
function addLink(a='',b='',c='Open Link'){let x=document.createElement('div');x.className='linkrow';x.innerHTML='<input class="input a" placeholder="Link name"><input class="input b" placeholder="https://..."><input class="input c" placeholder="Button Text"><button class="btn danger rm" type="button">✕</button>';links.append(x);x.querySelector('.a').value=a;x.querySelector('.b').value=b;x.querySelector('.c').value=c;}
function pairs(id){return[...document.querySelectorAll('#'+id+' .row')].map(x=>[x.querySelector('.a').value.trim(),x.querySelector('.b').value.trim()]).filter(x=>x[0]||x[1]);}
function collect(){return{type:v('type'),title:v('title'),short_description:v('short'),department:v('department'),category:v('category'),tags:v('tags').split(',').map(x=>x.trim()).filter(Boolean),main_content:v('main'),featured_image:v('imageUrl')||null,overview:pairs('overview'),important_dates:pairs('dates'),qualification:v('eligibility'),fee:v('fee'),selection_process:v('selection'),how_to_apply:v('how'),important_documents:v('docs'),detailed_sections:pairs('sections'),important_links:[...document.querySelectorAll('#links .linkrow')].map(x=>[x.querySelector('.a').value.trim(),x.querySelector('.b').value.trim(),x.querySelector('.c').value.trim()]).filter(x=>x[0]||x[1]),youtube_videos:pairs('youtube'),faqs:pairs('faqs'),publish_date:v('publishDate')||null,last_date:v('lastDate')||null,vacancies:v('vacancies'),age:v('age'),salary:v('salary'),location:v('location')||'All India',slug:v('slug')}}
function resetForm(clearSaved=true){current=null;['title','short','department','category','tags','main','imageUrl','eligibility','fee','selection','how','docs','publishDate','lastDate','vacancies','age','salary','slug'].forEach(id=>$(id).value='');$('location').value='All India';$('image').value='';$('imagePreview').innerHTML='';['overview','dates','sections','links','youtube','faqs'].forEach(id=>$(id).replaceChildren());$('formTitle').textContent='Create Content';$('msg').textContent='';if(clearSaved)sessionStorage.removeItem('yocewor_unsaved_content')}
function fill(d){current=d;$('formTitle').textContent=(d.published?'Edit Published':'Edit Draft')+' Content';$('type').value=d.type||'Recruitment';[['title',d.title],['short',d.short_description],['department',d.department],['category',d.category],['tags',Array.isArray(d.tags)?d.tags.join(', '):''],['main',d.main_content],['imageUrl',d.featured_image],['eligibility',d.qualification],['fee',d.fee],['selection',d.selection_process],['how',d.how_to_apply],['docs',d.important_documents],['publishDate',d.publish_date||d.start_date],['lastDate',d.last_date],['vacancies',d.vacancies],['age',d.age],['salary',d.salary],['location',d.location||'All India'],['slug',d.slug]].forEach(x=>$(x[0]).value=x[1]||'');$('imagePreview').innerHTML=d.featured_image?'<img class="heroimg" src="'+esc(d.featured_image)+'" alt="">':'';['overview','dates','sections','links','youtube','faqs'].forEach(id=>$(id).replaceChildren());(d.overview||[]).forEach(x=>addPair('overview',x[0],x[1]));(d.important_dates||[]).forEach(x=>addPair('dates',x[0],x[1]));(d.detailed_sections||[]).forEach(x=>addPair('sections',x[0],x[1]));(d.important_links||[]).forEach(x=>addLink(x[0],x[1],x[2]));(d.youtube_videos||[]).forEach(x=>addPair('youtube',x[0],x[1]));(d.faqs||[]).forEach(x=>addPair('faqs',x[0],x[1]));$('msg').textContent='✏️ Same record selected — editing will not create a duplicate.'}
async function uploadImage(file,userId){if(!file)return null;let ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=userId+'/'+crypto.randomUUID()+'.'+ext,r=await db.storage.from('content-images').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});if(r.error)throw r.error;return db.storage.from('content-images').getPublicUrl(path).data.publicUrl}
async function loadList(){let q=await db.from('jobs').select('*').order('updated_at',{ascending:false});if(q.error){$('list').innerHTML='<div class="status error">❌ '+esc(q.error.message)+'</div>';return}let a=q.data||[];$('list').innerHTML=a.length?a.map(x=>'<div class="item"><b>'+esc(x.title||'Untitled')+'</b><div class="muted">'+esc(x.type||'')+' • '+(x.published?'🟢 Published':'🟡 Draft')+' • '+esc(x.department||'')+'</div><div class="list-actions"><button class="btn" onclick="editItem(\''+x.id+'\')">✏️ Edit / View</button><button class="btn danger" onclick="removeItem(\''+x.id+'\')">🗑️ Delete</button></div></div>').join(''):'<span class="muted">No content yet.</span>'}
async function editItem(id){let q=await db.from('jobs').select('*').eq('id',id).single();if(q.error){$('msg').textContent='❌ '+q.error.message;return}fill(q.data);sessionStorage.removeItem('yocewor_unsaved_content');scrollTo({top:0,behavior:'smooth'})}
async function removeItem(id){if(!confirm('यह content permanently delete करना है?'))return;let q=await db.from('jobs').delete().eq('id',id);$('msg').textContent=q.error?'❌ '+q.error.message:'✅ Deleted';if(!q.error)resetForm();await loadList()}
async function save(published){let u=(await db.auth.getUser()).data.user;if(!u){$('msg').textContent='Login expired. Please login again.';return}let o=collect();if(!o.title){$('msg').textContent='Title required.';return}try{let f=$('image').files[0];if(f)o.featured_image=await uploadImage(f,u.id);if(!o.slug)o.slug=o.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');let payload={type:o.type,title:o.title,department:o.department||null,start_date:o.publish_date,last_date:o.last_date,vacancies:o.vacancies||null,qualification:o.qualification||null,age:o.age||null,fee:o.fee||null,salary:o.salary||null,location:o.location||'All India',selection_process:o.selection_process||null,description:o.main_content||'',apply_url:(o.important_links.find(x=>/apply/i.test(x[0]))||[])[1]||null,notification_url:(o.important_links.find(x=>/notification|official/i.test(x[0]))||[])[1]||null,video_url:o.youtube_videos[0]?.[1]||null,published,short_description:o.short_description||null,category:o.category||null,tags:o.tags,main_content:o.main_content||null,featured_image:o.featured_image,overview:o.overview,important_dates:o.important_dates,detailed_sections:o.detailed_sections,important_links:o.important_links,youtube_videos:o.youtube_videos,faqs:o.faqs,how_to_apply:o.how_to_apply||null,important_documents:o.important_documents||null,publish_date:o.publish_date,slug:o.slug,created_by:current?.created_by||u.id,published_at:published?new Date().toISOString():null,updated_at:new Date().toISOString()};let q=current?await db.from('jobs').update(payload).eq('id',current.id).select().single():await db.from('jobs').insert(payload).select().single();if(q.error)throw q.error;sessionStorage.removeItem('yocewor_unsaved_content');current=q.data;fill(q.data);$('msg').textContent=published?'✅ Published successfully.':'✅ Draft saved successfully.';await loadList()}catch(e){console.error(e);$('msg').textContent='❌ Save failed: '+(e.message||e)}}
function preview(){let o=collect(),h='<div class="hero"><div>'+esc(o.type)+'</div><h1>'+esc(o.title)+'</h1><p>'+br(o.short_description)+'</p></div>';if(o.featured_image)h+='<img class="heroimg" src="'+esc(o.featured_image)+'">';const sec=(t,b)=>b?'<div class="sec"><h3>'+t+'</h3>'+b+'</div>':'';if(o.main_content)h+=sec('इस अपडेट के बारे में','<div class="topic">'+br(o.main_content)+'</div>');if(o.overview.length)h+=sec('मुख्य जानकारी','<table class="table">'+o.overview.map(x=>'<tr><th>'+esc(x[0])+'</th><td>'+br(x[1])+'</td></tr>').join('')+'</table>');if(o.important_dates.length)h+=sec('महत्वपूर्ण तिथियाँ','<table class="table">'+o.important_dates.map(x=>'<tr><th>'+esc(x[0])+'</th><td>'+br(x[1])+'</td></tr>').join('')+'</table>');[['qualification','पात्रता / योग्यता'],['fee','आवेदन शुल्क'],['selection_process','चयन प्रक्रिया'],['how_to_apply','आवेदन / जानकारी कैसे देखें'],['important_documents','अतिरिक्त जानकारी']].forEach(r=>{if(o[r[0]])h+=sec(r[1],'<div class="topic">'+br(o[r[0]])+'</div>')});o.detailed_sections.forEach(x=>{if(x[0]||x[1])h+=sec('📌 '+esc(x[0]),'<div class="topic">'+br(x[1])+'</div>')});if(o.important_links.length)h+=sec('🔗 महत्वपूर्ण लिंक',o.important_links.filter(x=>x[1]).map(x=>'<p><a href="'+esc(x[1])+'" target="_blank" class="btn">'+esc(x[2]||x[0]||'Open Link')+' ↗</a></p>').join(''));if(o.faqs.length)h+=sec('❓ FAQ',o.faqs.map(x=>'<p><b>'+esc(x[0])+'</b><br>'+br(x[1])+'</p>').join(''));$('preview').innerHTML=h;$('pc').classList.remove('hidden')}
function autosave(){if(!current&&v('title'))sessionStorage.setItem('yocewor_unsaved_content',JSON.stringify(collect()))}
async function restoreUnsaved(){if(current)return;let raw=sessionStorage.getItem('yocewor_unsaved_content');if(!raw)return;try{let d=JSON.parse(raw);fill(d);current=null;$('formTitle').textContent='Create Content';$('msg').textContent='↩️ Unsaved content restored on this device.'}catch{} }
async function init(){let s=$('status');try{let {data,error}=await db.auth.getUser();if(error)throw error;let u=data.user;if(!u){s.textContent='Login required. Please login first.';s.className='status error';return}let [p,sr,au]=await Promise.all([db.from('profiles').select('role').eq('id',u.id).maybeSingle(),db.from('staff_roles').select('role,is_active').eq('user_id',u.id).maybeSingle(),db.from('admin_users').select('role,is_active').eq('user_id',u.id).maybeSingle()]);role=String(sr.data?.is_active!==false&&sr.data?.role||au.data?.is_active!==false&&au.data?.role||p.data?.role||'').toLowerCase();if(!['owner','gm','admin','editor'].includes(role)){s.textContent='Access denied — authorized content staff only.';s.className='status error';return}s.textContent='✓ Logged in as '+role.toUpperCase()+'. Content Manager ready.';s.className='status success';$('manager').classList.remove('hidden');await loadList();await restoreUnsaved()}catch(e){console.error(e);s.textContent='❌ Content Manager error: '+(e.message||e);s.className='status error'}}
document.addEventListener('click',e=>{if(e.target.classList.contains('rm')){e.target.closest('.row,.linkrow')?.remove();autosave()}});$('image').onchange=e=>{let f=e.target.files[0];if(f){let u=URL.createObjectURL(f);$('imagePreview').innerHTML='<img class="heroimg" src="'+u+'" alt="preview">';autosave()}};$('imageUrl').oninput=()=>{$('imagePreview').innerHTML=v('imageUrl')?'<img class="heroimg" src="'+esc(v('imageUrl'))+'" alt="preview">':'';autosave()};document.addEventListener('input',e=>{if(e.target.closest('#manager'))autosave()});$('draftBtn').onclick=()=>save(false);$('publishBtn').onclick=()=>save(true);$('previewBtn').onclick=preview;$('newBtn').onclick=()=>resetForm();$('refreshBtn').onclick=loadList;$('deleteBtn').onclick=()=>current&&removeItem(current.id);$('logoutBtn').onclick=()=>db.auth.signOut().then(()=>location.reload());resetForm(false);init();
</script></body></html>
