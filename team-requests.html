<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Team Requests</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:32px auto;padding:20px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px #0001}label{display:block;font-weight:600;margin:12px 0 6px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd5e0;border-radius:8px}textarea{min-height:90px}button{margin-top:16px;background:#174a7c;color:#fff;border:0;font-weight:700}.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.nav a{flex:1;min-width:120px;text-align:center;padding:11px;border-radius:8px;background:#174a7c;color:#fff;text-decoration:none;font-weight:700}.status{margin-top:12px;padding:10px;border-radius:8px;background:#eef3f8}.role-note{padding:10px;border-radius:8px;background:#eef7ff;margin-top:10px}@media(max-width:650px){.wrap{margin:12px auto;padding:12px}}</style></head><body><main class="wrap"><div class="nav"><a href="/">🏠 Home</a><a href="/owner-dashboard.html">👑 Owner Dashboard</a><a href="/admin.html">🛠️ Admin</a><a href="https://www.instagram.com/yocewor" target="_blank" rel="noopener">📸 Instagram</a><a href="https://t.me/YOCEWOR" target="_blank" rel="noopener">📱 Telegram</a><a href="https://whatsapp.com/channel/0029VaNA3EBJf05WBdLb1y2n" target="_blank" rel="noopener">🟢 WhatsApp</a></div><div class="card"><h1>Team Request / KYC</h1><p>YOCEWOR internal staff onboarding request.</p><label>Requested Role</label><select id="requested_role"><option value="">Select role</option></select><div id="roleNote" class="role-note">Checking your role…</div><label>Full Name</label><input id="full_name" required><label>Username</label><input id="username" required><label>Email</label><input id="email" type="email" required><label>Mobile</label><input id="mobile"><label>KYC / Identity Details</label><textarea id="kyc_details" placeholder="Enter required verification details"></textarea><label>Reason / Responsibilities</label><textarea id="reason"></textarea><button id="submit">Submit Request</button><div id="status" class="status">Checking authorization…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="team-requests.js"></script><script>(async()=>{const s=document.getElementById('status'),select=document.getElementById('requested_role'),note=document.getElementById('roleNote'),submit=document.getElementById('submit'),u=await YOCEWOR_TEAM_REQUESTS.me();if(!u){s.textContent='Unauthorized or inactive account.';submit.disabled=true;return}const allowed=u.role==='owner'?['gm','admin','editor']:u.role==='gm'?['admin']:u.role==='admin'?['editor']:[];select.innerHTML='<option value="">Select role</option>'+allowed.map(r=>'<option value="'+r+'">'+r.toUpperCase()+'</option>').join('');note.textContent=u.role==='owner'?'Owner: GM, Admin और Editor बना सकते हैं।':u.role==='gm'?'GM: केवल Admin request कर सकता है।':u.role==='admin'?'Admin: केवल Editor request कर सकता है।':'Editor: team request नहीं कर सकता।';s.textContent='Signed in as '+u.role+' — allowed roles updated.';submit.onclick=async()=>{const f={requested_role:select.value,full_name:document.getElementById('full_name').value,username:document.getElementById('username').value,email:document.getElementById('email').value,mobile:document.getElementById('mobile').value,kyc_details:document.getElementById('kyc_details').value,reason:document.getElementById('reason').value};try{if(!f.requested_role)throw new Error('पहले role चुनें।');const r=await YOCEWOR_TEAM_REQUESTS.createRequest(f);s.textContent='Request submitted successfully. Status: pending. Request ID: '+r.id}catch(e){s.textContent='Request failed: '+(e.message||'Unknown error')}}})();</script></body></html>
