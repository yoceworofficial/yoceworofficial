<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>YOCEWOR Team Management</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:32px auto;padding:20px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:700;margin:12px 0 6px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd5e0;border-radius:8px;font:inherit}textarea{min-height:90px}button{margin-top:16px;background:#174a7c;color:#fff;border:0;font-weight:700;cursor:pointer}.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.nav a{flex:1;min-width:120px;text-align:center;padding:11px;border-radius:8px;background:#174a7c;color:#fff;text-decoration:none;font-weight:700}.status{margin-top:12px;padding:10px;border-radius:8px;background:#eef3f8}.role-note{padding:10px;border-radius:8px;background:#eef7ff;margin-top:10px}.hide{display:none}.success{background:#e9f7ef;color:#176b35}.error{background:#fcebea;color:#b42318}@media(max-width:650px){.wrap{margin:12px auto;padding:12px}.grid{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><div class="nav"><a href="/">🏠 Home</a><a href="/gm-dashboard.html">👥 GM Home</a><a href="/owner-dashboard.html">👑 Owner Dashboard</a><a href="/admin.html">📰 Content</a></div><div class="card"><h1>👥 Team Management</h1><p>Admin और Editor onboarding.</p><div id="roleNote" class="role-note">Checking your role…</div></div><section id="createCard" class="card hide"><h2>➕ Create Admin / Editor</h2><p class="role-note">GM: <b>Editor सीधे बनेगा</b> और <b>Admin Owner approval</b> के लिए जाएगा।</p><div class="grid"><div><label>Role</label><select id="requested_role"><option value="admin">ADMIN</option><option value="editor">EDITOR</option></select></div><div><label>Department</label><select id="department_id"><option value="">Select department</option></select></div><div><label>Full Name</label><input id="full_name" required></div><div><label>Username</label><input id="username" required placeholder="e.g. rahul.editor"></div><div><label>Official Email</label><input id="email" type="email" required></div><div><label>Mobile</label><input id="mobile"></div><div><label>Designation</label><input id="designation"></div><div><label>Joining Date</label><input id="joining_date" type="date"></div></div><label>Address</label><textarea id="address"></textarea><button id="submit">Create / Send Request</button><div id="status" class="status">Ready.</div></section><section id="legacyCard" class="card hide"><h2>Team Request</h2><label>Requested Role</label><select id="legacy_role"></select><div id="legacyNote" class="role-note"></div><button id="legacySubmit">Submit Request</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="team-requests.js?v=4"></script><script>(async()=>{const s=document.getElementById('status'),u=await YOCEWOR_TEAM_REQUESTS.me(),note=document.getElementById('roleNote');if(!u){note.textContent='Unauthorized or inactive account. Please login again.';return}const role=String(u.role).toLowerCase();if(role==='gm'||role==='owner'){document.getElementById('createCard').classList.remove('hide');note.textContent=role==='gm'?'GM access: Admin और Editor बना सकते हैं। Admin को Owner final approval चाहिए; Editor सीधे create होगा।':'Owner access: Admin और Editor create कर सकते हैं।';try{const r=await fetch('https://mzntgjyecymcpzciklfk.supabase.co/functions/v1/team-management',{method:'POST',headers:{Authorization:'Bearer '+(await window.supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',{auth:{persistSession:true}}).auth.getSession()).data.session?.access_token,apikey:'sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn','Content-Type':'application/json'},body:JSON.stringify({action:'departments'})});const d=await r.json();(d.data||[]).forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;document.getElementById('department_id').appendChild(o)});}catch(e){}document.getElementById('submit').onclick=async()=>{try{const f={role:document.getElementById('requested_role').value,department_id:document.getElementById('department_id').value,full_name:document.getElementById('full_name').value,username:document.getElementById('username').value,official_email:document.getElementById('email').value,phone:document.getElementById('mobile').value,address:document.getElementById('address').value,designation:document.getElementById('designation').value,joining_date:document.getElementById('joining_date').value};const r=await YOCEWOR_TEAM_REQUESTS.createUser(f);s.className='status success';s.textContent='✅ '+(r.message||'Done.');}catch(e){s.className='status error';s.textContent='❌ '+(e.message||'Failed');}};return}document.getElementById('legacyCard').classList.remove('hide');const allowed=role==='admin'?['editor']:[];document.getElementById('legacy_role').innerHTML=allowed.map(x=>'<option value="'+x+'">'+x.toUpperCase()+'</option>').join('');document.getElementById('legacyNote').textContent=role==='admin'?'Admin: Editor request GM approval के लिए जाएगा।':'इस account से team user नहीं बनाया जा सकता।';})();</script></body></html>
