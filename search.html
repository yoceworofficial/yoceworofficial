<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Search — YOCEWOR</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="site-header"><div class="site-wrap header-inner"><a class="site-title" href="/">YOCEWOR</a><nav><a href="/">Home</a><a href="/category.html?category=latest-jobs">Latest Jobs</a><a href="/category.html?category=admit-card">Admit Card</a><a href="/category.html?category=answer-key">Answer Key</a><a href="/category.html?category=result">Result</a></nav></div></header>
<main class="site-wrap" style="max-width:900px;margin-top:18px"><p><a href="/">Home</a> &gt; Search</p><h1>Search</h1><div class="search-row"><label class="sr-only" for="q">Search</label><input id="q" type="search" placeholder="Search YOCEWOR..."><button id="go">Search</button></div><div id="results" class="list-box"><div class="post-list"><p class="muted">Loading...</p></div></div></main>
<footer class="site-footer"><div class="site-wrap footer-inner"><div>© <span id="year"></span> YOCEWOR</div><div class="footer-links"><a href="/about.html">About</a><a href="/contact.html">Contact</a><a href="/privacy-policy.html">Privacy Policy</a><a href="/disclaimer.html">Disclaimer</a><a href="/terms.html">Terms & Conditions</a></div></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script>
<script>
(async()=>{const c=supabase.createClient(YOCEWOR_CONFIG.supabaseUrl,YOCEWOR_CONFIG.supabasePublishableKey),q=document.getElementById("q"),box=document.querySelector("#results .post-list");document.getElementById("year").textContent=new Date().getFullYear();q.value=new URLSearchParams(location.search).get("q")||"";async function run(){const term=q.value.trim();if(!term){box.innerHTML="<p>अपना search term दर्ज करें।</p>";return}box.innerHTML="<p class='muted'>Searching...</p>";const {data,error}=await c.rpc("search_published_posts",{search_term:term,result_limit:30});if(error){console.error(error);box.innerHTML="<p>Search अभी उपलब्ध नहीं है।</p>";return}box.innerHTML=(data||[]).map(p=>"<p class='post-item'><a href='/post.html?slug="+encodeURIComponent(p.slug)+"'>"+esc(p.title)+"</a>"+(p.excerpt?"<br><span class='muted'>"+esc(p.excerpt)+"</span>":"")+"</p>").join("")||"<p class='muted'>कोई प्रकाशित परिणाम नहीं मिला।</p>";history.replaceState(null,"","/search.html?q="+encodeURIComponent(term))}document.getElementById("go").onclick=run;q.addEventListener("keydown",e=>{if(e.key==="Enter")run()});if(q.value)run();function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}})();
</script></body></html>
