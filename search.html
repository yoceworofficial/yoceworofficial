<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Search — YOCEWOR</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><div class="wrap head"><a class="brand" href="/"><img class="brand-logo" src="/images/yocewor-logo.svg" alt="YOCEWOR logo"><span class="brand-copy"><span class="brand-name">YOCEWOR</span><span class="tagline">Your Voice. Your World.</span></span></a><nav><a href="/">Home</a><a href="/category/latest-jobs/">Latest Jobs</a><a href="/category/admit-card/">Admit Card</a><a href="/category/answer-key/">Answer Key</a><a href="/category/result/">Result</a><a href="/category/exam-date/">Exam Date</a><a href="/category/latest-news/">Latest News</a><a href="/category/sarkari-yojana/">Sarkari Yojana</a><a href="/candidate-guide.html">Candidate Guide</a></nav></div></header>
<main class="site-wrap" style="max-width:900px;margin-top:18px"><p><a href="/">Home</a> &gt; Search</p><h1>Search YOCEWOR</h1><form id="search-form" class="search-row"><label class="sr-only" for="q">Search</label><input id="q" type="search" placeholder="Search government jobs, admit card, result..." autocomplete="off"><button type="submit">Search</button></form><div id="results" class="list-box"><div class="post-list"><p class="muted">अपना search term दर्ज करें।</p></div></div></main>
<footer class="site-footer"><div class="site-wrap footer-inner"><div>© <span id="year"></span> YOCEWOR</div><div class="footer-links"><a href="/about.html">About</a><a href="/contact.html">Contact</a><a href="/privacy-policy.html">Privacy Policy</a><a href="/disclaimer.html">Disclaimer</a><a href="/terms.html">Terms &amp; Conditions</a></div></div></footer>
<script src="/config.js"></script><script>
(function(){const form=document.getElementById("search-form"),q=document.getElementById("q"),box=document.querySelector("#results .post-list");document.getElementById("year").textContent=new Date().getFullYear();q.value=new URLSearchParams(location.search).get("q")||"";const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));async function run(){const term=q.value.trim();if(!term){box.innerHTML="<p>अपना search term दर्ज करें।</p>";return}box.innerHTML="<p class='muted'>Searching...</p>";try{const url=YOCEWOR_CONFIG.supabaseUrl+"/rest/v1/rpc/search_published_posts";const r=await fetch(url,{method:"POST",headers:{"apikey":YOCEWOR_CONFIG.supabasePublishableKey,"Authorization":"Bearer "+YOCEWOR_CONFIG.supabasePublishableKey,"Content-Type":"application/json"},body:JSON.stringify({search_term:term,result_limit:30}),cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const data=await r.json();box.innerHTML=(data||[]).map(p=>"<p class='post-item'><a href='/"+encodeURIComponent(p.slug)+"/'>"+esc(p.title)+"</a>"+(p.excerpt?"<br><span class='muted'>"+esc(p.excerpt)+"</span>":"")+"</p>").join("")||"<p class='muted'>कोई प्रकाशित परिणाम नहीं मिला।</p>";history.replaceState(null,"","/search.html?q="+encodeURIComponent(term))}catch(err){console.error("YOCEWOR search failed:",err);box.innerHTML="<p>Search अभी उपलब्ध नहीं है। कृपया थोड़ी देर बाद फिर कोशिश करें।</p>"}}form.addEventListener("submit",e=>{e.preventDefault();run()});if(q.value)run()})();
</script></body></html>
