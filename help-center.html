<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Help Center</title><style>body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#eef2f6;color:#17212b}.top{background:#073b72;color:#fff;padding:20px;border-bottom:4px solid #f58220}.wrap{max-width:800px;width:92%;margin:auto}.card{background:#fff;border:1px solid #d7dee6;border-radius:10px;padding:20px;margin:18px 0}.info{background:#f5f7fa;padding:13px;border-radius:8px;line-height:1.6}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bcc7d1;border-radius:7px;margin:6px 0 12px}button{width:100%;padding:12px;border:0;border-radius:7px;background:#073b72;color:#fff;font-weight:bold;margin-top:8px}.msg{font-weight:bold;margin-top:12px}.item{border:1px solid #d5dde5;border-radius:8px;padding:12px;margin:9px 0}</style></head><body><header class="top"><b>YOCEWOR HELP CENTER</b><br><small>Team Support • Account Requests • Password Assistance</small></header><main class="wrap"><section class="card"><h2>🎫 New Support Ticket</h2><div class="info">GM / Admin / Editor के लिए direct password reset नहीं है। Password या account समस्या के लिए ticket भेजें। Request authorized hierarchy द्वारा handle होगी।</div><label>Subject</label><input id="subject" placeholder="उदाहरण: Password reset request"><label>Category</label><select id="category"><option value="password_reset">Password Reset</option><option value="account_access">Account Access</option><option value="blocked_account">Blocked Account</option><option value="technical">Technical Issue</option><option value="general">General</option></select><button onclick="send()">📨 Ticket Submit करें</button><div id="msg" class="msg"></div></section><section class="card"><h2>📋 My Tickets</h2><button onclick="load()">Refresh Tickets</button><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn');const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action,data={}){const r=await db.functions.invoke('team-management',{body:{action,...data}});if(r.error)throw r.error;if(r.data?.error)throw Error(r.data.error);return r.data}async function send(){try{const s=$('subject').value.trim();if(!s){$('msg').textContent='Subject जरूरी है।';return}const r=await api('create_ticket',{subject:s,category:$('category').value});$('msg').textContent='✅ Ticket submit हो गया। Ticket ID: '+r.data.id;$('subject').value='';load()}catch(e){$('msg').textContent='❌ '+e.message}}async function load(){try{const r=await api('my_tickets');$('list').innerHTML=(r.data||[]).map(x=>'<div class="item"><b>'+esc(x.subject)+'</b><br>Category: '+esc(x.category)+' • Status: '+esc(x.status)+'<br><small>'+esc(x.created_at)+'</small></div>').join('')||'No tickets'}catch(e){$('list').textContent='❌ '+e.message}}async function init(){const s=await db.auth.getSession();if(!s.data.session){$('msg').textContent='पहले Team Login करें।';return}load()}init()</script></body></html>
