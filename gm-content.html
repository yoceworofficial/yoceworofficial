<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>YOCEWOR GM — Content</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.nav a{color:#fff;text-decoration:none;padding:8px 12px;border:1px solid #ffffff33;border-radius:10px;font-size:13px;font-weight:700}.nav a.active{background:#fff;color:#102a43}.status{display:inline-flex;padding:6px 10px;border-radius:20px;background:#e9f7ef;color:#16844b;font-weight:800;font-size:12px}.frame{width:100%;height:calc(100vh - 170px);min-height:760px;border:0;display:block;background:#f3f6fa}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #0001}.error{color:#b42318;font-weight:800}@media(max-width:650px){.nav{display:grid;grid-template-columns:1fr 1fr}.nav a{text-align:center}.frame{height:calc(100vh - 220px)}}</style></head><body><header class="top"><div class="wrap"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><h1 style="margin:0">📝 YOCEWOR GM CONTENT</h1><div style="color:#dbe8f5;font-size:13px">General Management Content Control Center</div></div><span class="status">● GM ACTIVE</span></div><nav class="nav"><a href="/gm-dashboard.html?gmhome=10">🏠 Home</a><a href="/gm-manage-users.html?gmusers=10">👥 Manage Users</a><a class="active" href="/gm-content.html?gmcontent=10">📝 Content</a></nav></div></header><main class="wrap"><section id="guard" class="card">GM access verify हो रहा है…</section><section id="app" style="display:none"><iframe id="contentFrame" class="frame" src="/content.html?gm=1&embedded=1&v=11" title="YOCEWOR Content Management"></iframe></section></main><script src="/owner-auth.js?gmcontent=11"></script><script>const $=id=>document.getElementById(id);function clean(){const f=$("contentFrame");try{const d=f.contentDocument||f.contentWindow.document;if(!d)return;let s=d.getElementById("gm-content-cleanup");if(!s){s=d.createElement("style");s.id="gm-content-cleanup";s.textContent="body>header.top,body>header.top,.topbar+nav,.top>.wrap>nav{display:none!important}body{padding-top:0!important}";(d.head||d.documentElement).appendChild(s)}const status=d.getElementById('status'),manager=d.getElementById('manager');if(manager){manager.classList.remove('hidden');if(status){status.textContent='✓ Logged in as GM. Content Manager ready.';status.className='status success'}}if(typeof d.loadList==='function')d.loadList();const inner=d.getElementById('contentFrame');if(inner){const activate=()=>{try{const w=inner.contentWindow,cd=inner.contentDocument||w.document;if(!cd)return;const st=cd.getElementById('status'),mg=cd.getElementById('manager');if(mg)mg.classList.remove('hidden');if(st){st.textContent='✓ Logged in as GM. Content Manager ready.';st.className='status success'}if(typeof w.loadList==='function')w.loadList()}catch(e){}};inner.addEventListener('load',activate);setTimeout(activate,100);setTimeout(activate,500);setTimeout(activate,1200)}}catch(e){}}async function boot(){try{const auth=window.YOCEWOR_AUTH;if(!auth)throw Error('Authentication service unavailable.');await auth.requireRole(['gm']);$("guard").style.display='none';$("app").style.display='block';const f=$("contentFrame");f.addEventListener('load',()=>{clean();setTimeout(clean,200);setTimeout(clean,800);setTimeout(clean,1500)});setTimeout(clean,300)}catch(e){if(/HTTP 401|Login session missing|Login required/i.test(String(e.message||''))){location.href='/gm.html?from=gm-content';return}$('guard').innerHTML='<span class="error">'+e.message+'</span><br><br><button onclick="location.reload()">Retry</button>'}}boot()</script></body></html>
