<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Set Password</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:520px;margin:50px auto;padding:18px}.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 20px #0001}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;border:1px solid #ccd5e0;border-radius:8px}button{background:#174a7c;color:#fff;border:0;font-weight:700}.msg{margin-top:14px;padding:10px;background:#eef3f8;border-radius:8px}</style></head><body><main class="wrap"><div class="card"><h1>Set your YOCEWOR password</h1><p>For security, choose a new password before using your staff account.</p><input id="p1" type="password" placeholder="New password" autocomplete="new-password"><input id="p2" type="password" placeholder="Confirm password" autocomplete="new-password"><button id="save">Set Password</button><div id="msg" class="msg">Checking account…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',{auth:{persistSession:true,autoRefreshToken:true}});const msg=document.getElementById('msg');(async()=>{const {data:{user}}=await db.auth.getUser();if(!user){msg.textContent='Please login first.';document.getElementById('save').disabled=true;return}msg.textContent='Account verified. Set your new password.'})();document.getElementById('save').onclick=async()=>{const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<10)return msg.textContent='Password must be at least 10 characters.';if(a!==b)return msg.textContent='Passwords do not match.';const {data,error}=await db.auth.updateUser({password:a,data:{must_change_password:false}});if(error)return msg.textContent=error.message;msg.textContent='Password updated successfully. You can now continue to your dashboard.';setTimeout(()=>location.href='department-login.html',900)};</script></body></html>
