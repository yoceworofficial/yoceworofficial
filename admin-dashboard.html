<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Admin Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#182235}.top{background:#174a7c;color:#fff;padding:18px 22px}.wrap{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 3px 16px #0001}.n{font-size:28px;font-weight:800}.muted{color:#65758b;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e8edf3}a{color:#174a7c;font-weight:700}</style></head><body><header class="top"><div class="wrap"><b>YOCEWOR</b><div>Admin Dashboard</div></div></header><main class="wrap"><div id="guard" class="card">Admin access verify हो रहा है…</div><div id="app" hidden><div class="grid"><div class="card"><div class="muted">Editors</div><div id="editors" class="n">—</div></div><div class="card"><div class="muted">Active Editors</div><div id="active" class="n">—</div></div><div class="card"><div class="muted">Pending Editor Requests</div><div id="requests" class="n">—</div></div><div class="card"><div class="muted">Published Jobs</div><div id="jobs" class="n">—</div></div></div><div class="card"><h3>Admin Actions</h3><p><a href="team-requests.html">Create Editor Request</a></p><p><a href="job-review.html">Review Recruitment Jobs</a></p><p><a href="id-card.html">My ID Card</a></p><p><a href="team-approvals.html">Approval Center</a> <span class="muted">(GM/Owner authorization required)</span></p></div><div class="card"><h3>Editor Team</h3><div id="team">Loading…</div></div></div></main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',{auth:{persistSession:true,autoRefreshToken:true}});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function main(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='department-login.html';return}const {data:a}=await db.from('admin_users').select('role,is_active,username,display_name').eq('user_id',user.id).maybeSingle();if(String(a?.role||'').toLowerCase()!=='admin'||a.is_active===false){document.getElementById('guard').textContent='Access denied — Admin account required.';return}document.getElementById('guard').innerHTML='<b>Admin verified</b> — '+esc(a.display_name||a.username||'Admin');document.getElementById('app').hidden=false;const tm=await db.from('admin_users').select('role,is_active,username,display_name').eq('role','editor');const rows=tm.data||[];document.getElementById('editors').textContent=rows.length;document.getElementById('active').textContent=rows.filter(x=>x.is_active).length;const rq=await db.from('team_requests').select('id',{count:'exact',head:true}).eq('status','pending').eq('requested_role','editor');document.getElementById('requests').textContent=rq.count||0;const jp=await db.from('jobs').select('id',{count:'exact',head:true}).eq('published',true);document.getElementById('jobs').textContent=jp.count||0;document.getElementById('team').innerHTML=rows.map(x=>`<div class="row"><span>${esc(x.display_name||x.username||'Editor')}</span><span>${x.is_active?'Active':'Inactive'}</span></div>`).join('')||'No editors'}main().catch(()=>document.getElementById('guard').textContent='Dashboard data load failed.');</script></body></html>
