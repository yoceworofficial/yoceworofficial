<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>YOCEWOR Admin Dashboard</title><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#182235}.top{background:#174a7c;color:#fff;padding:18px 22px}.wrap{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 3px 16px #0001}.n{font-size:28px;font-weight:800}.muted{color:#65758b;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e8edf3}a{color:#174a7c;font-weight:700}</style></head><body><header class="top"><div class="wrap"><b>YOCEWOR</b><div>Admin Dashboard</div></div></header><main class="wrap"><div id="guard" class="card">Admin access verify हो रहा है…</div><div id="app" hidden><div class="grid"><div class="card"><div class="muted">Editors</div><div id="editors" class="n">—</div></div><div class="card"><div class="muted">Active Editors</div><div id="active" class="n">—</div></div><div class="card"><div class="muted">Pending Editor Requests</div><div id="requests" class="n">—</div></div><div class="card"><div class="muted">Published Jobs</div><div id="jobs" class="n">—</div></div></div><div class="card"><h3>Admin Actions</h3><p><a href="team-requests.html">Create Editor Request</a></p><p><a href="job-review.html">Review Recruitment Jobs</a></p><p><a href="id-card.html">My ID Card</a></p><p><a href="team-approvals.html">Approval Center</a></p></div><div class="card"><h3>Editor Team</h3><div id="team">Loading…</div></div></div></main><script src="/owner-auth.js?admin-v3"></script><script>const $=id=>document.getElementById(id),auth=window.YOCEWOR_AUTH;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action,extra={}){const r=await auth.request(action,extra);return r}async function main(){try{if(!auth)throw Error('Authentication service unavailable.');const me=await auth.requireRole('admin');$('guard').style.display='none';$('app').hidden=false;const tm=await api('list_team'),rows=(tm.data||[]).filter(x=>String(x.role).toLowerCase()==='editor');$('editors').textContent=rows.length;$('active').textContent=rows.filter(x=>x.is_active!==false).length;const rq=await api('list_requests');const pending=(rq.data||[]).filter(x=>x.status==='pending'&&String(x.requested_role).toLowerCase()==='editor');$('requests').textContent=pending.length;const jp=await api('list_content');$('jobs').textContent=(jp.data||[]).filter(x=>x.published===true||x.status==='published').length;$('team').innerHTML=rows.map(x=>'<div class="row"><span>'+esc(x.display_name||x.username||'Editor')+'</span><span>'+(x.is_active!==false?'Active':'Inactive')+'</span></div>').join('')||'No editors'}catch(e){$('guard').innerHTML='<b>Access unavailable</b><br>'+esc(e.message)}}main()</script></body></html>
