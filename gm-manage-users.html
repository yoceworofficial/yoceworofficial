<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR GM — Manage Users</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.top .wrap{padding-top:0;padding-bottom:0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.nav a{color:#fff;text-decoration:none;padding:8px 12px;border:1px solid #ffffff33;border-radius:10px;font-size:13px;font-weight:700}.nav a.active{background:#fff;color:#102a43}.card{background:#fff;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.muted{color:#65758b;font-size:13px}.status{display:inline-flex;align-items:center;gap:7px;background:#e9f7ef;color:#16844b;padding:6px 10px;border-radius:20px;font-weight:700;font-size:12px}.error{color:#b42318;font-weight:700}.hide{display:none}.btn{display:inline-block;border:0;border-radius:9px;padding:10px 14px;background:#102a43;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.user{padding:12px 0;border-bottom:1px solid #e6ebf1}.user:last-child{border-bottom:0}@media(max-width:600px){.nav a{flex:1;text-align:center;min-width:45%}}</style></head><body><header class="top"><div class="wrap"><h1 style="margin:0">👥 GM MANAGE USERS</h1><div style="color:#dbe8f5;font-size:13px">General Management Control Center</div><nav class="nav"><a href="/gm-dashboard.html">🏠 Home</a><a class="active" href="/gm-manage-users.html">👥 Manage Users</a></nav></div></header><main class="wrap"><section id="guard" class="card">GM access verify हो रहा है…</section><section id="app" class="hide"><div class="card"><span class="status">● GM ACCESS</span><h2>Manage Users</h2><p class="muted">GM के अधिकार के अनुसार team users का management area.</p></div><div class="card"><h2>👥 Team Users</h2><div id="users">Loading users…</div></div></section></main><script src="/owner-auth.js?gmusers=1"></script><script>(function(){const $=id=>document.getElementById(id),auth=window.YOCEWOR_AUTH,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{await auth.requireRole('gm');$('guard').classList.add('hide');$('app').classList.remove('hide');const r=await auth.request('list_team'),rows=r.data||[];$('users').innerHTML=rows.map(x=>'<div class="user">👤 <b>'+esc(x.display_name||x.username||'Team member')+'</b><br><span class="muted">'+esc(String(x.role||'').toUpperCase())+(x.email?' · '+esc(x.email):'')+'</span></div>').join('')||'<span class="muted">No team users found.</span>'}catch(e){$('guard').innerHTML='<span class="error">'+esc(e.message)+'</span><br><br><a class="btn" href="/gm-dashboard.html">← Back Home</a>'}}load()})();</script></body></html>
