<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Departments</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;padding:10px 13px;border:1px solid #ffffff33;border-radius:10px;font-weight:800}.card{background:#fff;border:1px solid #e3e8ef;border-radius:16px;padding:18px;margin:14px 0}.hide{display:none}.error{color:#b42318;font-weight:700}.row{padding:10px 0;border-bottom:1px solid #edf0f4}</style></head><body><header class="top"><div class="wrap"><h1>🏢 DEPARTMENTS</h1><nav class="nav"><a href="/owner-dashboard.html">🏠 Home</a><a href="/dashboard.html">📊 Dashboard</a><a href="/team-management-live.html">👥 Team</a><a href="/content.html">📝 Content</a><a href="/departments.html">🏢 Departments</a><a href="/important-notice.html">📢 Important Notice</a><a href="/live-notice.html">🔴 Live Notice</a><a href="/settings.html">⚙️ Settings</a><a href="/activity-audit.html">🧾 Activity / Audit</a><a href="/" id="logout">🚪 Logout</a></nav></div></header><main class="wrap"><section id="guard" class="card">Owner access verify हो रहा है…</section><section id="app" class="card hide"><h2>Departments</h2><div id="list">Loading…</div></section></main><script src="/owner-auth.js?v=20260831-owner"></script><script>const $=id=>document.getElementById(id);async function load(){try{const A=window.YOCEWOR_AUTH;if(!A||typeof A.requireRole!=='function')throw Error('Owner authentication service unavailable.');await A.requireRole(['owner','gm']);$('guard').classList.add('hide');$('app').classList.remove('hide');const r=await A.request('departments');$('list').innerHTML=(r.data||[]).map(x=>'<div class="row"><b>🏢 '+String(x.name||'')+'</b> — '+String(x.code||'')+'</div>').join('')||'No departments found.';document.getElementById('logout').onclick=async e=>{e.preventDefault();await A.signOut();location.href='/'};}catch(e){$('guard').innerHTML='<span class="error">'+e.message+'</span><br><br><button onclick="location.reload()">Retry</button>'}}load();</script></body></html>
