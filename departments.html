<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Departments</title><style>body{font-family:system-ui;margin:0;background:#f5f7fa;color:#172235}.wrap{max-width:1100px;margin:auto;padding:18px}.top{background:#102a43;color:#fff}.nav{display:flex;flex-wrap:wrap;gap:8px}.nav a{color:#fff;padding:9px;text-decoration:none;border:1px solid #ffffff33;border-radius:8px;font-weight:700}.nav a.active{background:#fff;color:#102a43}.card{background:#fff;padding:18px;margin:14px 0;border-radius:14px}button,input,select{padding:10px;margin:5px 0;border:1px solid #ccd5df;border-radius:8px}button{background:#102a43;color:#fff;font-weight:700}.error{color:#b42318}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.muted{color:#66758a}</style></head><body><header class="top"><div class="wrap"><h1>🏢 Departments</h1><nav class="nav"><a href="/owner-dashboard.html">🏠 Home</a><a href="/dashboard.html">📊 Dashboard</a><a href="/team-management-live.html">👥 Team</a><a href="/content.html">📝 Content</a><a class="active" href="/departments.html">🏢 Departments</a><a href="/important-notice.html">📢 Important Notice</a><a href="/live-notice.html">🔴 Live Notice</a><a href="/settings.html">⚙️ Settings</a><a href="/activity-audit.html">🧾 Activity / Audit</a><a href="/" id="logout">🚪 Logout</a></nav></div></header><main class="wrap"><section id="status" class="card">Loading Department Management…</section><section id="app" hidden><div class="grid"><div class="card">🏢 Total<strong id="total">0</strong></div><div class="card">🟢 Active<strong id="active">0</strong></div><div class="card">👥 Team<strong id="members">0</strong></div></div><div class="card"><h2>🏢 Department List</h2><div id="list"></div></div><div class="card"><h2>➕ Create Department</h2><input id="name" placeholder="Department name"><input id="code" placeholder="Code"><input id="desc" placeholder="Description"><br><button id="create">Create Department</button></div><div class="card"><h2>⚙️ Manage Department</h2><select id="dept"></select><br><button id="edit">Edit Selected</button><button id="deactivate">Deactivate</button><h3>👥 Assign Team Member</h3><select id="user"></select><br><button id="assign">Assign Member</button><h3>🔐 Extra Permissions</h3><div id="checks"></div><button id="save">Save Permissions</button><div id="msg" class="muted"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sb-mzntgjyecymcpzciklfk-auth-token'}}),$=id=>document.getElementById(id);let ds=[],us=[];const ps=['view_department','manage_members','edit_content','publish_content','manage_notices','view_audit'];async function fn(action,extra={}){const s=await db.auth.getSession(),t=s.data?.session?.access_token;if(!t)throw Error('Login session missing. Please login again.');const r=await db.functions.invoke('team-management',{body:{action,...extra},headers:{Authorization:'Bearer '+t,apikey:'sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn'}});if(r.error)throw r.error;if(r.data?.error)throw Error(r.data.error);return r.data}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const d=await fn('departments');ds=d.data||[];const t=await fn('list_team');us=(t.data||[]).filter(x=>x.is_active!==false&&String(x.role||'').toLowerCase()!=='owner');$('total').textContent=ds.length;$('active').textContent=ds.filter(x=>x.is_active!==false).length;$('members').textContent=us.length;$('list').innerHTML=ds.map(x=>'<p>🏢 <b>'+esc(x.name)+'</b> — '+esc(x.code)+' — '+(x.is_active===false?'Inactive':'Active')+'</p>').join('')||'No departments';$('dept').innerHTML=ds.map(x=>'<option value="'+x.id+'">'+esc(x.name)+' ('+esc(x.code)+')</option>').join('');$('user').innerHTML=us.length?us.map(x=>'<option value="'+x.user_id+'">'+esc(x.display_name||x.username||x.email)+' — '+esc(x.role)+'</option>').join(''):'<option value="">No team member available</option>';$('checks').innerHTML=ps.map(x=>'<label style="display:block"><input type="checkbox" id="p_'+x+'"> '+x+'</label>').join('');$('status').hidden=true;$('app').hidden=false;await perms()}catch(e){$('status').innerHTML='<span class="error">'+esc(e.message)+'</span><br><button onclick="load()">Retry</button>'}}async function perms(){if(!$('dept').value||!$('user').value){ps.forEach(x=>$('p_'+x).checked=false);return}try{const r=await fn('list_department_permissions',{department_id:$('dept').value,user_id:$('user').value}),a=new Set((r.data||[]).map(x=>x.permission_key));ps.forEach(x=>$('p_'+x).checked=a.has(x))}catch(e){$('msg').textContent='❌ '+e.message}}$('create').onclick=async()=>{try{await fn('create_department',{name:$('name').value,code:$('code').value,description:$('desc').value});$('msg').textContent='✅ Created';await load()}catch(e){$('msg').textContent='❌ '+e.message}};$('edit').onclick=async()=>{const d=ds.find(x=>x.id===$('dept').value);if(!d)return;const n=prompt('Department name',d.name);if(n===null)return;const c=prompt('Code',d.code);if(c===null)return;const desc=prompt('Description',d.description||'');if(desc===null)return;try{await fn('update_department',{department_id:d.id,name:n,code:c,description:desc,is_active:d.is_active!==false});await load()}catch(e){$('msg').textContent='❌ '+e.message}};$('deactivate').onclick=async()=>{if(!confirm('Deactivate selected department?'))return;try{await fn('update_department',{department_id:$('dept').value,is_active:false});await load()}catch(e){$('msg').textContent='❌ '+e.message}};$('assign').onclick=async()=>{if(!$('user').value){$('msg').textContent='❌ No team member available';return}try{await fn('assign_department_member',{department_id:$('dept').value,user_id:$('user').value});$('msg').textContent='✅ Member assigned'}catch(e){$('msg').textContent='❌ '+e.message}};$('save').onclick=async()=>{if(!$('user').value){$('msg').textContent='❌ Select a team member first';return}try{const d=$('dept').value,u=$('user').value,r=await fn('list_department_permissions',{department_id:d,user_id:u}),a=new Set((r.data||[]).map(x=>x.permission_key));for(const p of ps){const c=$('p_'+p).checked;if(c&&!a.has(p))await fn('grant_department_permission',{department_id:d,user_id:u,permission_key:p});if(!c&&a.has(p))await fn('revoke_department_permission',{department_id:d,user_id:u,permission_key:p})}$('msg').textContent='✅ Permissions saved';await perms()}catch(e){$('msg').textContent='❌ '+e.message}};$('dept').onchange=perms;$('user').onchange=perms;$('logout').onclick=async e=>{e.preventDefault();await db.auth.signOut();location.href='/'};load();</script></body></html>
