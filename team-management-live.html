<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Team Management</title><style>body{margin:0;font-family:system-ui;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;flex-wrap:wrap;gap:8px}.nav a{color:#fff;padding:9px 12px;border:1px solid #ffffff33;border-radius:10px;text-decoration:none}.card{background:#fff;border-radius:15px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.num{font-size:28px;font-weight:800}input,select,button{padding:10px;margin:4px;border:1px solid #ccd6e2;border-radius:8px;box-sizing:border-box}input,select{max-width:100%}button{background:#102a43;color:#fff;font-weight:700}.error{color:#b42318}.member{border-top:1px solid #e5e9ef;padding:14px 0}.hidden{display:none}.msg{margin-top:8px;font-weight:700}</style></head><body><header class="top"><div class="wrap"><h1>👥 TEAM MANAGEMENT</h1><nav class="nav"><a href="/owner-dashboard.html">🏠 Home</a><a href="/dashboard.html">📊 Dashboard</a><a href="/team-management-live.html">👥 Team</a><a href="/content.html">📝 Content</a><a href="/departments.html">🏢 Departments</a><a href="/important-notice.html">📢 Important Notice</a><a href="/live-notice.html">🔴 Live Notice</a><a href="/settings.html">⚙️ Settings</a><a href="/activity-audit.html">🧾 Activity / Audit</a><a href="/" id="logout">🚪 Logout</a></nav></div></header><main class="wrap"><div id="status" class="card">Loading Team Management…</div><section id="app" class="hidden"><div class="grid"><div class="card">👥 Total<div class="num" id="total">0</div></div><div class="card">🟢 Active<div class="num" id="active">0</div></div><div class="card">🔴 Blocked<div class="num" id="blocked">0</div></div><div class="card">⏳ Pending<div class="num" id="pending">0</div></div></div><section class="card"><h2>➕ Create Team User</h2><input id="uid" placeholder="Unique User ID"><input id="email" type="email" placeholder="Email"><input id="name" placeholder="Full name"><input id="password" type="password" placeholder="Initial password (8+ characters)"><select id="role"><option value="admin">ADMIN</option><option value="editor">EDITOR</option><option value="gm">GM</option><option value="owner">OWNER</option></select><select id="department"></select><br><button id="create">Create User</button><div id="createMsg" class="msg"></div></section><section class="card"><h2>👥 Team Members</h2><input id="search" placeholder="Search name / email / ID"><div id="members">Loading…</div></section><section class="card"><h2>📩 Pending Requests</h2><div id="requests">Loading…</div></section><section class="card"><h2>⚙️ Owner Control</h2><select id="selected"></select><br><select id="changeRole"><option value="admin">ADMIN</option><option value="editor">EDITOR</option><option value="gm">GM</option><option value="owner">OWNER</option></select><select id="changeDept"></select><select id="changeStatus"><option value="active">ACTIVE</option><option value="blocked">BLOCKED</option></select><br><button id="save">Save Role / Department / Status</button><div id="saveMsg" class="msg"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sb-mzntgjyecymcpzciklfk-auth-token'}}),$=id=>document.getElementById(id);let rows=[],deps=[];async function call(action,extra={}){const s=await db.auth.getSession(),t=s.data?.session?.access_token;if(!t)throw Error('Login session missing.');const r=await db.functions.invoke('team-management',{body:{action,...extra},headers:{Authorization:'Bearer '+t,apikey:'sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn'}});if(r.error)throw r.error;if(r.data?.error)throw Error(r.data.error);return r.data}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const me=await call('me');if(String(me.role).toLowerCase()!=='owner')throw Error('Only Owner can manage the Team.');const d=await call('departments');deps=d.data||[];fillDeps();const t=await call('list_team');rows=t.data||[];render();try{const r=await call('list_requests');const q=(r.data||[]).filter(x=>String(x.status).toLowerCase()==='pending');$('pending').textContent=q.length;$('requests').innerHTML=q.map(x=>'<div class="member">📩 Request #'+esc(x.id)+' — '+esc(x.email||x.user_id||'Pending')+'</div>').join('')||'No pending requests.'}catch(e){$('requests').textContent='No pending requests.'}$('status').hidden=true;$('app').classList.remove('hidden')}catch(e){$('status').innerHTML='<span class="error">'+esc(e.message)+'</span><br><button onclick="location.reload()">Retry</button>'}}function fillDeps(){const o=deps.map(d=>'<option value="'+d.id+'">'+esc(d.name)+' ('+esc(d.code)+')</option>').join('');$('department').innerHTML='<option value="">No department</option>'+o;$('changeDept').innerHTML='<option value="">No department</option>'+o}function render(){const s=$('search').value.toLowerCase(),active=rows.filter(x=>x.is_active!==false).length;$('total').textContent=rows.length;$('active').textContent=active;$('blocked').textContent=rows.length-active;const list=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(s));$('members').innerHTML=list.map(x=>'<div class="member"><b>👤 '+esc(x.display_name||x.username||'Member')+'</b><div>'+esc(x.username||'')+' · <b>'+esc(String(x.role||'').toUpperCase())+'</b> · '+(x.is_active===false?'🔴 BLOCKED':'🟢 ACTIVE')+'</div><div>Department ID: '+esc(x.department_id||'—')+'</div></div>').join('')||'No members found.';$('selected').innerHTML='<option value="">Select member</option>'+rows.map(x=>'<option value="'+esc(x.user_id)+'">'+esc(x.display_name||x.username||'Member')+' — '+esc(String(x.role||'').toUpperCase())+'</option>').join('')}$('search').oninput=render;$('create').onclick=async()=>{try{if(!$('uid').value||!$('email').value||!$('name').value||$('password').value.length<8)throw Error('User ID, name, email and password (8+ characters) required');await call('create_user',{user_id:$('uid').value,email:$('email').value,display_name:$('name').value,password:$('password').value,role:$('role').value,department_id:$('department').value||null});$('createMsg').textContent='✅ User created';['uid','email','name','password'].forEach(id=>$(id).value='');await load()}catch(e){$('createMsg').textContent='❌ '+e.message}};$('save').onclick=async()=>{try{const id=$('selected').value;if(!id)throw Error('Select a member');await call('update_user',{user_id:id,role:$('changeRole').value,department_id:$('changeDept').value||null,is_active:$('changeStatus').value==='active'});$('saveMsg').textContent='✅ User updated';await load()}catch(e){$('saveMsg').textContent='❌ '+e.message}};$('selected').onchange=()=>{const x=rows.find(r=>r.user_id===$('selected').value);if(!x)return;$('changeRole').value=String(x.role||'admin').toLowerCase();$('changeStatus').value=x.is_active===false?'blocked':'active';$('changeDept').value=x.department_id||''};$('logout').onclick=async e=>{e.preventDefault();await db.auth.signOut();location.href='/'};load();</script></body></html>
