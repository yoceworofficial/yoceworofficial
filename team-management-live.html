<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Team Management</title><style>body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1050px;margin:auto;padding:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.nav a{color:#fff;text-decoration:none;padding:9px 12px;border:1px solid #ffffff33;border-radius:10px;font-weight:700}.active{background:#fff!important;color:#102a43!important}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.num{font-size:28px;font-weight:800}.muted{color:#66758a;font-size:13px}.member{padding:14px 0;border-top:1px solid #e7ebf0}.btn{display:inline-block;border:0;border-radius:9px;padding:9px 12px;background:#102a43;color:#fff;text-decoration:none;font-weight:800;cursor:pointer;margin:3px}.light{background:#eef2f6;color:#172235}.danger{background:#a51d22}.error{color:#b42318;font-weight:700}.hide{display:none}input,select{padding:10px;border:1px solid #d7dee8;border-radius:9px;margin:4px}</style></head><body><header class="top"><div class="wrap"><h1>👥 TEAM MANAGEMENT</h1><div style="color:#dbe7f2">Owner / GM team control</div><nav class="nav"><a href="/owner-dashboard.html">🏠 Home</a><a href="/dashboard.html">📊 Dashboard</a><a class="active" href="/team-management-live.html">👥 Team</a></nav></div></header><main class="wrap"><a class="btn light" href="/owner-dashboard.html">← Back to Owner Home</a><section id="guard" class="card">Team access verify हो रहा है…</section><section id="app" class="hide"><div class="grid"><div class="card">👥 TOTAL TEAM<div class="num" id="total">0</div></div><div class="card">🟢 ACTIVE<div class="num" id="active">0</div></div><div class="card">🔴 BLOCKED<div class="num" id="blocked">0</div></div><div class="card">⏳ PENDING<div class="num" id="pending">0</div></div></div><section class="card"><h2>🔎 Find Team Member</h2><input id="search" placeholder="Name / email / User ID"><select id="filter"><option value="all">All</option><option value="active">Active</option><option value="blocked">Blocked</option></select></section><section class="card"><h2>👤 Team Members</h2><div id="members">Loading…</div></section><section class="card"><h2>📩 Pending Requests</h2><div id="requests">Loading…</div></section></section></main><script>const SUPA='https://mzntgjyecymcpzciklfk.supabase.co',KEY='sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',FN=SUPA+'/functions/v1/team-management',$=id=>document.getElementById(id);let me=null,rows=[];function getStoredToken(){try{const x=JSON.parse(localStorage.getItem('sb-mzntgjyecymcpzciklfk-auth-token')||'null');return x?.access_token||x?.currentSession?.access_token||x?.session?.access_token||null}catch(e){return null}}async function api(action,extra={}){const t=getStoredToken();if(!t)throw Error('Login session missing. Please login again.');const c=new AbortController(),timer=setTimeout(()=>c.abort(),10000);try{const r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+t,apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({action,...extra}),signal:c.signal});const text=await r.text();let d={};try{d=JSON.parse(text||'{}')}catch(e){throw Error('Invalid Edge Function response.')}if(!r.ok||d.error)throw Error(d.error||('Edge Function returned HTTP '+r.status));return d}finally{clearTimeout(timer)}}async function init(){try{me=await api('me');const role=String(me.role||'').toLowerCase();if(!['owner','gm'].includes(role))throw Error('Only Owner or GM can manage the team.');$('guard').classList.add('hide');$('app').classList.remove('hide');await load()}catch(e){$('guard').innerHTML='<b class="error">'+(e.name==='AbortError'?'Team verification timed out.':e.message)+'</b><br><br><button class="btn" onclick="location.reload()">Retry</button><p class="muted">If this says Login session missing, return to Team Login and login again.</p>'}}async function load(){try{const r=await api('list_team');rows=r.data||[];render()}catch(e){$('members').innerHTML='<b class="error">Team data unavailable: '+e.message+'</b>'}try{const r=await api('list_requests');const q=(r.data||[]).filter(x=>String(x.status).toLowerCase()==='pending');$('pending').textContent=q.length;$('requests').innerHTML=q.map(x=>'<div class="member">📩 Request #'+x.id+' — '+(x.name||x.email||'Applicant')+' • '+(x.requested_role||'Role not specified')+'</div>').join('')||'<span class="muted">No pending requests.</span>'}catch(e){$('requests').textContent='No pending requests.'}}function render(){const s=$('search').value.toLowerCase(),f=$('filter').value,active=rows.filter(x=>x.is_active!==false).length;$('total').textContent=rows.length;$('active').textContent=active;$('blocked').textContent=rows.length-active;const list=rows.filter(x=>(f==='all'||(f==='active'?x.is_active!==false:x.is_active===false))&&JSON.stringify(x).toLowerCase().includes(s));$('members').innerHTML=list.map(x=>'<div class="member"><b>👤 '+(x.display_name||x.username||'Member')+'</b><div class="muted">User ID: '+(x.username||x.user_id||'—')+' • '+(x.role||'—')+' • Department ID: '+(x.department_id||'—')+' • '+(x.is_active===false?'🔴 BLOCKED':'🟢 ACTIVE')+'</div><button class="btn" onclick="view(\''+(x.user_id||x.username)+'\')">View</button></div>').join('')||'<span class="muted">No members found.</span>'}function view(id){const x=rows.find(a=>String(a.user_id||a.username)===String(id));if(x)alert('Member\n\nName: '+(x.display_name||x.username||'—')+'\nUser ID: '+(x.username||x.user_id||'—')+'\nRole: '+(x.role||'—')+'\nDepartment ID: '+(x.department_id||'—')+'\nStatus: '+(x.is_active===false?'BLOCKED':'ACTIVE'))}$('search').oninput=render;$('filter').onchange=render;init();</script></body></html>
