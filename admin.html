<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Admin</title><style>body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#eef2f6;color:#17212b}.top{background:#073b72;color:#fff;padding:18px 5%;border-bottom:4px solid #f58220}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:12px;padding:20px;margin:15px 0;box-shadow:0 2px 9px #0001}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 10px;border:1px solid #bcc7d1;border-radius:7px}textarea{min-height:90px}button{border:0;border-radius:7px;padding:11px 15px;background:#073b72;color:#fff;font-weight:bold;margin:4px;cursor:pointer}.green{background:#16844b}.red{background:#b42318}.gray{background:#596773}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{font-weight:bold;margin:8px 0}.hide{display:none}.item{border:1px solid #d5dde5;border-radius:8px;padding:12px;margin:8px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}button{width:100%;margin:4px 0}}</style></head><body><div class="top"><b>YOCEWOR ADMIN PANEL</b><br><small>Jobs • Updates • Admit Card • Result • Forms</small></div><main class="wrap"><section id="login" class="card"><h2>🔐 Admin Login</h2><p>Team Login से आने पर यह screen अपने-आप skip होगी।</p><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="green" onclick="login()">Login</button><div id="lm" class="msg"></div></section><section id="app" class="hide"><div class="card"><button class="gray" onclick="logout()">Logout</button><h2>📰 भर्ती / Update Publish करें</h2><div class="grid"><div><label>Type</label><select id="type"><option value="job">नई भर्ती</option><option value="admit">Admit Card</option><option value="result">Result</option><option value="form">Online Form</option></select></div><div><label>Title</label><input id="title"></div><div><label>Department</label><input id="department"></div><div><label>Total Posts</label><input id="vacancies"></div><div><label>Start Date</label><input id="start_date"></div><div><label>Last Date</label><input id="last_date"></div><div><label>Qualification</label><input id="qualification"></div><div><label>Age Limit</label><input id="age_limit"></div><div><label>Fee</label><input id="fee"></div><div><label>Location</label><input id="location" value="All India"></div><div><label>Salary</label><input id="salary"></div><div><label>Selection Process</label><input id="selection_process"></div></div><label>Full Details</label><textarea id="description"></textarea><div class="grid"><div><label>Direct Apply URL</label><input id="apply_url"></div><div><label>Official Notification URL</label><input id="notification_url"></div><div><label>Admit Card URL</label><input id="admit_url"></div><div><label>Result URL</label><input id="result_url"></div><div><label>Form Video URL</label><input id="video_url"></div><div><label>Status</label><select id="status"><option value="published">Live / Published</option><option value="draft">Draft</option></select></div></div><button class="green" onclick="save()">🚀 Save / Publish</button><div id="sm" class="msg"></div></div><div class="card"><h2>📋 Content Manager</h2><button onclick="load()">Refresh</button><div id="list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn');const $=id=>document.getElementById(id);let editing=null;const keys=['type','title','department','vacancies','start_date','last_date','qualification','age_limit','fee','location','salary','selection_process','description','apply_url','notification_url','admit_url','result_url','video_url','status'];async function api(action,extra={}){const r=await db.functions.invoke('content-control',{body:{action,...extra}});if(r.error)throw r.error;if(r.data?.error)throw Error(r.data.error);return r.data}async function login(){const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(r.error){$('lm').textContent=r.error.message;return}openFromSession()}async function openFromSession(){try{const me=await api('role');if(!['admin','owner','gm'].includes(me.role))throw Error('यह Admin/Manager account नहीं है।');$('login').classList.add('hide');$('app').classList.remove('hide');load()}catch(e){await db.auth.signOut();$('lm').textContent=e.message}}async function logout(){await db.auth.signOut();location.href='team-login.html'}function data(){let x={};keys.forEach(k=>x[k]=$(k).value.trim());return x}function fill(x){editing=x.id;keys.forEach(k=>$(k).value=x[k]??'')}function clearForm(){editing=null;keys.forEach(k=>$(k).value='');$('location').value='All India';$('status').value='published'}async function save(){let job=data();if(!job.title){$('sm').textContent='Title जरूरी है।';return}try{await api(editing?'update':'create',{job:editing?{...job,id:editing}:job});$('sm').textContent='सफलतापूर्वक save/publish हो गया।';clearForm();load()}catch(e){$('sm').textContent=e.message}}async function load(){try{let r=await api('list');$('list').innerHTML=(r.data||[]).map(x=>'<div class="item"><b>'+esc(x.title)+'</b><br><small>'+esc(x.type)+' • '+esc(x.status)+' • Last: '+esc(x.last_date||'—')+'</small><br><button onclick="editJob(\''+x.id+'\')">Edit</button><button class="red" onclick="delJob(\''+x.id+'\')">Delete</button></div>').join('')||'No content'}catch(e){$('list').textContent=e.message}}window.editJob=async id=>{let r=await api('list'),x=(r.data||[]).find(a=>a.id===id);if(x){fill(x);scrollTo({top:0,behavior:'smooth'})}};window.delJob=async id=>{if(!confirm('यह content delete करें?'))return;try{await api('delete',{id});load()}catch(e){alert(e.message)}};function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function auto(){const s=await db.auth.getSession();if(s.data.session)openFromSession()}auto()</script></body></html>
