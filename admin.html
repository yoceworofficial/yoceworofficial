<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Admin</title><style>body{font-family:Arial;background:#f3f6f9;margin:0;color:#17202a}.wrap{max-width:1100px;width:94%;margin:auto}.head{background:#073b72;color:#fff;padding:18px 0;border-bottom:4px solid #f58220}.card{background:#fff;border:1px solid #d7dee6;padding:18px;margin:18px 0}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 10px;border:1px solid #b9c5d0}textarea{min-height:100px}button{padding:11px 15px;border:0;background:#073b72;color:#fff;font-weight:bold;cursor:pointer;margin:4px}.green{background:#16844b}.gray{background:#596773}.danger{background:#b42318}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.msg{padding:10px;background:#fff8e8;margin:10px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="head"><div class="wrap"><b>YOCEWOR ADMIN</b><div>Recruitment • Admit Card • Result • Forms</div></div></header><main class="wrap"><section id="setup" class="card"><h2>⚙️ Admin Connection Setup</h2><p>पहली बार इस page पर अपने Supabase Project URL और Publishable Key डालें। ये values browser में local device पर ही रखी जाएंगी।</p><input id="surl" placeholder="Supabase Project URL"><input id="skey" placeholder="Supabase Publishable Key"><button id="connect" class="green">Connect</button><div id="setupmsg"></div></section><section id="login" class="card hidden"><h2>🔐 Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><div id="loginMsg"></div></section><section id="app" class="hidden"><div class="card"><button id="logout" class="gray">Logout</button><h2>📢 नई भर्ती / Update Publish करें</h2><input id="id" type="hidden"><div class="grid"><div><label>Type</label><select id="type"><option value="job">नई भर्ती</option><option value="admit">Admit Card</option><option value="result">Result</option><option value="form">Online Form</option></select></div><div><label>Title</label><input id="title"></div><div><label>Department</label><input id="department"></div><div><label>Total Posts</label><input id="vacancies"></div><div><label>Start Date</label><input id="start_date" type="date"></div><div><label>Last Date</label><input id="last_date" type="date"></div><div><label>Qualification</label><input id="qualification"></div><div><label>Age Limit</label><input id="age"></div><div><label>Salary</label><input id="salary"></div><div><label>Location</label><input id="location" value="All India"></div><div><label>Published</label><select id="published"><option value="true">Live</option><option value="false">Draft</option></select></div><div class="full"><label>Full Details</label><textarea id="description"></textarea></div><div><label>Direct Apply URL</label><input id="apply_url" type="url"></div><div><label>Official Notification URL</label><input id="notification_url" type="url"></div><div><label>Admit Card URL</label><input id="admit_url" type="url"></div><div><label>Result URL</label><input id="result_url" type="url"></div><div><label>Form Video URL</label><input id="video_url" type="url"></div></div><button id="save" class="green">💾 Save / Publish</button><button id="clear" class="gray">Clear</button><div id="msg"></div></div><div class="card"><h2>📋 Posts</h2><button id="refresh">Refresh</button><div id="list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let S=null,$=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function make(){let u=$('surl').value.trim(),k=$('skey').value.trim();if(!u||!k){$('setupmsg').textContent='Project URL और Publishable Key दोनों जरूरी हैं।';return}S=supabase.createClient(u,k);localStorage.setItem('yocewor_supabase_url',u);localStorage.setItem('yocewor_supabase_key',k);$('setup').classList.add('hidden');$('login').classList.remove('hidden')}async function admin(){let{data}=await S.auth.getUser();if(!data.user)return false;let r=await S.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();return !!r.data}function reset(){['id','title','department','vacancies','start_date','last_date','qualification','age','salary','description','apply_url','notification_url','admit_url','result_url','video_url'].forEach(x=>$(x).value='');$('location').value='All India';$('published').value='true'}async function load(){let r=await S.from('jobs').select('*').order('created_at',{ascending:false});if(r.error){$('list').textContent=r.error.message;return}$('list').innerHTML=(r.data||[]).map(x=>'<div style="border:1px solid #d7dee6;padding:10px;margin:8px 0"><b>'+esc(x.title)+'</b><br><small>'+esc(x.department||'')+' • '+(x.published?'LIVE':'DRAFT')+' • Last: '+esc(x.last_date||'—')+'</small><br><button onclick="editJob(\''+x.id+'\')">Edit</button><button onclick="toggleJob(\''+x.id+'\','+(!x.published)+')">'+(x.published?'Unpublish':'Publish')+'</button><button class="danger" onclick="deleteJob(\''+x.id+'\')">Delete</button></div>').join('')||'No posts'}window.editJob=async id=>{let r=await S.from('jobs').select('*').eq('id',id).single();if(r.error)return;Object.keys(r.data).forEach(k=>{if($(k)&&r.data[k]!=null)$(k).value=r.data[k]});$('published').value=String(!!r.data.published)};window.toggleJob=async(id,p)=>{await S.from('jobs').update({published:p,updated_at:new Date().toISOString()}).eq('id',id);load()};window.deleteJob=async id=>{if(confirm('Delete this post?')){await S.from('jobs').delete().eq('id',id);load()}};$('connect').onclick=make;$('loginBtn').onclick=async()=>{let r=await S.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('loginMsg').textContent=r.error.message;return}if(!(await admin())){await S.auth.signOut();$('loginMsg').textContent='यह account admin नहीं है।';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');load()};$('logout').onclick=async()=>{await S.auth.signOut();location.reload()};$('clear').onclick=reset;$('refresh').onclick=load;$('save').onclick=async()=>{if(!(await admin()))return;let p={type:$('type').value,title:$('title').value.trim(),department:$('department').value.trim(),vacancies:$('vacancies').value.trim()||null,start_date:$('start_date').value||null,last_date:$('last_date').value||null,qualification:$('qualification').value.trim()||null,age:$('age').value.trim()||null,salary:$('salary').value.trim()||null,location:$('location').value.trim()||'All India',published:$('published').value==='true',description:$('description').value.trim()||null,apply_url:$('apply_url').value.trim()||null,notification_url:$('notification_url').value.trim()||null,admit_url:$('admit_url').value.trim()||null,result_url:$('result_url').value.trim()||null,video_url:$('video_url').value.trim()||null,updated_at:new Date().toISOString()};let r=$('id').value?await S.from('jobs').update(p).eq('id',$('id').value):await S.from('jobs').insert(p);$('msg').textContent=r.error?r.error.message:'Saved successfully';if(!r.error){reset();load()}};let u=localStorage.getItem('yocewor_supabase_url'),k=localStorage.getItem('yocewor_supabase_key');if(u&&k){$('surl').value=u;$('skey').value=k;make()}</script></body></html>
