<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner Panel — YOCEWOR</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header class="site-header"><div class="site-wrap header-inner"><a class="site-title" href="/">YOCEWOR Owner</a><nav><a href="/">Public Site</a></nav></div></header>
<main class="site-wrap" style="max-width:980px;margin-top:18px">
<section id="login-box" class="simple-section"><h2>Owner Login</h2><p>Use the authorized YOCEWOR owner account.</p><form id="login-form"><p><label>Email<br><input id="email" type="email" required style="width:100%;padding:10px"></label></p><p><label>Password<br><input id="password" type="password" required style="width:100%;padding:10px"></label></p><button>Login</button><p id="login-msg" class="muted"></p></form></section>
<section id="panel" class="simple-section" hidden><h2>Content Manager</h2><p id="who" class="muted"></p><button id="logout">Logout</button>
<form id="post-form"><h2>Add / Edit Update</h2><input type="hidden" id="post-id"><p><label>Category<br><select id="category" required style="width:100%;padding:10px"></select></label></p><p><label>Title<br><input id="title" required style="width:100%;padding:10px"></label></p><p><label>Slug<br><input id="slug" required style="width:100%;padding:10px"></label></p><p><label>Short Description<br><textarea id="excerpt" rows="3" style="width:100%;padding:10px"></textarea></label></p><p><label>Introduction<br><textarea id="intro" rows="5" style="width:100%;padding:10px"></textarea></label></p><p><label>Official Source URL<br><input id="source" type="url" style="width:100%;padding:10px"></label></p><p><label><input id="publish" type="checkbox"> Publish now</label></p><button type="submit">Save Update</button> <button type="button" id="reset">Clear</button><p id="save-msg" class="muted"></p></form>
<h2>Published / Draft Updates</h2><div id="posts" class="post-list">Loading...</div></section></main>
<footer class="site-footer"><div class="site-wrap footer-inner">© <span id="year"></span> YOCEWOR</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script>
<script>
(async()=>{const c=supabase.createClient(YOCEWOR_CONFIG.supabaseUrl,YOCEWOR_CONFIG.supabasePublishableKey,{auth:{persistSession:true}});document.getElementById("year").textContent=new Date().getFullYear();
const loginBox=document.getElementById("login-box"),panel=document.getElementById("panel"),msg=document.getElementById("login-msg"),saveMsg=document.getElementById("save-msg"),form=document.getElementById("post-form"),list=document.getElementById("posts"),cat=document.getElementById("category");
async function init(){const {data:{session}}=await c.auth.getSession();if(!session){loginBox.hidden=false;panel.hidden=true;return}const {data:admin}=await c.from("admin_users").select("user_id").eq("user_id",session.user.id).maybeSingle();if(!admin){await c.auth.signOut();msg.textContent="This account is not authorized as a YOCEWOR owner.";return}loginBox.hidden=true;panel.hidden=false;document.getElementById("who").textContent="Logged in: "+session.user.email;await loadCats();await loadPosts()}
async function loadCats(){const {data}=await c.from("categories").select("id,name,slug").eq("is_active",true).order("sort_order");cat.innerHTML=(data||[]).map(x=>"<option value='"+x.id+"'>"+esc(x.name)+"</option>").join("")}
async function loadPosts(){const {data,error}=await c.from("posts").select("id,title,slug,status,published_at,categories(name)").order("updated_at",{ascending:false}).limit(100);if(error){list.innerHTML="<p>Could not load updates.</p>";return}list.innerHTML=(data||[]).map(p=>"<p class='post-item'><strong>"+esc(p.title)+"</strong> <span class='muted'>["+esc(p.status)+"]</span> — <button type='button' data-edit='"+p.id+"'>Edit</button></p>").join("")||"<p class='muted'>No updates yet.</p>";list.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(b.dataset.edit))}
async function edit(id){const {data:p,error}=await c.from("posts").select("*").eq("id",id).single();if(error)return;document.getElementById("post-id").value=p.id;cat.value=p.category_id;document.getElementById("title").value=p.title||"";document.getElementById("slug").value=p.slug||"";document.getElementById("excerpt").value=p.excerpt||"";document.getElementById("intro").value=p.content_intro||"";document.getElementById("source").value=p.official_source_url||"";document.getElementById("publish").checked=p.status==="published";scrollTo({top:300,behavior:"smooth"})}
form.onsubmit=async e=>{e.preventDefault();saveMsg.textContent="Saving...";const id=document.getElementById("post-id").value;const payload={category_id:cat.value,title:document.getElementById("title").value.trim(),slug:document.getElementById("slug").value.trim(),excerpt:document.getElementById("excerpt").value.trim()||null,content_intro:document.getElementById("intro").value.trim()||null,official_source_url:document.getElementById("source").value.trim()||null,status:document.getElementById("publish").checked?"published":"draft",published_at:document.getElementById("publish").checked?new Date().toISOString():null,updated_at:new Date().toISOString()};let res=id?await c.from("posts").update(payload).eq("id",id):await c.from("posts").insert(payload);if(res.error){saveMsg.textContent=res.error.message;return}saveMsg.textContent="Saved successfully.";reset();await loadPosts()}
function reset(){form.reset();document.getElementById("post-id").value="";document.getElementById("publish").checked=false}
document.getElementById("reset").onclick=reset;document.getElementById("logout").onclick=async()=>{await c.auth.signOut();location.reload()};document.getElementById("login-form").onsubmit=async e=>{e.preventDefault();msg.textContent="Logging in...";const {error}=await c.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});if(error){msg.textContent=error.message;return}await init()};c.auth.onAuthStateChange(()=>init());init();
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
})();</script></body></html>
