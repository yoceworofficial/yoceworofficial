<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>YOCEWOR Content Manager</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.nav a,.nav button{color:#fff;text-decoration:none;padding:9px 12px;border:1px solid #ffffff33;border-radius:10px;font-size:13px;font-weight:800;background:transparent;cursor:pointer}.nav a.active{background:#fff;color:#102a43}.status{display:inline-flex;align-items:center;gap:7px;background:#e9f7ef;color:#16844b;padding:6px 10px;border-radius:20px;font-weight:800;font-size:12px}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:5px}.input{width:100%;padding:11px;border:1px solid #cbd6e2;border-radius:9px;font:inherit;background:#fff}textarea.input{min-height:100px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer;background:#102a43;color:#fff}.green{background:#176b35}.red{background:#b42318}.gray{background:#64748b}.item{padding:13px 0;border-bottom:1px solid #e8edf2}.muted{font-size:13px;color:#68778b}.hide{display:none}.error{color:#b42318;font-weight:800}.builder{border:1px solid #dce4ec;border-radius:12px;padding:14px;margin:14px 0;background:#fbfcfe}.builder-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:8px 0}@media(max-width:650px){.nav{display:grid;grid-template-columns:1fr 1fr}.nav a,.nav button{text-align:center}.grid,.row{grid-template-columns:1fr}.actions .btn{width:100%}}</style></head><body><header class="top"><div class="wrap"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><h1 id="heading" style="margin:0">📝 YOCEWOR CONTENT MANAGER</h1><div id="subtitle" style="color:#dbe8f5;font-size:13px">Department Content Control Center</div></div><span id="roleBadge" class="status">VERIFYING…</span></div><nav class="nav" id="nav"></nav></div></header><main class="wrap"><section id="login" class="card"><h2>🔐 Access</h2><div id="loginMsg">Checking authorization…</div><div id="loginForm" class="hide"><input id="email" class="input" type="email" placeholder="Email"><input id="pass" class="input" type="password" placeholder="Password"><button class="btn green" onclick="login()">Login</button></div></section><section id="app" class="hide"><section class="card"><div class="actions"><button class="btn gray" onclick="clearForm()">＋ New Content</button><button class="btn gray" onclick="load()">↻ Refresh</button><button class="btn" onclick="logout()">🚪 Logout</button></div></section><section class="card"><h2 id="formTitle">📰 Create / Update Content</h2><div class="grid"><div class="field"><label>Type</label><select id="type" class="input"><option value="job">नई भर्ती</option><option value="admit">Admit Card</option><option value="result">Result</option><option value="form">Online Form</option></select></div><div class="field"><label>Title</label><input id="title" class="input"></div><div class="field"><label>Department</label><input id="department" class="input"></div><div class="field"><label>Total Posts</label><input id="vacancies" class="input"></div><div class="field"><label>Start Date</label><input id="start_date" class="input" type="date"></div><div class="field"><label>Last Date</label><input id="last_date" class="input" type="date"></div><div class="field"><label>Qualification</label><input id="qualification" class="input"></div><div class="field"><label>Age Limit</label><input id="age_limit" class="input"></div><div class="field"><label>Fee</label><input id="fee" class="input"></div><div class="field"><label>Location</label><input id="location" class="input" value="All India"></div><div class="field"><label>Salary</label><input id="salary" class="input"></div><div class="field"><label>Selection Process</label><input id="selection_process" class="input"></div></div><div class="field"><label>Full Details</label><textarea id="description" class="input"></textarea></div><div class="grid"><div class="field"><label>Direct Apply URL</label><input id="apply_url" class="input"></div><div class="field"><label>Official Notification URL</label><input id="notification_url" class="input"></div><div class="field"><label>Admit Card URL</label><input id="admit_url" class="input"></div><div class="field"><label>Result URL</label><input id="result_url" class="input"></div><div class="field"><label>Form Video URL</label><input id="video_url" class="input"></div><div class="field"><label>Status</label><select id="status" class="input"><option value="published">Live / Published</option><option value="draft">Draft</option></select></div></div><div class="actions"><button class="btn gray" onclick="save('draft')">🟡 Save Draft</button><button class="btn green" onclick="save('published')">🚀 Save / Publish</button><button class="btn red hide" id="deleteBtn" onclick="delCurrent()">🗑️ Delete</button></div><div id="sm" class="muted"></div></section><section class="card"><h2>📋 Content Manager</h2><div id="list">Loading…</div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id);let editing=null,currentRole=null;const keys=['type','title','department','vacancies','start_date','last_date','qualification','age_limit','fee','location','salary','selection_process','description','apply_url','notification_url','admit_url','result_url','video_url','status'];async function api(action,extra={}){const r=await db.functions.invoke('content-control',{body:{action,...extra}});if(r.error)throw r.error;if(r.data?.error)throw Error(r.data.error);return r.data}async function login(){const r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(r.error){$("loginMsg").textContent=r.error.message;return}openFromSession()}function nav(role){const n=$("nav");n.innerHTML='';const add=(text,url,active=false)=>{const a=document.createElement('a');a.href=url;a.textContent=text;if(active)a.className='active';n.append(a)};if(role==='owner'){add('🏠 Home','/owner-dashboard.html');add('👑 Owner Dashboard','/owner-dashboard.html');add('👥 Team','/team-requests.html');add('📝 Content','/content.html',true);add('🏢 Departments','/departments.html')}else if(role==='gm'){add('🏠 Home','/gm-dashboard.html',true);add('👥 Users','/team-requests.html');add('📝 Content','/content.html',true);add('📊 Reports','/job-review.html');add('🛠️ Admins','/admin.html')}else if(role==='admin'){add('🏠 Home','/admin-dashboard.html',true);add('📝 Content','/content.html',true);add('📊 Reports','/job-review.html')}else{add('🏠 Home','/editor-dashboard.html',true);add('📝 Content','/content.html',true)}const b=document.createElement('button');b.textContent='🚪 Logout';b.onclick=logout;n.append(b)}async function openFromSession(){try{const me=await api('role');currentRole=String(me.role||'').toLowerCase();if(!['owner','gm','admin','editor'].includes(currentRole))throw Error('इस account को Content access नहीं है।');nav(currentRole);$("heading").textContent=currentRole==='owner'?'👑 YOCEWOR OWNER CONTENT MANAGER':'📝 YOCEWOR '+currentRole.toUpperCase()+' CONTENT MANAGER';$("subtitle").textContent=currentRole==='gm'?'General Management Control Center':currentRole==='admin'?'Administration Control Center':currentRole==='editor'?'Editorial Control Center':'Owner Control Center';$("roleBadge").textContent='● '+currentRole.toUpperCase()+' ACTIVE';$("login").classList.add('hide');$("app").classList.remove('hide');load()}catch(e){$("loginMsg").textContent=e.message;$("loginForm").classList.remove('hide')}}async function logout(){await db.auth.signOut();location.href='/'}function data(status){let x={};keys.forEach(k=>x[k]=$(k).value.trim());x.status=status;return x}function fill(x){editing=x.id;keys.forEach(k=>$(k).value=x[k]??'');$("deleteBtn").classList.remove('hide');$("formTitle").textContent='✏️ Edit Content'}function clearForm(){editing=null;keys.forEach(k=>$(k).value='');$("location").value='All India';$("status").value='draft';$("deleteBtn").classList.add('hide');$("formTitle").textContent='📰 Create / Update Content';$("sm").textContent=''}async function save(status){let job=data(status);if(!job.title){$("sm").textContent='❌ Title जरूरी है।';return}try{await api(editing?'update':'create',{job:editing?{...job,id:editing}:job});$("sm").textContent=status==='published'?'✅ Content published successfully.':'🟡 Draft saved successfully.';clearForm();load()}catch(e){$("sm").textContent='❌ '+e.message}}async function load(){try{let r=await api('list');let rows=r.data||[];$("list").innerHTML=rows.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><br><span class="muted">'+esc(x.type)+' • '+esc(x.status||'')+' • Last: '+esc(x.last_date||'—')+'</span><br><div class="actions"><button class="btn" onclick="editJob(\''+x.id+'\')">✏️ Edit / View</button><button class="btn red" onclick="delJob(\''+x.id+'\')">🗑️ Delete</button></div></div>').join('')||'<span class="muted">No content yet.</span>'}catch(e){$("list").innerHTML='<span class="error">'+esc(e.message)+'</span>'}}async function editJob(id){try{let r=await api('list'),x=(r.data||[]).find(a=>a.id===id);if(x){fill(x);scrollTo({top:0,behavior:'smooth'})}}catch(e){$("sm").textContent=e.message}}async function delJob(id){if(!confirm('यह content delete करें?'))return;try{await api('delete',{id});load()}catch(e){alert(e.message)}}async function delCurrent(){if(editing)await delJob(editing);clearForm()}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}openFromSession()</script></body></html>
