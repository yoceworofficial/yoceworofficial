function landing(){return '<section class="landing"><div class="wrap hero"><div><div class="tiny muted">YOUR VOICE. YOUR WORLD.</div><h1>Say it.<br><span class="gradient">Share it.</span><br>Live it.</h1><p>'+t('welcome')+' — a social space for people, creators and communities.</p><div class="actions"><button class="btn primary" id="signup">'+t('signup')+'</button><button class="btn" id="login">'+t('login')+'</button></div></div><div class="card heroCard"><div class="phone"><div class="phoneScreen"><div class="row"><b>YOCEWOR</b>'+badge({is_verified:true})+'</div><div style="height:12px"></div><div class="phonePic"><img src="yocewor-logo.svg" style="width:92%;max-height:210px;object-fit:contain" alt="YOCEWOR"></div><div style="padding:12px 2px"><b>'+t('welcome')+'</b></div></div></div></div></div></section>'}
function auth(kind='login'){return '<section class="auth"><div class="wrap"><div class="card authbox"><div class="authleft"><img src="yocewor-logo.svg" style="width:250px;max-width:100%;margin-bottom:20px" alt="YOCEWOR"><h1 style="font-size:48px;letter-spacing:-3px">Welcome<br><span class="gradient">to YOCEWOR.</span></h1><p class="muted">Simple. Social. Yours.</p></div><div class="authright"><div class="tabs"><button class="btn '+(kind==='login'?'primary':'')+'" id="alog">'+t('login')+'</button><button class="btn '+(kind==='signup'?'primary':'')+'" id="asign">'+t('signup')+'</button></div>'+(kind==='login'?'<input id="email" class="field" type="email" placeholder="Email"><input id="pass" class="field" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:8px" id="doLogin">'+t('login')+'</button>':'<input id="name" class="field" placeholder="Name"><input id="username" class="field" placeholder="Username"><input id="email" class="field" type="email" placeholder="Email"><input id="pass" class="field" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:8px" id="doSignup">'+t('signup')+'</button>')+'</div></div></div></section>'}
function bindAuth(k){$('#alog').onclick=()=>{root.innerHTML=auth('login');bindAuth('login')};$('#asign').onclick=()=>{root.innerHTML=auth('signup');bindAuth('signup')};$('#doLogin')?.addEventListener('click',async()=>{const r=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});if(r.error)toast(r.error.message);else boot()});$('#doSignup')?.addEventListener('click',async()=>{const u=$('#username').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,30}$/.test(u))return toast('Username must be 3–30 letters, numbers or _');const r=await db.auth.signUp({email:$('#email').value.trim().toLowerCase(),password:$('#pass').value,options:{data:{username:u,display_name:$('#name').value.trim()||u}}});if(r.error)toast(r.error.message);else toast(r.data.session?'Account created':'Check your email')})}
async function profile(id){const r=await db.from('profiles').select('*').eq('id',id).maybeSingle();return r.data||{id,username:'user',display_name:'YOCEWOR User',is_verified:false,is_private:false}}
async function upload(file,folder){if(!file)return null;if(file.size>20*1024*1024)throw Error('File must be under 20MB');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'')||'media';const path=me.id+'/'+folder+'/'+Date.now()+'-'+safe;const r=await db.storage.from('yocewor-media').upload(path,file,{upsert:false,cacheControl:'3600'});if(r.error)throw r.error;return db.storage.from('yocewor-media').getPublicUrl(path).data.publicUrl}
async function getPostMeta(ids){const meta={};if(!ids.length)return meta;const [l,c]=await Promise.all([db.from('likes').select('post_id,user_id').in('post_id',ids),db.from('comments').select('post_id').in('post_id',ids)]);(l.data||[]).forEach(x=>{meta[x.post_id]??={likes:0,comments:0,liked:false};meta[x.post_id].likes++;if(x.user_id===me.id)meta[x.post_id].liked=true});(c.data||[]).forEach(x=>{meta[x.post_id]??={likes:0,comments:0,liked:false};meta[x.post_id].comments++});return meta}
async function feed(){const r=await db.from('posts').select('id,user_id,body,image_url,created_at,visibility,engagement_visibility,allow_download').order('created_at',{ascending:false}).range(0,29);if(r.error)return '<div class="card empty">'+esc(r.error.message)+'</div>';const ps=r.data||[],ids=[...new Set(ps.map(x=>x.user_id))],mp={};if(ids.length){const q=await db.from('profiles').select('*').in('id',ids);(q.data||[]).forEach(p=>mp[p.id]=p)}const meta=await getPostMeta(ps.map(p=>p.id));const official=Object.values(mp).find(p=>p.username==='yocewor_official');let html='<div class="stories card"><div class="story" data-view="create"><div class="storyring add">＋</div>'+t('create')+'</div>'+ids.slice(0,12).map(id=>'<div class="story"><div class="storyring">'+av(mp[id])+'</div>'+esc(mp[id]?.username||'user')+'</div>').join('')+'</div>';if(official)html+='<div class="latest"><div class="row"><div class="grow"><b>Welcome to YOCEWOR</b><div class="tiny muted">@yocewor_official'+badge(official)+'</div></div><button class="btn" data-view="reels">See Reels</button></div><div class="tiny muted" style="margin-top:8px">Official updates, safety notices and product news will appear here.</div></div>';html+='<div class="card composer"><div class="row">'+av(meP)+'<div><b>What is on your mind?</b><div class="tiny muted">Share something with your world.</div></div></div><textarea id="body" placeholder="Say something..."></textarea><div class="composebar"><label class="btn file">＋ Photo<input id="photo" type="file" accept="image/*"></label><button class="btn primary" id="postBtn">'+t('post')+'</button></div></div>';html+=(ps.length?ps.map(p=>{const pp=mp[p.user_id]||{},m=meta[p.id]||{likes:0,comments:0,liked:false};return '<article class="card post"><div class="row posthead">'+av(pp)+'<div class="grow"><b>'+esc(pp.display_name||pp.username||'User')+badge(pp)+'</b><div class="tiny muted">@'+esc(pp.username||'user')+' · '+new Date(p.created_at).toLocaleDateString()+'</div></div>'+(p.user_id===me.id?'<button class="icon" title="Delete your post" data-delete-post="'+p.id+'"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="m7 7 1 13h8l1-13"/><path d="M10 11v5M14 11v5"/></svg></button>':'')+'</div>'+(p.body?'<div class="posttext">'+esc(p.body)+'</div>':'')+(p.image_url?'<img class="postimg" loading="lazy" src="'+esc(p.image_url)+'" alt="">':'')+'<div class="postactions"><button class="action like '+(m.liked?'active':'')+'" data-like="'+p.id+'">♥ '+t('like')+' '+m.likes+'</button><button class="action" data-comment="'+p.id+'">○ '+t('comment')+' '+m.comments+'</button><button class="action" data-share="'+p.id+'">↗ '+t('share')+'</button><button class="action" data-save="'+p.id+'">☆ '+t('save')+'</button></div></article>'}).join(''):'<div class="card empty">No posts yet.</div>');return html}
async function createPost(){try{const body=$('#body').value.trim(),file=$('#photo').files[0];if(!body&&!file)return toast('Write something or add a photo');const image=await upload(file,'posts');const r=await db.from('posts').insert({user_id:me.id,body:body||'',image_url:image,visibility:'public',engagement_visibility:'public',allow_download:true});if(r.error)throw r.error;toast('Posted');route('home')}catch(e){toast(e.message)}}
async function comments(id){const r=await db.from('comments').select('*').eq('post_id',id).order('created_at',{ascending:true}).limit(100);if(r.error)return toast('Comments are temporarily unavailable');const cs=r.data||[],ids=[...new Set(cs.map(x=>x.user_id))],mp={};if(ids.length){const q=await db.from('profiles').select('*').in('id',ids);(q.data||[]).forEach(p=>mp[p.id]=p)}$('#modal').innerHTML='<div class="modal"><div class="card modalbox"><div class="row"><h2 class="grow">'+t('comment')+'</h2><button class="icon" id="x">×</button></div><div class="comments">'+(cs.length?cs.map(c=>'<div class="comment">'+av(mp[c.user_id])+'<div class="bubble"><b>'+esc(mp[c.user_id]?.display_name||'User')+badge(mp[c.user_id])+'</b><div>'+esc(c.body)+'</div>'+(c.user_id===me.id?'<button class="btn danger tiny" data-delete-comment="'+c.id+'">Delete</button>':'')+'</div></div>').join(''):'<div class="empty">No comments yet.</div>')+'</div><div class="row"><input id="comment" class="field" placeholder="Write a comment..."><button class="btn primary" id="send">'+t('send')+'</button></div></div></div>';$('#x').onclick=()=>$('#modal').innerHTML='';$('#send').onclick=async()=>{const b=$('#comment').value.trim();if(!b)return;const q=await db.from('comments').insert({post_id:id,user_id:me.id,body:b});if(q.error)toast(q.error.message);else comments(id)};document.querySelectorAll('[data-delete-comment]').forEach(b=>b.onclick=async()=>{const q=await db.from('comments').delete().eq('id',b.dataset.deleteComment).eq('user_id',me.id);if(q.error)toast(q.error.message);else comments(id)})}
async function like(id){const q=await db.from('likes').select('post_id').eq('post_id',id).eq('user_id',me.id).maybeSingle();if(q.error)return toast('Like is temporarily unavailable');const r=q.data?await db.from('likes').delete().eq('post_id',id).eq('user_id',me.id):await db.from('likes').insert({post_id:id,user_id:me.id});if(r.error)toast(r.error.message);else route('home')}
async function deletePost(id){if(!confirm('Delete your post?'))return;const r=await db.from('posts').delete().eq('id',id).eq('user_id',me.id);if(r.error)toast(r.error.message);else{toast('Post deleted');route('home')}}
function bindFeed(){document.querySelectorAll('[data-like]').forEach(x=>x.onclick=()=>like(x.dataset.like));document.querySelectorAll('[data-comment]').forEach(x=>x.onclick=()=>comments(x.dataset.comment));document.querySelectorAll('[data-delete-post]').forEach(x=>x.onclick=()=>deletePost(x.dataset.deletePost));document.querySelectorAll('[data-share]').forEach(x=>x.onclick=async()=>{const u=location.href.split('#')[0]+'#post-'+x.dataset.share;if(navigator.share)await navigator.share({title:'YOCEWOR',url:u});else{try{await navigator.clipboard.writeText(u);toast('Link copied')}catch{toast(u)}}});document.querySelectorAll('[data-save]').forEach(x=>x.onclick=async()=>{const r=await db.from('saved_posts').upsert({user_id:me.id,post_id:x.dataset.save},{onConflict:'user_id,post_id'});toast(r.error?'Save unavailable':'Saved')});$('#postBtn')?.addEventListener('click',createPost)}
async function explore(){return '<div class="card sidecard"><h2>'+t('explore')+'</h2><div class="search"><input id="q" class="field" placeholder="'+t('search')+'"><button class="btn primary" id="searchBtn">'+t('search')+'</button></div><div id="results"></div></div>'}
async function doSearch(){const q=$('#q').value.trim();if(!q)return;const r=await db.from('profiles').select('*').or('username.ilike.%'+q+'%,display_name.ilike.%'+q+'%').limit(30);if(r.error)return toast('Search unavailable');$('#results').innerHTML=(r.data||[]).map(p=>'<div class="result">'+av(p)+'<div class="grow"><b>'+esc(p.display_name||p.username)+badge(p)+'</b><div class="tiny muted">@'+esc(p.username)+'</div></div>'+(p.id!==me.id?'<button class="btn" data-follow="'+p.id+'">Follow</button><button class="btn" data-message-user="'+p.id+'">Message</button>':'')+'</div>').join('')||'<div class="empty">No people found.</div>';document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=async()=>{const r=await db.from('follows').upsert({follower_id:me.id,following_id:b.dataset.follow,status:'accepted'},{onConflict:'follower_id,following_id'});if(!r.error){b.textContent='Following';b.disabled=true}else toast(r.error.message)});document.querySelectorAll('[data-message-user]').forEach(b=>b.onclick=()=>startChat(b.dataset.messageUser))}
async function reels(){const r=await db.from('reels').select('*').order('created_at',{ascending:false}).limit(30);if(r.error)return '<div class="card empty">Reels are temporarily unavailable: '+esc(r.error.message)+'</div>';return '<div class="card sidecard"><div class="row"><div class="grow"><h2>'+t('reels')+'</h2><div class="tiny muted">Official updates + creator reels.</div></div><label class="btn primary file">＋ Upload<input id="reelUpload" type="file" accept="video/*"></label></div></div><div style="height:12px"></div>'+((r.data||[]).map(x=>'<article class="reel">'+(x.media_url?(x.media_url.match(/\.(mp4|webm|mov)(\?|$)/i)?'<video src="'+esc(x.media_url)+'" controls playsinline></video>':'<img src="'+esc(x.media_url)+'" alt="">'):'<div class="reelPoster"><div><div class="bigY">Y</div><h2>YOCEWOR</h2><div class="muted">'+esc(x.caption||'Your Voice. Your World.')+'</div></div></div>')+'<div class="reelcap"><b>YOCEWOR'+(x.user_id===me.id?' Reel':' Official')+'</b><div>'+esc(x.caption||'')+'</div>'+(x.user_id===me.id?'<button class="btn danger tiny" data-delete-reel="'+x.id+'">Delete</button>':'')+'</div></article>').join('')||'<div class="card empty">No reels yet.</div>')}
async function uploadReel(file){try{const url=await upload(file,'reels');const r=await db.from('reels').insert({user_id:me.id,media_url:url,caption:'',visibility:'public',engagement_visibility:'public',allow_download:true});if(r.error)throw r.error;toast('Reel uploaded');route('reels')}catch(e){toast(e.message)}}
async function deleteReel(id){if(!confirm('Delete your reel?'))return;const r=await db.from('reels').delete().eq('id',id).eq('user_id',me.id);if(r.error)toast(r.error.message);else route('reels')}
async function stories(){const r=await db.from('stories').select('*').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(30);if(r.error)return toast('Stories unavailable');const ss=r.data||[],ids=[...new Set(ss.map(s=>s.user_id))],mp={};if(ids.length){const q=await db.from('profiles').select('*').in('id',ids);(q.data||[]).forEach(p=>mp[p.id]=p)}$('#modal').innerHTML='<div class="modal"><div class="card modalbox"><div class="row"><h2 class="grow">Stories</h2><button class="icon" id="x">×</button></div><label class="btn primary file">＋ Add Story<input id="storyFile" type="file" accept="image/*,video/*"></label><div style="margin-top:14px">'+(ss.length?ss.map(s=>'<div class="result"><div class="storyring" style="margin:0">'+av(mp[s.user_id])+'</div><div class="grow"><b>'+esc(mp[s.user_id]?.display_name||'User')+badge(mp[s.user_id])+'</b><div class="tiny muted">'+new Date(s.created_at).toLocaleString()+'</div></div><button class="btn" data-open-story="'+s.id+'">View</button>'+(s.user_id===me.id?'<button class="btn danger" data-delete-story="'+s.id+'">Delete</button>':'')+'</div>').join(''):'<div class="empty">No active stories yet.</div>')+'</div></div></div>';$('#x').onclick=()=>$('#modal').innerHTML='';$('#storyFile').onchange=e=>uploadStory(e.target.files[0]);document.querySelectorAll('[data-delete-story]').forEach(b=>b.onclick=()=>deleteStory(b.dataset.deleteStory));document.querySelectorAll('[data-open-story]').forEach(b=>b.onclick=()=>viewStory(b.dataset.openStory))}
async function uploadStory(file){try{const url=await upload(file,'stories');const type=file.type.startsWith('video/')?'video':'image';const r=await db.from('stories').insert({user_id:me.id,media_url:url,media_type:type,caption:'',expires_at:new Date(Date.now()+86400000).toISOString(),visibility:'public',allow_download:true,engagement_visibility:'public'});if(r.error)throw r.error;toast('Story added');stories()}catch(e){toast(e.message)}}
async function deleteStory(id){if(!confirm('Delete your story?'))return;const r=await db.from('stories').delete().eq('id',id).eq('user_id',me.id);if(r.error)toast(r.error.message);else stories()}
async function viewStory(id){const r=await db.from('stories').select('*').eq('id',id).maybeSingle();if(r.error||!r.data)return;const s=r.data;await db.from('story_views').upsert({story_id:id,viewer_id:me.id},{onConflict:'story_id,viewer_id'});$('#modal').innerHTML='<div class="modal"><div class="card modalbox" style="text-align:center"><button class="icon" id="x" style="float:right">×</button><div style="clear:both"></div>'+(s.media_type==='video'?'<video src="'+esc(s.media_url)+'" controls autoplay playsinline style="max-width:100%;max-height:70vh"></video>':'<img src="'+esc(s.media_url)+'" style="max-width:100%;max-height:70vh;border-radius:14px">')+'<p>'+esc(s.caption||'')+'</p><div class="tiny muted">Story view recorded</div></div></div>';$('#x').onclick=()=>$('#modal').innerHTML=''}
async function messages(){const cm=await db.from('conversation_members').select('conversation_id').eq('user_id',me.id);if(cm.error)return '<div class="card empty">Messages are temporarily unavailable.</div>';const ids=(cm.data||[]).map(x=>x.conversation_id);let conv=[];if(ids.length){const q=await db.from('conversations').select('*').in('id',ids).order('updated_at',{ascending:false});conv=q.data||[]}return '<div class="card sidecard"><h2>'+t('messages')+'</h2><div class="tiny muted">Private conversations.</div>'+ (conv.length?conv.map(c=>'<button class="result" style="width:100%;background:transparent;border:0;color:inherit;text-align:left" data-chat="'+c.id+'"><b>Conversation</b><span class="grow"></span><span class="tiny muted">'+new Date(c.updated_at||Date.now()).toLocaleString()+'</span></button>').join(''):'<div class="empty">Find someone in Explore and tap Message to start a conversation.</div>')+'</div>'}
async function startChat(target){try{const existing=await db.from('conversation_members').select('conversation_id').eq('user_id',me.id);let cid=null;for(const row of existing.data||[]){const q=await db.from('conversation_members').select('user_id').eq('conversation_id',row.conversation_id);const ids=(q.data||[]).map(x=>x.user_id);if(ids.includes(target)&&ids.includes(me.id)&&ids.length===2){cid=row.conversation_id;break}}if(!cid){const c=await db.from('conversations').insert({}).select('id').single();if(c.error)throw c.error;cid=c.data.id;const m=await db.from('conversation_members').insert([{conversation_id:cid,user_id:me.id},{conversation_id:cid,user_id:target}]);if(m.error)throw m.error}openChat(cid)}catch(e){toast(e.message||'Could not start chat')}}
async function openChat(cid){const r=await db.from('messages').select('*').eq('conversation_id',cid).order('created_at',{ascending:true}).limit(100);if(r.error)return toast('Messages unavailable');const msgs=r.data||[];$('#modal').innerHTML='<div class="modal"><div class="card modalbox chat"><div class="row"><b class="grow">'+t('messages')+'</b><button class="icon" id="closeChat">×</button></div><div class="chatbody">'+msgs.map(m=>'<div class="msg '+(m.sender_id===me.id?'mine':'')+'">'+esc(m.body)+'</div>').join('')+'</div><div class="chatbar"><input id="msg" class="field" placeholder="Write a message..."><button class="btn primary" id="sendMsg">'+t('send')+'</button></div></div></div>';$('#closeChat').onclick=()=>$('#modal').innerHTML='';$('#sendMsg').onclick=async()=>{const body=$('#msg').value.trim();if(!body)return;const q=await db.from('messages').insert({conversation_id:cid,sender_id:me.id,body,message_type:'text'});if(q.error)toast(q.error.message);else openChat(cid)}}
async function notifications(){const r=await db.from('notifications').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(50);if(r.error)return '<div class="card empty">Notifications unavailable.</div>';return '<div class="card sidecard"><h2>'+t('notifications')+'</h2>'+((r.data||[]).map(n=>'<div class="result"><img src="yocewor-logo.svg" style="width:40px;height:40px;object-fit:contain"><div class="grow"><b>'+esc(n.title||n.type||'Activity')+'</b><div>'+esc(n.message||'Activity on your account')+'</div><div class="tiny muted">'+new Date(n.created_at).toLocaleString()+'</div></div></div>').join('')||'<div class="empty">You are all caught up.</div>')+'</div>'}
async function profilePage(){const [pc,fo,fi]=await Promise.all([db.from('posts').select('id',{count:'exact',head:true}).eq('user_id',me.id),db.from('follows').select('follower_id',{count:'exact',head:true}).eq('following_id',me.id),db.from('follows').select('following_id',{count:'exact',head:true}).eq('follower_id',me.id)]);return '<div class="card profile"><div class="row">'+av(meP)+'<div class="grow"><h2 style="margin:0">'+esc(meP.display_name)+badge(meP)+'</h2><div class="muted">@'+esc(meP.username)+'</div><p>'+esc(meP.bio||t('welcome'))+'</p></div><button class="btn" id="editProfile">Edit Profile</button></div><div class="stats"><div><strong>'+(pc.count||0)+'</strong><span class="tiny muted">Posts</span></div><div><strong>'+(fo.count||0)+'</strong><span class="tiny muted">Followers</span></div><div><strong>'+(fi.count||0)+'</strong><span class="tiny muted">Following</span></div></div><div class="latest" style="margin-top:18px"><b>Account controls</b><div class="tiny muted" style="margin-top:5px">Privacy, blocking, downloads and engagement visibility are managed in Settings.</div><button class="btn primary" style="margin-top:10px" data-view="settings">Open Settings</button></div></div>'}
function editProfile(){ $('#modal').innerHTML='<div class="modal"><div class="card modalbox"><div class="row"><h2 class="grow">Edit Profile</h2><button class="icon" id="x">×</button></div><input id="epName" class="field" value="'+esc(meP.display_name||'')+'"><input id="epUser" class="field" value="'+esc(meP.username||'')+'"><textarea id="epBio" class="field" style="min-height:120px">'+esc(meP.bio||'')+'</textarea><button class="btn primary" id="epSave">Save</button></div></div>';$('#x').onclick=()=>$('#modal').innerHTML='';$('#epSave').onclick=async()=>{const u=$('#epUser').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,30}$/.test(u))return toast('Username must be 3–30 letters, numbers or _');const r=await db.from('profiles').update({display_name:$('#epName').value.trim(),username:u,bio:$('#epBio').value.trim()}).eq('id',me.id);if(r.error)toast(r.error.message);else{meP=await profile(me.id);$('#modal').innerHTML='';route('profile')}}}
async function settings(){const s=await db.from('user_settings').select('*').eq('user_id',me.id).maybeSingle();const us=s.data||{is_private:false,notifications_enabled:true};return '<div class="card sidecard"><h2>'+t('settings')+'</h2><div class="setting"><div><b>'+t('language')+'</b><div class="tiny muted">Choose the language for YOCEWOR controls.</div></div>'+languageSelect()+'</div><div class="setting"><div><b>Private account</b><div class="tiny muted">Only approved followers can see private content.</div></div><button class="switch '+(us.is_private?'on':'')+'" id="private"><i></i></button></div><div class="setting"><div><b>Notifications</b><div class="tiny muted">Likes, comments and follows.</div></div><button class="switch '+(us.notifications_enabled!==false?'on':'')+'" id="notif"><i></i></button></div><div class="setting"><div><b>Download your posts/reels</b><div class="tiny muted">You control whether each public post or reel can be downloaded.</div></div><span class="tiny muted">Per item</span></div><div class="setting"><div><b>Who can see likes/comments</b><div class="tiny muted">Public, followers/following, or private — choose per post/reel.</div></div><span class="tiny muted">Per item</span></div><div class="setting"><div><b>Close Friends Stories</b><div class="tiny muted">Stories can be limited to selected people.</div></div><button class="btn" id="closeFriends">Manage</button></div><div class="setting"><div><b>Blocked users</b><div class="tiny muted">Manage accounts you have blocked.</div></div><button class="btn" id="blocked">Manage</button></div><h3>'+t('appearance')+'</h3><div class="themegrid">'+Object.entries(themes).map(([k,v])=>'<button class="theme" data-theme="'+k+'"><i style="--x:'+v[0]+';--y:'+v[1]+';--z:'+v[2]+'"></i>'+k+'</button>').join('')+'</div><div class="latest" style="margin-top:16px"><b>Latest update</b><div class="tiny muted" style="margin:6px 0 10px">Stable testing build • 10 Aug 2026</div><div class="copyrow"><code id="latestCode2">YOCEWOR v3.0 • stable UI • settings • privacy • stories • reels • messages</code><button class="btn" id="copyLatest2">Copy</button></div></div><div class="setting"><b>'+t('logout')+'</b><button class="btn danger" id="logout">'+t('logout')+'</button></div></div>'}
async function loadSettings(){const pb=$('#private'),nb=$('#notif');pb.onclick=async()=>{const on=!pb.classList.contains('on');pb.classList.toggle('on');const r=await db.from('user_settings').upsert({user_id:me.id,is_private:on},{onConflict:'user_id'});if(r.error)toast(r.error.message);else{meP.is_private=on;toast(on?'Private account enabled':'Private account disabled')}};nb.onclick=async()=>{const on=!nb.classList.contains('on');nb.classList.toggle('on');const r=await db.from('user_settings').upsert({user_id:me.id,notifications_enabled:on},{onConflict:'user_id'});if(r.error)toast(r.error.message)};$('#language').onchange=e=>{lang=e.target.value;localStorage.yLang=lang;boot()};$('#logout').onclick=logout;$('#copyLatest2').onclick=()=>copyText($('#latestCode2').textContent);$('#closeFriends').onclick=manageCloseFriends;$('#blocked').onclick=manageBlocked}
async function manageCloseFriends(){const r=await db.from('close_friends').select('friend_id').eq('user_id',me.id);if(r.error)return toast('Close Friends unavailable');toast('Close Friends manager is connected. Add people from Explore in the next screen.')}
async function manageBlocked(){const r=await db.from('blocks').select('blocked_id').eq('blocker_id',me.id);if(r.error)return toast('Blocked users unavailable');toast((r.data||[]).length+' blocked account(s)')}
async function copyText(x){try{await navigator.clipboard.writeText(x);toast('Copied')}catch{toast('Copy is unavailable on this browser')}}
function help(){return '<div class="card sidecard"><h2>'+t('help')+'</h2><p class="muted">Help for login, posts, profiles, messages, privacy and safety.</p><div class="setting"><div><b>YOCEWOR AI Support</b><div class="tiny muted">Guided support inside the app.</div></div><button class="btn primary" id="aiHelp">Start chat</button></div><div class="setting"><div><b>Community Guidelines</b><div class="tiny muted">Respectful use, anti-spam, anti-fraud and safety rules.</div></div><button class="btn" id="guidelines">Read</button></div><div class="setting"><div><b>Report a problem</b><div class="tiny muted">Create a support ticket.</div></div><button class="btn" id="ticket">Create ticket</button></div></div>'}
async function guidelines(){const r=await db.from('community_guidelines_versions').select('*').order('effective_at',{ascending:false}).limit(1);const g=r.data?.[0];$('#modal').innerHTML='<div class="modal"><div class="card modalbox"><div class="row"><h2 class="grow">YOCEWOR Community Guidelines</h2><button class="icon" id="x">×</button></div><div class="muted">'+esc(g?.version||'v1.0')+'</div><p>Use YOCEWOR lawfully and respectfully. No impersonation, scams, fake engagement, harassment, threats, hate, sexual exploitation, child abuse material, non-consensual intimate content, dangerous illegal activity, or coordinated manipulation. Do not bypass security or abuse bugs. Repeated or serious violations can lead to warnings, content removal, feature limits or account suspension/ban, subject to review and applicable Indian law.</p><p class="tiny muted">This is platform policy text, not legal advice. YOCEWOR will update it as required by applicable law and platform safety needs.</p></div></div>';$('#x').onclick=()=>$('#modal').innerHTML=''}
function aiHelp(){const qs=['I cannot login','My post is not uploading','My account has a problem','I want to report abuse'];$('#modal').innerHTML='<div class="modal"><div class="card modalbox"><div class="row"><b class="grow">YOCEWOR AI Support</b><button class="icon" id="x">×</button></div><div class="comments" style="margin-top:12px"><div class="comment"><div class="bubble"><b>YOCEWOR Support</b><div>Tell me what happened. I can guide you through the app.</div></div></div>'+qs.map(q=>'<button class="btn" style="margin:5px" data-q="'+esc(q)+'">'+esc(q)+'</button>').join('')+'</div></div></div>';$('#x').onclick=()=>$('#modal').innerHTML='';document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>toast('Guidance: refresh once, check your connection, then retry. For account or safety issues, create a support ticket.'))}
async function ticket(){const s=prompt('Describe the problem');if(!s)return;const r=await db.from('support_tickets').insert({user_id:me.id,subject:s.slice(0,120),category:'app',status:'open'});toast(r.error?'Could not create ticket':'Support ticket created')}
async function route(v){view=v;$('#bottom').innerHTML=bottomHtml();const p=$('#page');if(v==='home'||v==='create'){p.innerHTML=await feed();bindFeed();if(v==='create')$('#body')?.focus();return}if(v==='explore'){p.innerHTML=await explore();$('#searchBtn').onclick=doSearch;return}if(v==='reels'){p.innerHTML=await reels();$('#reelUpload')?.addEventListener('change',e=>uploadReel(e.target.files[0]));document.querySelectorAll('[data-delete-reel]').forEach(b=>b.onclick=()=>deleteReel(b.dataset.deleteReel));return}if(v==='messages'){p.innerHTML=await messages();document.querySelectorAll('[data-chat]').forEach(x=>x.onclick=()=>openChat(x.dataset.chat));return}if(v==='notifications'){p.innerHTML=await notifications();return}if(v==='profile'){p.innerHTML=await profilePage();$('#editProfile').onclick=editProfile;return}if(v==='settings'){p.innerHTML=await settings();await loadSettings();return}if(v==='help'){p.innerHTML=help();$('#aiHelp').onclick=aiHelp;$('#ticket').onclick=ticket;$('#guidelines').onclick=guidelines;return}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-view]');if(n)route(n.dataset.view);const th=e.target.closest('[data-theme]');if(th){setTheme(th.dataset.theme);toast('Theme changed')}if(e.target.closest('#copyLatest'))copyText($('#latestCode')?.textContent||'')});
async function logout(){await db.auth.signOut();boot()}
async function boot(){try{const s=await db.auth.getSession();me=s.data.session?.user||null;document.documentElement.lang=lang;if(!me){$('#topActions').innerHTML=languageSelect();$('#bottom').innerHTML='';root.innerHTML=landing();$('#language').onchange=e=>{lang=e.target.value;localStorage.yLang=lang;boot()};$('#signup').onclick=()=>{root.innerHTML=auth('signup');bindAuth('signup')};$('#login').onclick=()=>{root.innerHTML=auth('login');bindAuth('login')};return}meP=await profile(me.id);$('#topActions').innerHTML=languageSelect()+av(meP)+'<button class="icon" id="settingsTop" aria-label="Settings">'+icons.settings+'</button><button class="icon" id="logoutTop" aria-label="'+t('logout')+'">↪</button>';$('#language').onchange=e=>{lang=e.target.value;localStorage.yLang=lang;boot()};$('#settingsTop').onclick=()=>route('settings');$('#logoutTop').onclick=logout;root.innerHTML=shell();$('#copyLatest').onclick=()=>copyText($('#latestCode')?.textContent||'');await route('home')}catch(e){console.error(e);root.innerHTML='<div class="wrap" style="padding:40px"><div class="card sidecard"><h2>YOCEWOR could not load</h2><p class="muted">'+esc(e.message||e)+'</p><button class="btn primary" onclick="location.reload()">Reload</button></div></div>'}}
$('#brand').innerHTML=logoBrand();$('#brand').onclick=e=>{e.preventDefault();if(me)route('home')};setTimeout(()=>$('#splash').classList.add('hide'),1800);setTimeout(()=>$('#splash').remove(),2400);boot();
</script>
</body>
</html>
