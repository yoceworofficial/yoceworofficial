<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Change Password</title><style>body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#eef2f6;color:#17212b}.wrap{max-width:520px;width:92%;margin:40px auto}.top{background:#073b72;color:#fff;padding:20px;text-align:center;border-bottom:4px solid #f58220}.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 18px #0001}label{display:block;font-weight:700;margin-top:14px}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 4px;border:1px solid #cbd5df;border-radius:8px}button{width:100%;padding:12px;margin-top:16px;border:0;border-radius:8px;background:#073b72;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:12px;font-weight:700;min-height:22px}.note{font-size:13px;line-height:1.6;color:#65727e}</style></head><body><header class="top"><b>YOCEWOR TEAM</b><div>Secure Password</div></header><main class="wrap"><section class="card"><h2>🔐 Password Change</h2><p class="note">पहली login पर नया password set करें। / Set a new password after your first login or password reset.</p><label for="p1">New Password</label><input id="p1" type="password" autocomplete="new-password" minlength="8" placeholder="Minimum 8 characters"><label for="p2">Confirm Password</label><input id="p2" type="password" autocomplete="new-password" minlength="8" placeholder="Confirm new password"><button id="save">Save New Password</button><div id="msg" class="msg"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn');const $=id=>document.getElementById(id);const next=new URLSearchParams(location.search).get('next')||'/';const {data:{session}}=await db.auth.getSession();if(!session){$('msg').textContent='Session नहीं मिला। Login फिर से करें। / No active session. Please login again.';$('save').disabled=true;return}$('save').onclick=async()=>{const p1=$('p1').value,p2=$('p2').value;if(p1.length<8){$('msg').textContent='Password कम से कम 8 characters का होना चाहिए।';return}if(p1!==p2){$('msg').textContent='दोनों passwords match नहीं करते।';return}$('save').disabled=true;$('msg').textContent='Saving...';const r=await db.auth.updateUser({password:p1,data:{must_change_password:false}});if(r.error){$('msg').textContent=r.error.message;$('save').disabled=false;return}$('msg').textContent='Password updated successfully. / Password सफलतापूर्वक बदल गया।';setTimeout(()=>location.href=next,700)}})();</script></body></html>
