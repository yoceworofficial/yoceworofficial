/[<>]/g,'')+'</span><button onclick="location.href=\'index.html?retry=1\'">Back to YOCEWOR</button></div>'};try{if(!window.supabase)throw new Error('Authentication service unavailable');const sb=window.supabase.createClient(U,K),s=await sb.auth.getSession();if(s.error)throw s.error;if(!s.data.session){location.replace('index.html');return}const r=await fetch('app-v4.html?v=20260810-12&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('App file could not be loaded ('+r.status+')');let html=await r.text();if(!html||html.length<10000)throw new Error('App file is incomplete');html=html.replace(/throw\s+new\s+Error\(\s*[\"']Auth block not found[\"']\s*\)/g,"console.warn('YOCEWOR: legacy auth-block guard skipped')");html=html.replace(/throw\s+new\s+Error\(\s*[\"']Auth block not found[\"']\s*\)/g,"console.warn('YOCEWOR: legacy auth-block guard skipped')");const addon=`<script>(function(){const U='${U}',K='${K}',sb2=window.supabase.createClient(U,K);function css(){document.body.insertAdjacentHTML('beforeend','<button class="yw-photo-btn" id="ywPhotoBtn">📷 Profile photo</button><input id="ywPhotoFile" type="file" accept="image/jpeg,image/png,image/webp" style="display:none">');}async function me(){const {data:{user}}=await sb2.auth.getUser();return user}async function upload(){const f=document.getElementById('ywPhotoFile');f.click();f.onchange=async()=>{const file=f.files&&f.files[0];if(!file)return;if(file.size>5*1024*1024){alert('Profile photo 5MB से छोटी रखें.');return}const u=await me();if(!u)return;const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=u.id+'/avatar-'+Date.now()+'.'+(ext||'jpg');const r=await sb2.storage.from('yocewor-media').upload(path,file,{upsert:true,cacheControl:'3600'});if(r.error){alert('Photo upload failed: '+r.error.message);return}const pub=sb2.storage.from('yocewor-media').getPublicUrl(path).data.publicUrl;const p=await sb2.from('profiles').update({avatar_url:pub,updated_at:new Date().toISOString()}).eq('id',u.id);if(p.error){alert('Profile update failed: '+p.error.message);return}alert('Profile photo updated.');location.reload();};}function viewer(src){if(!src)return;const m=document.createElement('div');m.className='yw-photo-modal';m.innerHTML='<div><img class="yw-viewer-img" src="'+src.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"><div class="yw-note">Profile photo viewing only • download/long-press disabled where browser allows</div></div>';m.onclick=()=>m.remove();m.oncontextmenu=e=>e.preventDefault();document.body.appendChild(m)}function wire(){css();document.getElementById('ywPhotoBtn').onclick=upload;document.querySelectorAll('.avatar img').forEach(i=>{i.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();viewer(i.currentSrc||i.src)})});document.addEventListener('contextmenu',e=>{if(e.target.closest('.avatar img,.yw-viewer-img'))e.preventDefault()});document.addEventListener('dragstart',e=>{if(e.target.closest('.avatar img,.yw-viewer-img'))e.preventDefault()});}setTimeout(wire,1200);new MutationObserver(()=>{document.querySelectorAll('.avatar img:not([data-yw-wired])').forEach(i=>{i.dataset.ywWired='1';i.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();viewer(i.currentSrc||i.src)})})}).observe(document.documentElement,{subtree:true,childList:true});})();<\/script>`;html=html.replace('</body>',addon+'</body>');document.open();document.write(html);document.close()}catch(e){fail(e)}})();</script></body></html>
