<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>YOCEWOR</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="site-header"><div class="site-wrap header-inner"><a class="site-title" href="/">YOCEWOR</a><nav aria-label="Primary navigation"><a href="/">Home</a><a href="/category.html?category=latest-jobs">Latest Jobs</a><a href="/category.html?category=admit-card">Admit Card</a><a href="/category.html?category=answer-key">Answer Key</a><a href="/category.html?category=result">Result</a></nav></div></header>
<main class="site-wrap" style="max-width:860px;margin-top:18px"><p><a href="/">Home</a> &gt; Category</p><h1 id="heading">Updates</h1><div id="list" class="list-box"><div class="post-list"><p class="muted">Loading...</p></div></div></main>
<footer class="site-footer"><div class="site-wrap footer-inner"><div>© <span id="year"></span> YOCEWOR</div><div class="footer-links"><a href="/about.html">About</a><a href="/contact.html">Contact</a><a href="/privacy-policy.html">Privacy Policy</a><a href="/disclaimer.html">Disclaimer</a><a href="/terms.html">Terms & Conditions</a></div></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script>
(async()=>{const c=supabase.createClient(YOCEWOR_CONFIG.supabaseUrl,YOCEWOR_CONFIG.supabasePublishableKey),slug=new URLSearchParams(location.search).get("category")||"latest-jobs",names={"latest-jobs":"Latest Jobs","admit-card":"Admit Card","answer-key":"Answer Key","result":"Result","exam-date":"Exam Date","latest-news":"Latest News","sarkari-yojana":"Sarkari Yojana"};document.getElementById("heading").textContent=names[slug]||"Updates";document.title=(names[slug]||"Updates")+" — YOCEWOR";document.getElementById("year").textContent=new Date().getFullYear();const box=document.querySelector("#list .post-list");const {data:cat,error:ce}=await c.from("categories").select("id,name").eq("slug",slug).eq("is_active",true).maybeSingle();if(ce||!cat){box.innerHTML="<p>Category not found.</p>";return}const {data,error}=await c.from("posts").select("title,slug,excerpt,published_at").eq("category_id",cat.id).eq("status","published").order("published_at",{ascending:false});if(error){console.error(error);box.innerHTML="<p>Updates could not be loaded right now.</p>";return}box.innerHTML=(data||[]).map(p=>"<p class='post-item'><a href='/post.html?slug="+encodeURIComponent(p.slug)+"'>"+esc(p.title)+"</a>"+(p.excerpt?"<br><span class='muted'>"+esc(p.excerpt)+"</span>":"")+"</p>").join("")||"<p class='muted'>अभी कोई प्रकाशित अपडेट उपलब्ध नहीं है।</p>";function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}})();
</script></body></html>
