<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#073b72"><title>Job Details | YOCEWOR</title><link rel="icon" href="favicon.svg"><style>:root{--b:#073b72;--b2:#0b4f91;--o:#f58220;--g:#16844b;--bg:#f3f6f9;--line:#d7dee6;--muted:#596773}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17202a;font-family:Arial,"Noto Sans Devanagari",sans-serif}.wrap{width:min(1000px,94%);margin:auto}.gov{background:#f7f7f7;border-bottom:1px solid #ddd;color:#53606c;font-size:12px;padding:8px 0}.head{background:#fff;border-bottom:4px solid var(--o)}.headin{height:78px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--b)}.seal{width:52px;height:52px;border:2px solid var(--b);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:23px}.brand b{font-size:25px}.brand small{display:block;color:var(--muted);margin-top:3px}.nav{background:var(--b)}.nav a{display:inline-block;color:#fff;text-decoration:none;padding:12px 15px;font-size:13px;font-weight:700;border-right:1px solid #fff2}.nav a:hover{background:var(--b2)}.main{padding:22px 0}.crumb{font-size:12px;color:#607080;margin-bottom:10px}.title{background:#fff;border:1px solid var(--line);border-top:4px solid var(--b);padding:22px}.tag{display:inline-block;background:#edf3f8;color:var(--b);font-size:10px;font-weight:800;padding:5px 7px}.title h1{font-size:clamp(26px,4vw,42px);line-height:1.2;color:#17324d;margin:12px 0 6px}.muted{color:var(--muted);line-height:1.65}.card{background:#fff;border:1px solid var(--line);padding:18px;margin-top:12px}.card h2{font-size:18px;color:var(--b);border-bottom:1px solid var(--line);padding-bottom:9px;margin-top:0}.facts{display:grid;grid-template-columns:repeat(3,1fr)}.fact{padding:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.fact b{display:block;color:#354452;margin-bottom:4px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.buttons a{padding:13px;text-align:center;border:1px solid var(--line);background:#f5f7fa;color:#344454;text-decoration:none;font-size:12px;font-weight:800}.buttons .apply{background:var(--g);color:#fff;border-color:var(--g)}.buttons .official{background:var(--b);color:#fff;border-color:var(--b)}.buttons .video{background:#fff7f4;color:#a33b17}.copy{width:100%;margin-top:9px;padding:12px;border:1px dashed #9fb8d1;background:#f5f8fb;color:var(--b);font-weight:800;cursor:pointer}.note{margin-top:12px;background:#fff8e8;border:1px solid #edd49a;padding:12px;color:#725116;font-size:11px;line-height:1.5}.footer{margin-top:30px;background:#17324d;color:#dce5ec;padding:25px 0;font-size:12px}@media(max-width:700px){.facts,.buttons{grid-template-columns:1fr}.fact{border-right:0}.headin{height:68px}.brand b{font-size:21px}.seal{width:45px;height:45px}.nav a{padding:11px 9px}}
</style></head><body><div class="gov"><div class="wrap">YOCEWOR एक निजी सूचना पोर्टल है • आवेदन से पहले Official Notification सत्यापित करें</div></div><header class="head"><div class="wrap headin"><a class="brand" href="index.html"><span class="seal">Y</span><span><b>YOCEWOR</b><small>Recruitment • Admit Card • Result • Forms</small></span></a></div></header><nav class="nav"><div class="wrap"><a href="index.html">⌂ होम</a><a href="updates.html">नई भर्ती</a><a href="updates.html?type=admit">Admit Card</a><a href="updates.html?type=result">Result</a><a href="updates.html?type=form">Online Forms</a></div></nav><main class="wrap main" id="app"><div class="crumb">Home › Recruitment › Details</div><p class="muted">Loading...</p></main><footer class="footer"><div class="wrap">YOCEWOR — भर्ती, Admit Card, Result और Online Forms की जानकारी एक जगह।</div></footer><script>const id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=u=>{try{return new URL(u).href}catch{return ''}};const btn=(u,l,c='')=>(u=safe(u))?'<a class="'+c+'" target="_blank" rel="noopener" href="'+esc(u)+'">'+l+' ↗</a>':'';fetch('jobs.json').then(r=>r.json()).then(d=>{const x=(d.jobs||[]).find(j=>j.id===id);if(!x){app.innerHTML='<div class="card"><h2>जानकारी उपलब्ध नहीं है</h2><p class="muted">यह vacancy अभी उपलब्ध नहीं है।</p></div>';return}document.title=x.title+' | YOCEWOR';const desc=x.description||x.summary||'';app.innerHTML='<div class="crumb"><a href="index.html">Home</a> › <a href="updates.html">Updates</a> › Details</div><section class="title"><span class="tag">'+esc((x.type||'JOB').toUpperCase())+'</span><h1>'+esc(x.title)+'</h1><p class="muted">'+esc(x.department||'')+'</p></section><section class="card"><h2>📋 महत्वपूर्ण जानकारी</h2><div class="facts"><div class="fact"><b>कुल पद</b>'+esc(x.vacancies||'Official Notification')+'</div><div class="fact"><b>योग्यता</b>'+esc(x.qualification||'Official Notification')+'</div><div class="fact"><b>आयु सीमा</b>'+esc(x.age||'Official Notification')+'</div><div class="fact"><b>अंतिम तिथि</b>'+esc(x.lastDate||'Official Notification')+'</div><div class="fact"><b>वेतन</b>'+esc(x.salary||'Official Notification')+'</div><div class="fact"><b>स्थान</b>'+esc(x.location||'All India')+'</div></div></section><section class="card"><h2>📖 भर्ती की पूरी जानकारी</h2><p class="muted">'+esc(desc).replace(/\n/g,'<br>')+'</p></section><section class="card"><h2>🔗 महत्वपूर्ण Direct Links</h2><div class="buttons">'+btn(x.applyUrl,'Direct Apply','apply')+btn(x.notificationUrl||x.officialUrl,'Official Notification','official')+btn(x.admitUrl,'Admit Card')+btn(x.resultUrl,'Result')+btn(x.videoUrl,'Form कैसे भरें','video')+'</div><button id="copy" class="copy">📋 WhatsApp/Telegram के लिए जानकारी Copy करें</button></section><div class="note">⚠️ <b>महत्वपूर्ण:</b> YOCEWOR सरकारी विभाग की official website नहीं है। आवेदन करने से पहले संबंधित विभाग की official notification और website से सभी विवरण सत्यापित करें।</div>';const share='🔥 '+x.title+'\n\nयोग्यता: '+(x.qualification||'Official Notice देखें')+'\nअंतिम तिथि: '+(x.lastDate||'Official Notice देखें')+'\nकुल पद: '+(x.vacancies||'—')+'\n\nDirect Apply: '+(x.applyUrl||'')+'\nOfficial Notification: '+(x.notificationUrl||x.officialUrl||'')+'\nAdmit Card: '+(x.admitUrl||'')+'\nResult: '+(x.resultUrl||'')+'\nForm कैसे भरें: '+(x.videoUrl||'')+'\n\nYOCEWOR: '+location.href;copy.onclick=async()=>{try{await navigator.clipboard.writeText(share);copy.textContent='✅ जानकारी Copy हो गई';setTimeout(()=>copy.textContent='📋 WhatsApp/Telegram के लिए जानकारी Copy करें',1600)}catch(e){prompt('Copy:',share)}};const schema={"@context":"https://schema.org","@type":"JobPosting","title":x.title,"description":desc,"datePosted":x.datePosted,"validThrough":x.validThrough,"employmentType":x.employmentType||'FULL_TIME',"hiringOrganization":{"@type":"Organization","name":x.department||'See official notification'},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"IN","addressLocality":x.location||'India'}},"directApply":!!x.applyUrl};const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(schema);document.head.appendChild(s)}).catch(()=>app.innerHTML='<div class="card"><h2>Data load नहीं हुआ</h2><p class="muted">jobs.json उपलब्ध नहीं है।</p></div>');</script></body></html>
