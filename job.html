<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101f"><title>Job Details — YOCEWOR</title><meta name="description" content="YOCEWOR job details, eligibility, important dates and official application links."><style>:root{--bg:#07101f;--card:#0d1a2c;--line:#263a57;--text:#f8fbff;--muted:#a9b7ca;--a:#22d3ee;--b:#3b82f6;--g:#34d399}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#102c4d,#07101f 45%,#050b14);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{width:min(920px,92%);margin:auto}.nav{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:950;color:white;text-decoration:none}.brand span{color:var(--a)}.back{color:#b9d9ff;text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:11px}.hero{padding:45px 0 20px}.tag{display:inline-block;color:#8eeaff;background:#102b47;border:1px solid #1f496d;padding:6px 9px;border-radius:8px;font-size:11px;font-weight:900}.hero h1{font-size:clamp(31px,5vw,52px);line-height:1.08;letter-spacing:-1.5px;margin:14px 0 8px}.muted{color:var(--muted);line-height:1.65}.card{background:linear-gradient(145deg,#0e1b2e,#091525);border:1px solid var(--line);border-radius:20px;padding:20px;margin:15px 0}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fact{background:#0a1423;border:1px solid #1b2c43;border-radius:11px;padding:12px}.fact b{display:block;color:#fff;margin-bottom:4px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.buttons a{padding:13px;text-align:center;border-radius:11px;border:1px solid var(--line);background:#0b1c30;color:#dff7ff;text-decoration:none;font-weight:900}.buttons .apply{background:linear-gradient(135deg,var(--b),var(--a));border:0;color:white}.buttons .video{color:#ffbaba;border-color:#673737}.note{padding:14px;border:1px solid #5b491e;background:#211b0b;color:#f8d77d;border-radius:13px;font-size:13px;line-height:1.55}.copy{width:100%;padding:12px;border:1px dashed #2b5074;background:#0b1727;color:#8eeaff;border-radius:11px;font-weight:900;cursor:pointer}@media(max-width:650px){.facts,.buttons{grid-template-columns:1fr}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">Y<span>O</span>CEWOR</a><a class="back" href="updates.html">← सभी Updates</a></div></header><main class="wrap" id="app"><p class="muted">Loading...</p></main><script>const id=new URLSearchParams(location.search).get('id');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safeUrl(u){try{return new URL(u).href}catch{return ''}}function btn(u,label,cls=''){u=safeUrl(u);return u?'<a class="'+cls+'" target="_blank" rel="noopener" href="'+esc(u)+'">'+label+' ↗</a>':''}fetch('jobs.json').then(r=>r.json()).then(d=>{const x=(d.jobs||[]).find(j=>j.id===id);if(!x){document.getElementById('app').innerHTML='<div class="card"><h1>Job नहीं मिली</h1><p class="muted">यह vacancy हटाई जा चुकी है या link गलत है।</p><a class="back" href="updates.html">← Updates पर जाएँ</a></div>';return}document.title=x.title+' — YOCEWOR';const desc=x.description||x.summary||'';document.getElementById('app').innerHTML='<section class="hero"><span class="tag">'+esc((x.type||'JOB').toUpperCase())+'</span><h1>'+esc(x.title)+'</h1><p class="muted">'+esc(x.department||'')+'</p></section><section class="card"><h2>📋 महत्वपूर्ण जानकारी</h2><div class="facts"><div class="fact"><b>योग्यता</b>'+esc(x.qualification)+'</div><div class="fact"><b>आयु सीमा</b>'+esc(x.age||'Official notification देखें')+'</div><div class="fact"><b>अंतिम तारीख</b>'+esc(x.lastDate||'Official notification देखें')+'</div><div class="fact"><b>स्थान</b>'+esc(x.location||'All India')+'</div><div class="fact"><b>वेतन</b>'+esc(x.salary||'Official notification देखें')+'</div><div class="fact"><b>पद / Vacancies</b>'+esc(x.vacancies||'Official notification देखें')+'</div></div></section><section class="card"><h2>📖 भर्ती की पूरी जानकारी</h2><p class="muted">'+esc(desc).replace(/\n/g,'<br>')+'</p></section><section class="card"><h2>🔗 Direct Links</h2><div class="buttons">'+btn(x.applyUrl,'Direct Apply','apply')+btn(x.notificationUrl||x.officialUrl,'Official Notification')+btn(x.admitUrl,'Admit Card')+btn(x.resultUrl,'Result')+btn(x.videoUrl,'Form कैसे भरें','video')+'</div><button id="copy" class="copy">📲 WhatsApp/Telegram पोस्ट Copy करें</button></section><div class="note">⚠️ YOCEWOR सरकारी विभाग की official website नहीं है। अंतिम तारीख, eligibility, fee और आवेदन से पहले official notification जरूर verify करें।</div>';const share='📢 '+x.title+'\n\nयोग्यता: '+(x.qualification||'Official notice देखें')+'\nअंतिम तारीख: '+(x.lastDate||'Check official notice')+'\n\nDirect Apply: '+(x.applyUrl||'')+'\nOfficial Notification: '+(x.notificationUrl||x.officialUrl||'')+'\nAdmit Card: '+(x.admitUrl||'')+'\nResult: '+(x.resultUrl||'')+'\nForm कैसे भरें: '+(x.videoUrl||'')+'\n\nYOCEWOR: '+location.href;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(share);document.getElementById('copy').textContent='✅ Copy हो गया';setTimeout(()=>document.getElementById('copy').textContent='📲 WhatsApp/Telegram पोस्ट Copy करें',1600)}catch(e){prompt('Copy:',share)}};const schema={"@context":"https://schema.org","@type":"JobPosting","title":x.title,"description":desc,"datePosted":x.datePosted,"validThrough":x.validThrough,"employmentType":x.employmentType||'FULL_TIME',"hiringOrganization":{"@type":"Organization","name":x.department||'See official notification'},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"IN","addressLocality":x.location||'India'}},"directApply":!!x.applyUrl};const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(schema);document.head.appendChild(s)}).catch(()=>document.getElementById('app').innerHTML='<div class="card"><h1>Data load नहीं हुआ</h1><p class="muted">jobs.json उपलब्ध नहीं है।</p></div>');</script></body></html>
