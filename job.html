<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9fc"><title>Job Details — YOCEWOR</title><meta name="description" content="YOCEWOR job details, eligibility, important dates and official links."><link rel="icon" href="favicon.svg"><style>:root{--bg:#f7f9fc;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--blue:#155eef;--red:#d92d20;--shadow:0 14px 40px #1018280d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.wrap{width:min(920px,92%);margin:auto}.top{background:#fff;border-bottom:1px solid var(--line)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;color:var(--ink);text-decoration:none;font-size:23px;font-weight:950}.logo{width:37px;height:37px;border-radius:11px;background:linear-gradient(135deg,#155eef,#7f56d9);color:#fff;display:grid;place-items:center}.back{color:#344054;text-decoration:none;border:1px solid var(--line);padding:9px 12px;border-radius:10px;font-weight:800}.hero{padding:45px 0 20px}.tag{display:inline-block;color:var(--blue);background:#eef4ff;border-radius:7px;padding:6px 9px;font-size:10px;font-weight:950}.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.06;letter-spacing:-2px;margin:14px 0 8px}.muted{color:var(--muted);line-height:1.65}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:var(--shadow)}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.fact{background:#f8fafc;border-radius:11px;padding:12px;color:var(--muted);font-size:12px}.fact b{display:block;color:#344054;margin-bottom:4px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.buttons a{padding:13px;text-align:center;border-radius:11px;border:1px solid var(--line);background:#f8fafc;color:#344054;text-decoration:none;font-weight:900;font-size:13px}.buttons .apply{background:var(--blue);border-color:var(--blue);color:#fff}.buttons .video{color:#b42318;background:#fff5f4;border-color:#fecdca}.copy{width:100%;padding:12px;border:1px dashed #b2ccff;background:#f5f8ff;color:var(--blue);border-radius:11px;font-weight:900;cursor:pointer;margin-top:9px}.note{padding:14px;background:#fffaeb;border:1px solid #fedf89;color:#93370d;border-radius:13px;font-size:12px;line-height:1.55}@media(max-width:650px){.facts,.buttons{grid-template-columns:1fr}.hero h1{letter-spacing:-1px}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html"><span class="logo">Y</span>YOCEWOR</a><a class="back" href="updates.html">← Updates</a></div></header><main class="wrap" id="app"><p class="muted">Loading...</p></main><script>const id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=u=>{try{return new URL(u).href}catch{return ''}},btn=(u,l,c='')=>(u=safe(u))?'<a class="'+c+'" target="_blank" rel="noopener" href="'+esc(u)+'">'+l+' ↗</a>':'';fetch('jobs.json').then(r=>r.json()).then(d=>{const x=(d.jobs||[]).find(j=>j.id===id);if(!x){app.innerHTML='<div class="card"><h1>Job नहीं मिली</h1><p class="muted">यह vacancy उपलब्ध नहीं है।</p></div>';return}document.title=x.title+' — YOCEWOR';const desc=x.description||x.summary||'';app.innerHTML='<section class="hero"><span class="tag">'+esc((x.type||'JOB').toUpperCase())+'</span><h1>'+esc(x.title)+'</h1><p class="muted">'+esc(x.department||'')+'</p></section><section class="card"><h2>📋 महत्वपूर्ण जानकारी</h2><div class="facts"><div class="fact"><b>योग्यता</b>'+esc(x.qualification||'Official notification देखें')+'</div><div class="fact"><b>आयु सीमा</b>'+esc(x.age||'Official notification देखें')+'</div><div class="fact"><b>अंतिम तारीख</b>'+esc(x.lastDate||'Official notification देखें')+'</div><div class="fact"><b>स्थान</b>'+esc(x.location||'All India')+'</div><div class="fact"><b>वेतन</b>'+esc(x.salary||'Official notification देखें')+'</div><div class="fact"><b>कुल पद</b>'+esc(x.vacancies||'Official notification देखें')+'</div></div></section><section class="card"><h2>📖 पूरी जानकारी</h2><p class="muted">'+esc(desc).replace(/\n/g,'<br>')+'</p></section><section class="card"><h2>🔗 सभी Direct Links</h2><div class="buttons">'+btn(x.applyUrl,'Direct Apply','apply')+btn(x.notificationUrl||x.officialUrl,'Official Notification')+btn(x.admitUrl,'Admit Card')+btn(x.resultUrl,'Result')+btn(x.videoUrl,'Form कैसे भरें','video')+'</div><button id="copy" class="copy">📲 WhatsApp/Telegram Post Copy करें</button></section><div class="note">⚠️ YOCEWOR सरकारी विभाग की official website नहीं है। आवेदन से पहले official notification और संबंधित विभाग की website जरूर verify करें।</div>';const share='🔥 '+x.title+'\n\nयोग्यता: '+(x.qualification||'Official notice देखें')+'\nअंतिम तारीख: '+(x.lastDate||'Check notice')+'\n\nDirect Apply: '+(x.applyUrl||'')+'\nOfficial Notification: '+(x.notificationUrl||x.officialUrl||'')+'\nAdmit Card: '+(x.admitUrl||'')+'\nResult: '+(x.resultUrl||'')+'\nForm कैसे भरें: '+(x.videoUrl||'')+'\n\nYOCEWOR: '+location.href;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(share);copy.textContent='✅ Copy हो गया';setTimeout(()=>copy.textContent='📲 WhatsApp/Telegram Post Copy करें',1600)}catch(e){prompt('Copy:',share)}};const schema={"@context":"https://schema.org","@type":"JobPosting","title":x.title,"description":desc,"datePosted":x.datePosted,"validThrough":x.validThrough,"employmentType":x.employmentType||'FULL_TIME',"hiringOrganization":{"@type":"Organization","name":x.department||'See official notification'},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"IN","addressLocality":x.location||'India'}},"directApply":!!x.applyUrl};const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(schema);document.head.appendChild(s)}).catch(()=>app.innerHTML='<div class="card"><h1>Data load नहीं हुआ</h1><p class="muted">jobs.json उपलब्ध नहीं है।</p></div>');</script></body></html>
