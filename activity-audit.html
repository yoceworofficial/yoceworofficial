<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity / Audit | YOCEWOR</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.nav a{color:#fff;text-decoration:none;padding:8px 12px;border:1px solid #ffffff33;border-radius:10px;font-size:13px;font-weight:700}.nav a.active{background:#fff;color:#102a43}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #0001}.item{padding:12px 0;border-bottom:1px solid #e6ebf1}.status{display:inline-block;padding:6px 10px;border-radius:20px;background:#e9f7ef;color:#16844b;font-weight:700;font-size:12px}.muted{color:#65758b;font-size:13px}.error{color:#b42318;font-weight:700}@media(max-width:650px){.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.nav a{text-align:center}}</style></head><body><header class="top"><div class="wrap"><h1>🧾 Activity / Audit</h1><nav class="nav"><a href="/owner-dashboard.html">🏠 Home</a><a href="/dashboard.html">📊 Dashboard</a><a href="/team-management-live.html">👥 Team</a><a href="/content.html">📝 Content</a><a href="/departments.html">🏢 Departments</a><a href="/important-notice.html">📢 Important Notice</a><a href="/live-notice.html">🔴 Live Notice</a><a href="/settings.html">⚙️ Settings</a><a class="active" href="/activity-audit.html">🧾 Activity / Audit</a><a href="/" id="logout">🚪 Logout</a></nav></div></header><main class="wrap"><section id="guard" class="card">Owner access verify हो रहा है…</section><section id="app" style="display:none"><section class="card"><h2>🧾 Team Audit Log</h2><div id="list">Loading…</div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://mzntgjyecymcpzciklfk.supabase.co',KEY='sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sb-mzntgjyecymcpzciklfk-auth-token'}}),$=id=>document.getElementById(id);async function token(){const s=await db.auth.getSession();return s.data?.session?.access_token||null}async function fn(action){const t=await token();if(!t)throw Error('Login session missing. Please login again.');const r=await db.functions.invoke('team-management',{body:{action},headers:{Authorization:'Bearer '+t,apikey:KEY}});if(r.error)throw r.error;if(r.data?.error)throw Error(r.data.error);return r.data}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const m=await fn('me');if(String(m.role||'').toLowerCase()!=='owner')throw Error('Owner access required');$('guard').style.display='none';$('app').style.display='block';const r=await db.from('team_audit_log').select('id,actor_role,action,details,created_at').order('created_at',{ascending:false}).limit(200);if(r.error)throw r.error;$('list').innerHTML=(r.data||[]).map(x=>'<div class="item"><b>'+esc(x.action)+'</b> <span class="status">'+esc(x.actor_role||'')+'</span><br><span class="muted">'+new Date(x.created_at).toLocaleString()+'</span><br><small>'+esc(JSON.stringify(x.details||{}))+'</small></div>').join('')||'<span class="muted">No audit activity yet.</span>'}catch(e){$('guard').innerHTML='<span class="error">'+e.message+'</span>'}}$('logout').onclick=async e=>{e.preventDefault();await db.auth.signOut();location.href='/'};load();</script></body></html>
