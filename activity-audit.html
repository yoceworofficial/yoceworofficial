<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma":"no-cache"><meta http-equiv="Expires":"0"><title>Activity / Audit | YOCEWOR</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.nav a{color:#fff;text-decoration:none;padding:8px 12px;border:1px solid #ffffff33;border-radius:10px;font-size:13px;font-weight:700}.nav a.active{background:#fff;color:#102a43}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #0001}.item{padding:12px 0;border-bottom:1px solid #e6ebf1}.status{display:inline-block;padding:6px 10px;border-radius:20px;background:#e9f7ef;color:#16844b;font-weight:700;font-size:12px}.muted{color:#65758b;font-size:13px}.error{color:#b42318;font-weight:700}</style></head><body><header class="top"><div class="wrap"><h1>🧾 Activity / Audit</h1><nav class="nav"><a href="/owner-dashboard.html?v=20260901">🏠 Home</a><a href="/dashboard.html?v=20260901">📊 Dashboard</a><a href="/team-management-live.html?v=20260901">👥 Team</a><a href="/content.html?v=20260901">📝 Content</a><a href="/departments.html?v=20260901">🏢 Departments</a><a href="/important-notice.html?v=20260901">📢 Important Notice</a><a href="/live-notice.html?v=20260901">🔴 Live Notice</a><a href="/settings.html?v=20260901">⚙️ Settings</a><a class="active" href="/activity-audit.html?v=20260901">🧾 Activity / Audit</a><a href="/" id="logout">🚪 Logout</a></nav></div></header><main class="wrap"><section id="guard" class="card">Owner access verify हो रहा है…</section><section id="app" style="display:none"><section class="card"><h2>🧾 Team Audit Log</h2><div id="list">Loading…</div></section></section></main><script src="/owner-auth.js?audit-v2"></script><script>const $=id=>document.getElementById(id),auth=window.YOCEWOR_AUTH;function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c))}async function boot(){try{if(!auth||!auth.requireRole)throw Error('Owner authentication service is unavailable.');await auth.requireRole('owner');$('guard').style.display='none';$('app').style.display='block';const r=await auth.request('list_audit_activity');const rows=r.data||[];$('list').innerHTML=rows.map(x=>'<div class="item"><b>'+esc(x.action)+'</b> <span class="status">'+esc(x.actor_role||'')+'</span><br><span class="muted">'+new Date(x.created_at).toLocaleString()+'</span><br><small>'+esc(JSON.stringify(x.details||{}))+'</small></div>').join('')||'<span class="muted">No audit activity yet.</span>'}catch(e){$('guard').innerHTML='<span class="error">'+esc(e.message)+'</span><br><br><button onclick="location.reload()">Retry</button>'}}$('logout').onclick=async e=>{e.preventDefault();if(auth?.signOut)await auth.signOut();location.href='/'};boot();</script></body></html>
