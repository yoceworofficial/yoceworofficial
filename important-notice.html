<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Important Notice | YOCEWOR</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.nav a{color:#fff;text-decoration:none;padding:8px 12px;border:1px solid #ffffff33;border-radius:10px;font-size:13px;font-weight:700}.nav a.active{background:#fff;color:#102a43}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #0001}input,textarea{width:100%;padding:10px;border:1px solid #d7dee8;border-radius:9px;margin:5px 0 10px}textarea{min-height:120px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#102a43;color:#fff;font-weight:700;cursor:pointer}.green{background:#16844b}.danger{background:#a51d22}.muted{color:#65758b;font-size:13px}.item{padding:12px 0;border-bottom:1px solid #e6ebf1}.status{display:inline-block;padding:6px 10px;border-radius:20px;background:#e9f7ef;color:#16844b;font-weight:700;font-size:12px}.error{color:#b42318;font-weight:700}</style></head><body><header class="top"><div class="wrap"><h1>📢 Important Notice</h1><nav class="nav"><a href="/owner-dashboard.html?v=20260901">🏠 Home</a><a href="/dashboard.html?v=20260901">📊 Dashboard</a><a href="/team-management-live.html?v=20260901">👥 Team</a><a href="/content.html?v=20260901">📝 Content</a><a href="/departments.html?v=20260901">🏢 Departments</a><a class="active" href="/important-notice.html?v=20260901">📢 Important Notice</a><a href="/live-notice.html?v=20260901">🔴 Live Notice</a><a href="/settings.html?v=20260901">⚙️ Settings</a><a href="/activity-audit.html?v=20260901">🧾 Activity / Audit</a><a href="/" id="logout">🚪 Logout</a></nav></div></header><main class="wrap"><section id="guard" class="card">Owner access verify हो रहा है…</section><section id="app" style="display:none"><section class="card"><h2>＋ New Important Notice</h2><input id="title" maxlength="200" placeholder="Notice title"><textarea id="body" placeholder="Notice content"></textarea><input id="image" placeholder="Optional image URL"><button class="btn green" id="save">Publish Notice</button><div id="msg" class="muted"></div></section><section class="card"><h2>📢 Published Notices</h2><div id="list">Loading…</div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://mzntgjyecymcpzciklfk.supabase.co',KEY='sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sb-mzntgjyecymcpzciklfk-auth-token'}}),$=id=>document.getElementById(id);async function token(){const s=await db.auth.getSession();if(s.error)throw s.error;return s.data?.session?.access_token||null}async function owner(){const t=await token();if(!t)throw Error('Login session missing. Please login again.');const r=await db.functions.invoke('team-management',{body:{action:'me'},headers:{Authorization:'Bearer '+t,apikey:KEY}});if(r.error)throw Error(r.error.message||'Owner verification failed');const m=r.data;if(!m||String(m.role||'').toLowerCase()!=='owner')throw Error('Owner access required');return m}async function refresh(){const r=await db.from('jobs').select('id,title,description,main_content,published,published_at,updated_at,created_at').eq('type','General Notice').eq('category','Important Notice').order('updated_at',{ascending:false});if(r.error)throw r.error;const rows=r.data||[];$('list').innerHTML=rows.map(x=>'<div class="item"><b>'+esc(x.title)+'</b> <span class="status">'+(x.published?'LIVE':'DRAFT')+'</span><br><span class="muted">'+esc(x.description||x.main_content||'')+'</span><br><button class="btn '+(x.published?'danger':'green')+'" onclick="toggle(\''+x.id+'\','+x.published+')">'+(x.published?'Unpublish':'Publish')+'</button></div>').join('')||'<span class="muted">No important notices.</span>'}async function toggle(id,p){try{await owner();const r=await db.from('jobs').update({published:!p,published_at:!p?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error;await refresh()}catch(e){alert(e.message)}}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c))}$('save').onclick=async()=>{try{const m=await owner(),title=$('title').value.trim(),body=$('body').value.trim(),image=$('image').value.trim();if(!title||!body)throw Error('Title and content are required.');const now=new Date().toISOString();const r=await db.from('jobs').insert({title,type:'General Notice',description:body,main_content:body,category:'Important Notice',featured_image:image||null,published:true,published_at:now,slug:'important-'+Date.now(),created_by:m.user_id}).select('id').single();if(r.error)throw r.error;$('msg').textContent='✅ Important Notice published successfully';$('title').value='';$('body').value='';$('image').value='';await refresh()}catch(e){$('msg').textContent='❌ '+e.message}}$('logout').onclick=async e=>{e.preventDefault();await db.auth.signOut();location.href='/'};async function boot(){try{await owner();$('guard').style.display='none';$('app').style.display='block';await refresh()}catch(e){$('guard').innerHTML='<span class="error">'+esc(e.message)+'</span><br><br><button class="btn" onclick="location.reload()">Retry</button>'}}boot();</script></body></html>
