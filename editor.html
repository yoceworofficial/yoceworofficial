<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Editor</title><style>body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#eef2f6;color:#17212b}.top{background:#073b72;color:#fff;padding:18px 5%;border-bottom:4px solid #f58220}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:12px;padding:20px;margin:15px 0;box-shadow:0 2px 9px #0001}.item{border:1px solid #d5dde5;border-radius:8px;padding:12px;margin:8px 0}.gray{background:#596773;color:#fff;border:0;border-radius:7px;padding:11px 15px;font-weight:bold}.msg{font-weight:bold;margin:8px 0}</style></head><body><header class="top"><b>YOCEWOR EDITOR PANEL</b><br><small>Content review • Read-only access</small></header><main class="wrap"><div class="card"><button class="gray" onclick="logout()">Logout</button><h2>✍️ Editor Dashboard</h2><p id="who">Session verify हो रहा है...</p></div><div class="card"><h2>📋 Published Content</h2><button class="gray" onclick="load()">Refresh</button><div id="msg" class="msg"></div><div id="list"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action){const r=await db.functions.invoke('content-control',{body:{action}});if(r.error)throw r.error;if(r.data?.error)throw Error(r.data.error);return r.data}async function init(){try{const s=await db.auth.getSession();if(!s.data.session)throw Error('Team login required');const me=await api('role');if(me.role!=='editor')throw Error('यह Editor account नहीं है।');document.getElementById('who').textContent='Logged in: '+(me.display_name||me.email);load()}catch(e){document.getElementById('msg').textContent='❌ '+e.message}}async function load(){try{const r=await api('list');document.getElementById('list').innerHTML=(r.data||[]).map(x=>'<div class="item"><b>'+esc(x.title)+'</b><br><small>'+esc(x.type)+' • '+esc(x.status)+' • Last: '+esc(x.last_date||'—')+'</small></div>').join('')||'No content'}catch(e){document.getElementById('msg').textContent='❌ '+e.message}}async function logout(){await db.auth.signOut();location.href='team-login.html'}init()</script></body></html>
