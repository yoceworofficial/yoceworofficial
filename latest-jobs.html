<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3d6e">
<title>YOCEWOR — Latest Government Jobs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#eef3f7;color:#1d2a36}.container{width:min(1160px,94%);margin:auto}.top{background:#0b3d6e;color:#fff;border-bottom:4px solid #f28c18}.topin{display:flex;align-items:center;gap:14px;padding:14px 0}.seal{width:55px;height:55px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;position:relative;background:#fff;color:#0b3d6e;font-weight:900;font-size:22px}.seal:before{content:"";position:absolute;inset:4px;border:1px dashed #f28c18;border-radius:50%}.brand h1{margin:0;font-size:25px}.brand small{opacity:.86}.back{margin-left:auto;color:#fff;text-decoration:none;border:1px solid #ffffff55;padding:9px 13px;border-radius:4px;font-weight:700}.notice{background:#fff;border:1px solid #d3dce4;margin:18px 0;padding:0;box-shadow:0 3px 10px #0001}.notice-title{background:#b71c1c;color:#fff;padding:10px 14px;font-weight:900}.notice-body{padding:10px 14px;color:#294763}.tools{background:#fff;border:1px solid #d3dce4;padding:16px;box-shadow:0 3px 10px #0001}.tools-title{font-size:18px;color:#0b3d6e;font-weight:900;margin-bottom:12px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.tools input,.tools select{width:100%;padding:12px;border:1px solid #cbd6df;border-radius:5px;background:#fff;font-size:14px;outline:none}.tools input:focus,.tools select:focus{border-color:#0b3d6e;box-shadow:0 0 0 2px #0b3d6e15}.status{padding:13px 0;color:#5d6d7c;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fff;border:1px solid #d3dce4;border-radius:5px;box-shadow:0 3px 12px #0001;overflow:hidden}.cardhead{padding:14px 16px;background:#f5f8fa;border-bottom:1px solid #e1e7eb}.card h2{font-size:19px;line-height:1.35;margin:0;color:#0b3d6e}.cardbody{padding:15px 16px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.meta div{background:#f7f9fb;border:1px solid #e4e9ed;padding:9px;font-size:13px}.meta b{display:block;color:#566979;font-size:11px;text-transform:uppercase;margin-bottom:3px}.desc{font-size:14px;line-height:1.55;color:#465765;max-height:66px;overflow:hidden}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.btn{display:inline-block;padding:9px 12px;border-radius:4px;background:#0b3d6e;color:#fff;text-decoration:none;font-weight:800;font-size:13px}.btn.green{background:#138a45}.empty{background:#fff;padding:45px;text-align:center;border:1px dashed #b9c6d0;color:#687985}.footer{margin-top:35px;background:#0b3d6e;color:#dce8f0;padding:25px 0;font-size:13px}.footer b{color:#fff;font-size:18px}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){.topin{align-items:flex-start}.brand h1{font-size:21px}.back{padding:8px 9px;font-size:12px}.filters{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.card h2{font-size:18px}}
</style>
</head>
<body>
<header class="top"><div class="container topin"><div class="seal">Y</div><div class="brand"><h1>YOCEWOR</h1><small>सरकारी भर्ती एवं सूचना पोर्टल</small></div><a class="back" href="index.html">← मुख्य पृष्ठ</a></div></header>
<main class="container">
<section class="notice"><div class="notice-title">🔴 LIVE NOTICE BOARD</div><div class="notice-body" id="notice">प्रकाशित भर्तियों की नवीनतम सूचना यहाँ लाइव दिखाई जाएगी।</div></section>
<section class="tools"><div class="tools-title">📋 नवीनतम सरकारी भर्तियाँ</div><div class="filters"><input id="q" placeholder="भर्ती / विभाग / qualification खोजें…"><input id="from" type="date" title="Start date"><input id="to" type="date" title="Last date"><select id="sort"><option value="new">नवीनतम पहले</option><option value="last">Last Date पहले</option></select></div></section>
<div id="status" class="status">Published jobs loading…</div><section id="jobs" class="grid"></section>
</main>
<footer class="footer"><div class="container"><b>YOCEWOR</b><div>स्वतंत्र सूचना पोर्टल • © 2026 YOCEWOR</div></div></footer>
<script>
const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let all=[];
async function load(){const {data,error}=await db.from('jobs').select('id,title,department,start_date,last_date,qualification,vacancies,age,salary,description,apply_url,notification_url,created_at').eq('published',true).order('created_at',{ascending:false});if(error){document.getElementById('status').textContent='Published jobs could not be loaded.';return}all=data||[];const n=document.getElementById('notice');n.innerHTML=all.slice(0,6).map(j=>`<a href="job-details.html?id=${encodeURIComponent(j.id)}" style="color:#0b3d6e;font-weight:800;text-decoration:none;margin-right:25px">◆ ${esc(j.title||'नई भर्ती')} ${j.last_date?`• Last Date: ${esc(j.last_date)}`:''}</a>`).join('')||'अभी कोई published recruitment नहीं है।';render()}
function render(){const q=document.getElementById('q').value.trim().toLowerCase(),from=document.getElementById('from').value,to=document.getElementById('to').value,sort=document.getElementById('sort').value;let rows=all.filter(j=>(!q||[j.title,j.department,j.qualification,j.description].some(v=>String(v||'').toLowerCase().includes(q)))&&(!from||!j.start_date||j.start_date>=from)&&(!to||!j.last_date||j.last_date<=to));if(sort==='last')rows.sort((a,b)=>String(a.last_date||'9999').localeCompare(String(b.last_date||'9999')));document.getElementById('status').textContent=`${rows.length} published job${rows.length===1?'':'s'} found`;document.getElementById('jobs').innerHTML=rows.length?rows.map(j=>`<article class="card"><div class="cardhead"><h2>${esc(j.title||'Government Recruitment')}</h2></div><div class="cardbody"><div class="meta"><div><b>Department</b>${esc(j.department||'—')}</div><div><b>Start Date</b>${esc(j.start_date||'—')}</div><div><b>Last Date</b>${esc(j.last_date||'—')}</div><div><b>Qualification</b>${esc(j.qualification||'—')}</div><div><b>Vacancies</b>${esc(j.vacancies||'—')}</div><div><b>Age</b>${esc(j.age||'—')}</div><div><b>Salary</b>${esc(j.salary||'—')}</div></div><div class="desc">${esc(j.description||'विस्तृत जानकारी के लिए Job Details खोलें।')}</div><div class="actions"><a class="btn" href="job-details.html?id=${encodeURIComponent(j.id)}">पूर्ण विवरण</a>${j.apply_url?`<a class="btn green" href="${esc(j.apply_url)}" target="_blank" rel="noopener">Official Apply ↗</a>`:''}${j.notification_url?`<a class="btn" href="${esc(j.notification_url)}" target="_blank" rel="noopener">Notification PDF ↗</a>`:''}</div></div></article>`).join(''):'<div class="empty">इस filter के अनुसार कोई published job नहीं मिली।</div>'}
['q','from','to','sort'].forEach(id=>document.getElementById(id).addEventListener('input',render));load().catch(()=>document.getElementById('status').textContent='Unable to load published jobs.');
</script>
</body>
</html>
