<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Latest Jobs</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#182235}.top{background:#174a7c;color:#fff;padding:20px}.wrap{max-width:1100px;margin:auto;padding:18px}.tools{display:flex;gap:10px;flex-wrap:wrap}.tools input,.tools select{padding:11px;border:1px solid #ccd5e0;border-radius:8px;flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px;margin-top:16px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 16px #0001}.meta{font-size:14px;color:#5f6f82;margin:7px 0}.btn{display:inline-block;margin-top:10px;padding:10px 13px;border-radius:8px;background:#174a7c;color:#fff;text-decoration:none;font-weight:700}.empty{text-align:center;padding:35px}</style></head><body><header class="top"><div class="wrap"><h1>YOCEWOR</h1><div>Latest Government Jobs</div></div></header><main class="wrap"><div class="tools"><input id="q" placeholder="Search job, department…"><input id="from" type="date" title="Start date"><input id="to" type="date" title="Last date"><select id="sort"><option value="new">Newest first</option><option value="last">Last date first</option></select></div><div id="status" class="meta">Loading published jobs…</div><section id="jobs" class="grid"></section></main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let all=[];async function load(){const {data,error}=await db.from('jobs').select('id,title,department,start_date,last_date,eligibility,official_url,details,created_at').eq('published',true).order('created_at',{ascending:false});if(error){document.getElementById('status').textContent='Jobs could not be loaded.';return}all=data||[];render()}function render(){const q=document.getElementById('q').value.toLowerCase(),from=document.getElementById('from').value,to=document.getElementById('to').value,sort=document.getElementById('sort').value;let rows=all.filter(j=>(!q||[j.title,j.department,j.eligibility,j.details].some(v=>String(v||'').toLowerCase().includes(q)))&&(!from||!j.start_date||j.start_date>=from)&&(!to||!j.last_date||j.last_date<=to));if(sort==='last')rows.sort((a,b)=>String(a.last_date||'9999').localeCompare(String(b.last_date||'9999')));document.getElementById('status').textContent=rows.length+' published job'+(rows.length===1?'':'s');document.getElementById('jobs').innerHTML=rows.length?rows.map(j=>`<article class="card"><h2>${esc(j.title||'Government Recruitment')}</h2><div class="meta"><b>Department:</b> ${esc(j.department||'—')}</div><div class="meta"><b>Start Date:</b> ${esc(j.start_date||'—')}</div><div class="meta"><b>Last Date:</b> ${esc(j.last_date||'—')}</div><div class="meta"><b>Eligibility:</b> ${esc(j.eligibility||'—')}</div><p>${esc(j.details||'')}</p>${j.official_url?`<a class="btn" href="${esc(j.official_url)}" target="_blank" rel="noopener">Official Apply / Details</a>`:''}</article>`).join(''):'<div class="card empty">No published jobs found.</div>'}['q','from','to','sort'].forEach(id=>document.getElementById(id).addEventListener('input',render));load().catch(()=>document.getElementById('status').textContent='Jobs could not be loaded.');</script></body></html>
