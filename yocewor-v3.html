function bindAuth(k){$('#alog').onclick=()=>{root.innerHTML=auth('login');bindAuth('login')};$('#asign').onclick=()=>{root.innerHTML=auth('signup');bindAuth('signup')};$('#doLogin')?.addEventListener('click',async()=>{const r=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});if(r.error)toast(r.error.message);else boot()});$('#doSignup')?.addEventListener('click',async()=>{const u=$('#username').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,30}$/.test(u))return toast('Username must be 3–30 letters, numbers or _');const r=await db.auth.signUp({email:$('#email').value.trim().toLowerCase(),password:$('#pass').value,options:{data:{username:u,display_name:$('#name').value.trim()||u}}});if(r.error)toast(r.error.message);else toast(r.data.session?'Account created':'Check your email')})}
async function profile(id){const r=await db.from('profiles').select('*').eq('id',id).maybeSingle();return r.data||{id,username:'user',display_name:'YOCEWOR User'}}
async function feed(){const r=await db.from('posts').select('id,user_id,body,image_url,created_at').order('created_at',{ascending:false}).range(0,19);if(r.error)return `<div class="card empty">${esc(r.error.message)}</div>`;const ps=r.data||[],ids=[...new Set(ps.map(x=>x.user_id))],mp={};if(ids.length){const q=await db.from('profiles').select('*').in('id',ids);(q.data||[]).forEach(p=>mp[p.id]=p)}return `<div class="stories card"><div class="story"><div class="storyRing"><div class="avatar">＋</div></div>${t('create')}</div>${ids.slice(0,10).map(id=>`<div class="story"><div class="storyRing">${av(mp[id])}</div>${esc(mp[id]?.username||'user')}</div>`).join('')}</div><div class="card composer"><div class="row">${av(meP)}<div><b>What is on your mind?</b><div class="tiny muted">Share something with your world.</div></div></div><textarea id="body" placeholder="Say something..."></textarea><div class="composebar"><label class="btn file">＋ Photo<input id="photo" type="file" accept="image/*"></label><button class="btn primary" id="postBtn">${t('post')}</button></div></div>${ps.length?ps.map(p=>{const pp=mp[p.user_id]||{};return `<article class="card post"><div class="row posthead">${av(pp)}<div class="grow"><b>${esc(pp.display_name||pp.username||'User')}${badge(pp)}</b><div class="tiny muted">@${esc(pp.username||'user')} · ${new Date(p.created_at).toLocaleDateString()}</div></div><button class="icon" data-report="${p.id}" aria-label="More">•••</button></div>${p.body?`<div class="posttext">${esc(p.body)}</div>`:''}${p.image_url?`<img class="postimg" loading="lazy" src="${esc(p.image_url)}" alt="">`:''}<div class="postactions"><button class="action like" data-like="${p.id}">♡ ${t('like')}</button><button class="action" data-comment="${p.id}">○ ${t('comment')}</button><button class="action" data-share="${p.id}">↗ ${t('share')}</button><button class="action" data-save="${p.id}">☆ ${t('save')}</button></div></article>`}).join(''):`<div class="card empty">No posts yet.</div>`}`}
async function upload(file,folder){if(!file)return null;if(file.size>12*1024*1024)throw Error('File must be under 12MB');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'');const path=`${me.id}/${folder}/${Date.now()}-${safe}`;const r=await db.storage.from('yocewor-media').upload(path,file,{upsert:false,cacheControl:'3600'});if(r.error)throw r.error;return db.storage.from('yocewor-media').getPublicUrl(path).data.publicUrl}
async function createPost(){try{const body=$('#body').value.trim(),file=$('#photo').files[0];if(!body&&!file)return toast('Write something or add a photo');const image=await upload(file,'posts');const r=await db.from('posts').insert({user_id:me.id,body:body||'',image_url:image});if(r.error)throw r.error;toast('Posted');route('home')}catch(e){toast(e.message)}}
async function comments(id){const r=await db.from('comments').select('*').eq('post_id',id).order('created_at',{ascending:true}).limit(100);if(r.error)return toast('Comments are temporarily unavailable');const cs=r.data||[],ids=[...new Set(cs.map(x=>x.user_id))],mp={};if(ids.length){const q=await db.from('profiles').select('*').in('id',ids);(q.data||[]).forEach(p=>mp[p.id]=p)}$('#modal').innerHTML=`<div class="modal"><div class="card modalbox"><div class="row"><h2 class="grow">${t('comment')}</h2><button class="icon" id="x">×</button></div><div class="comments">${cs.length?cs.map(c=>`<div class="comment">${av(mp[c.user_id])}<div class="bubble"><b>${esc(mp[c.user_id]?.display_name||'User')}${badge(mp[c.user_id])}</b><div>${esc(c.body)}</div></div></div>`).join(''):`<div class="empty">No comments yet.</div>`}</div><div class="row"><input id="comment" class="field" placeholder="Write a comment..."><button class="btn primary" id="send">${t('send')}</button></div></div></div>`;$('#x').onclick=()=>$('#modal').innerHTML='';$('#send').onclick=async()=>{const b=$('#comment').value.trim();if(!b)return;const q=await db.from('comments').insert({post_id:id,user_id:me.id,body:b});if(q.error)toast(q.error.message);else comments(id)}}
async function like(id){const q=await db.from('likes').select('post_id').eq('post_id',id).eq('user_id',me.id).maybeSingle();if(q.error)return toast('Like is temporarily unavailable');if(q.data)await db.from('likes').delete().eq('post_id',id).eq('user_id',me.id);else await db.from('likes').insert({post_id:id,user_id:me.id});route('home')}
function bindFeed(){document.querySelectorAll('[data-like]').forEach(x=>x.onclick=()=>like(x.dataset.like));document.querySelectorAll('[data-comment]').forEach(x=>x.onclick=()=>comments(x.dataset.comment));document.querySelectorAll('[data-share]').forEach(x=>x.onclick=async()=>{const u=location.origin+location.pathname+'#post-'+x.dataset.share;if(navigator.share)await navigator.share({title:'YOCEWOR',url:u});else{try{await navigator.clipboard.writeText(u);toast('Link copied')}catch{toast(u)}}});document.querySelectorAll('[data-save]').forEach(x=>x.onclick=async()=>{const r=await db.from('saved_posts').upsert({user_id:me.id,post_id:x.dataset.save},{onConflict:'user_id,post_id'});toast(r.error?'Save unavailable':'Saved')});$('#postBtn')?.addEventListener('click',createPost)}
async function explore(){return `<div class="card pad"><h2>${t('explore')}</h2><div class="search"><input id="q" class="field" placeholder="${t('search')}"><button class="btn primary" id="searchBtn">${t('search')}</button></div><div id="results"></div></div>`}
async function doSearch(){const q=$('#q').value.trim();if(!q)return;const r=await db.from('profiles').select('*').or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).limit(30);if(r.error)return toast('Search unavailable');$('#results').innerHTML=(r.data||[]).map(p=>`<div class="result">${av(p)}<div class="grow"><b>${esc(p.display_name||p.username)}${badge(p)}</b><div class="tiny muted">@${esc(p.username)}</div></div>${p.id!==me.id?`<button class="btn" data-follow="${p.id}">Follow</button>`:''}</div>`).join('')||`<div class="empty">No people found.</div>`;document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=async()=>{const r=await db.from('follows').upsert({follower_id:me.id,following_id:b.dataset.follow},{onConflict:'follower_id,following_id'});if(!r.error){b.textContent='Following';b.disabled=true}else toast(r.error.message)})}
async function reels(){const r=await db.from('reels').select('*').order('created_at',{ascending:false}).limit(20);if(r.error)return `<div class="card empty">Reels are being prepared. Please try again.</div>`;return `<div class="card pad"><div class="row"><div class="grow"><h2>${t('reels')}</h2><div class="tiny muted">Short videos from YOCEWOR.</div></div><label class="btn primary file">＋ Upload<input id="reelUpload" type="file" accept="video/*"></label></div></div><div style="height:12px"></div>${(r.data||[]).map(x=>`<article class="reel">${x.media_url.match(/\.(mp4|webm|mov)(\?|$)/i)?`<video src="${esc(x.media_url)}" controls playsinline></video>`:`<img src="${esc(x.media_url)}" alt="">`}<div class="reelCaption"><b>YOCEWOR Reel</b><div>${esc(x.caption||'')}</div></div></article>`).join('')||`<div class="card empty">No reels yet.</div>`}`}
async function uploadReel(file){try{const url=await upload(file,'reels');const r=await db.from('reels').insert({user_id:me.id,media_url:url,caption:''});if(r.error)throw r.error;toast('Reel uploaded');route('reels')}catch(e){toast(e.message)}}
async function messages(){const cm=await db.from('conversation_members').select('conversation_id').eq('user_id',me.id);if(cm.error)return `<div class="card empty">Messages are temporarily unavailable.</div>`;const ids=(cm.data||[]).map(x=>x.conversation_id);let conv=[];if(ids.length){const q=await db.from('conversations').select('*').in('id',ids).order('updated_at',{ascending:false});conv=q.data||[]}return `<div class="card pad"><div class="row"><div class="grow"><h2>${t('messages')}</h2><div class="tiny muted">Private conversations.</div></div></div>${conv.length?conv.map(c=>`<button class="result" style="width:100%;background:transparent;border:0;color:inherit;text-align:left" data-chat="${c.id}"><b>Conversation</b><span class="grow"></span><span class="tiny muted">${new Date(c.updated_at).toLocaleString()}</span></button>`).join(''):`<div class="empty">Find someone in Explore to start a conversation.</div>`}</div>`}
async function openChat(cid){const r=await db.from('messages').select('*').eq('conversation_id',cid).order('created_at',{ascending:true}).limit(100);if(r.error)return toast('Messages unavailable');const msgs=r.data||[];$('#modal').innerHTML=`<div class="modal"><div class="card modalbox chat"><div class="row"><b class="grow">${t('messages')}</b><button class="icon" id="closeChat">×</button></div><div class="chatbody">${msgs.map(m=>`<div class="msg ${m.sender_id===me.id?'mine':''}">${esc(m.body)}</div>`).join('')}</div><div class="chatbar"><input id="msg" class="field" placeholder="Write a message..."><button class="btn primary" id="sendMsg">${t('send')}</button></div></div></div>`;$('#closeChat').onclick=()=>$('#modal').innerHTML='';$('#sendMsg').onclick=async()=>{const body=$('#msg').value.trim();if(!body)return;const q=await db.from('messages').insert({conversation_id:cid,sender_id:me.id,body,message_type:'text'});if(q.error)toast(q.error.message);else openChat(cid)}}
async function notifications(){const r=await db.from('notifications').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(50);if(r.error)return `<div class="card empty">Notifications unavailable.</div>`;return `<div class="card pad"><h2>${t('notifications')}</h2>${(r.data||[]).map(n=>`<div class="result">${logo()}<div class="grow"><b>${esc(n.title||n.type||'Activity')}</b><div>${esc(n.message||'Activity on your account')}</div><div class="tiny muted">${new Date(n.created_at).toLocaleString()}</div></div></div>`).join('')||`<div class="empty">You're all caught up.</div>`}</div>`}
async function profilePage(){const [pc,fo,fi]=await Promise.all([db.from('posts').select('id',{count:'exact',head:true}).eq('user_id',me.id),db.from('follows').select('follower_id',{count:'exact',head:true}).eq('following_id',me.id),db.from('follows').select('following_id',{count:'exact',head:true}).eq('follower_id',me.id)]);return `<div class="card profileHero"><div class="row">${av(meP)}<div class="grow"><h2 style="margin:0">${esc(meP.display_name)}${badge(meP)}</h2><div class="muted">@${esc(meP.username)}</div><p>${esc(meP.bio||'Your voice. Your world.')}</p></div><button class="btn" id="editProfile">Edit Profile</button></div><div class="profileStats"><div><strong>${pc.count||0}</strong><span class="tiny muted">Posts</span></div><div><strong>${fo.count||0}</strong><span class="tiny muted">Followers</span></div><div><strong>${fi.count||0}</strong><span class="tiny muted">Following</span></div></div><div class="card pad" style="margin-top:18px"><b>Verification</b><p class="tiny muted">${meP.is_verified?'Your account is verified.':'Apply for a YOCEWOR verification offer.'}</p><button class="btn primary" id="verifyBtn">${meP.is_verified?'Verified':'Verification & offers'}</button></div></div>`}
function editProfile(){ $('#modal').innerHTML=`<div class="modal"><div class="card modalbox"><div class="row"><h2 class="grow">Edit Profile</h2><button class="icon" id="x">×</button></div><input id="epName" class="field" value="${esc(meP.display_name||'')}"><input id="epUser" class="field" value="${esc(meP.username||'')}"><textarea id="epBio" class="field" style="min-height:120px">${esc(meP.bio||'')}</textarea><button class="btn primary" id="epSave">Save</button></div></div>`;$('#x').onclick=()=>$('#modal').innerHTML='';$('#epSave').onclick=async()=>{const r=await db.from('profiles').update({display_name:$('#epName').value.trim(),username:$('#epUser').value.trim().toLowerCase(),bio:$('#epBio').value.trim()}).eq('id',me.id);if(r.error)toast(r.error.message);else{meP=await profile(me.id);$('#modal').innerHTML='';route('profile')}}}
function settings(){return `<div class="card pad"><h2>${t('settings')}</h2><div class="setting"><div><b>${t('language')}</b><div class="tiny muted">Choose the language for YOCEWOR controls.</div></div>${languageSelect()}</div><div class="setting"><div><b>Private account</b><div class="tiny muted">Control profile visibility.</div></div><button class="switch" id="private"><i></i></button></div><div class="setting"><div><b>Notifications</b><div class="tiny muted">Likes, comments and follows.</div></div><button class="switch" id="notif"><i></i></button></div><h3>${t('appearance')}</h3><div class="themeGrid">${Object.entries(themes).map(([k,v])=>`<button class="theme" data-theme="${k}"><i style="--x:${v[0]};--y:${v[1]};--z:${v[2]}"></i>${k}</button>`).join('')}</div><div class="setting"><b>${t('logout')}</b><button class="btn" id="logout">${t('logout')}</button></div></div>`}
async function loadSettings(){const r=await db.from('user_settings').select('*').eq('user_id',me.id).maybeSingle();const s=r.data||{is_private:false,notifications_enabled:true};['private','notif'].forEach((id,i)=>{const b=$('#'+id);if(s[i?'notifications_enabled':'is_private'])b.classList.add('on');b.onclick=async()=>{b.classList.toggle('on');const val=b.classList.contains('on');const patch=i?{notifications_enabled:val}:{is_private:val};await db.from('user_settings').upsert({user_id:me.id,...patch},{onConflict:'user_id'})}});$('#language').onchange=e=>{lang=e.target.value;localStorage.yLang=lang;document.documentElement.lang=lang;route('settings');toast('Language changed')};$('#logout').onclick=logout}
function help(){return `<div class="card pad"><h2>${t('help')}</h2><p class="muted">Help for login, posts, profiles, messages and safety.</p><div class="setting"><div><b>AI Support</b><div class="tiny muted">Guided help inside YOCEWOR.</div></div><button class="btn primary" id="aiHelp">Start chat</button></div><div class="setting"><div><b>Report a problem</b><div class="tiny muted">Create a support ticket.</div></div><button class="btn" id="ticket">Create ticket</button></div><div class="tiny muted" style="margin-top:18px">Never share your password, OTP or payment PIN with support.</div></div>`}
function aiHelp(){const qs=['I cannot login','My post is not uploading','My account has a problem','I want to report abuse'];$('#modal').innerHTML=`<div class="modal"><div class="card modalbox"><div class="row"><b class="grow">YOCEWOR AI Support</b><button class="icon" id="x">×</button></div><div class="comments" style="margin-top:12px"><div class="comment"><div class="bubble"><b>YOCEWOR Support</b><div>Tell me what happened. I can guide you through the app.</div></div></div>${qs.map(q=>`<button class="btn" style="margin:5px" data-q="${q}">${q}</button>`).join('')}</div></div></div>`;$('#x').onclick=()=>$('#modal').innerHTML='';document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>toast('Guidance: check your connection, refresh once, then retry. If it continues, create a ticket.'))}
async function ticket(){const s=prompt('Describe the problem');if(!s)return;const r=await db.from('support_tickets').insert({user_id:me.id,subject:s.slice(0,120),category:'app',status:'open'});if(r.error)toast('Could not create ticket');else toast('Support ticket created')}
async function route(v){view=v;bottom();const p=$('#page');if(v==='home'||v==='create'){p.innerHTML=await feed();bindFeed();if(v==='create')$('#body')?.focus();return}if(v==='explore'){p.innerHTML=await explore();$('#searchBtn').onclick=doSearch;return}if(v==='reels'){p.innerHTML=await reels();$('#reelUpload')?.addEventListener('change',e=>uploadReel(e.target.files[0]));return}if(v==='messages'){p.innerHTML=await messages();document.querySelectorAll('[data-chat]').forEach(x=>x.onclick=()=>openChat(x.dataset.chat));return}if(v==='notifications'){p.innerHTML=await notifications();return}if(v==='profile'){p.innerHTML=await profilePage();$('#editProfile').onclick=editProfile;$('#verifyBtn').onclick=()=>route('verify');return}if(v==='settings'){p.innerHTML=settings();await loadSettings();return}if(v==='help'){p.innerHTML=help();$('#aiHelp').onclick=aiHelp;$('#ticket').onclick=ticket;return}if(v==='verify'){p.innerHTML=`<div class="card pad"><h2>Verification offers</h2><p class="muted">Submit public-profile information. YOCEWOR can review it and issue an individual offer. Real payment is not enabled yet.</p><input id="vfName" class="field" value="${esc(meP.display_name||'')}" placeholder="Full name"><input id="vfCat" class="field" placeholder="Creator, business, public figure..."><input id="vfAud" class="field" type="number" placeholder="Audience size"><input id="vfUrl" class="field" placeholder="Profile / website"><textarea id="vfAbout" class="field" style="min-height:120px" placeholder="About you"></textarea><button class="btn primary" id="vfSend">Submit application</button></div>`;$('#vfSend').onclick=async()=>{const r=await db.from('verification_offer_profiles').upsert({user_id:me.id,full_name:$('#vfName').value,category:$('#vfCat').value,audience_size:Number($('#vfAud').value||0),profile_url:$('#vfUrl').value,about:$('#vfAbout').value,offer_currency:'INR',offer_status:'pending'},{onConflict:'user_id'});if(r.error)toast('Application unavailable');else toast('Application submitted')}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-view]');if(n)route(n.dataset.view);const th=e.target.closest('[data-theme]');if(th){setTheme(th.dataset.theme);toast('Theme changed')}});
async function logout(){await db.auth.signOut();boot()}
async function boot(){const s=await db.auth.getSession();me=s.data.session?.user||null;document.documentElement.lang=lang;if(!me){$('#topActions').innerHTML=languageSelect();$('#bottom').innerHTML='';root.innerHTML=landing();$('#language').onchange=e=>{lang=e.target.value;localStorage.yLang=lang;boot()};$('#signup').onclick=()=>{root.innerHTML=auth('signup');bindAuth('signup')};$('#login').onclick=()=>{root.innerHTML=auth('login');bindAuth('login')};return}meP=await profile(me.id);$('#topActions').innerHTML=languageSelect()+av(meP)+`<button class="icon" id="logoutTop" aria-label="${t('logout')}">↪</button>`;$('#language').onchange=e=>{lang=e.target.value;localStorage.yLang=lang;boot()};$('#logoutTop').onclick=logout;root.innerHTML=shell();route('home')}
$('#brand').onclick=e=>{e.preventDefault();route('home')};db.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
