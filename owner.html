<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Owner Control</title><style>body{font-family:Arial;margin:0;background:#eef2f6;color:#18212b}.wrap{max-width:1100px;width:94%;margin:auto}.head{background:#073b72;color:#fff;padding:18px 0;border-bottom:4px solid #f58220}.card{background:#fff;border:1px solid #d5dde5;border-radius:10px;padding:18px;margin:18px 0}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #b9c5d0;border-radius:6px;margin:5px 0 10px}button{border:0;border-radius:6px;padding:11px 15px;background:#073b72;color:#fff;font-weight:700;cursor:pointer;margin:4px}.green{background:#16844b}.danger{background:#b42318}.gray{background:#596773}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.hidden{display:none}.badge{padding:4px 8px;border-radius:12px;background:#e8eef5;display:inline-block}.row{border:1px solid #d5dde5;padding:12px;border-radius:8px;margin:8px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="head"><div class="wrap"><b>YOCEWOR OWNER CONTROL</b><div>Team • Admins • Publishing permissions</div></div></header><main class="wrap"><section id="setup" class="card"><h2>⚙️ Connect</h2><input id="url" placeholder="Supabase Project URL"><input id="key" placeholder="Supabase Publishable Key"><button id="connect" class="green">Connect</button></section><section id="login" class="card hidden"><h2>🔐 Owner Login</h2><p>Owner account must already be authorized in YOCEWOR.</p><input id="email" type="email" placeholder="Owner email / User ID"><input id="pass" type="password" placeholder="Password"><button id="loginBtn">Login</button><div id="loginMsg"></div></section><section id="app" class="hidden"><div class="card"><button id="logout" class="gray">Logout</button><h2>👑 Owner Dashboard</h2><p>यहाँ से team के लिए Admin/Editor accounts बनाए, disable या delete कर सकते हैं।</p><div class="grid"><div><label>User ID / Email</label><input id="newEmail" type="email" placeholder="team@example.com"></div><div><label>Display Name</label><input id="newName" placeholder="Team Member"></div><div><label>Password</label><input id="newPass" type="password" minlength="8" placeholder="कम से कम 8 characters"></div><div><label>Role</label><select id="role"><option value="admin">Admin — publishing access</option><option value="editor">Editor — content access</option></select></div></div><button id="create" class="green">➕ Create Team User</button><div id="msg"></div></div><div class="card"><h2>👥 Team Members</h2><button id="refresh">Refresh</button><div id="list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let S=null,$=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function connect(){let u=$('url').value.trim(),k=$('key').value.trim();if(!u||!k)return;$('setup').classList.add('hidden');$('login').classList.remove('hidden');S=supabase.createClient(u,k);localStorage.setItem('yocewor_supabase_url',u);localStorage.setItem('yocewor_supabase_key',k)}async function isOwner(){let {data:{user}}=await S.auth.getUser();if(!user)return false;let r=await S.from('admin_users').select('role').eq('user_id',user.id).maybeSingle();return !!r.data&&r.data.role==='owner'}async function load(){let r=await S.from('admin_users').select('user_id,role,display_name,created_at').order('created_at',{ascending:false});if(r.error){$('list').textContent=r.error.message;return}$('list').innerHTML=(r.data||[]).map(x=>'<div class="row"><b>'+esc(x.display_name||'Team User')+'</b> <span class="badge">'+esc(x.role)+'</span><br><small>'+esc(x.user_id)+' • '+esc(x.created_at||'')+'</small><br>'+(x.role!=='owner'?'<button class="danger" onclick="removeUser(\''+x.user_id+'\')">Remove Admin Access</button>':'<b>Owner</b>')+'</div>').join('')||'No team members'}window.removeUser=async uid=>{if(!confirm('Remove this user from YOCEWOR admin team?'))return;let r=await S.from('admin_users').delete().eq('user_id',uid);if(r.error)alert(r.error.message);load()};$('connect').onclick=connect;$('loginBtn').onclick=async()=>{let r=await S.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(r.error){$('loginMsg').textContent=r.error.message;return}if(!(await isOwner())){await S.auth.signOut();$('loginMsg').textContent='यह account Owner नहीं है।';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');load()};$('logout').onclick=async()=>{await S.auth.signOut();location.reload()};$('refresh').onclick=load;$('create').onclick=async()=>{let email=$('newEmail').value.trim(),password=$('newPass').value,name=$('newName').value.trim()||'Team Member',role=$('role').value;if(!email||password.length<8){$('msg').textContent='Valid email और कम से कम 8 character password जरूरी है।';return}let r=await S.auth.signUp({email,password});if(r.error){$('msg').textContent=r.error.message;return}if(!r.data.user){$('msg').textContent='User create नहीं हुआ।';return}let ins=await S.from('admin_users').insert({user_id:r.data.user.id,display_name:name,role});if(ins.error){$('msg').textContent=ins.error.message;return}$('msg').textContent='Team user created. यदि email confirmation enabled है तो user को email verify करना होगा।';$('newEmail').value='';$('newPass').value='';$('newName').value='';load()};let u=localStorage.getItem('yocewor_supabase_url'),k=localStorage.getItem('yocewor_supabase_key');if(u&&k){$('url').value=u;$('key').value=k;connect()}</script></body></html>
