<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Job Review</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#182235}.wrap{max-width:1000px;margin:24px auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #0001}.row{padding:9px 0;border-bottom:1px solid #e8edf3}button,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd5e0;border-radius:8px;margin-top:8px}button{background:#174a7c;color:#fff;font-weight:700;border:0}.reject{background:#8b1e1e}</style></head><body><main class="wrap"><div class="card"><h1>Recruitment Review Center</h1><p id="guard">Access checking…</p></div><section id="list"></section></main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',{auth:{persistSession:true,autoRefreshToken:true}});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me;async function init(){const {data:{user}}=await db.auth.getUser();if(!user)return deny('Login required.');const {data:a}=await db.from('admin_users').select('role,is_active').eq('user_id',user.id).maybeSingle();const role=String(a?.role||'').toLowerCase();if(a?.is_active===false||!['gm','admin','owner'].includes(role))return deny('GM, Admin or Owner access required.');me={id:user.id,role};document.getElementById('guard').textContent='Authorized as '+role;load()}function deny(x){document.getElementById('guard').textContent=x}async function load(){const {data,error}=await db.from('jobs').select('*').eq('published',false).order('created_at',{ascending:false});if(error)return document.getElementById('list').innerHTML='<div class="card">Unable to load drafts.</div>';const rows=data||[];document.getElementById('list').innerHTML=rows.length?rows.map(j=>`<article class="card"><h2>${esc(j.title)}</h2><div class="row"><b>Department:</b> ${esc(j.department)}</div><div class="row"><b>Start:</b> ${esc(j.start_date)}</div><div class="row"><b>Last Date:</b> ${esc(j.last_date)}</div><div class="row"><b>Eligibility:</b> ${esc(j.eligibility)}</div><div class="row"><b>Official Link:</b> ${esc(j.official_url)}</div><div class="row"><b>Details:</b> ${esc(j.details)}</div><textarea id="reason-${j.id}" placeholder="Rejection reason (required for reject)"></textarea><button onclick="review('${j.id}','approve')">Approve & Publish</button><button class="reject" onclick="review('${j.id}','reject')">Reject</button></article>`).join(''):'<div class="card">No unpublished jobs awaiting review.</div>'}async function review(id,action){const reason=document.getElementById('reason-'+id)?.value.trim()||null;if(action==='reject'&&!reason)return alert('Rejection reason required.');const {error}=await db.from('jobs').update(action==='approve'?{published:true,reviewed_by:me.id,reviewed_at:new Date().toISOString(),review_status:'approved'}:{reviewed_by:me.id,reviewed_at:new Date().toISOString(),review_status:'rejected',rejection_reason:reason}).eq('id',id).eq('published',false);if(error)alert(error.message);else load()}init().catch(()=>deny('Review center failed to load.'));</script></body></html>
