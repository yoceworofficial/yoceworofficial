<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Team Login</title><style>body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f3f6f9;color:#17202a}.top{background:#073b72;color:#fff;border-bottom:4px solid #f58220;padding:20px}.wrap{max-width:900px;width:92%;margin:auto}.card{background:#fff;margin:28px 0;padding:25px;border:1px solid #d7dee6;border-radius:10px;box-shadow:0 3px 12px #1b273315}.title{text-align:center;color:#073b72}.form{max-width:520px;margin:auto}.label{font-weight:700;color:#073b72;display:block;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #bcc7d1;border-radius:7px;font-size:15px}button{width:100%;border:0;border-radius:7px;padding:13px;background:#073b72;color:#fff;font-weight:bold;margin-top:12px;cursor:pointer}.msg{font-weight:bold;margin:12px 0;text-align:center}.info{background:#fff8e8;border:1px solid #edd49a;color:#725116;padding:12px;border-radius:7px;font-size:12px;line-height:1.6}.home{display:block;text-align:center;margin-top:18px;color:#073b72;font-weight:700;text-decoration:none}</style></head><body><header class="top"><div class="wrap"><b>YOCEWOR TEAM</b><div>सभी departments के लिए एक ही सुरक्षित login</div></div></header><main class="wrap"><section class="card"><h1 class="title">🔐 Team Login</h1><p style="text-align:center;color:#596773">अपनी Department Role चुनने की जरूरत नहीं—User ID से system अपने-आप सही dashboard खोलेगा।</p><div class="form"><label class="label">User ID</label><input id="uid" autocomplete="username" placeholder="अपनी User ID डालें"><label class="label">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="अपना Password डालें"><button onclick="login()">🔐 Login</button><div id="msg" class="msg"></div><div class="info"><b>Roles:</b> Owner • GM • Admin • Editor<br>Login के बाद आपकी backend role के अनुसार सही dashboard खुलेगा।</div><a class="home" href="index.html">← YOCEWOR Home</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn');async function login(){const uid=document.getElementById('uid').value.trim(),pw=document.getElementById('pw').value,msg=document.getElementById('msg');if(!uid||!pw){msg.textContent='User ID और Password दोनों जरूरी हैं।';return}msg.textContent='Login verify हो रहा है...';try{const r=await fetch('https://mzntgjyecymcpzciklfk.supabase.co/functions/v1/team-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,password:pw})});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'Login failed');if(!d.access_token||!d.refresh_token)throw Error('Secure session नहीं मिला।');const s=await db.auth.setSession({access_token:d.access_token,refresh_token:d.refresh_token});if(s.error)throw s.error;const role=String(d.role||'').toLowerCase();const routes={owner:'owner-control.html',gm:'gm.html',admin:'admin.html',editor:'editor.html'};if(!routes[role])throw Error('इस account की valid team role नहीं मिली।');sessionStorage.setItem('yocewor_team_session',JSON.stringify({user_id:uid,role,verified_at:new Date().toISOString()}));location.href=routes[role]}catch(e){msg.textContent='❌ '+(e.message||'Login failed')}}document.addEventListener('keydown',e=>{if(e.key==='Enter')login()})</script></body></html>
