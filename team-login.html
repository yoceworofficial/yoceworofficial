<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Team Login</title><style>body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#eef2f6;color:#17212b}.wrap{max-width:520px;width:92%;margin:40px auto}.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 18px #0001}.top{background:#073b72;color:#fff;padding:20px;text-align:center;border-bottom:4px solid #f58220}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 12px;border:1px solid #cbd5df;border-radius:8px}button{width:100%;padding:12px;border:0;border-radius:8px;background:#073b72;color:#fff;font-weight:800;cursor:pointer}.home{display:block;text-align:center;margin-top:18px;color:#073b72;font-weight:700;text-decoration:none}.msg{margin-top:12px;font-weight:700}</style></head><body><header class="top"><b>YOCEWOR TEAM</b><div>Secure Login</div></header><main class="wrap"><section class="card"><h2>🔐 Team Login</h2><p id="roleText">अपने Team credentials से continue करें।</p><input id="email" type="email" autocomplete="username" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="login">Login</button><div id="msg" class="msg"></div></section><a class="home" href="/">🏠 YOCEWOR Home</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn',{auth:{persistSession:true,autoRefreshToken:true}});const role=(new URLSearchParams(location.search).get('role')||'').toLowerCase();const $=id=>document.getElementById(id);if(role)$('roleText').textContent='Selected role: '+role.toUpperCase()+'. अपने credentials से login करें।';async function route(){const s=await db.auth.getSession();if(!s.data.session)return;const u=s.data.session.user;const a=await db.from('admin_users').select('role,is_active').eq('user_id',u.id).maybeSingle();const p=await db.from('profiles').select('role,account_status').eq('id',u.id).maybeSingle();const actual=(a.data?.role||p.data?.role||'').toLowerCase();if(a.data?.is_active===false||p.data?.account_status==='banned'){await db.auth.signOut();return}if(actual==='owner'){location.href='/owner-dashboard.html';return}if(['gm','admin'].includes(actual)){location.href='/admin.html';return}if(actual==='editor'){location.href='/team-requests.html';return}await db.auth.signOut();$('msg').textContent='यह account Team access के लिए authorized नहीं है।'}$('login').onclick=async()=>{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('msg').textContent=r.error.message;return}route()};route();</script></body></html>
