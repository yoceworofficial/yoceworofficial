<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Team Login</title><style>body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17212b}.top{background:#073b72;color:#fff;padding:18px 5%;border-bottom:4px solid #f58220}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:22px;margin:18px 0;box-shadow:0 2px 10px #0001}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{padding:22px;border:2px solid #d5dde5;border-radius:12px;background:#fff;cursor:pointer;text-align:center;font-weight:700}.choice:hover{border-color:#073b72}.owner{color:#7a4b00}.blue{color:#073b72}.green{color:#16844b}.purple{color:#6b3fa0}.hide{display:none}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 12px;border:1px solid #b9c5d0;border-radius:8px}button{width:100%;border:0;border-radius:8px;padding:13px;background:#073b72;color:#fff;font-weight:700;cursor:pointer}.back{background:#596773;margin-bottom:12px}.msg{font-weight:700;margin-top:12px}@media(max-width:550px){.choices{grid-template-columns:1fr}}</style></head><body><header class="top"><b>YOCEWOR TEAM LOGIN</b><br><small>Secure staff access</small></header><main class="wrap"><section id="choose" class="card"><h2>🔐 Login करें</h2><p>अपना department चुनें:</p><div class="choices"><div class="choice owner" onclick="openLogin('owner')">👑<br>OWNER LOGIN<br><small>Full Control • Team • Website</small></div><div class="choice green" onclick="openLogin('gm')">👔<br>GM LOGIN<br><small>Management • Publishing</small></div><div class="choice blue" onclick="openLogin('admin')">👤<br>ADMIN LOGIN<br><small>Jobs • Updates • Publishing</small></div><div class="choice purple" onclick="openLogin('editor')">✍️<br>EDITOR LOGIN<br><small>Content • Drafts • Updates</small></div></div></section><section id="form" class="card hide"><button class="back" onclick="back()">← वापस</button><h2 id="heading"></h2><p id="hint"></p><input id="email" type="email" placeholder="Email / User Email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button onclick="doLogin()">🔐 Login</button><div id="msg" class="msg"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn');let mode='';const $=id=>document.getElementById(id);function openLogin(m){mode=m;$('choose').classList.add('hide');$('form').classList.remove('hide');const t={owner:['👑 Owner Login','Owner account से Full Control Panel खोलें।'],gm:['👔 GM Login','Owner द्वारा बनाया गया GM account से login करें।'],admin:['👤 Admin Login','Admin account से Jobs, Updates और Publishing manage करें।'],editor:['✍️ Editor Login','Editor account से permitted content और drafts manage करें।']};$('heading').textContent=t[m][0];$('hint').textContent=t[m][1];$('email').focus()}function back(){mode='';$('form').classList.add('hide');$('choose').classList.remove('hide');$('msg').textContent=''}async function doLogin(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('msg').textContent='Email और password दोनों भरें।';return}$('msg').textContent='Login हो रहा है...';const r=await db.auth.signInWithPassword({email,password});if(r.error){$('msg').textContent='Login failed: '+r.error.message;return}try{const {data:{user}}=await db.auth.getUser();const {data:row}=await db.from('admin_users').select('role').eq('user_id',user.id).maybeSingle();if(mode==='owner'){if((user.email||'').toLowerCase()!=='yoceworofficial@gmail.com'||row?.role!=='owner')throw new Error('Owner access denied');location.href='/owner-control.html?v=5';return}if(!row||row.role!==mode){await db.auth.signOut();$('msg').textContent='इस account को '+mode.toUpperCase()+' department की अनुमति नहीं है।';return}location.href=mode==='gm'?'/gm.html?v=2':'/admin.html?v=2'}catch(e){$('msg').textContent=e.message||'Login verification failed';}}</script></body></html>
