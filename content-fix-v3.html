<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Content</title><style>body{margin:0;font-family:system-ui,Arial;background:#f4f7fb;color:#172235}.wrap{max-width:1100px;margin:auto;padding:16px}.top{background:#102a43;color:#fff;padding:18px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.nav a,.btn{padding:10px 13px;border-radius:10px;font-weight:800;text-decoration:none;cursor:pointer;border:0}.nav a{color:#fff;border:1px solid #ffffff33}.btn{background:#102a43;color:#fff}.card{background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.input{width:100%;padding:11px;border:1px solid #ccd6e2;border-radius:9px;margin-top:6px;background:#fff;font:inherit}.field{margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.builder{border:1px solid #dfe6ee;border-radius:12px;padding:14px;margin:14px 0;background:#fbfcfe}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:9px 0;align-items:center}.linkrow{display:grid;grid-template-columns:1fr 1.4fr .8fr auto;gap:8px;align-items:center;margin:9px 0}.sectionrow,.faqrow{display:grid;gap:8px;margin:9px 0;padding:10px;border:1px solid #e1e6ed;border-radius:10px;background:#fff}.preview{border:1px solid #dfe6ee;border-radius:16px;padding:22px;background:#fff}.preview h1{font-size:30px}.tag{display:inline-block;padding:5px 10px;border-radius:999px;background:#eef3f8;font-size:12px;font-weight:800}.pubsec{border-top:1px solid #e7ebf0;margin-top:22px;padding-top:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #dfe5ec;padding:10px;text-align:left}.table th{background:#f7f9fc;width:38%}.linkbtn{display:inline-block;padding:9px 14px;border-radius:9px;background:#102a43;color:#fff;text-decoration:none;font-weight:800}.muted{color:#68778b;font-size:13px}.hidden{display:none}@media(max-width:650px){.row,.linkrow{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.preview h1{font-size:24px}}</style></head><body><header class="top"><div class="wrap"><h1 style="margin:0">📝 CONTENT</h1><div>YOCEWOR Content Management</div><nav class="nav"><a href="/owner-dashboard.html">🏠 Home</a><a href="/dashboard.html">📊 Dashboard</a><a href="/team-management-live.html">👥 Team</a><a href="/departments.html">🏢 Departments</a><a href="/content.html">📝 Content</a></nav></div></header><main class="wrap"><section class="card"><a class="btn" href="/owner-dashboard.html">← Back to Owner Home</a></section><section class="card"><h2>➕ Create Content</h2><div class="field"><label>🏷️ Content Type</label><select id="type" class="input"><option>Recruitment</option><option>Result</option><option>Admit Card</option><option>Answer Key</option><option>Exam / Syllabus</option><option>Exam / Date</option><option>Admission</option><option>Scholarship</option><option>Government Scheme</option><option>General Notice</option></select></div><div class="field"><label>Title</label><input id="title" class="input"></div><div class="field"><label>Short Description</label><textarea id="short" class="input" rows="3"></textarea></div><div class="grid"><div class="field"><label>Department</label><input id="department" class="input"></div><div class="field"><label>Category / Tags</label><input id="categoryInput" class="input"></div></div><div class="field"><label>Main Content / Introduction</label><textarea id="main" class="input" rows="6"></textarea></div><div class="builder"><div class="head"><h3>📊 Overview</h3><button id="addOverview" class="btn" type="button">＋ Add Row</button></div><div id="overview"></div></div><div class="builder"><div class="head"><h3>📅 Important Dates</h3><button id="addDate" class="btn" type="button">＋ Add Date</button></div><div id="dates"></div></div><div class="grid"><div class="field"><label>Eligibility / Qualification</label><textarea id="eligibility" class="input" rows="4"></textarea></div><div class="field"><label>Application Fee</label><textarea id="fee" class="input" rows="4"></textarea></div><div class="field"><label>Selection Process</label><textarea id="selection" class="input" rows="4"></textarea></div></div><div class="field"><label>How to Apply / How to Check</label><textarea id="how" class="input" rows="5"></textarea></div><div class="field"><label>Documents / Additional Information</label><textarea id="docs" class="input" rows="5"></textarea></div><div class="builder"><div class="head"><h3>📚 Detailed Sections</h3><button id="addSection" class="btn" type="button">＋ Add Section</button></div><div id="sections"></div></div><div class="builder"><div class="head"><h3>🔗 Important Links</h3><button id="addLink" class="btn" type="button">＋ Add Link</button></div><div id="links"></div></div><div class="builder"><div class="head"><h3>🎥 YouTube Video</h3><button id="addYoutube" class="btn" type="button">＋ Add Video</button></div><div id="youtube"></div></div><div class="builder"><div class="head"><h3>❓ FAQ</h3><button id="addFaq" class="btn" type="button">＋ Add Question</button></div><div id="faqs"></div></div><div class="grid"><div class="field"><label>Publish Date</label><input id="publishDate" class="input" type="date"></div><div class="field"><label>Last Date</label><input id="lastDate" class="input" type="date"></div><div class="field"><label>Permanent URL / Slug</label><input id="slug" class="input"></div></div><div class="actions"><button id="draft" class="btn" type="button">🟡 Save Draft</button><button id="previewBtn" class="btn" type="button">👁️ Preview</button><button id="publish" class="btn" type="button">📤 Submit / Publish</button></div><p id="msg" class="muted"></p></section><section id="previewCard" class="card hidden"><h2>👁️ Public Preview</h2><div id="preview" class="preview"></div></section><section class="card"><h2>📋 Content List</h2><div id="list" class="muted">No content created yet.</div></section></main><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),br=s=>esc(s).replaceAll('\n','<br>');let items=[];try{items=JSON.parse(localStorage.getItem('yocewor_content')||'[]')}catch(e){}let editId=null;function add(parent,html){const t=document.createElement('template');t.innerHTML=html.trim();$(parent).append(t.content.firstElementChild)}function overview(a='',b=''){add('overview','<div class="row ov"><input class="input k" placeholder="Label"><input class="input val" placeholder="Value"><button class="btn rm" type="button">✕</button></div>');let x=document.querySelector('#overview .ov:last-child');x.querySelector('.k').value=a;x.querySelector('.val').value=b}function dateRow(a='',b=''){add('dates','<div class="row dt"><input class="input k" placeholder="Date / Event"><input class="input val" placeholder="Details"><button class="btn rm" type="button">✕</button></div>');let x=document.querySelector('#dates .dt:last-child');x.querySelector('.k').value=a;x.querySelector('.val').value=b}function section(a='',b=''){add('sections','<div class="sectionrow"><input class="input sh" placeholder="Section heading"><textarea class="input sv" rows="5" placeholder="Section content / points"></textarea><button class="btn rm" type="button">✕ Remove Section</button></div>');let x=document.querySelector('#sections .sectionrow:last-child');x.querySelector('.sh').value=a;x.querySelector('.sv').value=b}function link(a='',b='',c=''){add('links','<div class="linkrow"><input class="input ln" placeholder="Link name"><input class="input lu" type="url" placeholder="https://..."><input class="input lb" placeholder="Button Text"><button class="btn rm" type="button">✕</button></div>');let x=document.querySelector('#links .linkrow:last-child');x.querySelector('.ln').value=a;x.querySelector('.lu').value=b;x.querySelector('.lb').value=c||'Open Link'}function yt(a='',b=''){add('youtube','<div class="row"><input class="input yn" placeholder="Video title"><input class="input yu" type="url" placeholder="YouTube URL"><button class="btn rm" type="button">✕</button></div>');let x=document.querySelector('#youtube .row:last-child');x.querySelector('.yn').value=a;x.querySelector('.yu').value=b}function faq(a='',b=''){add('faqs','<div class="faqrow"><input class="input fq" placeholder="Question"><textarea class="input fa" rows="3" placeholder="Answer"></textarea><button class="btn rm" type="button">✕ Remove Question</button></div>');let x=document.querySelector('#faqs .faqrow:last-child');x.querySelector('.fq').value=a;x.querySelector('.fa').value=b}function pairs(sel,a,b){return[...document.querySelectorAll(sel)].map(x=>[x.querySelector(a)?.value.trim()||'',x.querySelector(b)?.value.trim()||'']).filter(x=>x[0]||x[1])}function collect(){const o={id:editId||Date.now(),type:val('type'),status:'Draft',updated:new Date().toISOString()};['title','short','department','categoryInput','main','eligibility','fee','selection','how','docs','publishDate','lastDate','slug'].forEach(k=>o[k]=val(k));o.overview=pairs('.ov','.k','.val');o.dates=pairs('.dt','.k','.val');o.sections=pairs('.sectionrow','.sh','.sv');o.links=[...document.querySelectorAll('.linkrow')].map(x=>[x.querySelector('.ln').value.trim(),x.querySelector('.lu').value.trim(),x.querySelector('.lb').value.trim()]).filter(x=>x[0]||x[1]);o.youtube=pairs('#youtube .row','.yn','.yu');o.faqs=pairs('.faqrow','.fq','.fa');return o}function save(status){const o=collect();o.status=status;items=items.filter(x=>x.id!==o.id);items.unshift(o);localStorage.setItem('yocewor_content',JSON.stringify(items));editId=o.id;render();$('msg').textContent=status==='Draft'?'✅ Draft saved.':'🟡 Submitted for publication.'}function preview(){const o=collect();let h='<span class="tag">'+esc(o.type)+'</span><h1>'+esc(o.title||'Untitled publication')+'</h1>';if(o.short)h+='<p>'+br(o.short)+'</p>';const sec=(t,b)=>b?'<section class="pubsec"><h3>'+t+'</h3>'+b+'</section>':'';if(o.main)h+=sec('About this update','<p>'+br(o.main)+'</p>');if(o.overview.length)h+=sec('📊 Overview','<table class="table">'+o.overview.map(x=>'<tr><th>'+esc(x[0])+'</th><td>'+br(x[1])+'</td></tr>').join('')+'</table>');if(o.dates.length)h+=sec('📅 Important Dates','<table class="table">'+o.dates.map(x=>'<tr><th>'+esc(x[0])+'</th><td>'+br(x[1])+'</td></tr>').join('')+'</table>');[['eligibility','🎓 Eligibility / Qualification'],['fee','💰 Application Fee'],['selection','🧾 Selection Process'],['how','📝 How to Apply / How to Check'],['docs','📄 Additional Information']].forEach(x=>{if(o[x[0]])h+=sec(x[1],'<p>'+br(o[x[0]])+'</p>')});o.sections.forEach(x=>{if(x[0]||x[1])h+=sec(esc(x[0]),'<p>'+br(x[1])+'</p>')});if(o.links.length)h+=sec('🔗 Important Links',o.links.filter(x=>x[1]).map(x=>'<p><strong>'+esc(x[0])+'</strong><br><a class="linkbtn" target="_blank" rel="noopener" href="'+esc(x[1])+'">'+esc(x[2]||'Open Link')+'</a></p>').join(''));if(o.youtube.length)h+=sec('🎥 Related Video',o.youtube.filter(x=>x[1]).map(x=>'<p><a class="linkbtn" target="_blank" rel="noopener" href="'+esc(x[1])+'">▶️ '+esc(x[0]||'YouTube Video')+'</a></p>').join(''));if(o.faqs.length)h+=sec('❓ Frequently Asked Questions',o.faqs.filter(x=>x[0]||x[1]).map(x=>'<p><b>'+esc(x[0])+'</b><br>'+br(x[1])+'</p>').join(''));$('preview').innerHTML=h;$('previewCard').classList.remove('hidden')}function render(){$('list').innerHTML=items.map(x=>'<div class="row"><div><b>'+esc(x.title||'Untitled')+'</b><div class="muted">'+esc(x.type)+' • '+esc(x.status)+'</div></div><button class="btn edit" type="button" data-id="'+x.id+'">Edit / View</button></div>').join('')||'<span class="muted">No content created yet.</span>';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>load(Number(b.dataset.id)))}function load(id){const o=items.find(x=>x.id===id);if(!o)return;editId=o.id;['title','short','department','categoryInput','main','eligibility','fee','selection','how','docs','publishDate','lastDate','slug'].forEach(k=>$(k).value=o[k]||'');$('type').value=o.type||'Recruitment';['overview','dates','sections','links','youtube','faqs'].forEach(id=>$(id).replaceChildren());(o.overview||[]).forEach(x=>overview(x[0],x[1]));(o.dates||[]).forEach(x=>dateRow(x[0],x[1]));(o.sections||[]).forEach(x=>section(x[0],x[1]));(o.links||[]).forEach(x=>link(x[0],x[1],x[2]));(o.youtube||[]).forEach(x=>yt(x[0],x[1]));(o.faqs||[]).forEach(x=>faq(x[0],x[1]));scrollTo({top:0,behavior:'smooth'})}document.addEventListener('click',e=>{if(e.target.classList.contains('rm'))e.target.closest('.row,.sectionrow,.faqrow,.linkrow')?.remove()});$('addOverview').onclick=()=>overview();$('addDate').onclick=()=>dateRow();$('addSection').onclick=()=>section();$('addLink').onclick=()=>link();$('addYoutube').onclick=()=>yt();$('addFaq').onclick=()=>faq();$('draft').onclick=()=>save('Draft');$('publish').onclick=()=>save('Pending');$('previewBtn').onclick=preview;render();overview();dateRow();section();link();yt();faq()})();</script></body></html>
