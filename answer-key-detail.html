und:#566b7c}.copy{background:#7c4db0;border:0;cursor:pointer}.card{padding:18px;margin-bottom:15px}.card h2{margin:0 0 12px;color:var(--navy);font-size:20px;border-bottom:2px solid #edf2f6;padding-bottom:8px}.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:1px solid #d9e5ef;border-radius:11px;padding:12px;background:#f9fbfd}.item b{display:block;color:#6b7b8c;font-size:11px;margin-bottom:2px}.item strong{display:block;color:#082f55;font-size:14px}.dategrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dateitem{border:1px solid #d9e5ef;border-left:4px solid var(--orange);border-radius:10px;padding:11px;background:#fbfcfd}.dateitem b{display:block;color:#617384;font-size:12px}.dateitem strong{color:#082f55;font-size:14px}.subbox{border:1px solid #dce5ec;border-radius:11px;padding:13px 14px;background:#fbfcfd;margin-top:10px}.subbox:first-child{margin-top:0}.subbox h3{margin:0 0 6px;color:#1267a6;font-size:16px}.steps{margin:0;padding-left:22px}.steps li{margin:7px 0}.notice{background:var(--warn);border-left:4px solid #e1a000;border-radius:8px;padding:13px 14px;color:#5c470f}.faq{border:1px solid #dce5ec;border-radius:10px;padding:12px 13px;margin-top:9px;background:#fbfcfd}.faq:first-child{margin-top:0}.faq b{display:block;color:var(--navy);margin-bottom:4px}.social-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.social{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid #d9e5ef;border-radius:10px;text-decoration:none;font-weight:900;font-size:13px;background:#f9fbfd;color:#082f55}.social small{display:block;font-weight:700;color:#657482;margin-left:6px}.linkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.linkbox{border:1px solid #d9e5ef;border-radius:11px;padding:12px;background:#f9fbfd}.linkbox b{display:block;color:#082f55;font-size:14px;margin-bottom:8px}.linkbox .btn{width:100%;background:var(--navy)}.empty{color:var(--muted)}.error{color:#7a2e2e;background:#fff4f4;border:1px solid #f0caca;border-radius:10px;padding:13px}.footer{text-align:center;color:#72808b;font-size:12px;padding:24px 0 40px}@media(max-width:560px){.wrap{width:94%}.topin{padding:11px 0}.logo{width:40px;height:40px}.brand strong{font-size:20px}.back{font-size:11px;padding:6px 8px}.hero-main{padding:16px}.hero h1{font-size:25px}.info,.dategrid,.social-grid,.linkgrid{grid-template-columns:1fr}.actions .btn{flex:1 1 45%}.card{padding:15px}}</style></head><body><header class="top"><div class="wrap topin"><div class="logo">Y</div><div class="brand"><strong>YOCEWOR</strong><small>सरकारी भर्ती एवं सूचना पोर्टल</small></div><a class="back" href="answer-key.html">← Answer Key</a></div></header><main class="wrap" id="app"><div class="card">उत्तर कुंजी की जानकारी लोड हो रही है…</div></main><footer class="footer">© 2026 YOCEWOR • सरकारी भर्ती एवं सूचना पोर्टल</footer><script>(async()=>{const app=document.getElementById('app');const fail=m=>{app.innerHTML='<section class="card"><h2>YOCEWOR</h2><div class="error">'+String(m||'उत्तर कुंजी की जानकारी लोड नहीं हो सकी।')+'</div></section>'};try{if(!window.supabase||typeof window.supabase.createClient!=='function')throw Error('Supabase service लोड नहीं हुई।');const db=window.supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn');const p=new URLSearchParams(location.search);const id=(p.get('id')||'').trim();const pathSlug=(p.get('slug')||location.pathname.split('/').filter(Boolean).pop()||'').trim();if(!id&&!pathSlug)throw Error('Answer Key link missing');const fields='id,title,type,slug,published,department,notification_url,result_url,short_description,description,main_content,overview,important_dates,detailed_sections,faqs,how_to_apply,important_documents,fee,selection_process,important_links';let q=db.from('jobs').select(fields).eq('published',true);q=id?q.eq('id',id):q.eq('slug',decodeURIComponent(pathSlug));const timeout=new Promise((_,rej)=>setTimeout(()=>rej(Error('जानकारी लोड होने में समय लग रहा है। कृपया पेज को एक बार refresh करें।')),10000));const result=await Promise.race([q.maybeSingle(),timeout]);if(result.error)throw result.error;const j=result.data;if(!j)throw Error('Published Answer Key नहीं मिली।');if(String(j.type||'').toLowerCase().replace(/[-\s]+/g,'_')!=='answer_key')throw Error('यह Answer Key update नहीं है।');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=s=>String(s??'').replace(/\\n/g,'\n').trim();const arr=v=>Array.isArray(v)?v:[];const card=(title,body)=>'<section class="card"><h2>'+title+'</h2>'+body+'</section>';const text=s=>{const t=clean(s);return t?t.split(/\n+/).filter(Boolean).map(x=>'<p>'+esc(x.trim())+'</p>').join(''):'<div class="empty">जानकारी उपलब्ध नहीं है।</div>'};const pairs=(v,cls='item')=>arr(v).map(x=>'<div class="'+cls+'"><b>'+esc(x[0])+'</b><strong>'+esc(x[1])+'</strong></div>').join('');const official=j.notification_url||j.result_url||'';const share=location.href;const overview=pairs(j.overview);const dates=pairs(j.important_dates,'dateitem');const details=arr(j.detailed_sections).map(x=>'<div class="subbox"><h3>'+esc(x[0])+'</h3>'+text(x[1])+'</div>').join('');const faqs=arr(j.faqs).map(x=>'<div class="faq"><b>❓ '+esc(x[0])+'</b><div>'+esc(x[1])+'</div></div>').join('');const steps=clean(j.how_to_apply).split(/\n+/).map(x=>x.replace(/^\d+[.)]\s*/,'').trim()).filter(Boolean).map(x=>'<li>'+esc(x)+'</li>').join('');const docs=clean(j.important_documents).split(/\n+/).filter(Boolean).map(x=>'<div class="item"><strong>'+esc(x.replace(/^[-•]\s*/,''))+'</strong></div>').join('');const socials='<div class="social-grid"><a class="social" href="https://www.instagram.com/yocewor" target="_blank" rel="noopener">📸 Instagram <small>@yocewor</small></a><a class="social" href="https://whatsapp.com/channel/0029VaNA3EBJf05WBdLb1y2n" target="_blank" rel="noopener">🟢 WhatsApp Channel</a><a class="social" href="https://chat.whatsapp.com/D6eEuFsxR0PHslMu8XWZfr" target="_blank" rel="noopener">💬 WhatsApp Group</a><a class="social" href="https://t.me/YOCEWOR" target="_blank" rel="noopener">✈️ Telegram <small>@YOCEWOR</small></a></div>';const links=arr(j.important_links).filter(x=>Array.isArray(x)&&x[1]).map(x=>'<div class="linkbox"><b>🔗 '+esc(x[0]||'Official Link')+'</b><a class="btn" href="'+esc(x[1])+'" target="_blank" rel="noopener">'+esc(x[2]||'Open Official Link')+' ↗</a></div>').join('');document.title=(j.title||'Answer Key')+' — YOCEWOR';app.innerHTML='<div class="crumb"><a href="index.html">होम</a> / <a href="answer-key.html">Answer Key</a> / उत्तर कुंजी विवरण</div><article class="hero"><div class="hero-main"><span class="badge">🔑 Answer Key / उत्तर कुंजी</span><h1>'+esc(j.title)+'</h1><p class="lead">'+esc(j.short_description||j.description||'परीक्षा की उत्तर कुंजी से संबंधित महत्वपूर्ण जानकारी।')+'</p><div class="actions">'+(official?'<a class="btn official" href="'+esc(official)+'" target="_blank" rel="noopener">📄 Official Source ↗</a>':'')+'<a class="btn share" href="https://wa.me/?text='+encodeURIComponent(j.title+' '+share)+'" target="_blank" rel="noopener">💬 शेयर करें</a><button class="btn copy" id="copyBtn">🔗 लिंक कॉपी करें</button></div></div></article>'+card('📌 एक नजर में','<div class="info">'+(overview||'<div class="empty">जानकारी उपलब्ध नहीं है।</div>')+'</div>')+card('📅 महत्वपूर्ण तिथियाँ','<div class="dategrid">'+(dates||'<div class="empty">तिथियाँ उपलब्ध नहीं हैं।</div>')+'</div>')+card('📖 उत्तर कुंजी से जुड़ी जानकारी',details||text(j.main_content||j.description))+card('🔐 Answer Key और Response Sheet कैसे देखें?',steps?'<ol class="steps">'+steps+'</ol>':'<div class="empty">प्रक्रिया उपलब्ध नहीं है।</div>')+card('🧮 संभावित स्कोर',text(arr(j.detailed_sections).find(x=>String(x[0]).includes('स्कोर'))?.[1]||'सही उत्तर और गलत उत्तर की संख्या के आधार पर अनुमानित स्कोर निकाला जा सकता है। अंतिम अंक आधिकारिक नियमों के अनुसार मान्य होंगे।'))+card('📑 जरूरी जानकारी / दस्तावेज','<div class="info">'+(docs||'<div class="empty">अतिरिक्त जानकारी उपलब्ध नहीं है।</div>')+'</div>')+card('💰 शुल्क',text(j.fee))+card('🎯 आगे की प्रक्रिया',text(j.selection_process))+card('❓ अक्सर पूछे जाने वाले सवाल',faqs||'<div class="empty">FAQ उपलब्ध नहीं है।</div>')+card('🔗 महत्वपूर्ण आधिकारिक लिंक',links?'<div class="linkgrid">'+links+'</div>':(official?'<div class="actions" style="margin-top:0"><a class="btn official" href="'+esc(official)+'" target="_blank" rel="noopener">📄 Official Source ↗</a></div>':'<div class="empty">आधिकारिक लिंक उपलब्ध नहीं है।</div>'))+card('📲 YOCEWOR से जुड़े रहें',socials)+card('⚠️ जरूरी सावधानी','<div class="notice">उत्तर कुंजी provisional हो सकती है। Objection की अंतिम तारीख, शुल्क, login link और अन्य अंतिम निर्देश संबंधित official portal के अनुसार ही मान्य होंगे। अपने login credentials किसी अनधिकृत व्यक्ति या वेबसाइट के साथ साझा न करें। यह पेज आवेदन/भर्ती आवेदन पेज नहीं है।</div>');const copy=document.getElementById('copyBtn');copy.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);alert('लिंक कॉपी हो गया।')}catch(e){alert('लिंक कॉपी नहीं हो सका।')}}}catch(e){fail(e?.message||e)}})();</script></body></html>
