<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Owner Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#182235}.top{background:#102a43;color:#fff;padding:18px 22px}.wrap{max-width:1200px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 16px #0001}.n{font-size:30px;font-weight:800}.muted{color:#65758b;font-size:13px}.section{margin-top:22px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e8edf3}.danger{color:#b42318}button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer}</style></head><body><header class="top"><div class="wrap"><b>YOCEWOR</b><div>Owner Control Center</div></div></header><main class="wrap"><div id="guard" class="card">Owner access verify हो रहा है…</div><div id="app" style="display:none"><div class="grid"><div class="card"><div class="muted">आज के Events</div><div id="today" class="n">—</div></div><div class="card"><div class="muted">7 दिन</div><div id="week" class="n">—</div></div><div class="card"><div class="muted">30 दिन</div><div id="month" class="n">—</div></div><div class="card"><div class="muted">Total Jobs</div><div id="jobs" class="n">—</div></div><div class="card"><div class="muted">Published Jobs</div><div id="pub" class="n">—</div></div><div class="card"><div class="muted">Open Tickets</div><div id="tickets" class="n">—</div></div></div><div class="section card"><h3>Team Status</h3><div id="team">Loading…</div></div><div class="section card"><h3>Recent Audit Activity</h3><div id="audit">Loading…</div></div></div></main><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn',{auth:{persistSession:true,autoRefreshToken:true}});const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function count(table,filters){let q=db.from(table).select('*',{count:'exact',head:true});for(const [k,v] of filters||[])q=q.gte(k,v);const r=await q;return r.count||0}async function main(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='department-login.html';return}const p=await db.from('profiles').select('username,display_name,role,account_status').eq('id',user.id).maybeSingle();const a=await db.from('admin_users').select('role,is_active,username,display_name').eq('user_id',user.id).maybeSingle();const role=(a.data?.role||p.data?.role||'').toLowerCase();if(role!=='owner'||a.data?.is_active===false||p.data?.account_status==='banned'){document.getElementById('guard').innerHTML='<b class="danger">Access denied</b><br>Owner account required.';return}document.getElementById('guard').innerHTML='<b>Owner verified</b> — '+esc(a.data?.display_name||p.data?.display_name||'Owner');document.getElementById('app').style.display='block';const now=new Date(),d1=new Date(now-864e5),d7=new Date(now-7*864e5),d30=new Date(now-30*864e5);document.getElementById('today').textContent=await count('site_analytics_events',[['occurred_at',d1.toISOString()]]);document.getElementById('week').textContent=await count('site_analytics_events',[['occurred_at',d7.toISOString()]]);document.getElementById('month').textContent=await count('site_analytics_events',[['occurred_at',d30.toISOString()]]);const j=await db.from('jobs').select('published',{count:'exact'});document.getElementById('jobs').textContent=j.count||0;const jp=await db.from('jobs').select('id',{count:'exact',head:true}).eq('published',true);document.getElementById('pub').textContent=jp.count||0;const tk=await db.from('support_tickets').select('id',{count:'exact',head:true}).not('status','in','(closed,resolved)');document.getElementById('tickets').textContent=tk.count||0;const tm=await db.from('admin_users').select('role,is_active,username,display_name').order('role');document.getElementById('team').innerHTML=(tm.data||[]).map(x=>`<div class="row"><span>${esc(x.display_name||x.username||'User')}</span><span>${esc(x.role)} · ${x.is_active?'Active':'Blocked'}</span></div>`).join('')||'No team users';const al=await db.from('team_audit_log').select('actor_role,action,created_at').order('created_at',{ascending:false}).limit(12);document.getElementById('audit').innerHTML=(al.data||[]).map(x=>`<div class="row"><span>${esc(x.action)}</span><span>${esc(x.actor_role)} · ${new Date(x.created_at).toLocaleString()}</span></div>`).join('')||'No audit activity'}main().catch(e=>{console.error(e);document.getElementById('guard').textContent='Dashboard data load failed. Please retry.'});</script></body></html>
