9Dw_Eryr6Usn');async function setup(){const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value,m=document.getElementById('msg'),b=document.getElementById('btn');m.className='msg';if(p1.length<8||p1!==p2){m.classList.add('err');m.textContent='❌ Password कम से कम 8 characters का हो और दोनों समान हों।';return}b.disabled=true;b.textContent='⏳ Account activate हो रहा है...';try{const r=await db.functions.invoke('owner-setup',{body:{action:'setup',password:p1}});if(r.error)throw r.error;if(r.data?.error)throw Error(r.data.error);const login=await db.auth.signInWithPassword({email:'yoceworofficial@gmail.com',password:p1});if(login.error)throw login.error;m.classList.add('ok');m.textContent='✅ Owner account successfully activated. Dashboard खोला जा रहा है...';setTimeout(()=>location.href='owner-control.html',700)}catch(e){b.disabled=false;b.textContent='🔐 Owner Account Activate करें';m.classList.add('err');m.textContent='❌ '+(e.message||'Setup failed')}}</script></body></html>
