<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>YOCEWOR Content Manager</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.owner-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.owner-nav a{color:#fff;text-decoration:none;padding:9px 12px;border:1px solid #ffffff33;border-radius:10px;font-size:13px;font-weight:800}.owner-nav a.active{background:#fff;color:#102a43}.status{display:inline-flex;padding:6px 10px;border-radius:20px;background:#e9f7ef;color:#16844b;font-weight:800;font-size:12px}.frame{width:100%;height:calc(100vh - 170px);min-height:760px;border:0;display:block;background:#f3f6fa}@media(max-width:650px){.owner-nav{display:grid;grid-template-columns:1fr 1fr}.owner-nav a{text-align:center}.frame{height:calc(100vh - 220px)}}.error{color:#b42318;font-weight:800}</style><style id="yocewor-featured-image-complete-css">.yo-featured-image{margin:0 0 22px;border:1px solid #d6e1e8;border-radius:12px;overflow:hidden;background:#f7fafc}.yo-featured-image img{display:block;width:100%;max-height:430px;object-fit:cover}@media(max-width:700px){.yo-featured-image{margin-bottom:16px;border-radius:10px}.yo-featured-image img{max-height:260px;object-fit:cover}}</style></head><body><header class="top"><div class="wrap"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><h1 style="margin:0">📝 YOCEWOR CONTENT MANAGER</h1><div id="subtitle" style="color:#dbe8f5;font-size:13px">Department Content Control Center</div></div><span id="role" class="status">VERIFYING…</span></div><nav class="owner-nav" id="ownerContentNav"></nav></div></header><main class="wrap"><section id="guard" class="card" style="background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 16px #0001">Access verify हो रहा है…</section><section id="app" style="display:none"><iframe id="contentFrame" class="frame" src="/content-live-fixed.html?gm=1&embedded=1" title="YOCEWOR Content Management"></iframe></section></main><script src="/owner-auth.js?content-v8"></script><script>const $=id=>document.getElementById(id);let editOnly=location.hash==='#edit';function renderSingleNav(role,auth){const n=$("ownerContentNav");n.innerHTML='';const links=role==='owner'?[['🏠 Home','/owner-dashboard.html'],['📊 Dashboard','/dashboard.html'],['👥 Team','/team-management-live.html'],['📝 Content','/content.html'],['✏️ Edit Content','/content.html#edit'],['🏢 Departments','/departments.html'],['📢 Important Notice','/important-notice.html'],['🔴 Live Notice','/live-notice.html'],['⚙️ Settings','/settings.html'],['🧾 Activity / Audit','/activity-audit.html']]:role==='gm'?[['🏠 Home','/gm-dashboard.html'],['👥 Users','/team-requests.html'],['📝 Content','/content.html'],['📊 Reports','/job-review.html'],['🛠️ Admins','/admin.html']]:role==='admin'?[['🏠 Home','/admin-dashboard.html'],['📝 Content','/content.html'],['📊 Reports','/job-review.html']]:[['🏠 Home','/owner-dashboard.html'],['📝 Content','/content.html']];links.forEach(([t,u])=>{const a=document.createElement('a');a.href=u;a.textContent=t;if(location.pathname===u&&(!u.includes('#')||editOnly===u.endsWith('#edit')))a.className='active';n.append(a)});const lo=document.createElement('a');lo.href='/';lo.textContent='🚪 Logout';lo.onclick=async e=>{e.preventDefault();await auth.signOut();location.href='/'};n.append(lo)}function hideEmbeddedHeader(){const f=$("contentFrame");try{const d=f.contentDocument||f.contentWindow.document;if(!d)return;let s=d.getElementById("yocewor-embedded-cleanup");if(!s){s=d.createElement("style");s.id="yocewor-embedded-cleanup";s.textContent="html body>header.top,body>header.top,.topbar+nav,.top>.wrap>nav{display:none!important}body{padding-top:0!important}"+(editOnly?"#manager>section.card:nth-child(2){display:none!important}#manager>section.card:nth-child(3){display:block!important}":"");(d.head||d.documentElement).appendChild(s)}if(editOnly){const list=d.getElementById('list');if(list){list.scrollIntoView({behavior:'auto',block:'start'})}}}catch(e){}}async function boot(){try{const auth=window.YOCEWOR_AUTH;if(!auth)throw Error('Authentication service unavailable.');const me=await auth.requireRole(['owner','gm','admin','editor']);const role=String(me?.role||'').toLowerCase();$('guard').style.display='none';$('app').style.display='block';$('role').textContent='● '+role.toUpperCase()+' ACTIVE';$('subtitle').textContent=role==='gm'?'General Management Content Control Center':role==='admin'?'Administration Content Control Center':'Content Control Center';renderSingleNav(role,auth);const f=$('contentFrame');f.addEventListener('load',()=>{hideEmbeddedHeader();setTimeout(hideEmbeddedHeader,100);setTimeout(hideEmbeddedHeader,500)});setTimeout(hideEmbeddedHeader,100)}catch(e){$('guard').innerHTML='<span class="error">'+e.message+'</span><br><br><button onclick="location.reload()">Retry</button>'}}boot()</script><!-- YOCEWOR_FEATURED_IMAGE_COMPLETE_V1 -->
</body></html>
