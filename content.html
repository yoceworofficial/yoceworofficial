<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR Content Management</title><style>body{font-family:system-ui;margin:0}.card{padding:20px}.input{width:100%;padding:10px;box-sizing:border-box}.builder{padding:15px;border:1px solid #ddd;margin:15px 0}.btn{padding:10px 14px;border:0;border-radius:8px;background:#0b5577;color:white;font-weight:700}.image-preview{max-width:100%;max-height:320px;border-radius:12px;margin-top:10px;display:none}</style></head><body><main class="card"><section class="builder"><h3>🖼️ Featured Image</h3><p>भर्ती/विज्ञप्ति के लिए एक मुख्य फोटो लगाएँ। खाली छोड़ने पर public page पर फोटो नहीं दिखेगी।</p><input id="featuredImage" class="input" type="file" accept="image/*"><img id="imagePreview" class="image-preview" alt="Featured image preview"></section><button id="save" class="btn">Save</button></main><script>const input=document.getElementById('featuredImage'),preview=document.getElementById('imagePreview');input.addEventListener('change',()=>{const f=input.files?.[0];if(!f){preview.style.display='none';return}if(!f.type.startsWith('image/')){input.value='';preview.style.display='none';return}const r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block';localStorage.setItem('yocewor_featured_image',r.result)};r.readAsDataURL(f)});const old=localStorage.getItem('yocewor_featured_image');if(old){preview.src=old;preview.style.display='block'}document.getElementById('save').onclick=()=>alert('Featured image saved');</script></body></html>
