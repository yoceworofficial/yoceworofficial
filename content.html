<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12355b"><title>YOCEWOR Content Management</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f3f6fa;color:#172235}.wrap{max-width:1120px;margin:auto;padding:16px}.top{background:#12355b;color:#fff;padding:18px 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.nav a,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 13px;border-radius:10px;font-weight:800;text-decoration:none;cursor:pointer;border:0}.nav a{color:#fff;border:1px solid #ffffff44}.btn{background:#12355b;color:#fff}.btn.secondary{background:#fff;color:#12355b;border:1px solid #cbd6e2}.btn.danger{background:#8b2635}.card,.builder{background:#fff;border:1px solid #dce4ed;border-radius:16px;padding:18px;margin:14px 0}.builder{background:#f9fbfd}.field{margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.input{display:block;width:100%;padding:11px 12px;border:1px solid #cbd6e2;border-radius:9px;margin-top:6px;background:#fff;font:inherit;color:inherit}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.head h3{margin:0}.row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(220px,1.2fr) auto;gap:8px;margin:9px 0;align-items:center}.linkrow{display:grid;grid-template-columns:minmax(170px,1fr) minmax(240px,1.4fr) minmax(130px,.8fr) auto;gap:8px;align-items:center;margin:9px 0}.sectionrow,.faqrow{display:grid;gap:8px;margin:9px 0;padding:10px;border:1px solid #dfe6ee;border-radius:10px;background:#fff}.actions,.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.preview{border:1px solid #d6e0ea;border-radius:18px;padding:24px;background:#fff;max-width:900px;margin:auto}.preview h1{font-size:32px;line-height:1.25}.preview p{line-height:1.75}.tag{display:inline-block;padding:6px 11px;border-radius:999px;background:#e9f0f7;color:#12355b;font-size:12px;font-weight:800}.pubsec{border-top:1px solid #e3e9ef;margin-top:24px;padding-top:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #d8e1ea;padding:11px;text-align:left;vertical-align:top}.table th{background:#f4f7fa;width:38%}.linklist{display:grid;gap:10px}.linkitem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid #dce4ed;border-radius:11px;background:#f9fbfd}.linkbtn{display:inline-flex;padding:9px 14px;border-radius:9px;background:#12355b;color:#fff;text-decoration:none;font-weight:800}.muted{color:#68778b;font-size:13px}.status{padding:8px 11px;border-radius:9px;background:#eef4f8}.listitem{padding:14px 0;border-bottom:1px solid #e8edf2}.listitem:last-child{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:8px;font-size:12px;font-weight:800;background:#eef4f8;margin-left:6px}@media(max-width:650px){.wrap{padding:12px}.head{align-items:flex-start;flex-direction:column}.row,.linkrow{grid-template-columns:1fr;min-width:0}.preview{padding:17px}.preview h1{font-size:25px}.linkitem{align-items:flex-start;flex-direction:column}.actions .btn,.item-actions .btn{flex:1 1 140px}}</style></head><body><header class="top"><div class="wrap"><h1 style="margin:0">📝 CONTENT</h1><div>YOCEWOR Content Management</div><nav class="nav"><a href="/owner-dashboard.html">🏠 Home</a><a href="/dashboard.html">📊 Dashboard</a><a href="/team-management-live.html">👥 Team</a><a href="/departments.html">🏢 Departments</a><a href="/content.html">📝 Content</a></nav></div></header><main class="wrap"><section class="card"><a class="btn secondary" href="/owner-dashboard.html">← Back to Owner Home</a></section><section class="card"><h2>➕ Create / Edit Content</h2><div class="field"><label>🏷️ Content Type</label><select id="type" class="input"><option>Recruitment</option><option>Result</option><option>Admit Card</option><option>Answer Key</option><option>Exam / Syllabus</option><option>Exam / Date</option><option>Admission</option><option>Scholarship</option><option>Government Scheme</option><option>General Notice</option></select></div><div class="field"><label>Title</label><input id="title" class="input"></div><div class="field"><label>Short Description</label><textarea id="short" class="input" rows="3"></textarea></div><div class="grid"><div class="field"><label>Department</label><input id="department" class="input"></div><div class="field"><label>Category / Tags</label><input id="categoryInput" class="input"></div></div><div class="field"><label>Main Content / Introduction</label><textarea id="main" class="input" rows="6"></textarea></div><div class="builder"><div class="head"><h3>📊 Overview</h3><button id="addOverview" class="btn" type="button">＋ Add Row</button></div><div id="overview"></div></div><div class="builder"><div class="head"><h3>📅 Important Dates</h3><button id="addDate" class="btn" type="button">＋ Add Date</button></div><div id="dates"></div></div><div class="grid"><div class="field"><label>Eligibility / Qualification</label><textarea id="eligibility" class="input" rows="4"></textarea></div><div class="field"><label>Application Fee</label><textarea id="fee" class="input" rows="4"></textarea></div><div class="field"><label>Selection Process</label><textarea id="selection" class="input" rows="4"></textarea></div></div><div class="field"><label>How to Apply / How to Check</label><textarea id="how" class="input" rows="5"></textarea></div><div class="field"><label>Documents / Additional Information</label><textarea id="docs" class="input" rows="5"></textarea></div><div class="builder"><div class="head"><h3>📚 Detailed Sections</h3><button id="addSection" class="btn" type="button">＋ Add Section</button></div><div id="sections"></div></div><div class="builder"><div class="head"><h3>🔗 Important Links</h3><button id="addLink" class="btn" type="button">＋ Add Link</button></div><div id="links"></div></div><div class="builder"><div class="head"><h3>🎥 YouTube Video</h3><button id="addYoutube" class="btn" type="button">＋ Add Video</button></div><div id="youtube"></div></div><div class="builder"><div class="head"><h3>❓ FAQ</h3><button id="addFaq" class="btn" type="button">＋ Add Question</button></div><div id="faqs"></div></div><div class="grid"><div class="field"><label>Publish Date</label><input id="publishDate" class="input" type="date"></div><div class="field"><label>Last Date</label><input id="lastDate" class="input" type="date"></div><div class="field"><label>Permanent URL / Slug</label><input id="slug" class="input"></div></div><div class="actions"><button id="draft" class="btn" type="button">🟡 Save Draft</button><button id="previewBtn" class="btn" type="button">👁️ Preview</button><button id="publish" class="btn" type="button">📤 Publish / Update</button><button id="cancelEdit" class="btn secondary" type="button">✖ Cancel Edit</button></div><p id="msg" class="muted status"></p></section><section id="previewCard" class="card" hidden><h2>👁️ Public Preview</h2><div id="preview" class="preview"></div></section><section class="card"><h2>📋 Content Management</h2><div id="list" class="muted">No content created yet.</div></section></main><script>(()=>{const $=id=>document.getElementById(id),val=id=>$(id)?.value?.trim()||'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),br=s=>esc(s).replace(/\n/g,'<br>');const STORE='yocewor_content',BACKUP='yocewor_content_backup',AUTO='yocewor_content_autosave';let items=[],editId=null;function readStore(){try{const a=JSON.parse(localStorage.getItem(STORE)||'[]');if(Array.isArray(a))return a}catch(e){}try{const a=JSON.parse(localStorage.getItem(BACKUP)||'[]');if(Array.isArray(a))return a}catch(e){}return[]}items=readStore();function persist(){const raw=JSON.stringify(items);localStorage.setItem(STORE,raw);localStorage.setItem(BACKUP,raw)}function add(parent,html){const t=document.createElement('template');t.innerHTML=html.trim();$(parent).append(t.content.firstElementChild)}function pairRow(a,b,cls,pa,pb){add(parent,'')}function overview(a='',b=''){add('overview','<div class="row ov"><input class="input k" placeholder="Label"><input class="input v" placeholder="Value"><button class="btn danger rm" type="button">✕</button></div>');let x=$('overview').lastElementChild;x.querySelector('.k').value=a;x.querySelector('.v').value=b}function dateRow(a='',b=''){add('dates','<div class="row dt"><input class="input k" placeholder="Date / Event"><input class="input v" placeholder="Details"><button class="btn danger rm" type="button">✕</button></div>');let x=$('dates').lastElementChild;x.querySelector('.k').value=a;x.querySelector('.v').value=b}function section(a='',b=''){add('sections','<div class="sectionrow"><input class="input sh" placeholder="Section heading"><textarea class="input sv" rows="5" placeholder="Section content / points"></textarea><button class="btn danger rm" type="button">✕ Remove Section</button></div>');let x=$('sections').lastElementChild;x.querySelector('.sh').value=a;x.querySelector('.sv').value=b}function link(a='',b='',c=''){add('links','<div class="linkrow"><input class="input ln" placeholder="Link name"><input class="input lu" type="url" placeholder="https://..."><input class="input lb" placeholder="Button Text"><button class="btn danger rm" type="button">✕</button></div>');let x=$('links').lastElementChild;x.querySelector('.ln').value=a;x.querySelector('.lu').value=b;x.querySelector('.lb').value=c||'Open Link'}function yt(a='',b=''){add('youtube','<div class="row"><input class="input yn" placeholder="Video title"><input class="input yu" type="url" placeholder="YouTube URL"><button class="btn danger rm" type="button">✕</button></div>');let x=$('youtube').lastElementChild;x.querySelector('.yn').value=a;x.querySelector('.yu').value=b}function faq(a='',b=''){add('faqs','<div class="faqrow"><input class="input fq" placeholder="Question"><textarea class="input fa" rows="3" placeholder="Answer"></textarea><button class="btn danger rm" type="button">✕ Remove Question</button></div>');let x=$('faqs').lastElementChild;x.querySelector('.fq').value=a;x.querySelector('.fa').value=b}function pairs(sel,a,b){return[...document.querySelectorAll(sel)].map(x=>[x.querySelector(a)?.value.trim()||'',x.querySelector(b)?.value.trim()||'']).filter(x=>x[0]||x[1])}function collect(){const o={id:editId||Date.now(),type:val('type'),status:'Draft',updated:new Date().toISOString()};['title','short','department','categoryInput','main','eligibility','fee','selection','how','docs','publishDate','lastDate','slug'].forEach(k=>o[k]=val(k));o.overview=pairs('.ov','.k','.v');o.dates=pairs('.dt','.k','.v');o.sections=pairs('.sectionrow','.sh','.sv');o.links=[...document.querySelectorAll('.linkrow')].map(x=>[x.querySelector('.ln').value.trim(),x.querySelector('.lu').value.trim(),x.querySelector('.lb').value.trim()]).filter(x=>x[0]||x[1]||x[2]);o.youtube=pairs('#youtube .row','.yn','.yu');o.faqs=pairs('.faqrow','.fq','.fa');return o}function clearForm(){editId=null;['title','short','department','categoryInput','main','eligibility','fee','selection','how','docs','publishDate','lastDate','slug'].forEach(k=>$(k).value='');$('type').value='Recruitment';['overview','dates','sections','links','youtube','faqs'].forEach(k=>$(k).replaceChildren());overview();dateRow();section();link();yt();faq();$('previewCard').hidden=true;$('msg').textContent='';}function save(status){const o=collect();o.status=status;const idx=items.findIndex(x=>String(x.id)===String(o.id));if(idx>=0)items[idx]=o;else items.unshift(o);persist();editId=o.id;localStorage.removeItem(AUTO);render();$('msg').textContent=status==='Draft'?'✅ Draft updated safely.': '✅ Content published/updated successfully.'}function load(id){const o=items.find(x=>String(x.id)===String(id));if(!o)return;editId=o.id;['title','short','department','categoryInput','main','eligibility','fee','selection','how','docs','publishDate','lastDate','slug'].forEach(k=>$(k).value=o[k]||'');$('type').value=o.type||'Recruitment';['overview','dates','sections','links','youtube','faqs'].forEach(k=>$(k).replaceChildren());(o.overview||[]).forEach(x=>overview(x[0],x[1]));(o.dates||[]).forEach(x=>dateRow(x[0],x[1]));(o.sections||[]).forEach(x=>section(x[0],x[1]));(o.links||[]).forEach(x=>link(x[0],x[1],x[2]));(o.youtube||[]).forEach(x=>yt(x[0],x[1]));(o.faqs||[]).forEach(x=>faq(x[0],x[1]));$('msg').textContent='✏️ Editing existing content — Save Draft will update the same item.';scrollTo({top:0,behavior:'smooth'})}function removeItem(id){const o=items.find(x=>String(x.id)===String(id));if(!o)return;if(!confirm('क्या आप इस content को स्थायी रूप से हटाना चाहते हैं?'))return;items=items.filter(x=>String(x.id)!==String(id));persist();if(String(editId)===String(id))clearForm();render();$('msg').textContent='🗑️ Content deleted.'}function preview(){const o=collect();let h='<span class="tag">'+esc(o.type)+'</span><h1>'+esc(o.title||'Untitled publication')+'</h1>';if(o.publishDate||o.lastDate)h+='<p class="muted">'+(o.publishDate?'Published: '+esc(o.publishDate):'')+(o.lastDate?' • Last date: '+esc(o.lastDate):'')+'</p>';if(o.short)h+='<p>'+br(o.short)+'</p>';const sec=(t,b)=>b?'<section class="pubsec"><h3>'+t+'</h3>'+b+'</section>':'';if(o.main)h+=sec('About this update','<p>'+br(o.main)+'</p>');if(o.overview.length)h+=sec('📊 Overview','<table class="table"><tbody>'+o.overview.map(x=>'<tr><th>'+esc(x[0])+'</th><td>'+br(x[1])+'</td></tr>').join('')+'</tbody></table>');if(o.dates.length)h+=sec('📅 Important Dates','<table class="table"><tbody>'+o.dates.map(x=>'<tr><th>'+esc(x[0])+'</th><td>'+br(x[1])+'</td></tr>').join('')+'</tbody></table>');[['eligibility','🎓 Eligibility / Qualification'],['fee','💰 Application Fee'],['selection','🧾 Selection Process'],['how','📝 How to Apply / How to Check'],['docs','📄 Additional Information']].forEach(x=>{if(o[x[0]])h+=sec(x[1],'<p>'+br(o[x[0]])+'</p>')});o.sections.forEach(x=>{if(x[0]||x[1])h+=sec(esc(x[0]),'<p>'+br(x[1])+'</p>')});const ls=o.links.filter(x=>x[1]);if(ls.length)h+=sec('🔗 Important Links','<div class="linklist">'+ls.map(x=>'<div class="linkitem"><strong>'+esc(x[0]||'Important Link')+'</strong><a class="linkbtn" target="_blank" rel="noopener noreferrer" href="'+esc(x[1])+'">'+esc(x[2]||'Open Link')+'</a></div>').join('')+'</div>');const ys=o.youtube.filter(x=>x[1]);if(ys.length)h+=sec('🎥 Related Video',ys.map(x=>'<p><a class="linkbtn" target="_blank" rel="noopener noreferrer" href="'+esc(x[1])+'">▶️ '+esc(x[0]||'YouTube Video')+'</a></p>').join(''));const fs=o.faqs.filter(x=>x[0]||x[1]);if(fs.length)h+=sec('❓ Frequently Asked Questions',fs.map(x=>'<p><b>'+esc(x[0])+'</b><br>'+br(x[1])+'</p>').join(''));$('preview').innerHTML=h;$('previewCard').hidden=false;$('previewCard').scrollIntoView({behavior:'smooth',block:'start'})}function render(){$('list').innerHTML=items.map(x=>'<div class="listitem"><div><b>'+esc(x.title||'Untitled')+'</b><span class="badge">'+esc(x.status||'Draft')+'</span><div class="muted">'+esc(x.type||'')+' • '+(x.updated?new Date(x.updated).toLocaleString('en-IN'): '')+'</div></div><div class="item-actions"><button class="btn secondary edit" type="button" data-id="'+esc(x.id)+'">✏️ Edit / View</button><button class="btn danger del" type="button" data-id="'+esc(x.id)+'">🗑️ Delete</button></div></div>').join('')||'<span class="muted">No content created yet.</span>'}document.addEventListener('click',e=>{if(e.target.classList.contains('rm')){e.target.closest('.row,.sectionrow,.faqrow,.linkrow')?.remove();autosave()}if(e.target.classList.contains('edit'))load(e.target.dataset.id);if(e.target.classList.contains('del'))removeItem(e.target.dataset.id)});function autosave(){try{localStorage.setItem(AUTO,JSON.stringify(collect()))}catch(e){}}[['addOverview',overview],['addDate',dateRow],['addSection',section],['addLink',link],['addYoutube',yt],['addFaq',faq]].forEach(([id,fn])=>$(id).onclick=()=>{fn();autosave()});$('draft').onclick=()=>save('Draft');$('publish').onclick=()=>save('Published');$('previewBtn').onclick=preview;$('cancelEdit').onclick=clearForm;document.addEventListener('input',()=>{clearTimeout(window.__yoAuto);window.__yoAuto=setTimeout(autosave,400)});render();if(!document.querySelector('#overview .ov')){overview();dateRow();section();link();yt();faq()}})();</script></body></html>
