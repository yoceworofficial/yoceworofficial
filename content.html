<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>YOCEWOR Content Manager</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.nav a{color:#fff;text-decoration:none;padding:9px 12px;border:1px solid #ffffff33;border-radius:10px;font-size:13px;font-weight:800}.nav a.active{background:#fff;color:#102a43}.status{display:inline-flex;padding:6px 10px;border-radius:20px;background:#e9f7ef;color:#16844b;font-weight:800;font-size:12px}.frame{width:100%;height:calc(100vh - 170px);min-height:760px;border:0;display:block;background:#f3f6fa}@media(max-width:650px){.nav{display:grid;grid-template-columns:1fr 1fr}.nav a{text-align:center}.frame{height:calc(100vh - 220px)}}.error{color:#b42318;font-weight:800}</style></head><body><header class="top"><div class="wrap"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><h1 style="margin:0">📝 YOCEWOR CONTENT MANAGER</h1><div id="subtitle" style="color:#dbe8f5;font-size:13px">Department Content Control Center</div></div><span id="role" class="status">VERIFYING…</span></div><nav class="nav" id="nav"></nav></div></header><main class="wrap"><section id="guard" class="card" style="background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 16px #0001">Access verify हो रहा है…</section><section id="app" style="display:none"><iframe id="contentFrame" class="frame" src="/content-live-fixed.html?gm=1" title="YOCEWOR Content Management"></iframe></section></main><script src="/owner-auth.js?content-v3"></script><script>const $=id=>document.getElementById(id);function add(h,t,u,active=false){const a=document.createElement('a');a.href=u;a.textContent=t;if(active)a.className='active';$('nav').append(a)}async function boot(){try{const auth=window.YOCEWOR_AUTH;if(!auth)throw Error('Authentication service unavailable.');const me=await auth.me();const role=String(me?.role||'').toLowerCase();if(!['owner','gm','admin','editor'].includes(role))throw Error('Content access not allowed.');$('guard').style.display='none';$('app').style.display='block';$('role').textContent='● '+role.toUpperCase()+' ACTIVE';$('subtitle').textContent=role==='gm'?'General Management Content Control Center':role==='admin'?'Administration Content Control Center':'Content Control Center';if(role==='gm'){add('','🏠 Home','/gm-dashboard.html',true);add('','👥 Users','/team-requests.html');add('','📝 Content','/content.html',true);add('','📊 Reports','/job-review.html');add('','🛠️ Admins','/admin.html')}else if(role==='admin'){add('','🏠 Home','/admin-dashboard.html',true);add('','📝 Content','/content.html',true);add('','📊 Reports','/job-review.html')}else{add('','🏠 Home','/owner-dashboard.html',true);add('','📝 Content','/content.html',true)}add('','🚪 Logout','/',false);$('nav').lastElementChild.onclick=async e=>{e.preventDefault();await auth.signOut();location.href='/'};const f=$('contentFrame');f.addEventListener('load',()=>{try{const d=f.contentDocument||f.contentWindow.document;const s=d.createElement('style');s.textContent='.top{display:none!important}#logoutBtn{display:none!important}#manager>.card:first-child{display:none!important}';d.head.appendChild(s)}catch(e){}})}catch(e){$('guard').innerHTML='<span class="error">'+e.message+'</span><br><br><button onclick="location.reload()">Retry</button>'}}boot()</script></body></html>
