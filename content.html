<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Content</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6fa;color:#172235}.top{background:#102a43;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.nav a,.btn{padding:10px 13px;border-radius:10px;font-weight:800;text-decoration:none;cursor:pointer;border:0}.nav a{color:#fff;border:1px solid #ffffff33}.active,.btn{background:#102a43;color:#fff}.card{background:#fff;border:1px solid #e3e8ef;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat strong{display:block;font-size:28px;margin-top:5px}.muted{color:#68778b;font-size:13px}.input{width:100%;padding:11px;border:1px solid #ccd6e2;border-radius:9px;margin-top:6px;background:#fff}.field{margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-weight:800}.listrow{padding:13px 0;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;gap:12px;align-items:center}.hidden{display:none}.preview{border:1px solid #e1e6ed;border-radius:12px;padding:18px;background:#fff}.preview h1{margin-top:0}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef3f8;font-size:12px;font-weight:800}@media(max-width:650px){.listrow{flex-direction:column;align-items:flex-start}}</style></head><body><header class="top"><div class="wrap"><h1 style="margin:0">📝 CONTENT</h1><div>YOCEWOR Content Management</div><nav class="nav"><a href="/owner-dashboard.html">🏠 Home</a><a href="/dashboard.html">📊 Dashboard</a><a href="/team-management-live.html">👥 Team</a><a href="/departments.html">🏢 Departments</a><a class="active" href="/content.html">📝 Content</a></nav></div></header><main class="wrap"><section class="card"><a class="btn" href="/owner-dashboard.html">← Back to Owner Home</a></section><section class="card"><h2>📊 Content Status</h2><div class="grid"><div class="stat">📝 Drafts<strong id="draftCount">0</strong></div><div class="stat">🟡 Pending<strong id="pendingCount">0</strong></div><div class="stat">🟢 Published<strong id="publishedCount">0</strong></div><div class="stat">⚫ Expired / Previous<strong id="expiredCount">0</strong></div></div></section><section class="card"><h2>🔎 Find Content</h2><input id="search" class="input" placeholder="Search title"><div class="grid"><select id="category" class="input"><option value="all">All Categories</option><option>Recruitment</option><option>Result</option><option>Admit Card</option><option>Answer Key</option><option>Exam / Date</option><option>Admission</option><option>Scholarship</option><option>Government Scheme</option><option>General Notice</option></select><select id="statusFilter" class="input"><option value="all">All Status</option><option>Draft</option><option>Pending</option><option>Published</option><option>Expired</option></select></div></section><section class="card"><h2>➕ Create Content</h2><div class="field"><label>🏷️ Content Type</label><select id="type" class="input"><option value="Recruitment">📢 Recruitment</option><option value="Result">📊 Result</option><option value="Admit Card">🎫 Admit Card</option><option value="Answer Key">📋 Answer Key</option><option value="Exam / Date">📅 Exam / Date</option><option value="Admission">🎓 Admission</option><option value="Scholarship">💰 Scholarship</option><option value="Government Scheme">🏛️ Government Scheme</option><option value="General Notice">📰 General Notice</option></select></div><div class="field"><label>Title</label><input id="title" class="input"></div><div class="field"><label>Short Description</label><textarea id="short" class="input" rows="3"></textarea></div><div class="grid"><div class="field"><label>Department</label><input id="department" class="input"></div><div class="field"><label>Category</label><input id="categoryInput" class="input"></div></div><div class="field"><label>Main Content</label><textarea id="main" class="input" rows="7"></textarea></div><div class="grid"><div class="field"><label>Important Dates</label><textarea id="dates" class="input" rows="4"></textarea></div><div class="field"><label>Eligibility / Qualification</label><textarea id="eligibility" class="input" rows="4"></textarea></div></div><div class="grid"><div class="field"><label>Application Fee</label><textarea id="fee" class="input" rows="3"></textarea></div><div class="field"><label>Selection Process</label><textarea id="selection" class="input" rows="3"></textarea></div></div><div class="field"><label>How to Apply / How to Check</label><textarea id="how" class="input" rows="4"></textarea></div><div class="field"><label>Documents / Additional Information</label><textarea id="docs" class="input" rows="4"></textarea></div><div class="grid"><div class="field"><label>Notification / Download Link</label><input id="notification" class="input" type="url"></div><div class="field"><label>Apply / Result Link</label><input id="apply" class="input" type="url"></div><div class="field"><label>Official Website</label><input id="official" class="input" type="url"></div></div><div class="grid"><div class="field"><label>Publish Date</label><input id="publishDate" class="input" type="date"></div><div class="field"><label>Last Date</label><input id="lastDate" class="input" type="date"></div><div class="field"><label>Permanent URL / Slug</label><input id="slug" class="input" placeholder="example-title-2026"></div></div><div class="actions"><button class="btn" onclick="saveDraft()">🟡 Save Draft</button><button class="btn" onclick="preview()">👁️ Preview</button><button class="btn" onclick="submitPending()">📤 Submit / Publish</button></div><p id="msg" class="muted"></p></section><section id="previewCard" class="card hidden"><h2>👁️ Public Preview</h2><div id="preview" class="preview"></div></section><section class="card"><h2>📋 Content List</h2><div id="list"><span class="muted">No content created in this browser yet.</span></div></section></main><script>const $=id=>document.getElementById(id),fields=['title','short','department','categoryInput','main','dates','eligibility','fee','selection','how','docs','notification','apply','official','publishDate','lastDate','slug'];let items=JSON.parse(localStorage.getItem('yocewor_content')||'[]');function val(id){return $(id).value.trim()}function collect(){const o={id:Date.now(),type:val('type'),status:'Draft',updated:new Date().toISOString(),lastUpdated:new Date().toLocaleDateString('en-IN'),};fields.forEach(k=>o[k]=val(k));return o}function save(status){const o=collect();o.status=status;items=items.filter(x=>x.id!==o.id);items.unshift(o);localStorage.setItem('yocewor_content',JSON.stringify(items));render();$('msg').textContent=status==='Draft'?'✅ Draft saved.':'🟡 Submitted as Pending. Public publish will require the live backend workflow.'}function saveDraft(){save('Draft')}function submitPending(){save('Pending')}function preview(){const o=collect();let h='<span class="tag">'+esc(o.type)+'</span><h1>'+esc(o.title||'Untitled publication')+'</h1>';const blocks=[['short','Overview'],['dates','Important Dates'],['eligibility','Eligibility / Qualification'],['fee','Application Fee'],['selection','Selection Process'],['how','How to Apply / How to Check'],['docs','Documents / Additional Information']];blocks.forEach(([k,n])=>{if(o[k])h+='<section><h3>'+n+'</h3><p>'+esc(o[k]).replace(/\n/g,'<br>')+'</p></section>'});let links='';[['notification','Notification / Download'],['apply','Apply / Result'],['official','Official Website']].forEach(([k,n])=>{if(o[k])links+='<p><a href="'+esc(o[k])+'" target="_blank" rel="noopener">🔗 '+n+'</a></p>'});if(links)h+='<section><h3>Important Links</h3>'+links+'</section>';if(o.publishDate||o.lastDate)h+='<p class="muted">'+(o.publishDate?'Published: '+esc(o.publishDate)+' ':'')+(o.lastDate?'Last Date: '+esc(o.lastDate):'')+'</p>';if(o.slug)h+='<p class="muted">Permanent URL: /'+esc(o.slug)+'/</p>';$('preview').innerHTML=h;$('previewCard').classList.remove('hidden')}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('search').value.toLowerCase(),cat=$('category').value,st=$('statusFilter').value;const f=items.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(cat==='all'||x.type===cat)&&(st==='all'||x.status===st));$('draftCount').textContent=items.filter(x=>x.status==='Draft').length;$('pendingCount').textContent=items.filter(x=>x.status==='Pending').length;$('publishedCount').textContent=items.filter(x=>x.status==='Published').length;$('expiredCount').textContent=items.filter(x=>x.status==='Expired').length;$('list').innerHTML=f.map(x=>'<div class="listrow"><div><b>'+esc(x.title||'Untitled')+'</b><div class="muted">'+esc(x.type)+' • '+esc(x.status)+' • Updated '+esc(x.lastUpdated)+'</div></div><button class="btn" onclick="loadItem('+x.id+')">Edit / View</button></div>').join('')||'<span class="muted">No matching content.</span>'}function loadItem(id){const o=items.find(x=>x.id===id);if(!o)return;Object.keys(o).forEach(k=>$(k)&&($(k).value=o[k]));preview();scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}$('search').oninput=render;$('category').onchange=render;$('statusFilter').onchange=render;render();</script></body></html>
