is_active,full_name,designation,department_id,joining_date').eq('user_id',user.id).maybeSingle();if(!a?.is_active||!['owner','gm','admin','editor'].includes(String(a.role).toLowerCase())){st.textContent='Unauthorized or inactive account.';return}const {data:c}=await db.from('team_id_cards').select('card_number').eq('user_id',user.id).maybeSingle();document.getElementById('name').textContent=a.full_name||'—';document.getElementById('uid').textContent=user.id;document.getElementById('role').textContent=a.role;document.getElementById('designation').textContent=a.designation||'—';document.getElementById('department').textContent=a.department_id||'—';document.getElementById('joining').textContent=a.joining_date||'—';document.getElementById('cardno').textContent=c?.card_number||'—';document.getElementById('card').hidden=false;st.remove()})()</script></main></body></html>
