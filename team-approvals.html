<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOCEWOR — Team Approvals</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1000px;margin:24px auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:#667085}button,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd5e0;border-radius:8px}button{margin-top:8px;background:#174a7c;color:white;font-weight:700;border:0}.reject{background:#8b1e1e}.reason{min-height:70px;margin-top:8px}</style></head><body><main class="wrap"><div class="card"><h1>Team Approval Center</h1><p id="auth" class="muted">Checking authorization…</p></div><section id="list"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://mzntgjyecymcpzciklfk.supabase.co','sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr4Usn',{auth:{persistSession:true,autoRefreshToken:true}});let me=null;async function init(){const {data:{user}}=await db.auth.getUser();if(!user)return deny();const {data:r}=await db.from('admin_users').select('role,is_active').eq('user_id',user.id).maybeSingle();if(!r?.is_active||!['owner','gm'].includes(r.role))return deny();me={...r,user};document.getElementById('auth').textContent='Signed in as '+r.role;await load()}function deny(){document.getElementById('auth').textContent='Unauthorized — Owner or GM only.'}async function load(){const {data,error}=await db.from('team_requests').select('*').eq('status','pending').order('created_at',{ascending:false});const el=document.getElementById('list');if(error){el.innerHTML='<div class="card">Unable to load requests.</div>';return}const rows=(data||[]).filter(x=>me.role==='owner'?x.requested_role==='admin':x.requested_role==='editor');el.innerHTML=rows.length?rows.map(x=>`<div class="card"><h2>${esc(x.requested_role)} request</h2><div class="grid"><div><b>Name</b><br>${esc(x.full_name)}</div><div><b>Username</b><br>${esc(x.username)}</div><div><b>Official Email</b><br>${esc(x.official_email||x.email||'')}</div><div><b>Phone</b><br>${esc(x.phone||x.mobile||'')}</div><div><b>Address</b><br>${esc(x.address||'')}</div><div><b>Designation</b><br>${esc(x.designation||'')}</div><div><b>Joining Date</b><br>${esc(x.joining_date||'')}</div><div><b>Department</b><br>${esc(x.department_id||'')}</div></div><p><b>Notes / KYC</b><br>${esc(x.notes||x.kyc_details||'')}</p><textarea class="reason" id="reason-${x.id}" placeholder="Rejection reason (required for reject)"></textarea><button onclick="decide('${x.id}','approve')">Approve & Create Account</button><button class="reject" onclick="decide('${x.id}','reject')">Reject</button></div>`).join(''):'<div class="card">No pending requests.</div>'}async function decide(id,decision){const reason=document.getElementById('reason-'+id)?.value.trim()||null;if(decision==='reject'&&!reason)return alert('Rejection reason required.');const {data:{session}}=await db.auth.getSession();if(!session)return alert('Login required');const {data,error}=await db.functions.invoke('team-management',{body:{action:decision==='approve'?'approve_request':'reject_request',request_id:id,...(decision==='reject'?{reason}: {})}});if(error||data?.error){alert(data?.error||error.message);return}if(decision==='approve'&&data?.data?.password)alert('Account created. User ID: '+data.data.user_id+'\nTemporary password: '+data.data.password+'\nCard: '+data.data.card_number);else alert('Request rejected.');load()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();</script></body></html>
