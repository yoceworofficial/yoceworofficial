('#file').files[0];if(!body&&!file)return toast('Write something or add an image');let image_url=null;if(file){if(!file.type.startsWith('image/'))return toast('Only images are supported');if(file.size>8*1024*1024)return toast('Image must be under 8MB');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'');const path=me.id+'/'+Date.now()+'-'+safe;const up=await db.storage.from('yocewor-media').upload(path,file,{cacheControl:'3600',upsert:false});if(up.error)return toast(up.error.message);image_url=db.storage.from('yocewor-media').getPublicUrl(path).data.publicUrl}const r=await db.from('posts').insert({user_id:me.id,body:body||null,image_url});if(r.error)return toast(r.error.message);toast('Posted to YOCEWOR');renderHome()}function bindPostActions(){document.querySelectorAll('[data-like]').forEach(b=>b.onclick=async()=>{const r=await db.from('likes').insert({post_id:b.dataset.like,user_id:me.id});if(r.error)return toast('Like could not be saved');b.textContent='♥ Liked';b.disabled=true});document.querySelectorAll('[data-comment]').forEach(b=>b.onclick=()=>toast('Comments are being connected to the live social layer.'));document.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{const url=location.href.split('#')[0]+'#post-'+b.dataset.share;if(navigator.share)await navigator.share({title:'YOCEWOR',text:'Check this post on YOCEWOR',url});else{await navigator.clipboard?.writeText(url);toast('Post link copied')}})}function explore(){return '<div class="card" style="padding:22px"><h2 style="margin-top:0">Explore</h2><p class="muted">Find people and voices.</p><div class="search"><input id="search" class="field" placeholder="Search name or username"><button id="searchBtn" class="btn primary">Search</button></div><div id="results" style="margin-top:16px"></div></div>'}async function runSearch(){const q=$('#search').value.trim();if(!q)return;const r=await db.from('profiles').select('*').or('username.ilike.%'+q+'%,display_name.ilike.%'+q+'%').limit(20);if(r.error)re
