<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07040f"><title>YOCEWOR — Your Voice. Your World.</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--a:#ff6a00;--b:#ff2f7e;--c:#7c4dff;--bg:#07040f;--line:#2b3047;--muted:#a7acc1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}button,input{font:inherit}.splash,.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.splash{text-align:center;background:radial-gradient(circle at 50% 34%,#291044 0,transparent 36%),radial-gradient(circle at 100% 50%,#171047 0,transparent 34%),linear-gradient(180deg,#05020a,#09030f)}.splash-inner{width:min(92vw,720px)}.logo{width:min(92vw,560px);max-height:390px;object-fit:contain}.tag{font-size:clamp(20px,4vw,30px);font-weight:800;margin:8px 0 28px}.a{color:var(--a)}.p{color:var(--b)}.enter,.primary{border:0;border-radius:15px;padding:13px 24px;color:#fff;font-weight:900;background:linear-gradient(100deg,var(--a),var(--b));cursor:pointer}.small,.muted{color:var(--muted);font-size:12px;margin-top:14px}.auth{display:none;background:radial-gradient(circle at 15% 0,#291046 0,transparent 35%),radial-gradient(circle at 100% 30%,#16104b 0,transparent 34%),var(--bg)}.card{width:min(520px,100%);background:#111526f7;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 70px #0007}.brand{font-size:21px;font-weight:950;margin-bottom:22px}.brand span{background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;color:transparent}.mark{width:72px;height:72px;margin:0 auto 15px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#ffb300,#ff2f7e,#7c4dff);font-weight:1000;font-size:36px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 12px}.btn,.field{width:100%;border:1px solid var(--line);border-radius:13px;background:#151a2b;color:#fff;padding:12px}.btn{font-weight:850;cursor:pointer}.active{background:#20263a}.field{margin:5px 0;outline:0}.link{border:0;background:transparent;color:#79b7ff;text-decoration:underline;padding:8px 0;cursor:pointer}.msg{min-height:20px;margin-top:10px;color:var(--muted);font-size:13px;text-align:center;white-space:pre-wrap}.error{color:#ff8da5}.success{color:#65e6a2}.hint{font-size:11px;color:#858ca3;margin:4px 2px 8px}.otpbox{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:16px 0}.otpbox input{width:100%;height:58px;text-align:center;font-size:24px;font-weight:950;border:1px solid var(--line);border-radius:12px;background:#151a2b;color:#fff}.mailbox{padding:12px;border:1px solid var(--line);border-radius:13px;background:#151a2b;text-align:center;font-size:13px;line-height:1.45}.timer{text-align:center;color:var(--muted);font-size:13px;margin:8px 0}.verify{text-align:center}.icon{font-size:44px}.hidden{display:none!important}@media(max-width:560px){.card{padding:19px}.otpbox{gap:5px}.otpbox input{height:52px;font-size:21px}}</style></head><body><section id="welcome" class="splash"><div class="splash-inner"><img class="logo" src="yocewor-logo.svg" alt="YOCEWOR"><div class="tag">Your <span class="a">Voice.</span> Your <span class="p">World.</span></div><button id="enter" class="enter" type="button">Enter YOCEWOR</button><div class="small">Simple. Social. Yours.</div></div></section><section id="auth" class="auth"><div class="card"><div class="brand"><span>YOCEWOR</span> · Your Voice. Your World.</div><div class="mark">Y</div><h1 id="title" style="text-align:center;margin:0">Welcome to YOCEWOR</h1><p id="sub" class="muted" style="text-align:center">Your Voice. Your World.</p><div id="tabs" class="tabs"><button id="loginTab" class="btn active" type="button">Login</button><button id="signupTab" class="btn" type="button">Create account</button></div><div id="form"></div><div id="msg" class="msg"></div></div></section><script>(function(){'use strict';const U='https://mzntgjyecymcpzciklfk.supabase.co',K='sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6UsnK',APP='app-v5.html?v=20260812-01';let sb=null,mode='login',busy=false,timer=null,left=60,flow={email:'',username:'',name:''};const $=s=>document.querySelector(s);function showMsg(t,c){const n=$('#msg');if(n){n.className='msg '+(c||'');n.textContent=t}}function getClient(){if(!window.supabase)return null;if(!sb)sb=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});return sb}function openAuth(){if($('#welcome'))$('#welcome').style.display='none';if($('#auth'))$('#auth').style.display='grid';render()}$('#enter').addEventListener('click',openAuth);$('#loginTab').addEventListener('click',()=>{mode='login';showMsg('');render()});$('#signupTab').addEventListener('click',()=>{mode='signup';showMsg('');render()});function norm(v){return String(v||'').replace(/\s+/g,'_').replace(/[^a-z0-9_.]/gi,'').toLowerCase().slice(0,30)}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function policy(p){if(p.length<8||p.length>12)return'Password 8 से 12 characters का होना चाहिए.';if(!/[A-Z]/.test(p))return'कम से कम 1 capital letter जरूरी है.';if(!/[a-z]/.test(p))return'कम से कम 1 small letter जरूरी है.';if(!/[0-9]/.test(p))return'कम से कम 1 number जरूरी है.';if(!/[^A-Za-z0-9]/.test(p))return'कम से कम 1 special character जरूरी है.';return''}function otpScreen(button){return '<div class="verify"><div class="icon">✉️</div><h2 style="margin:4px 0 8px">Verify your email</h2><p class="muted">6-digit OTP आपके email पर भेजा गया है.</p><div class="mailbox">📧 OTP यहाँ आया है:<br><strong>'+esc(flow.email)+'</strong><br>Inbox / Spam / Promotions folder check करें.</div><div class="otpbox">'+[0,1,2,3,4,5].map(i=>'<input id="otp'+i+'" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="OTP digit '+(i+1)+'">').join('')+'</div><div id="timer" class="timer">Resend OTP 01:00</div><button id="verify" class="btn primary" type="button">'+button+'</button><button id="resend" class="link" type="button" disabled>Resend OTP</button><button id="cancel" class="link" type="button">Cancel</button></div>'}function setupOtp(){const a=[...document.querySelectorAll('.otpbox input')];a.forEach((el,i)=>{el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value&&i<5)a[i+1].focus()});el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&i>0)a[i-1].focus()});el.addEventListener('paste',e=>{e.preventDefault();const s=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);s.split('').forEach((x,j)=>{if(a[j])a[j].value=x});if(s)a[Math.min(5,s.length-1)].focus()})});a[0]?.focus()}function startTimer(){if(timer)clearInterval(timer);left=60;const t=$('#timer'),b=$('#resend');if(!t||!b)return;b.disabled=true;const tick=()=>{t.textContent=left>0?'Resend OTP 00:'+String(left).padStart(2,'0'):'You can request a new OTP now';if(left<=0){clearInterval(timer);b.disabled=false}};tick();timer=setInterval(()=>{left--;tick()},1000)}function render(){const tabs=$('#tabs'),f=$('#form');if(mode.endsWith('Otp'))tabs.classList.add('hidden');else tabs.classList.remove('hidden');$('#title').textContent=mode==='login'?'Welcome to YOCEWOR':mode==='signup'?'Create your YOCEWOR account':'Verify your email';$('#sub').textContent=mode==='signup'?'Create your account and verify with a 6-digit OTP.':mode.endsWith('Otp')?'Enter the 6-digit code sent to your email.':'Your Voice. Your World.';if(mode==='login')f.innerHTML='<input id="loginId" class="field" autocomplete="username" placeholder="Username or Email"><input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Password"><button id="go" class="btn primary" type="button">Login</button><button id="forgot" class="link" type="button">Forgot password?</button>';else if(mode==='signup')f.innerHTML='<input id="name" class="field" placeholder="Full name" maxlength="80"><input id="user" class="field" autocomplete="username" maxlength="30" placeholder="Username"><div class="hint">3–30 chars • a–z, 0–9, _ or .</div><input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><input id="pass" class="field" type="password" autocomplete="new-password" placeholder="Password (8–12 chars)"><div class="hint">8–12 • 1 capital • 1 small • 1 number • 1 special</div><input id="pass2" class="field" type="password" autocomplete="new-password" placeholder="Confirm password"><button id="create" class="btn primary" type="button">Create account</button>';else if(mode==='signupOtp')f.innerHTML=otpScreen('Verify OTP');else if(mode==='reset')f.innerHTML='<input id="email" class="field" type="email" placeholder="Email"><button id="reset" class="btn primary" type="button">Send password reset email</button><button id="back" class="link" type="button">Back to Login</button>';bind();if(mode==='signupOtp'){setupOtp();startTimer()}}function bind(){$('#go')?.addEventListener('click',login);$('#forgot')?.addEventListener('click',()=>{mode='reset';showMsg('');render()});$('#create')?.addEventListener('click',create);$('#verify')?.addEventListener('click',verify);$('#resend')?.addEventListener('click',resend);$('#cancel')?.addEventListener('click',()=>{mode='signup';showMsg('');render()});$('#reset')?.addEventListener('click',reset);$('#back')?.addEventListener('click',()=>{mode='login';showMsg('');render()});$('#user')?.addEventListener('input',e=>e.target.value=norm(e.target.value))}async function emailFor(id){const db=getClient();if(!db)return null;if(id.includes('@'))return id;const r=await db.rpc('resolve_login_email',{login_username:id});if(r.error||!r.data)return null;return String(r.data).toLowerCase()}async function login(){if(busy)return;const db=getClient();if(!db)return showMsg('Authentication service load नहीं हुआ. Internet check करके refresh करें.','error');const id=$('#loginId').value.trim().toLowerCase(),p=$('#pass').value;if(!id||!p)return showMsg('Username/Email और password दोनों डालें.','error');busy=true;try{const email=await emailFor(id);if(!email)return showMsg('Username या Email नहीं मिला.','error');const r=await db.auth.signInWithPassword({email,password:p});if(r.error)throw r.error;location.href=APP}catch(e){showMsg(e.message||'Login failed.','error')}finally{busy=false}}async function create(){if(busy)return;const db=getClient();if(!db)return showMsg('Authentication service load नहीं हुआ. Refresh करें.','error');const email=$('#email').value.trim().toLowerCase(),username=norm($('#user').value),name=$('#name').value.trim(),p=$('#pass').value,p2=$('#pass2').value;if(!email||!username||!p)return showMsg('Username, email और password जरूरी हैं.','error');if(!/^[a-z0-9_.]{3,30}$/.test(username))return showMsg('Username 3–30 chars: a-z, 0-9, _ or . only.','error');const pe=policy(p);if(pe)return showMsg(pe,'error');if(p!==p2)return showMsg('Confirm password same रखें.','error');busy=true;$('#create').disabled=true;showMsg('Account create हो रहा है…');try{const taken=await db.from('profiles').select('id').eq('username',username).maybeSingle();if(taken.data)return showMsg('Username already taken.','error');const r=await db.auth.signUp({email,password:p,options:{data:{username,display_name:name||username}}});if(r.error)throw r.error;flow={email,username,name};mode='signupOtp';render();showMsg('6-digit OTP भेज दिया गया.','success')}catch(e){showMsg(e.message||'Account creation failed.','error')}finally{busy=false;$('#create')?.removeAttribute('disabled')}}async function verify(){const db=getClient();if(!db)return showMsg('Authentication service load नहीं हुआ.','error');const token=[0,1,2,3,4,5].map(i=>$('#otp'+i)?.value||'').join('');if(!/^\d{6}$/.test(token))return showMsg('पूरा 6-digit OTP डालें.','error');busy=true;$('#verify').disabled=true;showMsg('OTP verify हो रहा है…');try{const r=await db.auth.verifyOtp({email:flow.email,token,type:'signup'});if(r.error)throw r.error;const u=r.data?.user;if(u)await db.from('profiles').upsert({id:u.id,username:flow.username,display_name:flow.name||flow.username,auth_email:flow.email,contact_email:flow.email,is_verified:true,verified_at:new Date().toISOString()},{onConflict:'id'});showMsg('Email verified. YOCEWOR खुल रहा है…','success');setTimeout(()=>location.href=APP,600)}catch(e){showMsg(e.message||'OTP गलत या expired है. नया OTP लें.','error')}finally{busy=false;$('#verify')?.removeAttribute('disabled')}}async function resend(){const db=getClient();if(!db||!flow.email)return;const b=$('#resend');b.disabled=true;showMsg('नया 6-digit OTP भेजा जा रहा है…');try{const r=await db.auth.resend({type:'signup',email:flow.email});if(r.error)throw r.error;showMsg('नया 6-digit OTP भेज दिया गया.','success');startTimer()}catch(e){showMsg(e.message||'OTP resend failed.','error');b.disabled=false}}async function reset(){const db=getClient();const email=$('#email').value.trim().toLowerCase();if(!email)return showMsg('Email डालें.','error');const r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'?reset=1'});if(r.error)return showMsg(r.error.message,'error');showMsg('Password reset email भेज दिया गया.','success')}openAuth.__name='openAuth';})();</script></body></html>
