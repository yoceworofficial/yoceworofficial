<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07040f"><meta name="description" content="YOCEWOR — Your Voice. Your World."><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>YOCEWOR — Your Voice. Your World.</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--a:#ff6a00;--b:#ff2f7e;--c:#7c4dff;--bg:#07040f;--line:#2b3047;--muted:#a7acc1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}button,input{font:inherit}.screen{min-height:100vh}.splash{display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 34%,#291044 0,transparent 36%),radial-gradient(circle at 100% 50%,#171047 0,transparent 34%),linear-gradient(180deg,#05020a,#09030f);padding:24px}.splash-inner{width:min(92vw,720px)}.logo{width:min(92vw,560px);max-height:390px;object-fit:contain;filter:drop-shadow(0 18px 45px #0009)}.tag{font-size:clamp(20px,4vw,30px);font-weight:800;margin:8px 0 28px}.tag .a{color:var(--a)}.tag .p{color:var(--b)}.enter,.primary{border:0;border-radius:15px;padding:13px 24px;color:#fff;font-weight:900;background:linear-gradient(100deg,var(--a),var(--b));cursor:pointer}.small,.muted{color:var(--muted);font-size:12px;margin-top:14px}.auth{display:none;min-height:100vh;place-items:center;padding:20px;background:radial-gradient(circle at 15% 0,#291046 0,transparent 35%),radial-gradient(circle at 100% 30%,#16104b 0,transparent 34%),var(--bg)}.card{width:min(520px,100%);background:#111526f7;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 70px #0007}.brand{font-size:21px;font-weight:950;margin-bottom:22px}.brand span{background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;color:transparent}.mark{width:72px;height:72px;margin:0 auto 15px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#ffb300,#ff2f7e,#7c4dff);font-weight:1000;font-size:36px}.tabs,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs{margin:18px 0 12px}.btn,.field{width:100%;border:1px solid var(--line);border-radius:13px;background:#151a2b;color:#fff;padding:12px}.btn{font-weight:850;cursor:pointer}.active{background:#20263a}.field{margin:5px 0;outline:0}.field:focus{border-color:var(--a)}.link{border:0;background:transparent;color:#79b7ff;text-decoration:underline;padding:8px 0;cursor:pointer}.msg{min-height:20px;margin-top:10px;color:var(--muted);font-size:13px;white-space:pre-wrap}.success{color:#65e6a2}.error{color:#ff8da5}.hint{font-size:11px;color:#858ca3;margin:4px 2px 8px}.verify-card{text-align:center;padding:18px 8px}.spinner{width:42px;height:42px;margin:6px auto 18px;border:4px solid #2b3047;border-top-color:#ff6a00;border-radius:50%;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.mail-icon{font-size:46px;margin:4px 0 12px}@media(max-width:560px){.grid2{grid-template-columns:1fr}.card{padding:19px}.logo{max-height:330px}}</style></head><body><section id="welcome" class="screen splash"><div class="splash-inner"><img class="logo" src="yocewor-logo.svg" alt="YOCEWOR"><div class="tag">Your <span class="a">Voice.</span> Your <span class="p">World.</span></div><button id="enter" class="enter" type="button">Enter YOCEWOR</button><div class="small">Simple. Social. Yours.</div></div></section><section id="auth" class="auth"><div class="card"><div class="brand"><span>YOCEWOR</span> · Your Voice. Your World.</div><div class="mark">Y</div><h1 id="title" style="text-align:center;margin:0">Welcome to YOCEWOR</h1><p id="sub" class="muted" style="text-align:center">Your Voice. Your World.</p><div id="tabs" class="tabs"><button id="loginTab" class="btn active" type="button">Login</button><button id="signupTab" class="btn" type="button">Create account</button></div><div id="form"></div><div id="msg" class="msg"></div></div></section><script>(function(){"use strict";const U="https://mzntgjyecymcpzciklfk.supabase.co",K="sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn",APP="app-v5.html?v=20260811-01";let mode="login",resetStage=0,flow=null,sb=null;const $=s=>document.querySelector(s);function msg(t,c){const n=$("#msg");if(n){n.className="msg "+(c||"");n.textContent=t}}function ready(){if(!window.supabase){msg("Authentication service load नहीं हो पाया. Page refresh करें.","error");return false}if(!sb)sb=window.supabase.createClient(U,K);return true}function openAuth(){$("#welcome").style.display="none";$("#auth").style.display="grid";render()}$("#enter").addEventListener("click",openAuth);function normUser(v){return v.replace(/\s+/g,"_").replace(/[^a-z0-9_.]/gi,"").toLowerCase().slice(0,30)}function bindUsername(){const el=$("#user");if(!el)return;const clean=()=>{const p=el.selectionStart||0;el.value=normUser(el.value);try{el.setSelectionRange(Math.min(p,el.value.length),Math.min(p,el.value.length))}catch(e){}};el.addEventListener("input",clean);el.addEventListener("paste",e=>{e.preventDefault();const t=normUser(e.clipboardData.getData("text")||"");const s=el.selectionStart||0,en=el.selectionEnd||0;el.value=(el.value.slice(0,s)+t+el.value.slice(en)).slice(0,30);try{el.setSelectionRange(s+t.length,s+t.length)}catch(e){}})}function passwordPolicy(p){if(p.length<8||p.length>12)return"Password 8 से 12 characters का होना चाहिए.";if(!/[A-Z]/.test(p))return"कम से कम 1 capital letter जरूरी है.";if(!/[a-z]/.test(p))return"कम से कम 1 small letter जरूरी है.";if(!/[0-9]/.test(p))return"कम से कम 1 number जरूरी है.";if(!/[^A-Za-z0-9]/.test(p))return"कम से कम 1 special character जरूरी है.";return""}async function usernameFree(u){const r=await sb.from("profiles").select("id").eq("username",u).maybeSingle();if(r.error&&r.error.code!=="PGRST116")throw r.error;return !r.data}function otpHtml(id,label){return '<p class="hint" style="text-align:center">Email पर 6 अंकों का OTP भेजा गया है</p><div style="display:flex;gap:8px;margin:14px 0">'+[0,1,2,3,4,5].map(i=>'<input inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="1" aria-label="OTP digit '+(i+1)+'" style="width:52px;height:58px;min-width:0;text-align:center;font-size:24px;font-weight:900;padding:8px 2px;border:1px solid var(--line);border-radius:12px;background:#151a2b;color:#fff;outline:0">').join("")+'</div><button id="verifyOtp" class="btn primary" type="button">'+label+'</button><button id="resendOtp" class="link" type="button">Resend OTP</button>'}function setupOtp(){const ins=[...$("#form").querySelectorAll("input")];ins.forEach((el,i)=>{el.addEventListener("input",()=>{el.value=el.value.replace(/\D/g,"").slice(-1);if(el.value&&i<5)ins[i+1].focus()});el.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!el.value&&i>0)ins[i-1].focus()});el.addEventListener("paste",e=>{e.preventDefault();const s=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);s.split("").forEach((x,j)=>{if(ins[j])ins[j].value=x});if(s)ins[Math.min(s.length-1,5)].focus()})});if(ins[0])ins[0].focus();return()=>ins.map(x=>x.value).join("")}function render(){if(!ready())return;const f=$("#form");$("#title").textContent=mode==="login"?"Welcome to YOCEWOR":mode==="signup"?"Create your YOCEWOR account":mode==="signupWait"?"Verify your email":mode.endsWith("Otp")?"Verify your email":"Reset your password";$("#sub").textContent=mode==="signup"?"Password + email confirmation required.":mode==="signupWait"?"Email verification is required before you can login.":mode==="loginOtp"?"Login OTP डालें.":mode==="reset"?"Email OTP से password reset करें.":"Your Voice. Your World.";$("#tabs").style.display=(mode==="reset"||mode.endsWith("Otp")||mode==="signupWait")?"none":"grid";if(mode==="login")f.innerHTML='<input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Password"><button id="go" class="btn primary" type="button">Login</button><button id="otpLogin" class="btn" style="margin-top:8px" type="button">Login with Email OTP</button><button id="forgot" class="link" type="button">Forgot password?</button><div class="grid2" style="margin-top:8px"><button id="google" class="btn" type="button">Continue with Google</button><button id="facebook" class="btn" type="button">Continue with Facebook</button></div>';else if(mode==="signup")f.innerHTML='<input id="name" class="field" placeholder="Full name"><input id="user" class="field" autocomplete="username" placeholder="Username"><div class="hint">3–30 chars • lowercase a–z, 0–9, _ or . only • space automatically becomes _</div><input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><input id="pass" class="field" type="password" autocomplete="new-password" placeholder="Password (8–12 chars)"><div class="hint">8–12 total • 1 capital • 1 small • 1 number • 1 special required</div><input id="pass2" class="field" type="password" autocomplete="new-password" placeholder="Confirm password"><button id="createAccount" class="btn primary" type="button">Create account</button>';else if(mode==="signupWait")f.innerHTML='<div class="verify-card"><div class="mail-icon">✉️</div><h2 style="margin:4px 0 8px">Check your email</h2><p class="muted">हमने आपके email पर confirmation link भेजा है.</p><p class="muted">Email खोलें और <b>Confirm your email</b> पर tap करें। Verification के बाद आपको automatically YOCEWOR के Login page पर भेज दिया जाएगा.</p><div class="spinner"></div><p class="hint">इस page को बंद करने की जरूरत नहीं है.</p><button id="backLogin" class="link" type="button">Back to Login</button></div>';else if(mode==="loginOtp")f.innerHTML=otpHtml("loginOtpBox","Verify OTP & Login");else if(resetStage===0)f.innerHTML='<input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><button id="rotp" class="btn primary" type="button">Send OTP</button><div class="hint">Password reset के लिए केवल email OTP इस्तेमाल होगा.</div>';else if(resetStage===1)f.innerHTML=otpHtml("resetOtpBox","Verify OTP");else f.innerHTML='<input id="newpass" class="field" type="password" autocomplete="new-password" placeholder="New password (8–12 chars)"><div class="hint">8–12 total • 1 capital • 1 small • 1 number • 1 special required</div><input id="newpass2" class="field" type="password" autocomplete="new-password" placeholder="Confirm new password"><button id="set" class="btn primary" type="button">Set new password</button>';bind();if(mode==="signup")bindUsername();if(mode.endsWith("Otp"))flow.read=setupOtp()}function bind(){$("#go")?.addEventListener("click",login);$("#otpLogin")?.addEventListener("click",otpLogin);$("#forgot")?.addEventListener("click",()=>{mode="reset";resetStage=0;render()});$("#google")?.addEventListener("click",()=>oauth("google"));$("#facebook")?.addEventListener("click",()=>oauth("facebook"));$("#createAccount")?.addEventListener("click",createAccount);$("#verifyOtp")?.addEventListener("click",verifyOtp);$("#resendOtp")?.addEventListener("click",resendOtp);$("#rotp")?.addEventListener("click",sendResetOtp);$("#set")?.addEventListener("click",setPassword);$("#backLogin")?.addEventListener("click",()=>{mode="login";resetStage=0;render()})}async function login(){try{const r=await sb.auth.signInWithPassword({email:$("#email").value.trim().toLowerCase(),password:$("#pass").value});if(r.error)throw r.error;location.href=APP}catch(e){msg(e.message||"Login failed","error")}}async function createAccount(){try{const email=$("#email").value.trim().toLowerCase(),user=normUser($("#user").value),name=$("#name").value.trim(),p=$("#pass").value,p2=$("#pass2").value;if(!email)return msg("Email डालें.","error");if(!/^[a-z0-9_.]{3,30}$/.test(user))return msg("Username 3–30 chars: lowercase a-z, numbers, _ or . only.","error");if(!(await usernameFree(user)))return msg("यह username पहले से लिया जा चुका है.","error");const pe=passwordPolicy(p);if(pe)return msg(pe,"error");if(p!==p2)return msg("Confirm password same रखें.","error");const r=await sb.auth.signUp({email,password:p,options:{data:{username:user,display_name:name||user},emailRedirectTo:location.origin+location.pathname}});if(r.error)throw r.error;flow={email,user,name};mode="signupWait";render();msg("Confirmation link email पर भेज दिया गया है.","success")}catch(e){msg(e.message||"Account create नहीं हो पाया","error")}}async function verifyOtp(){try{const code=flow?.read?flow.read():"";if(!/^\d{6}$/.test(code))return msg("पूरे 6 अंकों का OTP डालें.","error");const v=await sb.auth.verifyOtp({email:flow.email,token:code,type:"email"});if(v.error)throw v.error;if(mode==="loginOtp"){location.href=APP}else{resetStage=2;render();msg("OTP verified. अब नया password बनाइए.","success")}}catch(e){msg(e.message||"OTP verification failed","error")}}async function resendOtp(){try{const r=await sb.auth.signInWithOtp({email:flow.email,options:{shouldCreateUser:false}});if(r.error)throw r.error;msg("OTP फिर से भेज दिया गया.","success")}catch(e){msg(e.message||"Resend failed","error")}}async function otpLogin(){try{const email=$("#email").value.trim().toLowerCase();if(!email)return msg("Email डालें.","error");const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(r.error)throw r.error;flow={email};mode="loginOtp";render();msg("Login OTP email पर भेज दिया गया है.","success")}catch(e){msg(e.message||"OTP login failed","error")}}async function sendResetOtp(){try{const email=$("#email").value.trim().toLowerCase();if(!email)return msg("Email डालें.","error");const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(r.error)throw r.error;flow={email};resetStage=1;render();msg("6-digit OTP email पर भेज दिया गया है.","success")}catch(e){msg(e.message||"Reset OTP failed","error")}}async function setPassword(){try{const a=$("#newpass").value,b=$("#newpass2").value,pe=passwordPolicy(a);if(pe)return msg(pe,"error");if(a!==b)return msg("Confirm password same रखें.","error");const r=await sb.auth.updateUser({password:a});if(r.error)throw r.error;await sb.auth.signOut();mode="login";resetStage=0;render();msg("Password बदल गया. अब login करें.","success")}catch(e){msg(e.message||"Password update failed","error")}}async function oauth(p){try{const r=await sb.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin+location.pathname}});if(r.error)throw r.error}catch(e){msg(e.message||"OAuth login failed","error")}}async function handleEmailConfirmation(){if(!ready())return;const hasAuthHash=location.hash.includes("access_token")||location.hash.includes("type=signup")||location.search.includes("code=");if(hasAuthHash){setTimeout(async()=>{const s=await sb.auth.getSession();if(s.data.session){await sb.auth.signOut();history.replaceState({},document.title,location.pathname);openAuth();msg("Email verified successfully. अब अपने email और password से Login करें.","success")}},800)}}$("#loginTab").addEventListener("click",()=>{mode="login";resetStage=0;render()});$("#signupTab").addEventListener("click",()=>{mode="signup";resetStage=0;render()});render();handleEmailConfirmation();})();</script></body></html>
