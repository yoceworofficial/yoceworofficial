<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07040f"><title>YOCEWOR — Your Voice. Your World.</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--a:#ff6a00;--b:#ff2f7e;--c:#7c4dff;--bg:#07040f;--line:#2b3047;--muted:#a7acc1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}button,input{font:inherit}.screen{min-height:100vh}.splash{display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 34%,#291044 0,transparent 36%),radial-gradient(circle at 100% 50%,#171047 0,transparent 34%),linear-gradient(180deg,#05020a,#09030f);padding:24px}.splash-inner{width:min(92vw,720px)}.logo{width:min(92vw,560px);max-height:390px;object-fit:contain;filter:drop-shadow(0 18px 45px #0009)}.tag{font-size:clamp(20px,4vw,30px);font-weight:800;margin:8px 0 28px}.tag .a{color:var(--a)}.tag .p{color:var(--b)}.enter,.primary{border:0;border-radius:15px;padding:13px 24px;color:#fff;font-weight:900;background:linear-gradient(100deg,var(--a),var(--b));cursor:pointer}.small,.muted{color:var(--muted);font-size:12px;margin-top:14px}.auth{display:none;min-height:100vh;place-items:center;padding:20px;background:radial-gradient(circle at 15% 0,#291046 0,transparent 35%),radial-gradient(circle at 100% 30%,#16104b 0,transparent 34%),var(--bg)}.card{width:min(520px,100%);background:#111526f7;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 70px #0007}.brand{font-size:21px;font-weight:950;margin-bottom:22px}.brand span{background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;color:transparent}.mark{width:72px;height:72px;margin:0 auto 15px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#ffb300,#ff2f7e,#7c4dff);font-weight:1000;font-size:36px}.tabs,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs{margin:18px 0 12px}.btn,.field{width:100%;border:1px solid var(--line);border-radius:13px;background:#151a2b;color:#fff;padding:12px}.btn{font-weight:850;cursor:pointer}.active{background:#20263a}.field{margin:5px 0;outline:0}.link{border:0;background:transparent;color:#79b7ff;text-decoration:underline;padding:8px 0;cursor:pointer}.msg{min-height:20px;margin-top:10px;color:var(--muted);font-size:13px}.success{color:#65e6a2}.error{color:#ff8da5}@media(max-width:560px){.grid2{grid-template-columns:1fr}.card{padding:19px}.logo{max-height:330px}}</style></head><body><section id="welcome" class="screen splash"><div class="splash-inner"><img class="logo" src="yocewor-logo.svg" alt="YOCEWOR"><div class="tag">Your <span class="a">Voice.</span> Your <span class="p">World.</span></div><button id="enter" class="enter">Enter YOCEWOR</button><div class="small">Simple. Social. Yours.</div></div></section><section id="auth" class="auth"><div class="card"><div class="brand"><span>YOCEWOR</span> · Your Voice. Your World.</div><div class="mark">Y</div><h1 id="title" style="text-align:center;margin:0">Welcome to YOCEWOR</h1><p id="sub" class="muted" style="text-align:center">Your Voice. Your World.</p><div id="tabs" class="tabs"><button id="loginTab" class="btn active">Login</button><button id="signupTab" class="btn">Create account</button></div><div id="form"></div><div id="msg" class="msg"></div></div></section><script>(()=>{const U='https://mzntgjyecymcpzciklfk.supabase.co',K='sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',APP='app-v5.html?v=20260810-10',sb=supabase.createClient(U,K),$=s=>document.querySelector(s);let mode='login',reset=false;const msg=(t,c='')=>{$('#msg').className='msg '+c;$('#msg').textContent=t};const auth=()=>{$('#welcome').style.display='none';$('#auth').style.display='grid';render()};function render(){const f=$('#form');$('#title').textContent=mode==='login'?'Welcome to YOCEWOR':mode==='signup'?'Create your YOCEWOR account':'Reset your password';$('#sub').textContent=mode==='signup'?'Create account with Email OTP only.':mode==='login'?'Your Voice. Your World.':'Choose a new secure password.';$('#tabs').style.display=mode==='reset'?'none':'grid';if(mode==='login')f.innerHTML='<input id="email" class="field" type="email" placeholder="Email"><input id="pass" class="field" type="password" placeholder="Password"><button id="go" class="btn primary">Login</button><button id="otp" class="btn" style="margin-top:8px">Login with Email OTP</button><button id="forgot" class="link">Forgot password?</button><div class="grid2" style="margin-top:8px"><button id="google" class="btn">Continue with Google</button><button id="facebook" class="btn">Continue with Facebook</button></div>';else if(mode==='signup')f.innerHTML='<input id="name" class="field" placeholder="Full name"><input id="user" class="field" placeholder="Username (3–30 letters, numbers, _)"><input id="email" class="field" type="email" placeholder="Email"><button id="otp" class="btn primary">Send Email OTP</button>';else f.innerHTML='<input id="email" class="field" type="email" placeholder="Email"><button id="link" class="btn primary">Send password reset link</button><button id="rotp" class="btn" style="margin-top:8px">Reset with Email OTP</button>';if(mode==='reset'&&reset)f.innerHTML='<input id="newpass" class="field" type="password" placeholder="New password (8+ characters)"><input id="newpass2" class="field" type="password" placeholder="Confirm new password"><button id="set" class="btn primary">Set new password</button>';$('#go')?.addEventListener('click',login);$('#otp')?.addEventListener('click',mode==='signup'?signup:otpLogin);$('#forgot')?.addEventListener('click',()=>{mode='reset';reset=false;render()});$('#google')?.addEventListener('click',()=>oauth('google'));$('#facebook')?.addEventListener('click',()=>oauth('facebook'));$('#link')?.addEventListener('click',sendLink);$('#rotp')?.addEventListener('click',resetOtp);$('#set')?.addEventListener('click',setPassword)}async function login(){try{const r=await sb.auth.signInWithPassword({email:$('#email').value.trim().toLowerCase(),password:$('#pass').value});if(r.error)throw r.error;location.href=APP}catch(e){msg(e.message,'error')}}async function signup(){try{const email=$('#email').value.trim().toLowerCase(),user=$('#user').value.trim().toLowerCase(),name=$('#name').value.trim();if(!/^[a-z0-9_]{3,30}$/.test(user))return msg('Username 3–30 characters रखें.','error');const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,data:{username:user,display_name:name||user}}});if(r.error)throw r.error;const code=prompt('Email OTP डालें:');if(!code)return;const v=await sb.auth.verifyOtp({email,token:code,type:'email'});if(v.error)throw v.error;await sb.auth.updateUser({data:{username:user,display_name:name||user}});location.href=APP}catch(e){msg(e.message,'error')}}async function otpLogin(){try{const email=$('#email').value.trim().toLowerCase(),r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(r.error)throw r.error;const code=prompt('Email OTP डालें:');if(!code)return;const v=await sb.auth.verifyOtp({email,token:code,type:'email'});if(v.error)throw v.error;location.href=APP}catch(e){msg(e.message,'error')}}async function sendLink(){try{const r=await sb.auth.resetPasswordForEmail($('#email').value.trim().toLowerCase(),{redirectTo:location.origin+location.pathname+'?recovery=1'});if(r.error)throw r.error;msg('Reset link email पर भेज दिया गया है.','success')}catch(e){msg(e.message,'error')}}async function resetOtp(){try{const email=$('#email').value.trim().toLowerCase(),r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(r.error)throw r.error;const code=prompt('Email OTP डालें:');if(!code)return;const v=await sb.auth.verifyOtp({email,token:code,type:'email'});if(v.error)throw v.error;reset=true;render();msg('OTP verified. अब नया password बनाइए.','success')}catch(e){msg(e.message,'error')}}async function setPassword(){try{const a=$('#newpass').value,b=$('#newpass2').value;if(a.length<8||a!==b)return msg('Password 8+ characters और दोनों same रखें.','error');const r=await sb.auth.updateUser({password:a});if(r.error)throw r.error;await sb.auth.signOut();mode='login';reset=false;render();msg('Password बदल गया. अब login करें.','success')}catch(e){msg(e.message,'error')}}async function oauth(p){const r=await sb.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin+location.pathname}});if(r.error)msg(r.error.message,'error')}$('#enter').onclick=auth;$('#loginTab').onclick=()=>{mode='login';render()};$('#signupTab').onclick=()=>{mode='signup';render()};if(new URLSearchParams(location.search).get('recovery')==='1'){auth();mode='reset';reset=true;render()}else render();})();</script></body></html>
