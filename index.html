<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07040f"><meta name="description" content="YOCEWOR — Your Voice. Your World."><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>YOCEWOR — Your Voice. Your World.</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--a:#ff6a00;--b:#ff2f7e;--c:#7c4dff;--bg:#07040f;--line:#2b3047;--muted:#a7acc1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}button,input{font:inherit}.screen{min-height:100vh}.splash{display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 34%,#291044 0,transparent 36%),radial-gradient(circle at 100% 50%,#171047 0,transparent 34%),linear-gradient(180deg,#05020a,#09030f);padding:24px}.splash-inner{width:min(92vw,720px)}.logo{width:min(92vw,560px);max-height:390px;object-fit:contain;filter:drop-shadow(0 18px 45px #0009)}.tag{font-size:clamp(20px,4vw,30px);font-weight:800;margin:8px 0 28px}.tag .a{color:var(--a)}.tag .p{color:var(--b)}.enter,.primary{border:0;border-radius:15px;padding:13px 24px;color:#fff;font-weight:900;background:linear-gradient(100deg,var(--a),var(--b));cursor:pointer}.enter:disabled,.btn:disabled{opacity:.55;cursor:not-allowed}.small,.muted{color:var(--muted);font-size:12px;margin-top:14px}.auth{display:none;min-height:100vh;place-items:center;padding:20px;background:radial-gradient(circle at 15% 0,#291046 0,transparent 35%),radial-gradient(circle at 100% 30%,#16104b 0,transparent 34%),var(--bg)}.card{width:min(520px,100%);background:#111526f7;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 70px #0007}.brand{font-size:21px;font-weight:950;margin-bottom:22px}.brand span{background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;color:transparent}.mark{width:72px;height:72px;margin:0 auto 15px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#ffb300,#ff2f7e,#7c4dff);font-weight:1000;font-size:36px}.tabs,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs{margin:18px 0 12px}.btn,.field{width:100%;border:1px solid var(--line);border-radius:13px;background:#151a2b;color:#fff;padding:12px}.btn{font-weight:850;cursor:pointer}.active{background:#20263a}.field{margin:5px 0;outline:0}.field:focus{border-color:var(--a)}.link{border:0;background:transparent;color:#79b7ff;text-decoration:underline;padding:8px 0;cursor:pointer}.msg{min-height:20px;margin-top:10px;color:var(--muted);font-size:13px;white-space:pre-wrap}.success{color:#65e6a2}.error{color:#ff8da5}.hint{font-size:11px;color:#858ca3;margin:4px 2px 8px}.otpbox{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:16px 0}.otpbox input{width:100%;height:58px;text-align:center;font-size:24px;font-weight:950;padding:4px;border:1px solid var(--line);border-radius:12px;background:#151a2b;color:#fff;outline:0}.otpbox input:focus{border-color:var(--a)}.mailbox{padding:12px;border:1px solid var(--line);border-radius:13px;background:#151a2b;text-align:center;color:#dce2f3;font-size:13px;line-height:1.45}.timer{text-align:center;color:var(--muted);font-size:13px;margin:8px 0}.verify-card{text-align:center;padding:8px}.mail-icon{font-size:44px;margin:4px 0 10px}.status-ok{color:#65e6a2}.status-bad{color:#ff8da5}.username-status{min-height:18px}@media(max-width:560px){.grid2{grid-template-columns:1fr}.card{padding:19px}.logo{max-height:330px}.otpbox{gap:5px}.otpbox input{height:52px;font-size:21px}}
</style></head><body>
<section id="welcome" class="screen splash"><div class="splash-inner"><img class="logo" src="yocewor-logo.svg" alt="YOCEWOR"><div class="tag">Your <span class="a">Voice.</span> Your <span class="p">World.</span></div><button id="enter" class="enter" type="button">Enter YOCEWOR</button><div class="small">Simple. Social. Yours.</div></div></section>
<section id="auth" class="auth"><div class="card"><div class="brand"><span>YOCEWOR</span> · Your Voice. Your World.</div><div class="mark">Y</div><h1 id="title" style="text-align:center;margin:0">Welcome to YOCEWOR</h1><p id="sub" class="muted" style="text-align:center">Your Voice. Your World.</p><div id="tabs" class="tabs"><button id="loginTab" class="btn active" type="button">Login</button><button id="signupTab" class="btn" type="button">Create account</button></div><div id="form"></div><div id="msg" class="msg"></div></div></section>
<script>(function(){"use strict";
const U="https://mzntgjyecymcpzciklfk.supabase.co",K="sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn",APP="app-v5.html?v=20260811-03";let mode="login",sb=null,busy=false,flow={email:"",username:"",name:""},timer=null,left=60;
const $=s=>document.querySelector(s);function msg(t,c){const n=$("#msg");if(n){n.className="msg "+(c||"");n.textContent=t}}function ready(){if(!window.supabase){msg("Authentication service load नहीं हो पाया. Page refresh करें.","error");return false}if(!sb)sb=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});return true}function openAuth(){if(!ready())return;$("#welcome").style.display="none";$("#auth").style.display="grid";render()}
$("#enter").onclick=openAuth;$("#loginTab").onclick=()=>{mode="login";msg("");render()};$("#signupTab").onclick=()=>{mode="signup";msg("");render()};
function normUser(v){return v.replace(/\s+/g,"_").replace(/[^a-z0-9_.]/gi,"").toLowerCase().slice(0,30)}
function passwordPolicy(p){if(p.length<8||p.length>12)return"Password 8 से 12 characters का होना चाहिए.";if(!/[A-Z]/.test(p))return"कम से कम 1 capital letter जरूरी है.";if(!/[a-z]/.test(p))return"कम से कम 1 small letter जरूरी है.";if(!/[0-9]/.test(p))return"कम से कम 1 number जरूरी है.";if(!/[^A-Za-z0-9]/.test(p))return"कम से कम 1 special character जरूरी है.";return""}
function otpHtml(button){return '<div class="verify-card"><div class="mail-icon">✉️</div><h2 style="margin:4px 0 8px">Verify your email</h2><p class="muted">6-digit OTP आपके email पर भेजा गया है.</p><div class="mailbox">📧 OTP यहाँ आया है:<br><strong>'+escapeHtml(flow.email)+'</strong><br><span>Inbox / Spam / Promotions folder check करें.</span></div><div class="otpbox">'+[0,1,2,3,4,5].map(i=>'<input id="otp'+i+'" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="1" aria-label="OTP digit '+(i+1)+'">').join('')+'</div><div id="timer" class="timer">Resend OTP 01:00</div><button id="verifyOtp" class="btn primary" type="button">'+button+'</button><button id="resendOtp" class="link" type="button" disabled>Resend OTP</button><button id="cancelOtp" class="link" type="button">Cancel</button></div>'}
function escapeHtml(v){return String(v||"").replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function setupOtp(){const a=[...document.querySelectorAll(".otpbox input")];a.forEach((el,i)=>{el.oninput=()=>{el.value=el.value.replace(/\D/g,"").slice(-1);if(el.value&&i<5)a[i+1].focus()};el.onkeydown=e=>{if(e.key==="Backspace"&&!el.value&&i>0)a[i-1].focus()};el.onpaste=e=>{e.preventDefault();const s=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);s.split("").forEach((x,j)=>{if(a[j])a[j].value=x});if(s)a[Math.min(5,s.length-1)].focus()})});a[0]?.focus()}
function startTimer(){if(timer)clearInterval(timer);left=60;const t=$("#timer"),b=$("#resendOtp");if(!t||!b)return;b.disabled=true;const tick=()=>{t.textContent=left>0?`Resend OTP ${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`:"You can request a new OTP now";if(left<=0){clearInterval(timer);b.disabled=false}};tick();timer=setInterval(()=>{left--;tick()},1000)}
function render(){if(!ready())return;const f=$("#form"),tabs=$("#tabs");$("#title").textContent=mode==="login"?"Welcome to YOCEWOR":mode==="signup"?"Create your YOCEWOR account":"Verify your email";$("#sub").textContent=mode==="signup"?"Create your account and verify your email with a 6-digit OTP.":mode==="signupOtp"?"Email verification is required before you can login.":"Your Voice. Your World.";tabs.style.display=mode.endsWith("Otp")?"none":"grid";
if(mode==="login")f.innerHTML='<input id="loginId" class="field" autocomplete="username" placeholder="Username or Email"><input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Password"><button id="go" class="btn primary" type="button">Login</button><button id="otpLogin" class="btn" style="margin-top:8px" type="button">Login with Email OTP</button><button id="forgot" class="link" type="button">Forgot password?</button>';
else if(mode==="signup")f.innerHTML='<input id="name" class="field" placeholder="Full name" maxlength="80"><input id="user" class="field" autocomplete="username" maxlength="30" placeholder="Username"><div id="usernameStatus" class="hint username-status">3–30 chars • lowercase a–z, 0–9, _ or .</div><input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><input id="pass" class="field" type="password" autocomplete="new-password" placeholder="Password (8–12 chars)"><div class="hint">8–12 total • 1 capital • 1 small • 1 number • 1 special</div><input id="pass2" class="field" type="password" autocomplete="new-password" placeholder="Confirm password"><button id="createAccount" class="btn primary" type="button">Create account</button>';
else if(mode==="signupOtp")f.innerHTML=otpHtml("Verify OTP");
else if(mode==="loginOtp")f.innerHTML=otpHtml("Verify OTP & Login");
else if(mode==="reset")f.innerHTML='<input id="email" class="field" type="email" placeholder="Email"><button id="resetSend" class="btn primary" type="button">Send password reset email</button><button id="backLogin" class="link" type="button">Back to Login</button>';
bind();if(mode.endsWith("Otp")){setupOtp();startTimer()}}
function bind(){ $("#go")?.addEventListener("click",login);$("#otpLogin")?.addEventListener("click",otpLogin);$("#forgot")?.addEventListener("click",()=>{mode="reset";msg("");render()});$("#createAccount")?.addEventListener("click",createAccount);$("#verifyOtp")?.addEventListener("click",verifyOtp);$("#resendOtp")?.addEventListener("click",resendOtp);$("#cancelOtp")?.addEventListener("click",()=>{mode="signup";msg("");render()});$("#resetSend")?.addEventListener("click",resetEmail);$("#backLogin")?.addEventListener("click",()=>{mode="login";msg("");render()});$("#user")?.addEventListener("input",e=>{e.target.value=normUser(e.target.value)})}
async function usernameEmail(id){if(id.includes("@"))return id;const r=await sb.from("profiles").select("auth_email,contact_email").eq("username",id).maybeSingle();if(r.error||!r.data)return null;return (r.data.auth_email||r.data.contact_email||"").toLowerCase()}
async function login(){if(busy)return;const id=$("#loginId").value.trim().toLowerCase(),p=$("#pass").value;if(!id||!p)return msg("Username/Email और password दोनों डालें.","error");busy=true;try{const email=await usernameEmail(id);if(!email)return msg("Username या Email नहीं मिला.","error");const r=await sb.auth.signInWithPassword({email,password:p});if(r.error)throw r.error;location.href=APP}catch(e){msg(e.message||"Login failed.","error")}finally{busy=false}}
async function createAccount(){if(busy)return;const email=$("#email").value.trim().toLowerCase(),username=normUser($("#user").value),name=$("#name").value.trim(),p=$("#pass").value,p2=$("#pass2").value;if(!email||!username||!p)return msg("Username, email और password जरूरी हैं.","error");if(!/^[a-z0-9_.]{3,30}$/.test(username))return msg("Username 3–30 chars: a-z, 0-9, _ or . only.","error");const pe=passwordPolicy(p);if(pe)return msg(pe,"error");if(p!==p2)return msg("Confirm password same रखें.","error");busy=true;$("#createAccount").disabled=true;msg("Account create हो रहा है…");try{const taken=await sb.from("profiles").select("id").eq("username",username).maybeSingle();if(taken.data)return msg("Username already taken.","error");const r=await sb.auth.signUp({email,password:p,options:{data:{username,display_name:name||username}}});if(r.error)throw r.error;flow.email=email;flow.username=username;flow.name=name;mode="signupOtp";msg("6-digit OTP भेज दिया गया.","success");render()}catch(e){msg(e.message||"Account creation failed.","error")}finally{busy=false;$("#createAccount")?.removeAttribute("disabled")}}
function otpValue(){return[0,1,2,3,4,5].map(i=>$("#otp"+i)?.value||"").join("")}
async function verifyOtp(){const token=otpValue();if(!/^\d{6}$/.test(token))return msg("पूरा 6-digit OTP डालें.","error");busy=true;$("#verifyOtp").disabled=true;msg("OTP verify हो रहा है…");try{const type=mode==="signupOtp"?"signup":"email";const r=await sb.auth.verifyOtp({email:flow.email,token,type});if(r.error)throw r.error;if(mode==="signupOtp"){const u=r.data?.user;if(u){await sb.from("profiles").upsert({id:u.id,username:flow.username,display_name:flow.name||flow.username,auth_email:flow.email,contact_email:flow.email,is_verified:true,verified_at:new Date().toISOString()},{onConflict:"id"})}msg("Email verified. YOCEWOR खुल रहा है…","success");setTimeout(()=>location.href=APP,600)}else location.href=APP}catch(e){msg(e.message||"OTP गलत या expired है. नया OTP लें.","error")}finally{busy=false;$("#verifyOtp")?.removeAttribute("disabled")}}
async function resendOtp(){if(!flow.email)return;const b=$("#resendOtp");b.disabled=true;msg("नया 6-digit OTP भेजा जा रहा है…");try{const r=await sb.auth.resend({type:"signup",email:flow.email});if(r.error)throw r.error;msg("नया 6-digit OTP भेज दिया गया.","success");startTimer()}catch(e){msg(e.message||"OTP resend failed.","error");b.disabled=false}}
async function otpLogin(){const id=$("#loginId")?.value.trim().toLowerCase();if(!id||!id.includes("@"))return msg("Email OTP login के लिए email डालें.","error");flow.email=id;const r=await sb.auth.signInWithOtp({email:id,options:{shouldCreateUser:false}});if(r.error)return msg(r.error.message||"OTP भेजना failed.","error");mode="loginOtp";render();msg("6-digit OTP भेज दिया गया.","success")}
async function resetEmail(){const email=$("#email").value.trim().toLowerCase();if(!email)return msg("Email डालें.","error");const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+"?reset=1"});if(r.error)return msg(r.error.message||"Reset email failed.","error");msg("Password reset email भेज दिया गया.","success")}
(function(){const q=new URLSearchParams(location.search);if(q.get("reset")==="1"){cleanHash();openAuth()}})();
})();</script></body></html>
