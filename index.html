<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07040f"><title>YOCEWOR — Your Voice. Your World.</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--a:#ff6a00;--b:#ff2f7e;--c:#7c4dff;--bg:#07040f;--panel:#111526;--line:#2b3047;--muted:#a7acc1;--blue:#1688ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#291046 0,transparent 35%),radial-gradient(circle at 100% 30%,#16104b 0,transparent 34%),var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{width:min(980px,calc(100% - 24px));margin:auto}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center}.brand{font-size:21px;font-weight:950}.brand span{background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;color:transparent}.hero{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:24px 0}.card{width:min(520px,100%);background:#111526f7;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 70px #0007}.mark{width:72px;height:72px;margin:0 auto 15px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#ffb300,#ff2f7e,#7c4dff);box-shadow:0 10px 35px #ff2f7e33;font-weight:1000;font-size:36px}.tag{text-align:center;color:var(--muted);margin:0 0 22px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}.btn,.field{width:100%;border:1px solid var(--line);border-radius:13px;background:#151a2b;color:#fff;padding:12px}.btn{font-weight:850;cursor:pointer}.btn.primary{border:0;background:linear-gradient(100deg,var(--a),var(--b))}.btn.active{background:#20263a}.field{margin:5px 0;outline:0}.field:focus{border-color:var(--a)}.sep{display:flex;align-items:center;gap:10px;color:#6f758b;font-size:12px;margin:15px 0}.sep:before,.sep:after{content:" yle="margin-top:8px">Login</button><button id="otp" class="btn" style="margin-top:8px">Login with Email OTP</button><div class="sep">or</div><div class="grid2"><button id="google" class="btn">Continue with Google</button><button id="facebook" class="btn">Continue with Facebook</button></div>':'<input id="name" class="field" placeholder="Full name"><input id="user" class="field" autocomplete="username" placeholder="Username (3–30 letters, numbers, _)" pattern="[A-Za-z0-9_]{3,30}"><input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><input id="pass" class="field" type="password" autocomplete="new-password" placeholder="Password (8+ characters)"><button id="go" class="btn primary" style="margin-top:8px">Create account</button><button id="otp" class="btn" style="margin-top:8px">Create with Email OTP</button>';$('#go').onclick=submit;$('#otp').onclick=otp;$('#google')?.addEventListener('click',()=>oauth('google'));$('#facebook')?.addEventListener('click',()=>oauth('facebook'))}async function submit(){try{const email=$('#email').value.trim().toLowerCase(),password=$('#pass').value;if(!email||!password)return msg('Email और password भरें.');if(mode==='login'){const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;return showHome(r.data.user)}const user=$('#user').value.trim().toLowerCase(),name=$('#name').value.trim();if(!/^[a-z0-9_]{3,30}$/.test(user))return msg('Username 3–30 characters का होना चाहिए.');if(password.length<8)return msg('Password कम से कम 8 characters का रखें.');const r=await sb.auth.signUp({email,password,options:{data:{username:user,display_name:name||user}}});if(r.error)throw r.error;if(r.data.session)return showHome(r.data.user);msg('Account बन गया. Email verification पूरा करें, फिर login करें.','success')}catch(e){msg(e.message||'Authentication failed','error')}}async function otp(){try{const email=$('#email').value.trim().toLowerCase();if(!email)return msg('पहले email डालें.');const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:mode==='signup'}});if(r.error)throw r.error;const code=prompt('Email पर OTP भेजा गया है. OTP डालें:');if(!code)return;const v=await sb.auth.verifyOtp({email,token:code,type:'email'});if(v.error)throw v.error;if(mode==='signup'){const u=$('#user')?.value.trim().toLowerCase(),name=$('#name')?.value.trim();if(u&&/^[a-z0-9_]{3,30}$/.test(u))await sb.auth.updateUser({data:{username:u,display_name:name||u}})}showHome(v.data.user)}catch(e){msg(e.message||'OTP failed','error')}}async function oauth(provider){try{const r=await sb.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+location.pathname}});if(r.error)throw r.error}catch(e){msg(e.message||'OAuth login failed','error')}}async function showHome(u){$('#authCard').classList.add('hidden');$('#homeCard').classList.remove('hidden');$('#who').textContent=u?.email?'Logged in as '+u.email:'Logged in';}$('#loginTab').onclick=()=>{mode='login';$('#loginTab').classList.add('active');$('#signupTab').classList.remove('active');msg('');render()};$('#signupTab').onclick=()=>{mode='signup';$('#signupTab').classList.add('active');$('#loginTab').classList.remove('active');msg('');render()};$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('#openApp').onclick=()=>location.href='app-v4.html?v=stable-20260810-1';render();sb.auth.getSession().then(({data})=>{if(data.session)showHome(data.session.user)});})();</script></body></html>
