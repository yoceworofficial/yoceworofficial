<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07040f"><meta name="description" content="YOCEWOR — Your Voice. Your World."><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>YOCEWOR — Your Voice. Your World.</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--a:#ff6a00;--b:#ff2f7e;--c:#7c4dff;--bg:#07040f;--line:#2b3047;--muted:#a7acc1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}button,input{font:inherit}.screen{min-height:100vh}.splash{display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 34%,#291044 0,transparent 36%),radial-gradient(circle at 100% 50%,#171047 0,transparent 34%),linear-gradient(180deg,#05020a,#09030f);padding:24px}.splash-inner{width:min(92vw,720px)}.logo{width:min(92vw,560px);max-height:390px;object-fit:contain;filter:drop-shadow(0 18px 45px #0009)}.tag{font-size:clamp(20px,4vw,30px);font-weight:800;margin:8px 0 28px}.tag .a{color:var(--a)}.tag .p{color:var(--b)}.enter,.primary{border:0;border-radius:15px;padding:13px 24px;color:#fff;font-weight:900;background:linear-gradient(100deg,var(--a),var(--b));cursor:pointer}.small,.muted{color:var(--muted);font-size:12px;margin-top:14px}.auth{display:none;min-height:100vh;place-items:center;padding:20px;background:radial-gradient(circle at 15% 0,#291046 0,transparent 35%),radial-gradient(circle at 100% 30%,#16104b 0,transparent 34%),var(--bg)}.card{width:min(520px,100%);background:#111526f7;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 70px #0007}.brand{font-size:21px;font-weight:950;margin-bottom:22px}.brand span{background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;color:transparent}.mark{width:72px;height:72px;margin:0 auto 15px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#ffb300,#ff2f7e,#7c4dff);font-weight:1000;font-size:36px}.tabs,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs{margin:18px 0 12px}.btn,.field{width:100%;border:1px solid var(--line);border-radius:13px;background:#151a2b;color:#fff;padding:12px}.btn{font-weight:850;cursor:pointer}.active{background:#20263a}.field{margin:5px 0;outline:0}.field:focus{border-color:var(--a)}.link{border:0;background:transparent;color:#79b7ff;text-decoration:underline;padding:8px 0;cursor:pointer}.msg{min-height:20px;margin-top:10px;color:var(--muted);font-size:13px;white-space:pre-wrap}.success{color:#65e6a2}.error{color:#ff8da5}.hint{font-size:11px;color:#858ca3;margin:4px 2px 8px}.otpbox{display:flex;gap:8px;margin:14px 0}.otpbox input{width:52px;height:58px;min-width:0;text-align:center;font-size:24px;font-weight:900;padding:8px 2px;border:1px solid var(--line);border-radius:12px;background:#151a2b;color:#fff;outline:0}.otpbox input:focus{border-color:var(--a);box-shadow:0 0 0 2px #ff6a0033}@media(max-width:560px){.grid2{grid-template-columns:1fr}.card{padding:19px}.logo{max-height:330px}.otpbox{gap:5px}.otpbox input{width:calc((100vw - 70px)/6);height:54px;font-size:21px}}</style></head><body><section id="welcome" class="screen splash"><div class="splash-inner"><img class="logo" src="yocewor-logo.svg" alt="YOCEWOR"><div class="tag">Your <span class="a">Voice.</span> Your <span class="p">World.</span></div><button id="enter" class="enter">Enter YOCEWOR</button><div class="small">Simple. Social. Yours.</div></div></section><section id="auth" class="auth"><div class="card"><div class="brand"><span>YOCEWOR</span> · Your Voice. Your World.</div><div class="mark">Y</div><h1 id="title" style="text-align:center;margin:0">Welcome to YOCEWOR</h1><p id="sub" class="muted" style="text-align:center">Your Voice. Your World.</p><div id="tabs" class="tabs"><button id="loginTab" class="btn active">Login</button><button id="signupTab" class="btn">Create account</button></div><div id="form"></div><div id="msg" class="msg"></div></div></section><script>(()=>{const U='https://mzntgjyecymcpzciklfk.supabase.co',K='sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',APP='app-v5.html?v=20260810-14',sb=supabase.createClient(U,K),$=s=>document.querySelector(s);let mode='login',resetStage=0,signupData=null;const msg=(t,c='')=>{$('#msg').className='msg '+c;$('#msg').textContent=t};const auth=()=>{$('#welcome').style.display='none';$('#auth').style.display='grid';render()};const normUser=v=>v.trim().replace(/\s+/g,'_').toLowerCase();async function usernameFree(u){const {data,error}=await sb.from('profiles').select('id').eq('username',u).maybeSingle();if(error&&error.code!=='PGRST116')throw error;return !data}const passwordPolicy=p=>{if(p.length<8||p.length>12)return 'Password 8 से 12 characters का होना चाहिए.';if(!/[A-Z]/.test(p))return 'Password में कम से कम 1 capital letter (A-Z) होना चाहिए.';if(!/[a-z]/.test(p))return 'Password में कम से कम 1 small letter (a-z) होना चाहिए.';if(!/[0-9]/.test(p))return 'Password में कम से कम 1 number (0-9) होना चाहिए.';if(!/[!@"\'*:;?\/)\(\+\-&_₹#£€$¢^°={}\[\]℅™®©%~`|•√π÷×¶∆\\]/u.test(p))return 'Password में कम से कम 1 special character होना चाहिए, जैसे @, #, !, _, ₹, £, € आदि.';if(!/^[A-Za-z0-9!@"\'*:;?\/)\(\+\-&_₹#£€$¢^°={}\[\]℅™®©%~`|•√π÷×¶∆\\]+$/u.test(p))return 'Password में केवल letters, numbers और allowed special characters इस्तेमाल करें.';return ''};function otpHtml(id,buttonText){return '<p class="hint" style="text-align:center">6 अंकों का OTP आपके email पर भेजा गया है</p><div class="otpbox" id="'+id+'">'+[0,1,2,3,4,5].map((_,i)=>'<input inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="1" aria-label="OTP digit '+(i+1)+'">').join('')+'</div><button id="verifyOtp" class="btn primary">'+buttonText+'</button><button id="resendOtp" class="link">Resend OTP</button>'}function setupOtp(id){const box=document.getElementById(id);if(!box)return()=>'';const ins=[...box.querySelectorAll('input')];ins.forEach((el,i)=>{el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value&&i<5)ins[i+1].focus()});el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&i>0)ins[i-1].focus()});el.addEventListener('paste',e=>{e.preventDefault();const s=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);s.split('').forEach((x,j)=>{if(ins[j])ins[j].value=x});if(s.length)ins[Math.min(s.length-1,5)].focus()})});ins[0]?.focus();return()=>ins.map(x=>x.value).join('')}function render(){const f=$('#form');$('#title').textContent=mode==='login'?'Welcome to YOCEWOR':mode==='signup'?'Create your YOCEWOR account':mode==='signupOtp'?'Verify your email':'Reset your password';$('#sub').textContent=mode==='signup'?'Password + 6-digit Email OTP required.':mode==='login'?'Your Voice. Your World.':mode==='signupOtp'?'OTP verify होने के बाद ही account active होगा.':'Choose a new secure password.';$('#tabs').style.display=(mode==='reset'||mode==='signupOtp')?'none':'grid';if(mode==='login')f.innerHTML='<input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Password"><button id="go" class="btn primary">Login</button><button id="otpLogin" class="btn" style="margin-top:8px">Login with Email OTP</button><button id="forgot" class="link">Forgot password?</button><div class="grid2" style="margin-top:8px"><button id="google" class="btn">Continue with Google</button><button id="facebook" class="btn">Continue with Facebook</button></div>';else if(mode==='signup')f.innerHTML='<input id="name" class="field" placeholder="Full name"><input id="user" class="field" autocomplete="username" placeholder="Username"><div class="hint">3–30 chars • lowercase a–z, 0–9, _ or . • spaces automatically become _</div><input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><input id="pass" class="field" type="password" autocomplete="new-password" placeholder="Password (8–12 chars, A-Z, a-z, 0-9 + special)"><div class="hint">Password: 8–12 total characters • at least 1 capital • 1 small • 1 number • 1 special character</div><input id="pass2" class="field" type="password" autocomplete="new-password" placeholder="Confirm password"><button id="sendSignupOtp" class="btn primary">Send OTP</button>';else if(mode==='signupOtp')f.innerHTML=otpHtml('signupOtpBox','Verify OTP & Create Account');else if(resetStage===0)f.innerHTML='<input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><button id="link" class="btn primary">Send password reset link</button><button id="rotp" class="btn" style="margin-top:8px">Reset with Email OTP</button>';else if(resetStage===1)f.innerHTML=otpHtml('resetOtpBox','Verify OTP');else f.innerHTML='<input id="newpass" class="field" type="password" autocomplete="new-password" placeholder="New password (8–12 chars, A-Z, a-z, 0-9 + special)"><div class="hint">Password: 8–12 total characters • 1 capital • 1 small • 1 number • 1 special required</div><input id="newpass2" class="field" type="password" autocomplete="new-password" placeholder="Confirm new password"><button id="set" class="btn primary">Set new password</button>';$('#go')?.addEventListener('click',login);$('#otpLogin')?.addEventListener('click',otpLogin);$('#forgot')?.addEventListener('click',()=>{mode='reset';resetStage=0;render()});$('#google')?.addEventListener('click',()=>oauth('google'));$('#facebook')?.addEventListener('click',()=>oauth('facebook'));$('#sendSignupOtp')?.addEventListener('click',sendSignupOtp);$('#verifyOtp')?.addEventListener('click',verifyCurrentOtp);$('#resendOtp')?.addEventListener('click',resendCurrentOtp);$('#link')?.addEventListener('click',sendLink);$('#rotp')?.addEventListener('click',sendResetOtp);$('#set')?.addEventListener('click',setPassword);if(mode==='signupOtp')window.readSignupOtp=setupOtp('signupOtpBox');if(mode==='reset'&&resetStage===1)window.readResetOtp=setupOtp('resetOtpBox')}async function login(){try{const r=await sb.auth.signInWithPassword({email:$('#email').value.trim().toLowerCase(),password:$('#pass').value});if(r.error)throw r.error;location.href=APP}catch(e){msg(e.message||'Login failed','error')}}async function sendSignupOtp(){try{const email=$('#email').value.trim().toLowerCase(),user=normUser($('#user').value),name=$('#name').value.trim(),p=$('#pass').value,p2=$('#pass2').value;if(!email)return msg('Email डालें.','error');if(!/^[a-z0-9_.]{3,30}$/.test(user))return msg('Username 3–30 chars: lowercase a-z, numbers, _ or . only.','error');if(!(await usernameFree(user)))return msg('यह username पहले से लिया जा चुका है.','error');const pe=passwordPolicy(p);if(pe)return msg(pe,'error');if(p!==p2)return msg('Confirm password same रखें.','error');const r=await sb.auth.signUp({email,password:p,options:{data:{username:user,display_name:name||user}}});if(r.error)throw r.error;signupData={email,user,name};mode='signupOtp';render();msg('6-digit OTP आपके email पर भेजा गया है.','success')}catch(e){msg(e.message||'OTP भेजने में समस्या हुई','error')}}async function verifyCurrentOtp(){try{const code=mode==='signupOtp'?(window.readSignupOtp?window.readSignupOtp():''):(window.readResetOtp?window.readResetOtp():'');if(!/^\d{6}$/.test(code))return msg('कृपया पूरे 6 अंकों का OTP डालें.','error');if(mode==='signupOtp'){const v=await sb.auth.verifyOtp({email:signupData.email,token:code,type:'signup'});if(v.error)throw v.error;const u=signupData.user;const {error:pe}=await sb.from('profiles').upsert({id:v.data.user.id,username:u,display_name:signupData.name||u},{onConflict:'id'});if(pe)throw pe;location.href=APP}else{const email=signupData?.email||$('#email')?.value.trim().toLowerCase();const v=await sb.auth.verifyOtp({email,token:code,type:'recovery'});if(v.error)throw v.error;resetStage=2;render();msg('OTP verified. अब नया password बनाइए.','success')}}catch(e){msg(e.message||'OTP verification failed','error')}}async function resendCurrentOtp(){try{if(mode==='signupOtp'){const r=await sb.auth.resend({type:'signup',email:signupData.email});if(r.error)throw r.error}else{const email=signupData?.email||$('#email').value.trim().toLowerCase();const r=await sb.auth.resend({type:'recovery',email});if(r.error)throw r.error}msg('6-digit OTP फिर से भेज दिया गया.','success')}catch(e){msg(e.message||'Resend failed','error')}}async function otpLogin(){try{const email=$('#email').value.trim().toLowerCase();const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(r.error)throw r.error;const code=prompt('Email OTP डालें:');if(!code)return;const v=await sb.auth.verifyOtp({email,token:code,type:'email'});if(v.error)throw v.error;location.href=APP}catch(e){msg(e.message||'OTP login failed','error')}}async function sendLink(){try{const email=$('#email').value.trim().toLowerCase();if(!email)return msg('Email डालें.','error');const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'?recovery=1'});if(r.error)throw r.error;msg('Password reset link email पर भेज दिया गया है. Link खोलकर नया password बनाइए.','success')}catch(e){msg(e.message||'Reset link failed','error')}}async function sendResetOtp(){try{const email=$('#email').value.trim().toLowerCase();if(!email)return msg('Email डालें.','error');const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'?recovery=otp'});if(r.error)throw r.error;signupData={email};resetStage=1;render();msg('6-digit OTP email पर भेज दिया गया है.','success')}catch(e){msg(e.message||'Reset OTP failed','error')}}async function setPassword(){try{const a=$('#newpass').value,b=$('#newpass2').value;const pe=passwordPolicy(a);if(pe)return msg(pe,'error');if(a!==b)return msg('Confirm password same रखें.','error');const r=await sb.auth.updateUser({password:a});if(r.error)throw r.error;await sb.auth.signOut();mode='login';resetStage=0;render();msg('Password बदल गया. अब login करें.','success')}catch(e){msg(e.message||'Password update failed','error')}}async function oauth(p){try{const r=await sb.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin+location.pathname}});if(r.error)throw r.error}catch(e){msg(e.message||'OAuth login failed','error')}}$('#enter').onclick=auth;$('#loginTab').onclick=()=>{mode='login';resetStage=0;render()};$('#signupTab').onclick=()=>{mode='signup';resetStage=0;render()};if(new URLSearchParams(location.search).get('recovery')==='1'){auth();mode='reset';resetStage=2;render()}else{render()}})();</script></body></html>
