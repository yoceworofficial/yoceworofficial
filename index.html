lick',()=>oauth('facebook'))}async function submit(){try{const email=$('#email').value.trim().toLowerCase(),password=$('#pass').value;if(!email||!password)return msg('Email और password भरें.');if(mode==='login'){const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;return location.href='app-v4.html?v=stable-20260810-2'}const user=$('#user').value.trim().toLowerCase(),name=$('#name').value.trim();if(!/^[a-z0-9_]{3,30}$/.test(user))return msg('Username 3–30 characters का होना चाहिए.');if(password.length<8)return msg('Password कम से कम 8 characters का रखें.');const r=await sb.auth.signUp({email,password,options:{data:{username:user,display_name:name||user}}});if(r.error)throw r.error;if(r.data.session)return location.href='app-v4.html?v=stable-20260810-2';msg('Account बन गया. Email verification पूरा करें, फिर login करें.','success')}catch(e){msg(e.message||'Authentication failed','error')}}async function otp(){try{const email=$('#email').value.trim().toLowerCase();if(!email)return msg('पहले email डालें.');const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:mode==='signup'}});if(r.error)throw r.error;const code=prompt('Email पर OTP भेजा गया है. OTP डालें:');if(!code)return;const v=await sb.auth.verifyOtp({email,token:code,type:'email'});if(v.error)throw v.error;if(mode==='signup'){const u=$('#user')?.value.trim().toLowerCase(),name=$('#name')?.value.trim();if(u&&/^[a-z0-9_]{3,30}$/.test(u))await sb.auth.updateUser({data:{username:u,display_name:name||u}})}location.href='app-v4.html?v=stable-20260810-2'}catch(e){msg(e.message||'OTP failed','error')}}async function oauth(provider){try{const r=await sb.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+location.pathname}});if(r.error)throw r.error}catch(e){msg(e.message||'OAuth login failed','error')}}$('#enter').onclick=showAuth;$('#loginTab').onclick=()=>{mode='login';$('#loginTab').classList.add('active');$('#signupTab').classList.remove('active');msg('');re
