<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07040f"><title>YOCEWOR — Your Voice. Your World.</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--a:#ff6a00;--b:#ff2f7e;--c:#7c4dff;--bg:#07040f;--panel:#111526;--line:#2b3047;--muted:#a7acc1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07040f;color:#fff;font-family:Inter,system-ui,sans-serif}button,input{font:inherit}.screen{min-height:100vh}.splash{display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 34%,#291044 0,transparent 36%),radial-gradient(circle at 100% 50%,#171047 0,transparent 34%),linear-gradient(180deg,#05020a,#09030f);padding:24px}.splash-inner{width:min(92vw,720px)}.logo{width:min(92vw,560px);max-height:390px;object-fit:contain;filter:drop-shadow(0 18px 45px #0009)}.tag{font-size:clamp(20px,4vw,30px);font-weight:800;margin:8px 0 28px}.tag .a{color:var(--a)}.tag .p{color:var(--b)}.enter{border:0;border-radius:16px;padding:14px 30px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(100deg,var(--a),var(--b));box-shadow:0 12px 35px #ff2f7e33;cursor:pointer}.small{color:var(--muted);font-size:12px;margin-top:14px}.authscreen{display:none;place-items:center;min-height:100vh;padding:20px;background:radial-gradient(circle at 15% 0,#291046 0,transparent 35%),radial-gradient(circle at 100% 30%,#16104b 0,transparent 34%),var(--bg)}.wrap{width:min(980px,calc(100% - 24px));margin:auto}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center}.brand{font-size:21px;font-weight:950}.brand span{background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;color:transparent}.card{width:min(520px,100%);background:#111526f7;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 70px #0007}.mark{width:72px;height:72px;margin:0 auto 15px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#ffb300,#ff2f7e,#7c4dff);box-shadow:0 10px 35px #ff2f7e33;font-weight:1000;font-size:36px}.tag2{text-align:center;color:var(--muted);margin:0 0 22px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}.btn,.field{width:100%;border:1px solid var(--line);border-radius:13px;background:#151a2b;color:#fff;padding:12px}.btn{font-weight:850;cursor:pointer}.btn.primary{border:0;background:linear-gradient(100deg,var(--a),var(--b))}.btn.active{background:#20263a}.field{margin:5px 0;outline:0}.field:focus{border-color:var(--a)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.msg{min-height:20px;margin-top:10px;color:var(--muted);font-size:13px;white-space:pre-wrap}.success{color:#65e6a2}.error{color:#ff8da5}.link{border:0;background:transparent;color:#79b7ff;padding:8px 0;text-decoration:underline;cursor:pointer}@media(max-width:560px){.grid2{grid-template-columns:1fr}.card{padding:19px}.logo{max-height:330px}}</style></head><body><section id="welcome" class="screen splash"><div class="splash-inner"><img class="logo" src="yocewor-logo.svg" alt="YOCEWOR"><div class="tag">Your <span class="a">Voice.</span> Your <span class="p">World.</span></div><button id="enter" class="enter">Enter YOCEWOR</button><div class="small">Simple. Social. Yours.</div></div></section><section id="authScreen" class="authscreen"><div class="wrap"><div class="top"><div class="brand"><span>YOCEWOR</span> · Your Voice. Your World.</div></div><div style="display:grid;place-items:center;min-height:calc(100vh - 68px)"><section class="card"><div class="mark">Y</div><h1 id="title" style="text-align:center;margin:0">Welcome to YOCEWOR</h1><p id="subtitle" class="tag2">Your Voice. Your World.</p><div id="tabs" class="tabs"><button class="btn active" id="loginTab">Login</button><button class="btn" id="signupTab">Create account</button></div><div id="form"></div><div id="msg" class="msg"></div></section></div></div></section><script>(function(){'use strict';const URL='https://mzntgjyecymcpzciklfk.supabase.co',KEY='sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn',APP='app-v5.html?v=20260810-8';const sb=window.supabase.createClient(URL,KEY);const $=s=>document.querySelector(s),msg=(t,c)=>{const n=$('#msg');n.className='msg '+(c||'');n.textContent=t};let mode='login',recovery=false;function showAuth(){if(recovery)return;$('#welcome').style.display='none';$('#authScreen').style.display='grid';render()}function render(){const f=$('#form');$('#title').textContent=mode==='login'?'Welcome to YOCEWOR':mode==='signup'?'Create your YOCEWOR account':'Reset your password';$('#subtitle').textContent=mode==='signup'?'Create your account using Email OTP only.':mode==='login'?'Your Voice. Your World.':'Choose a new secure password.';$('#tabs').style.display=mode==='recovery'?'none':'grid';if(mode==='login')f.innerHTML='<input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Password"><button id="go" class="btn primary">Login</button><button id="otp" class="btn" style="margin-top:8px">Login with Email OTP</button><button id="forgot" class="link">Forgot password?</button><div style="margin-top:8px" class="grid2"><button id="google" class="btn">Continue with Google</button><button id="facebook" class="btn">Continue with Facebook</button></div>';else if(mode==='signup')f.innerHTML='<input id="name" class="field" placeholder="Full name"><input id="user" class="field" autocomplete="username" placeholder="Username (3–30 letters, numbers, _)" pattern="[A-Za-z0-9_]{3,30}"><input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><button id="otp" class="btn primary">Send Email OTP</button>';else f.innerHTML='<input id="newpass" class="field" type="password" autocomplete="new-password" placeholder="New password (8+ characters)"><input id="newpass2" class="field" type="password" autocomplete="new-password" placeholder="Confirm new password"><button id="setpass" class="btn primary">Set new password</button>';$('#go')?.addEventListener('click',login);$('#otp')?.addEventListener('click',mode==='signup'?signupOtp:loginOtp);$('#forgot')?.addEventListener('click',forgot);$('#google')?.addEventListener('click',()=>oauth('google'));$('#facebook')?.addEventListener('click',()=>oauth('facebook'));$('#setpass')?.addEventListener('click',setPassword)}async function login(){try{const email=$('#email').value.trim().toLowerCase(),password=$('#pass').value;if(!email||!password)return msg('Email और password भरें.');const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;location.href=APP}catch(e){msg(e.message||'Login failed','error')}}async function signupOtp(){try{const email=$('#email').value.trim().toLowerCase(),user=$('#user').value.trim().toLowerCase(),name=$('#name').value.trim();if(!email)return msg('Email डालें.');if(!/^[a-z0-9_]{3,30}$/.test(user))return msg('Username 3–30 characters का होना चाहिए.');const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,data:{username:user,display_name:name||user}}});if(r.error)throw r.error;const code=prompt('Email पर OTP भेजा गया है. OTP डालें:');if(!code)return;const v=await sb.auth.verifyOtp({email,token:code,type:'email'});if(v.error)throw v.error;await sb.auth.updateUser({data:{username:user,display_name:name||user}});location.href=APP}catch(e){msg(e.message||'Signup OTP failed','error')}}async function loginOtp(){try{const email=$('#email').value.trim().toLowerCase();if(!email)return msg('Email डालें.');const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(r.error)throw r.error;const code=prompt('Email पर OTP भेजा गया है. OTP डालें:');if(!code)return;const v=await sb.auth.verifyOtp({email,token:code,type:'email'});if(v.error)throw v.error;location.href=APP}catch(e){msg(e.message||'OTP login failed','error')}}async function forgot(){mode='recovery';render();const old=$('#form');old.insertAdjacentHTML('beforeend','<div class="sep" style="display:flex;align-items:center;gap:10px;color:#6f758b;margin:12px 0"><span style="flex:1;height:1px;background:#2b3047"></span>or<span style="flex:1;height:1px;background:#2b3047"></span></div><input id="recoverEmail" class="field" type="email" placeholder="Email"><button id="linkReset" class="btn primary">Send password reset link</button><button id="otpReset" class="btn" style="margin-top:8px">Reset with Email OTP</button>');$('#setpass').style.display='none';$('#linkReset').onclick=sendResetLink;$('#otpReset').onclick=resetOtp;document.querySelector('#form #newpass').remove();document.querySelector('#form #newpass2').remove()}async function sendResetLink(){try{const email=$('#recoverEmail').value.trim().toLowerCase();if(!email)return msg('Email डालें.');const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'?recovery=1'});if(r.error)throw r.error;msg('Password reset link email पर भेज दिया गया है. Link खोलकर नया password बनाइए.','success')}catch(e){msg(e.message||'Reset link failed','error')}}async function resetOtp(){try{const email=$('#recoverEmail').value.trim().toLowerCase();if(!email)return msg('Email डालें.');const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(r.error)throw r.error;const code=prompt('Email पर OTP भेजा गया है. OTP डालें:');if(!code)return;const v=await sb.auth.verifyOtp({email,token:code,type:'email'});if(v.error)throw v.error;recovery=true;mode='recovery';render();msg('OTP verified. अब नया password बनाइए.','success')}catch(e){msg(e.message||'OTP reset failed','error')}}async function setPassword(){try{const a=$('#newpass').value,b=$('#newpass2').value;if(a.length<8)return msg('Password कम से कम 8 characters का रखें.','error'
