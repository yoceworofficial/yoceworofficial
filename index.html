function bind(){$("#go")?.addEventListener("click",login);$("#otpLogin")?.addEventListener("click",otpLogin);$("#forgot")?.addEventListener("click",()=>{mode="reset";resetStage=0;msg("");render()});$("#google")?.addEventListener("click",()=>oauth("google"));$("#facebook")?.addEventListener("click",()=>oauth("facebook"));$("#createAccount")?.addEventListener("click",createAccount);$("#verifyOtp")?.addEventListener("click",verifyOtp);$("#resendOtp")?.addEventListener("click",resendOtp);$("#rotp")?.addEventListener("click",sendResetOtp);$("#set")?.addEventListener("click",setPassword);$("#resendSignup")?.addEventListener("click",resendSignup);$("#retrySignup")?.addEventListener("click",resendSignup);$("#backLogin")?.addEventListener("click",()=>{mode="login";resetStage=0;msg("");render()})}

async function otpLogin(){const email=$("#email")?.value.trim().toLowerCase();if(!email)return msg("Email डालें.","error");const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});if(r.error)return msg(r.error.message||"OTP भेजना failed.","error");flow.email=email;mode="loginOtp";msg("OTP sent.");render()}
