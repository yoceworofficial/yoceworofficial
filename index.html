<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="YOCEWOR — Your Voice. Your World.">
<link rel="icon" href="assets/yocewor-favicon.svg" type="image/svg+xml">
<title>YOCEWOR — Your Voice. Your World.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1769ff;--blue2:#0f56d9;--ink:#101828;--muted:#667085;--line:#e6eaf0;--bg:#f7f9fc;--card:#fff;--soft:#eef4ff;--ok:#16a05d;--danger:#d92d20;--r:18px;--shadow:0 12px 35px rgba(16,24,40,.08)}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);line-height:1.5}button,input,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}img{max-width:100%;display:block}.hidden{display:none!important}.container{width:min(1120px,calc(100% - 28px));margin:auto}
.top{height:68px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.topin{height:100%;width:min(1120px,calc(100% - 28px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px;letter-spacing:-.6px}.brand img{width:38px;height:38px;border-radius:12px}.tag{color:var(--muted);font-size:12px;margin-left:3px}.actions{display:flex;align-items:center;gap:8px}.icon{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:750;min-height:42px}.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.soft{background:var(--soft);color:var(--blue)}.danger{background:#fff1f0;color:var(--danger);border:1px solid #ffd6d2}
.auth{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:30px 0}.authgrid{width:min(980px,100%);display:grid;grid-template-columns:1.05fr .95fr;background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}.welcome{padding:55px;background:#101828;color:#fff;display:flex;flex-direction:column;justify-content:center}.welcome img{width:60px;height:60px;margin-bottom:24px}.welcome h1{font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-2.5px;margin:0 0 16px}.welcome p{color:#c9d1df;max-width:420px;font-size:16px}.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.pill{border:1px solid #344054;color:#e7ebf2;border-radius:999px;padding:7px 11px;font-size:12px}.authbox{padding:38px}.authbox h2{margin:0 0 6px;font-size:28px;letter-spacing:-1px}.sub{color:var(--muted);font-size:14px;margin-bottom:22px}.tabs{display:flex;gap:4px;background:#f2f4f7;padding:4px;border-radius:12px;margin-bottom:20px}.tab{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:700;color:var(--muted)}.tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(16,24,40,.07)}label{display:block;font-size:12px;font-weight:750;margin:12px 0 6px}.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none;background:#fff;color:var(--ink)}.field:focus{border-color:#8db1ff;box-shadow:0 0 0 4px #eaf1ff}.authbox .btn{width:100%;margin-top:16px}.small{font-size:12px;color:var(--muted)}
.app{min-height:calc(100vh - 68px);padding:24px 0 90px}.layout{display:grid;grid-template-columns:190px minmax(0,620px) 240px;gap:24px;align-items:start}.side{position:sticky;top:92px}.navitem{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:12px;border-radius:12px;color:var(--muted);font-weight:700;text-align:left}.navitem.active,.navitem:hover{background:#fff;color:var(--ink);box-shadow:0 3px 14px rgba(16,24,40,.05)}.sidebrand{padding:14px 12px 18px;color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.profilemini{padding:16px;margin-bottom:10px}.avatar{width:46px;height:46px;border-radius:50%;background:#e8efff;color:var(--blue);display:grid;place-items:center;font-weight:850;overflow:hidden;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}.row{display:flex;align-items:center;gap:11px}.grow{flex:1;min-width:0}.name{font-weight:800}.muted{color:var(--muted)}.tiny{font-size:12px}.verified{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:900;margin-left:4px}
.composer{padding:16px;margin-bottom:16px}.composer textarea{width:100%;min-height:82px;resize:vertical;border:0;outline:0;font-size:15px}.composerfoot{border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:8px}.filelabel{padding:9px 12px;border-radius:10px;background:#f5f7fa;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}.filelabel input{display:none}.post{margin-bottom:16px;overflow:hidden}.posthead{padding:15px 16px 10px}.postbody{padding:0 16px 14px;white-space:pre-wrap;overflow-wrap:anywhere}.postmedia{width:100%;max-height:560px;object-fit:cover;background:#f2f4f7}.postfoot{border-top:1px solid var(--line);display:flex;gap:6px;padding:8px}.action{border:0;background:#fff;color:var(--muted);padding:9px 11px;border-radius:10px;font-weight:700}.action:hover{background:#f5f7fa;color:var(--ink)}.empty{text-align:center;padding:40px 18px;color:var(--muted)}.rightcard{padding:16px;margin-bottom:12px}.rightcard h3{font-size:14px;margin:0 0 12px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.stat b{display:block}.explore{padding:20px}..search{display:flex;gap:8px}.search input{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}.profile{padding:22px}.profiletop{display:flex;gap:18px;align-items:center}.profile .avatar{width:88px;height:88px}.profileactions{margin-left:auto}.badgebox{margin-top:20px;background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:16px}.bottom{display:none;position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}.bottom button{flex:1;border:0;background:#fff;color:var(--muted);font-size:11px;font-weight:700}.bottom button.active{color:var(--blue)}.view{display:none}.view.active{display:block}.toastwrap{position:fixed;right:16px;bottom:16px;z-index:100;width:min(360px,calc(100% - 32px))}.toast{background:#101828;color:#fff;border-radius:12px;padding:13px 15px;margin-top:8px;box-shadow:var(--shadow);font-size:13px}.toast.error{background:#b42318}
@media(max-width:900px){.layout{grid-template-columns:72px minmax(0,680px)}.side .navlabel,.sidebrand{display:none}.right{display:none}.navitem{justify-content:center}.navitem svg{width:22px}.bottom{display:flex}.app{padding-bottom:78px}}
@media(max-width:700px){.top{height:60px}.tag{display:none}.container,.topin{width:calc(100% - 18px)}.auth{padding:12px 0}.authgrid{grid-template-columns:1fr;border-radius:20px}.welcome{padding:30px}.welcome h1{font-size:38px}.authbox{padding:24px}.layout{display:block}.side{display:none}.app{padding-top:12px}.profiletop{align-items:flex-start}.profileactions{margin-left:0}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><img src="assets/yocewor-logo-mark.svg" alt="YOCEWOR"><span>YOCEWOR</span><span class="tag">Your Voice. Your World.</span></div><div class="actions" id="topActions"></div></div></header>
<main id="root"></main>
<div class="bottom" id="bottomNav"></div><div class="toastwrap" id="toasts"></div>
<script>
'use strict';
const SUPABASE_URL='https://mzntgjyecymcpzciklfk.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
window.supabaseClient=sb; window.yoceworSupabase=sb;
let user=null,profile=null,active='home',posts=[],loading=false;
const $=s=>document.querySelector(s);
function toast(msg,error=false){const d=document.createElement('div');d.className='toast'+(error?' error':'');d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3200)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function initials(p){return esc((p?.display_name||p?.username||user?.email||'Y').slice(0,1).toUpperCase())}
function avatar(p,cls='avatar'){const url=p?.avatar_url||p?.photo_url||p?.profile_photo;return url?`<div class="${cls}"><img src="${esc(url)}" alt=""></div>`:`<div class="${cls}">${initials(p)}</div>`}
function verified(p){return p?.is_verified||p?.verified?'<span class="verified" title="Verified">✓</span>':''}
async function loadProfile(id){if(!id)return null;const {data,error}=await sb.from('profiles').select('*').eq('id',id).maybeSingle();if(error){console.warn('profile',error);return null}return data}
function authView(){return `<section class="auth"><div class="authgrid"><div class="welcome"><img src="assets/yocewor-logo-mark.svg" alt="YOCEWOR"><h1>Your voice.<br>Your world.</h1><p>A simple place to share what matters, discover people and build your world.</p><div class="pills"><span class="pill">Simple</span><span class="pill">Human</span><span class="pill">Social</span><span class="pill">Made for everyone</span></div></div><div class="authbox"><div class="tabs"><button class="tab active" data-auth="login">Login</button><button class="tab" data-auth="signup">Create account</button></div><div id="authForm"></div></div></div></section>`}
function authForm(mode='login'){return mode==='login'?`<h2>Welcome back</h2><div class="sub">Sign in to continue to YOCEWOR.</div><label>Email</label><input id="email" class="field" type="email" autocomplete="email"><label>Password</label><input id="password" class="field" type="password" autocomplete="current-password"><button class="btn primary" id="loginBtn">Login to YOCEWOR</button><p class="small" style="margin-top:14px">New here? Use “Create account” above.</p>`:`<h2>Join YOCEWOR</h2><div class="sub">Create your identity and start sharing.</div><label>Name</label><input id="displayName" class="field" autocomplete="name"><label>Username</label><input id="username" class="field" placeholder="yourname" autocomplete="username"><label>Email</label><input id="email" class="field" type="email" autocomplete="email"><label>Password</label><input id="password" class="field" type="password" autocomplete="new-password"><button class="btn primary" id="signupBtn">Create my account</button>`}
async function login(){const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return toast('Enter email and password',true);const {error}=await sb.auth.signInWithPassword({email,password});if(error)return toast(error.message,true);toast('Welcome back')}
async function signup(){const email=$('#email').value.trim().toLowerCase(),password=$('#password').value,username=$('#username').value.trim().toLowerCase(),display_name=$('#displayName').value.trim();if(!/^[a-z0-9_]{3,30}$/.test(username))return toast('Username must be 3–30 lowercase characters, numbers or _',true);const {data,error}=await sb.auth.signUp({email,password,options:{data:{username,display_name:display_name||username}}});if(error)return toast(error.message,true);toast(data.session?'Account created':'Check your email to confirm your account')}
function bindAuth(){document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-auth]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#authForm').innerHTML=authForm(b.dataset.auth);bindAuthForm(b.dataset.auth)});bindAuthForm('login')}
function bindAuthForm(mode){$('#loginBtn')?.addEventListener('click',login);$('#signupBtn')?.addEventListener('click',signup);document.querySelectorAll('#authForm input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')mode==='login'?login():signup()}))}
function nav(){const items=[['home','Home','⌂'],['explore','Explore','⌕'],['create','Create','＋'],['notifications','Notifications','♡'],['profile','Profile','○']];return items.map(([id,label,icon])=>`<button class="navitem ${active===id?'active':''}" data-nav="${id}"><span style="font-size:20px">${icon}</span><span class="navlabel">${label}</span></button>`).join('')}
function shell(){return `<section class="app"><div class="container layout"><aside class="side"><div class="sidebrand">YOUR VOICE. YOUR WORLD.</div><div class="card profilemini">${avatar(profile)}<div style="margin-top:9px"><div class="name">${esc(profile?.display_name||profile?.username||user.email.split('@')[0])}${verified(profile)}</div><div class="muted tiny">@${esc(profile?.username||'you')}</div></div></div>${nav()}</aside><section><div id="view" class="view active"></div></section><aside class="right"><div class="card rightcard"><h3>YOCEWOR</h3><div class="muted tiny">Your Voice. Your World.</div><div class="statgrid"><div class="stat"><b>—</b><span class="tiny muted">Posts</span></div><div class="stat"><b>—</b><span class="tiny muted">Followers</span></div><div class="stat"><b>—</b><span class="tiny muted">Following</span></div></div></div><div class="card rightcard"><h3>Verification</h3><div class="muted tiny">Blue verification is planned at ₹75/month. Payment is not simulated here.</div><button class="btn soft" style="margin-top:12px;width:100%" data-nav="profile">View profile</button></div></aside></div></section>`}
function mobileNav(){const items=[['home','⌂'],['explore','⌕'],['create','＋'],['notifications','♡'],['profile','○']];return items.map(([id,i])=>`<button class="${active===id?'active':''}" data-nav="${id}">${i}<br>${id[0].toUpperCase()+id.slice(1)}</button>`).join('')}
async function getPosts(){loading=true;renderHome();const {data,error}=await sb.from('posts').select('id,user_id,body,image_url,created_at').order('created_at',{ascending:false}).range(0,19);loading=false;if(error){console.error(error);posts=[];toast('Feed could not be loaded. Check Supabase policies.',true)}else posts=data||[];renderHome()}
async function renderPosts(){if(loading)return '<div class="card empty">Loading your feed…</div>';if(!posts.length)return '<div class="card empty"><b>No posts yet</b><br>Be the first voice on YOCEWOR.</div>';const ids=[...new Set(posts.map(p=>p.user_id).filter(Boolean))];let profs={};if(ids.length){const r=await sb.from('profiles').select('*').in('id',ids);(r.data||[]).forEach(p=>profs[p.id]=p)}return posts.map(p=>{const pr=profs[p.user_id]||{};return `<article class="card post"><div class="row posthead">${avatar(pr)}<div class="grow"><div class="name">${esc(pr.display_name||pr.username||'YOCEWOR user')}${verified(pr)}</div><div class="muted tiny">@${esc(pr.username||'user')} · ${new Date(p.created_at).toLocaleDateString()}</div></div></div>${p.body?`<div class="postbody">${esc(p.body)}</div>`:''}${p.image_url?`<img class="postmedia" src="${esc(p.image_url)}" alt="Post media" loading="lazy">`:''}<div class="postfoot"><button class="action" data-like="${esc(p.id)}">♡ Like</button><button class="action" data-comment="${esc(p.id)}">○ Comment</button><button class="action" data-share="${esc(p.id)}">↗ Share</button></div></article>`}).join('')}
async function renderHome(){const v=$('#view');if(!v)return;v.innerHTML=`<div class="composer card"><div class="row">${avatar(profile)}<div class="grow muted">Share something with your world…</div></div><textarea id="postBody" placeholder="What's on your mind?"></textarea><div class="composerfoot"><label class="filelabel">Add image<input id="postImage" type="file" accept="image/*"></label><span class="muted tiny grow" id="fileName"></span><button class="btn primary" id="publish">Post</button></div></div><div id="feed">${await renderPosts()}</div>`;$('#postImage')?.addEventListener('change',e=>$('#fileName').textContent=e.target.files[0]?.name||'');$('#publish')?.addEventListener('click',createPost);bindPostActions()}
async function createPost(){const body=$('#postBody').value.trim(),file=$('#postImage').files[0];if(!body&&!file)return toast('Write something or add an image',true);let image_url=null;if(file){if(!file.type.startsWith('image/'))return toast('Only images are supported',true);if(file.size>8*1024*1024)return toast('Image must be under 8MB',true);const path=`${user.id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'')}`;const up=await sb.storage.from('yocewor-media').upload(path,file,{cacheControl:'3600',upsert:false});if(up.error)return toast(up.error.message,true);image_url=sb.storage.from('yocewor-media').getPublicUrl(path).data.publicUrl}const {error}=await sb.from('posts').insert({user_id:user.id,body:body||null,image_url});if(error)return toast(error.message,true);$('#postBody').value='';$('#postImage').value='';toast('Posted to YOCEWOR');await getPosts()}
function bindPostActions(){document.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{const url=location.href+'#post-'+b.dataset.share;if(navigator.share)await navigator.share({title:'YOCEWOR',text:'Check this post on YOCEWOR',url});else{await navigator.clipboard?.writeText(url);toast('Post link copied')}});document.querySelectorAll('[data-like]').forEach(b=>b.onclick=async()=>{const {error}=await sb.from('likes').insert({post_id:b.dataset.like,user_id:user.id});if(error)toast('Like is unavailable until likes RLS/schema is configured.',true);else{b.textContent='♥ Liked';b.disabled=true}});document.querySelectorAll('[data-comment]').forEach(b=>b.onclick=()=>toast('Comments UI is ready; comment table/RLS will be connected next.'))}
function explore(){return `<div class="card explore"><h2 style="margin-top:0">Explore</h2><div class="sub">Discover people and posts on YOCEWOR.</div><div class="search"><input class="field" id="exploreSearch" placeholder="Search username or name"><button class="btn primary" id="exploreBtn">Search</button></div><div id="exploreResults" style="margin-top:18px"></div></div>`}
async function runExplore(){const q=$('#exploreSearch').value.trim();if(!q)return;const r=await sb.from('profiles').select('*').or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).limit(20);if(r.error)return toast(r.error.message,true);$('#exploreResults').innerHTML=(r.data||[]).map(p=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)">${avatar(p)}<div class="grow"><b>${esc(p.display_name||p.username)}${verified(p)}</b><div class="muted tiny">@${esc(p.username||'')}</div></div><button class="btn ghost" data-profile="${esc(p.id)}">View</button></div>`).join('')||'<div class="empty">No people found.</div>'}
function profileView(){return `<div class="card profile"><div class="profiletop">${avatar(profile)}<div class="grow"><h2 style="margin:0">${esc(profile?.display_name||profile?.username||'Your profile')}${verified(profile)}</h2><div class="muted">@${esc(profile?.username||'you')}</div><p>${esc(profile?.bio||'Welcome to my YOCEWOR world.')}</p></div><div class="profileactions"><button class="btn ghost" id="logout">Logout</button></div></div><div class="statgrid"><div class="stat"><b>—</b><span class="tiny muted">Posts</span></div><div class="stat"><b>—</b><span class="tiny muted">Followers</span></div><div class="stat"><b>—</b><span class="tiny muted">Following</span></div></div><div class="badgebox"><b>Blue verification</b><div class="muted tiny" style="margin-top:5px">Planned subscription: ₹75/month. This screen does not fake payment or verification status.</div><button class="btn soft" style="margin-top:12px" onclick="toast('Verification checkout will be connected after the secure payment setup.')">Learn more</button></div></div>`}
function notifications(){return `<div class="card empty"><h2 style="color:var(--ink)">Notifications</h2><p>You're all caught up.</p><span class="tiny">Likes, comments and follows will appear here once their notification tables/RLS are enabled.</span></div>`}
async function route(id){active=id;document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===active));const v=$('#view');if(!v)return;if(id==='home'){await renderHome();return}if(id==='explore'){v.innerHTML=explore();$('#exploreBtn').onclick=runExplore;return}if(id==='profile'){v.innerHTML=profileView();$('#logout').onclick=logout;return}if(id==='notifications'){v.innerHTML=notifications();return}if(id==='create'){await renderHome();$('#postBody').focus();return}}
async function logout(){const {error}=await sb.auth.signOut();if(error)toast(error.message,true)}
function bindNav(){document.body.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n)route(n.dataset.nav)})}
function app(){document.querySelector('.top').classList.remove('hidden');$('#root').innerHTML=shell();$('#bottomNav').innerHTML=mobileNav();$('#topActions').innerHTML=avatar(profile);bindNav();route('home')}
async function boot(){const {data}=await sb.auth.getSession();user=data.session?.user||null;if(!user){$('#root').innerHTML=authView();bindAuth();return}profile=await loadProfile(user.id);app()}
sb.auth.onAuthStateChange(async(_event,session)=>{const next=session?.user||null;if(next?.id!==user?.id){user=next;if(user){profile=await loadProfile(user.id);app()}else{profile=null;active='home';$('#root').innerHTML=authView();$('#bottomNav').innerHTML='';bindAuth()}}});
boot();
</script>
</body>
</html>
