<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fc"><meta name="description" content="YOCEWOR — Your Voice. Your World."><link rel="icon" href="assets/yocewor-favicon.svg"><title>YOCEWOR — Your Voice. Your World.</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--blue:#1769ff;--ink:#111827;--muted:#667085;--bg:#f6f7fb;--paper:#fff;--line:#e8ebf1;--soft:#edf3ff;--dark:#111827;--radius:22px;--shadow:0 10px 30px rgba(17,24,39,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}img{max-width:100%}.hide{display:none!important}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.top{height:72px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}.topin{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;letter-spacing:-.8px}.brand img{width:40px;height:40px;border-radius:13px}.brand small{font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--muted);margin-left:2px}.btn{border:0;border-radius:13px;padding:11px 17px;font-weight:800}.blue{background:var(--blue);color:#fff}.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.soft{background:var(--soft);color:var(--blue)}.hero{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:35px 0}.heroGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:35px;align-items:center}.hero h1{font-size:clamp(48px,7vw,92px);line-height:.92;letter-spacing:-5px;margin:0 0 22px}.hero h1 span{color:var(--blue)}.hero p{font-size:18px;color:var(--muted);max-width:550px}.heroCard{background:var(--dark);color:#fff;border-radius:34px;padding:34px;box-shadow:0 25px 70px rgba(17,24,39,.18);transform:rotate(1.2deg)}.heroCard .bubble{background:#fff;color:var(--ink);border-radius:18px;padding:16px;margin:12px 0}.heroCard .bubble.blueb{background:var(--blue);color:#fff;margin-left:40px}.heroLinks{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.auth{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:25px 0}.authCard{width:min(920px,100%);display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid var(--line);border-radius:30px;overflow:hidden;box-shadow:var(--shadow)}.authIntro{background:var(--dark);color:#fff;padding:42px}.authIntro h2{font-size:42px;line-height:1;margin:20px 0}.authIntro p{color:#cbd2df}.authForm{padding:38px}.tabs{display:flex;background:#f2f4f7;padding:4px;border-radius:12px;margin-bottom:22px}.tab{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:800;color:var(--muted)}.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px #0000000c}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;outline:none;margin:5px 0 12px}.field:focus{border-color:#8db1ff;box-shadow:0 0 0 4px var(--soft)}label{font-size:12px;font-weight:800}.app{padding:25px 0 95px}.columns{display:grid;grid-template-columns:210px minmax(0,650px) 250px;gap:25px}.side{position:sticky;top:96px;height:max-content}.sideNav{display:grid;gap:5px}.nav{border:0;background:transparent;border-radius:15px;padding:13px 15px;text-align:left;font-weight:800;color:var(--muted);display:flex;gap:12px;align-items:center}.nav.on,.nav:hover{background:#fff;color:var(--ink);box-shadow:0 4px 18px #11182708}.nav b{font-size:19px;width:22px;text-align:center}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.mini{padding:15px;margin-bottom:12px}.avatar{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#eaf1ff;color:var(--blue);font-weight:900;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.row{display:flex;align-items:center;gap:11px}.grow{flex:1;min-width:0}.muted{color:var(--muted)}.tiny{font-size:12px}.verified{display:inline-grid;place-items:center;background:var(--blue);color:#fff;width:17px;height:17px;border-radius:50%;font-size:10px;font-weight:900;margin-left:4px}.composer{padding:17px;margin-bottom:16px}.composer textarea{border:0;outline:0;width:100%;min-height:75px;resize:vertical;padding:12px 0;font-size:16px}.composeFoot{border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:8px}.feedPost{margin-bottom:16px;overflow:hidden}.postHead{padding:16px}.postText{padding:0 16px 16px;white-space:pre-wrap;overflow-wrap:anywhere}.postImage{width:100%;max-height:600px;object-fit:cover}.postActions{display:flex;border-top:1px solid var(--line);padding:7px}.action{flex:1;border:0;background:#fff;padding:10px;border-radius:11px;color:var(--muted);font-weight:800}.action:hover{background:#f6f7fa;color:var(--ink)}.empty{padding:45px;text-align:center;color:var(--muted)}.rightCard{padding:17px;margin-bottom:12px}.rightCard h3{margin:0 0 8px;font-size:14px}.profileCard{padding:25px}.profileTop{display:flex;gap:18px;align-items:center}.profileTop .avatar{width:90px;height:90px}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-top:1px solid var(--line);padding-top:15px;text-align:center}.stats strong{display:block}.badgeBox{margin-top:22px;background:#f8faff;border:1px solid #dbe6ff;border-radius:17px;padding:17px}.search{display:flex;gap:8px}.search .field{margin:0}.bottom{display:none;position:fixed;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid var(--line);z-index:60}.bottom button{flex:1;border:0;background:#fff;color:var(--muted);font-size:11px;font-weight:800}.bottom button.on{color:var(--blue)}.toast{position:fixed;right:16px;bottom:18px;background:var(--dark);color:#fff;padding:13px 16px;border-radius:13px;z-index:100;box-shadow:var(--shadow)}@media(max-width:950px){.columns{grid-template-columns:76px minmax(0,680px)}.side .nav span{display:none}.nav{justify-content:center}.right{display:none}.bottom{display:flex}}@media(max-width:680px){.wrap{width:calc(100% - 18px)}.brand small{display:none}.heroGrid,.authCard{grid-template-columns:1fr}.hero{padding:25px 0}.hero h1{font-size:55px;letter-spacing:-3px}.heroCard{transform:none}.authIntro{padding:28px}.authIntro h2{font-size:34px}.authForm{padding:25px}.columns{display:block}.side{display:none}.app{padding-top:12px;padding-bottom:82px}.profileTop{align-items:flex-start}.profileTop .avatar{width:72px;height:72px}}
</style></head><body><header class="top"><div class="wrap topin"><div class="brand"><img src="assets/yocewor-logo-mark.svg"><span>YOCEWOR</span><small>YOUR VOICE. YOUR WORLD.</small></div><div id="top"></div></div></header><main id="root"></main><div id="bottom" class="bottom"></div><div id="toast"></div><script>
'use strict';const URL='https://mzntgjyecymcpzciklfk.supabase.co',KEY='sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn';const db=supabase.createClient(URL,KEY);window.supabaseClient=db;window.yoceworSupabase=db;let me=null,profile=null,view='home',posts=[];const $=x=>document.querySelector(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const note=(x)=>{$('#toast').innerHTML='<div class="toast">'+esc(x)+'</div>';setTimeout(()=>$('#toast').innerHTML='',3000)};const av=p=>{let u=p?.avatar_url||p?.photo_url;return u?'<div class="avatar"><img src="'+esc(u)+'"></div>':'<div class="avatar">'+esc((p?.display_name||p?.username||me?.email||'Y')[0].toUpperCase())+'</div>'};const tick=p=>p?.is_verified||p?.verified?'<span class="verified">✓</span>':'';
function landing(){return '<section class="hero"><div class="wrap heroGrid"><div><div class="tiny muted">A new social world</div><h1>Say it.<br><span>Share it.</span><br>Live it.</h1><p>YOCEWOR is a simple social space for your thoughts, people and moments. Your voice stays yours. Your world starts here.</p><div class="heroLinks"><button class="btn blue" id="join">Join YOCEWOR</button><button class="btn outline" id="signin">I already have an account</button></div></div><div class="heroCard"><div class="tiny" style="color:#aab4c5">TODAY ON YOCEWOR</div><div class="bubble">A thought worth sharing deserves a place.</div><div class="bubble blueb">Your voice. Your world. ✓</div><div class="bubble">Simple by design. Social by nature.</div></div></div></section>'}
function auth(mode='login'){return '<section class="auth"><div class="wrap"><div class="authCard"><div class="authIntro"><img src="assets/yocewor-logo-mark.svg" width="54"><h2>'+ (mode==='login'?'Welcome back.':'Welcome to your world.')+'</h2><p>Connect, share and discover without the clutter.</p></div><div class="authForm"><div class="tabs"><button class="tab '+(mode==='login'?'on':'')+'" id="lt">Login</button><button class="tab '+(mode==='signup'?'on':'')+'" id="st">Create account</button></div><div id="form">'+form(mode)+'</div></div></div></div></section>'}function form(m){return m==='login'?'<h2>Sign in</h2><p class="muted">Continue to YOCEWOR.</p><label>Email</label><input id="email" class="field" type="email"><label>Password</label><input id="password" class="field" type="password"><button class="btn blue" style="width:100%" id="login">Login</button>':'<h2>Create account</h2><p class="muted">Make your identity on YOCEWOR.</p><label>Name</label><input id="name" class="field"><label>Username</label><input id="username" class="field" placeholder="yourname"><label>Email</label><input id="email" class="field" type="email"><label>Password</label><input id="password" class="field" type="password"><button class="btn blue" style="width:100%" id="signup">Create account</button>'}
function bindAuth(m){$('#lt').onclick=()=>{$('#root').innerHTML=auth('login');bindAuth('login')};$('#st').onclick=()=>{$('#root').innerHTML=auth('signup');bindAuth('signup')};if(m==='login')$('#login').onclick=login;else $('#signup').onclick=signup}async function login(){let email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return note('Enter email and password');let r=await db.auth.signInWithPassword({email,password});if(r.error)return note(r.error.message);boot()}async function signup(){let email=$('#email').value.trim().toLowerCase(),password=$('#password').value,name=$('#name').value.trim(),username=$('#username').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,30}$/.test(username))return note('Use 3–30 letters, numbers or _ for username');let r=await db.auth.signUp({email,password,options:{data:{username,display_name:name||username}}});if(r.error)return note(r.error.message);note(r.data.session?'Account created':'Check your email to confirm your account')} 
const navs=[['home','⌂','Home'],['explore','⌕','Explore'],['create','＋','Create'],['notifications','♡','Notifications'],['profile','○','Profile']];function nav(){return navs.map(n=>'<button class="nav '+(view===n[0]?'on':'')+'" data-v="'+n[0]+'"><b>'+n[1]+'</b><span>'+n[2]+'</span></button>').join('')}function shell(){return '<section class="app"><div class="wrap columns"><aside class="side"><div class="card mini">'+av(profile)+'<div style="margin-top:9px"><b>'+esc(profile?.display_name||profile?.username||me.email.split('@')[0])+tick(profile)+'</b><div class="tiny muted">@'+esc(profile?.username||'you')+'</div></div></div><div class="sideNav">'+nav()+'</div></aside><section id="page"></section><aside class="right"><div class="card rightCard"><h3>YOCEWOR</h3><div class="tiny muted">Your Voice. Your World.</div></div><div class="card rightCard"><h3>Get verified</h3><div class="tiny muted">A blue check for verified YOCEWOR accounts. Planned price ₹75/month.</div></div></aside></div></section>'}function bottom(){return navs.map(n=>'<button class="'+(view===n[0]?'on':'')+'" data-v="'+n[0]+'">'+n[1]+'<br>'+n[2]+'</button>').join('')}
async function home(focus=false){let q=await db.from('posts').select('id,user_id,body,image_url,created_at').order('created_at',{ascending:false}).range(0,19);posts=q.data||[];let ids=[...new Set(posts.map(p=>p.user_id))],map={};if(ids.length){let r=await db.from('profiles').select('*').in('id',ids);(r.data||[]).forEach(p=>map[p.id]=p)}$('#page').innerHTML='<div class="card composer"><div class="row">'+av(profile)+'<div class="grow muted">What is on your mind?</div></div><textarea id="body" placeholder="Share something with your world…"></textarea><div class="composeFoot"><label class="btn soft">Add image<input id="file" type="file" accept="image/*" style="display:none"></label><span id="fname" class="tiny muted grow"></span><button id="post" class="btn blue">Post</button></div></div>'+(posts.length?posts.map(p=>'<article class="card feedPost"><div class="row postHead">'+av(map[p.user_id])+'<div class="grow"><b>'+esc(map[p.user_id]?.display_name||map[p.user_id]?.username||'YOCEWOR user')+tick(map[p.user_id])+'</b><div class="tiny muted">@'+esc(map[p.user_id]?.username||'user')+' · '+new Date(p.created_at).toLocaleDateString()+'</div></div></div>'+(p.body?'<div class="postText">'+esc(p.body)+'</div>':'')+(p.image_url?'<img class="postImage" src="'+esc(p.image_url)+'" loading="lazy">':'')+'<div class="postActions"><button class="action" data-like="'+p.id+'">♡ Like</button><button class="action" data-comment="'+p.id+'">○ Comment</button><button class="action" data-share="'+p.id+'">↗ Share</button></div></article>').join(''):'<div class="card empty"><b>No posts yet.</b><br>Be the first voice on YOCEWOR.</div>');$('#file').onchange=e=>$('#fname').textContent=e.target.files[0]?.name||'';$('#post').onclick=createPost;document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>navigator.clipboard?.writeText(location.href+'#post-'+b.dataset.share).then(()=>note('Post link copied')));document.querySelectorAll('[data-like]').forEach(b=>b.onclick=async()=>{let r=await db.from('likes').insert({post_id:b.dataset.like,user_id:me.id});if(r.error)note('Like is not available yet');else{b.textContent='♥ Liked';b.disabled=true}});if(focus)$('#body').focus()}
async function createPost(){let body=$('#body').value.trim(),file=$('#file').files[0],image_url=null;if(!body&&!file)return note('Write something or add an image');if(file){if(file.size>8*1024*1024)return note('Image must be under 8MB');let path=me.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'');let u=await db.storage.from('yocewor-media').upload(path,file);if(u.error)return note(u.error.message);image_url=db.storage.from('yocewor-media').getPublicUrl(path).data.publicUrl}let r=await db.from('posts').insert({user_id:me.id,body:body||null,image_url});if(r.error)return note(r.error.message);note('Posted');home()}
function explore(){return '<div class="card" style="padding:22px"><h2>Explore</h2><p class="muted">Find your next voice.</p><div class="search"><input id="search" class="field" placeholder="Search people"><button id="go" class="btn blue">Search</button></div><div id="results"></div></div>'}async function doSearch(){let q=$('#search').value.trim();if(!q)return;let r=await db.from('profiles').select('*').or('username.ilike.%'+q+'%,display_name.ilike.%'+q+'%').limit(20);$('#results').innerHTML=(r.data||[]).map(p=>'<div class="row" style="padding:13px 0;border-bottom:1px solid var(--line)">'+av(p)+'<div class="grow"><b>'+esc(p.display_name||p.username)+tick(p)+'</b><div class="tiny muted">@'+esc(p.username||'')+'</div></div></div>').join('')||'<div class="empty">No people found.</div>'}function profilePage(){return '<div class="card profileCard"><div class="profileTop">'+av(profile)+'<div class="grow"><h2 style="margin:0">'+esc(profile?.display_name||profile?.username||'Your profile')+tick(profile)+'</h2><div class="muted">@'+esc(profile?.username||'you')+'</div><p>'+esc(profile?.bio||'Your YOCEWOR world.')+'</p></div><button id="logout" class="btn outline">Logout</button></div><div class="stats"><div><strong>—</strong><span class="tiny muted">Posts</span></div><div><strong>—</strong><span class="tiny muted">Followers</span></div><div><strong>—</strong><span class="tiny muted">Following</span></div></div><div class="badgeBox"><b>✓ Blue verification</b><div class="tiny muted">Planned subscription ₹75/month. Payment will use a secure gateway and server webhook.</div></div></div>'}function notifications(){return '<div class="card empty"><h2 style="color:var(--ink)">Notifications</h2><p>Nothing new.</p><span class="tiny">Likes, comments and follows will appear here.</span></div>'}async function route(v){view=v;document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x.dataset.v===v));$('#bottom').innerHTML=bottom();if(v==='home')return home();if(v==='create')return home(true);if(v==='explore'){$('#page').innerHTML=explore();$('#go').onclick=doSearch;return}if(v==='profile'){$('#page').innerHTML=profilePage();$('#logout').onclick=async()=>{await db.auth.signOut();boot()};return}$('#page').innerHTML=notifications()}function app(){document.querySelector('.top').classList.remove('hide');$('#root').innerHTML=shell();document.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>route(x.dataset.v));route('home')}async function boot(){let s=await db.auth.getSession();me=s.data.session?.user||null;if(!me){$('#root').innerHTML=landing();$('#top').innerHTML='<button class="btn blue" id="topJoin">Join</button>';$('#join').onclick=()=>{$('#root').innerHTML=auth('signup');bindAuth('signup')};$('#signin').onclick=()=>{$('#root').innerHTML=auth('login');bindAuth('login')};$('#topJoin').onclick=$('#join').onclick;return}let r=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();profile=r.data||{username:me.email.split('@')[0],display_name:me.email.split('@')[0]};$('#top').innerHTML='<button class="btn outline" id="logoutTop">Logout</button>';$('#logoutTop').onclick=async()=>{await db.auth.signOut();boot()};app()}db.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();</script></body></html>
