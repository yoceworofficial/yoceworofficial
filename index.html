<script>
'use strict';
const SUPABASE_URL='https://mzntgjyecymcpzciklfk.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_AAXGC4EmiD4ELszpchz9Dw_Eryr6Usn';
if(!window.supabase||!window.supabase.createClient){document.getElementById('root').innerHTML='<section class="auth"><div class="card authForm"><h2>YOCEWOR is loading…</h2><p class="muted">Please refresh once. If this continues, open Help Center.</p></div></section>';throw new Error('Supabase CDN did not load');}
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);window.supabaseClient=db;window.yoceworSupabase=db;
let me=null,profile=null,view='home',posts=[],postProfiles={},liked=new Set();
const $=s=>document.querySelector(s),root=$('#root');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){$('#toastRoot').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('#toastRoot').innerHTML='',3000)}
function avatar(p){const u=p?.avatar_url;if(u)return '<div class="avatar"><img src="'+esc(u)+'" alt=""></div>';return '<div class="avatar">'+esc((p?.display_name||p?.username||'Y').slice(0,1).toUpperCase())+'</div>'}
function verified(p){return p?.is_verified?'<span class="verify" title="Verified">✓</span>':''}
async function loadProfile(id){if(!id)return null;const r=await db.from('profiles').select('*').eq('id',id).maybeSingle();return r.data||null}
const themes={sunset:['#ff6a00','#ff267e','#7c4dff'],ocean:['#00c6ff','#247bff','#6c4dff'],forest:['#18c37e','#08a6a6','#6acb4b'],royal:['#7c4dff','#b33cff','#ff3d81'],rose:['#ff4d8d','#ff7a59','#ffd166']};
function applyTheme(name){const t=themes[name]||themes.sunset;document.documentElement.style.setProperty('--a',t[0]);document.documentElement.style.setProperty('--b',t[1]);document.documentElement.style.setProperty('--c',t[2]);localStorage.setItem('yocewor-theme',name)}
applyTheme(localStorage.getItem('yocewor-theme')||'sunset');
function logoSmall(){return '<span class="brandMark" style="width:38px;height:38px"><svg viewBox="0 0 64 64" fill="none"><path d="M8 10H22L31 29L40 10H56L40 54L31 37L22 54Z" fill="url(#g2)"/><defs><linearGradient id="g2" x1="8" y1="10" x2="56" y2="54"><stop stop-color="var(--a)"/><stop offset=".52" stop-color="var(--b)"/><stop offset="1" stop-color="var(--c)"/></linearGradient></defs></svg></span>'}
function landing(){return '<section class="hero"><div class="wrap heroGrid"><div><span class="eyebrow"><i></i> Your social world, your way</span><h1>Say it.<br><span>Share it.</span><br>Live it.</h1><p>YOCEWOR is a fresh social space for thoughts, photos, people and moments that matter. Choose your look, make your profile yours, and share with your world.</p><div class="actions"><button class="btn primary" id="join">Create your account</button><button class="btn ghost" id="signin">Login</button></div><div class="notice">Email + password only · No GitHub login · No third-party sign-in</div></div><div class="heroVisual"><span class="orb one"></span><span class="orb two"></span><div class="phone"><div class="phonebar"><b>YOCEWOR</b><span>9:41</span></div><div class="mock"><div class="mockHead"><span class="mockAv">R</span><div><b>Royal B.</b><span class="verify">✓</span><div class="tiny muted">@royalbhai · just now</div></div></div><div class="mockPic">Y</div><div class="mockCopy"><b>Your Voice. Your World.</b><div class="tiny muted">A place to share what matters.</div></div><div class="mockActions">♡ 1.2K &nbsp;&nbsp; ○ 84 &nbsp;&nbsp; ↗ Share</div></div></div></div></div></section>'}
function auth(mode='login'){return '<section class="auth"><div class="wrap"><div class="card authCard"><div class="authIntro">'+logoSmall()+'<h2>'+(mode==='login'?'Welcome back.':'Welcome to YOCEWOR.')+'</h2><p class="muted">Your voice. Your world. Your account.</p><div class="notice">🔐 Secure email + password authentication.<br>No GitHub or social-login option.</div></div><div class="authForm"><div class="tabs"><button class="tab '+(mode==='login'?'on':'')+'" id="lt">Login</button><button class="tab '+(mode==='signup'?'on':'')+'" id="st">Create account</button></div><div id="form">'+authForm(mode)+'</div></div></div></div></section>'}
function authForm(m){return m==='login'?'<h2>Sign in</h2><p class="muted">Continue where you left off.</p><label>Email</label><input id="email" class="field" type="email" autocomplete="email"><label>Password</label><input id="password" class="field" type="password" autocomplete="current-password"><button class="btn primary" style="width:100%" id="login">Login to YOCEWOR</button>':'<h2>Create account</h2><p class="muted">Make your identity.</p><label>Name</label><input id="name" class="field" autocomplete="name"><label>Username</label><input id="username" class="field" placeholder="yourname" autocomplete="username"><label>Email</label><input id="email" class="field" type="email" autocomplete="email"><label>Password</label><input id="password" class="field" type="password" autocomplete="new-password"><button class="btn primary" style="width:100%" id="signup">Create my account</button>'}
function bindAuth(mode){$('#lt').onclick=()=>{root.innerHTML=auth('login');bindAuth('login')};$('#st').onclick=()=>{root.innerHTML=auth('signup');bindAuth('signup')};$('#login')?.addEventListener('click',login);$('#signup')?.addEventListener('click',signup)}
async function login(){const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return toast('Enter email and password');const r=await db.auth.signInWithPassword({email,password});if(r.error)return toast(r.error.message);await boot()}
async function signup(){const email=$('#email').value.trim().toLowerCase(),password=$('#password').value,name=$('#name').value.trim(),username=$('#username').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,30}$/.test(username))return toast('Username: 3–30 lowercase letters, numbers or _');if(password.length<6)return toast('Password must be at least 6 characters');const r=await db.auth.signUp({email,password,options:{data:{username,display_name:name||username}}});if(r.error)return toast(r.error.message);toast(r.data.session?'Account created':'Check your email to confirm your account')}
const navs=[['home','⌂','Home'],['explore','⌕','Explore'],['create','＋','Create'],['notifications','♡','Notifications'],['profile','○','Profile']];
function nav(){return navs.map(n=>'<button class="nav '+(view===n[0]?'on':'')+'" data-view="'+n[0]+'"><b>'+n[1]+'</b><span>'+n[2]+'</span></button>').join('')}
function shell(){return '<section class="app"><div class="wrap columns"><aside class="side"><div class="card mini"><div class="row">'+avatar(profile)+'<div class="grow"><b>'+esc(profile?.display_name||profile?.username||'You')+verified(profile)+'</b><div class="tiny muted">@'+esc(profile?.username||'you')+'</div></div></div></div><div class="sideNav">'+nav()+'</div></aside><section id="page"></section><aside class="right"><div class="card rightCard"><h3>YOCEWOR</h3><div class="tiny muted">Your Voice. Your World.</div></div><div class="card rightCard"><h3>Choose your theme</h3><div class="tiny muted">Pick a color mood. It saves on this device.</div><div class="themeList">'+Object.entries(themes).map(([k,v])=>'<button class="theme" data-theme="'+k+'"><i style="--x:'+v[0]+';--y:'+v[1]+'"></i>'+k[0].toUpperCase()+k.slice(1)+'</button>').join('')+'</div></div><div class="card rightCard"><h3>Verified</h3><div class="tiny muted">Blue checks are controlled by YOCEWOR verification. Founder verification is permanent.</div></div></aside></div></section>'}
function mobileNav(){return navs.map(n=>'<button class="'+(view===n[0]?'on':'')+' '+(n[0]==='create'?'create':'')+'" data-view="'+n[0]+'">'+n[1]+'<br>'+n[2]+'</button>').join('')}
async function loadFeed(){const r=await db.from('posts').select('id,user_id,body,image_url,created_at').order('created_at',{ascending:false}).range(0,19);if(r.error){toast(r.error.message);return}posts=r.data||[];postProfiles={};const ids=[...new Set(posts.map(p=>p.user_id).filter(Boolean))];if(ids.length){const pr=await db.from('profiles').select('*').in('id',ids);(pr.data||[]).forEach(p=>postProfiles[p.id]=p)}liked=new Set();if(posts.length){const lr=await db.from('likes').select('post_id').eq('user_id',me.id).in('post_id',posts.map(p=>p.id));(lr.data||[]).forEach(x=>liked.add(x.post_id))}}
async function countsFor(ids){if(!ids.length)return {};const [l,c]=await Promise.all([db.from('likes').select('post_id').in('post_id',ids),db.from('comments').select('post_id').in('post_id',ids)]);const out={};ids.forEach(id=>out[id]={likes:0,comments:0});(l.data||[]).forEach(x=>out[x.post_id]&&(out[x.post_id].likes++));(c.data||[]).forEach(x=>out[x.post_id]&&(out[x.post_id].comments++));return out}
async function renderHome(focus=false){await loadFeed();const counts=await countsFor(posts.map(p=>p.id));$('#page').innerHTML='<div class="card composer"><div class="row">'+avatar(profile)+'<div class="grow"><b>What is on your mind?</b><div class="tiny muted">Share something with your world.</div></div></div><textarea id="body" placeholder="Say something…"></textarea><div class="composeFoot"><label class="btn ghost file">＋ Add image<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><span id="fname" class="tiny muted grow"></span><button class="btn primary" id="post">Post</button></div></div>'+(posts.length?posts.map(p=>{const pp=postProfiles[p.user_id]||{};const ct=counts[p.id]||{likes:0,comments:0};const isLiked=liked.has(p.id);return '<article class="card feedPost"><div class="row postHead">'+avatar(pp)+'<div class="grow"><b>'+esc(pp.display_name||pp.username||'YOCEWOR user')+verified(pp)+'</b><div class="tiny muted">@'+esc(pp.username||'user')+' · '+new Date(p.created_at).toLocaleDateString()+'</div></div><button class="iconBtn" data-menu="'+p.id+'">⋯</button></div>'+(p.body?'<div class="postText">'+esc(p.body)+'</div>':'')+(p.image_url?'<img class="postImage" loading="lazy" src="'+esc(p.image_url)+'" alt="Post image">':'')+'<div class="postActions"><button class="action '+(isLiked?'active like':'')+'" data-like="'+p.id+'">'+(isLiked?'♥':'♡')+' Like <span class="count">'+ct.likes+'</span></button><button class="action" data-comment="'+p.id+'">○ Comment <span class="count">'+ct.comments+'</span></button><button class="action" data-share="'+p.id+'">↗ Share</button></div></article>'}).join(''):'<div class="card empty"><b>No posts yet.</b><br>Be the first voice on YOCEWOR.</div>');$('#file')?.addEventListener('change',e=>$('#fname').textContent=e.target.files[0]?.name||'');$('#post')?.addEventListener('click',createPost);bindPostActions();if(focus)$('#body')?.focus()}
async function createPost(){const body=$('#body').value.trim(),file=$('#file').files[0];if(!body&&!file)return toast('Write something or add an image');let image_url=null;if(file){if(file.size>8*1024*1024)return toast('Image must be under 8MB');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'');const path=me.id+'/'+Date.now()+'-'+safe;const up=await db.storage.from('yocewor-media').upload(path,file,{cacheControl:'3600',upsert:false});if(up.error)return toast(up.error.message);image_url=db.storage.from('yocewor-media').getPublicUrl(path).data.publicUrl}const r=await db.from('posts').insert({user_id:me.id,body:body||null,image_url});if(r.error)return toast(r.error.message);toast('Posted');await renderHome()}
async function toggleLike(id){const already=liked.has(id);if(already){const r=await db.from('likes').delete().eq('post_id',id).eq('user_id',me.id);if(r.error)return toast(r.error.message);liked.delete(id)}else{const r=await db.from('likes').insert({post_id:id,user_id:me.id});if(r.error)return toast(r.error.message);liked.add(id)}await renderHome()}
function bindPostActions(){document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));document.querySelectorAll('[data-comment]').forEach(b=>b.onclick=()=>openComments(b.dataset.comment));document.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{const url=location.href.split('#')[0]+'#post-'+b.dataset.share;try{if(navigator.share)await navigator.share({title:'YOCEWOR',text:'Check this post on YOCEWOR',url});else{await navigator.clipboard.writeText(url);toast('Post link copied')}}catch(e){}})}
async function openComments(postId){const r=await db.from('comments').select('id,user_id,body,created_at').eq('post_id',postId).order('created_at',{ascending:true}).limit(100);if(r.error)return toast(r.error.message);const cs=r.data||[];const ids=[...new Set(cs.map(c=>c.user_id))];const mp={};if(ids.length){const pr=await db.from('profiles').select('*').in('id',ids);(pr.data||[]).forEach(x=>mp[x.id]=x)}$('#modalRoot').innerHTML='<div class="modal" id="commentModal"><div class="card modalCard"><div class="modalHead"><div><h2 style="margin:0">Comments</h2><div class="tiny muted">Join the conversation.</div></div><button class="iconBtn" id="closeComments">×</button></div><div id="commentList" style="margin-top:12px">'+(cs.length?cs.map(c=>'<div class="comment">'+avatar(mp[c.user_id])+'<div class="commentBody"><b>'+esc(mp[c.user_id]?.display_name||mp[c.user_id]?.username||'User')+verified(mp[c.user_id])+'</b><div>'+esc(c.body)+'</div><div class="tiny muted">'+new Date(c.created_at).toLocaleString()+'</div></div></div>').join(''):'<div class="empty">No comments yet. Start the conversation.</div>')+'</div><div class="commentForm"><input id="commentInput" class="field" placeholder="Write a comment…"><button class="btn primary" id="sendComment">Send</button></div></div></div>';$('#closeComments').onclick=()=>$('#modalRoot').innerHTML='';$('#commentModal').onclick=e=>{if(e.target.id==='commentModal')$('#modalRoot').innerHTML=''};$('#sendComment').onclick=()=>addComment(postId)}
async function addComment(postId){const body=$('#commentInput').value.trim();if(!body)return toast('Write a comment');const r=await db.from('comments').insert({post_id:postId,user_id:me.id,body});if(r.error)return toast(r.error.message);toast('Comment added');await openComments(postId);await renderHome()}
function explore(){return '<div class="card" style="padding:22px"><h2 style="margin-top:0">Explore</h2><p class="muted">Discover people and voices on YOCEWOR.</p><div class="search"><input id="search" class="field" placeholder="Search people or usernames"><button id="searchBtn" class="btn primary">Search</button></div><div id="results" style="margin-top:15px"></div></div>'}
async function runSearch(){const q=$('#search').value.trim();if(!q)return;const r=await db.from('profiles').select('*').or('username.ilike.%'+q+'%,display_name.ilike.%'+q+'%').limit(20);if(r.error)return toast(r.error.message);$('#results').innerHTML=(r.data||[]).map(p=>'<div class="result">'+avatar(p)+'<div class="grow"><b>'+esc(p.display_name||p.username)+verified(p)+'</b><div class="tiny muted">@'+esc(p.username||'')+'</div></div></div>').join('')||'<div class="empty">No people found.</div>'}
async function profileView(){const p=profile;const postCount=(await db.from('posts').select('id',{count:'exact',head:true}).eq('user_id',me.id)).count||0;const followers=(await db.from('follows').select('follower_id',{count:'exact',head:true}).eq('following_id',me.id)).count||0;const following=(await db.from('follows').select('following_id',{count:'exact',head:true}).eq('follower_id',me.id)).count||0;return '<div class="card profileCard"><div class="profileTop">'+avatar(p)+'<div class="grow"><h2 style="margin:0">'+esc(p?.display_name||p?.username||'Your profile')+verified(p)+'</h2><div class="muted">@'+esc(p?.username||'you')+'</div><p>'+esc(p?.bio||'Your voice. Your ideas. Your world.')+'</p></div><button class="btn ghost" id="logout">Logout</button></div><div class="stats"><div><strong>'+postCount+'</strong><span class="tiny muted">Posts</span></div><div><strong>'+followers+'</strong><span class="tiny muted">Followers</span></div><div><strong>'+following+'</strong><span class="tiny muted">Following</span></div></div><div class="badgeBox"><b>🔵 Verified account</b><div class="tiny muted" style="margin-top:5px">'+(p?.verification_type==='founder'?'Founder verification is permanently enabled for this account.':'Verification is controlled by YOCEWOR.')+'</div></div><div class="card" style="margin-top:18px;padding:16px;background:#0b0e18"><b>Theme</b><div class="tiny muted">Choose how YOCEWOR looks on this device.</div><div class="themeList">'+Object.entries(themes).map(([k,v])=>'<button class="theme" data-theme="'+k+'"><i style="--x:'+v[0]+';--y:'+v[1]+'"></i>'+k[0].toUpperCase()+k.slice(1)+'</button>').join('')+'</div></div></div>'}
async function notifications(){const r=await db.from('notifications').select('id,actor_id,type,message,title,read,created_at,post_id').eq('user_id',me.id).order('created_at',{ascending:false}).limit(50);if(r.error)return '<div class="card empty">Notifications are temporarily unavailable.</div>';const ns=r.data||[];return '<div class="card" style="padding:22px"><h2 style="margin-top:0">Notifications</h2><p class="muted">Your activity, in one place.</p>'+(ns.length?ns.map(n=>'<div class="result">'+logoSmall()+'<div class="grow"><b>'+esc(n.title||n.type||'Activity')+'</b><div>'+esc(n.message||'You have a new notification.')+'</div><div class="tiny muted">'+new Date(n.created_at).toLocaleString()+'</div></div></div>').join(''):'<div class="empty">You are all caught up.</div>')+'</div>'}
async function route(v){view=v;$('#bottom').innerHTML=mobileNav();document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x.dataset.view===view));const page=$('#page');if(v==='home')return renderHome();if(v==='create')return renderHome(true);if(v==='explore'){page.innerHTML=explore();$('#searchBtn').onclick=runSearch;return}if(v==='profile'){page.innerHTML=await profileView();$('#logout').onclick=logout;document.querySelectorAll('[data-theme]').forEach(x=>x.onclick=()=>{applyTheme(x.dataset.theme);toast('Theme changed')});return}if(v==='notifications'){page.innerHTML=await notifications();return}}
async function logout(){await db.auth.signOut();await boot()}
document.addEventListener('click',e=>{const n=e.target.closest('[data-view]');if(n)route(n.dataset.view);const t=e.target.closest('[data-theme]');if(t){applyTheme(t.dataset.theme);toast('Theme changed')}});
function bindLanding(){document.querySelector('#join').onclick=()=>{root.innerHTML=auth('signup');bindAuth('signup')};document.querySelector('#signin').onclick=()=>{root.innerHTML=auth('login');bindAuth('login')}}
async function boot(){const s=await db.auth.getSession();me=s.data.session?.user||null;if(!me){$('#topActions').innerHTML='';$('#bottom').innerHTML='';root.innerHTML=landing();bindLanding();return}profile=await loadProfile(me.id);$('#topActions').innerHTML=avatar(profile)+'<button class="iconBtn" id="logoutTop">↪</button>';$('#logoutTop').onclick=logout;root.innerHTML=shell();route('home')}
db.auth.onAuthStateChange(async(_e,s)=>{const next=s?.user||null;if((next?.id||null)!==(me?.id||null)){me=next;if(me){profile=await loadProfile(me.id);root.innerHTML=shell();route('home')}else{profile=null;boot()}}});
$('#brandHome').onclick=e=>{e.preventDefault();if(me)route('home');else boot()};boot();
</script>
</body>
