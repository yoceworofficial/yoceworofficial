 कम 1 number जरूरी है.";if(!/[^A-Za-z0-9]/u.test(p))return"कम से कम 1 special character जरूरी है.";return""}async function usernameFree(u){var r=await sb.from("profiles").select("id").eq("username",u).maybeSingle();if(r.error&&r.error.code!=="PGRST116")throw r.error;return!r.data}function otpHtml(id,text){return'<p class="hint" style="text-align:center">Email पर 6 अंकों का OTP भेजा गया है</p><div class="otpbox" id="'+id+'">'+[0,1,2,3,4,5].map(function(i){return'<input inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="1" aria-label="OTP digit '+(i+1)+'">'}).join("")+'</div><button id="verifyOtp" class="btn primary" type="button">'+text+'</button><button id="resendOtp" class="link" type="button">Resend OTP</button>'}function setupOtp(id){var box=document.getElementById(id),ins=box?[].slice.call(box.querySelectorAll("input")):[];ins.forEach(function(el,i){el.addEventListener("input",function(){el.value=el.value.replace(/\D/g,"").slice(-1);if(el.value&&i<5)ins[i+1].focus()});el.addEventListener("keydown",function(e){if(e.key==="Backspace"&&!el.value&&i>0)ins[i-1].focus()});el.addEventListener("paste",function(e){e.preventDefault();var s=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);s.split("").forEach(function(x,j){if(ins[j])ins[j].value=x});if(s)ins[Math.min(s.length-1,5)].focus()})});if(ins[0])ins[0].focus();return function(){return ins.map(function(x){return x.value}).join("")}}function render(){if(!ready())return;var f=$("#form");$("#title").textContent=mode==="login"?"Welcome to YOCEWOR":mode==="signup"?"Create your YOCEWOR account":(mode==="signupOtp"||mode==="loginOtp")?"Verify your email":"Reset your password";$("#sub").textContent=mode==="signup"?"Password + 6-digit Email OTP required.":mode==="signupOtp"?"OTP verify होने के बाद ही account active होगा.":mode==="loginOtp"?"Login OTP डालें.":mode==="reset"?"Choose a new secure password.":"Your Voice. Your World.";$("#tabs").style.display=(mode==="reset"||mode==="sig rHTML='<input id="newpass" class="field" type="password" autocomplete="new-password" placeholder="New password (8–12 chars)"><div class="hint">8–12 total • 1 capital • 1 small • 1 number • 1 special required</div><input id="newpass2" class="field" type="password" autocomplete="new-password" placeholder="Confirm new password"><button id="set" class="btn primary" type="button">Set new password</button>';bind();if(mode==="signup")bindUsernameInput()}function bind(){$("#go")&&$("#go").addEventListener("click",login);$("#otpLogin")&&$("#otpLogin").addEventListener("click",otpLogin);$("#forgot")&&$("#forgot").addEventListener("click",function(){mode="reset";resetStage=0;render()});$("#google")&&$("#google").addEventListener("click",function(){oauth("google")});$("#facebook")&&$("#facebook").addEventListener("click",function(){oauth("facebook")});$("#sendSignupOtp")&&$("#sendSignupOtp").addEventListener("click",sendSignupOtp);$("#verifyOtp")&&$("#verifyOtp").addEventListener("click",verifyCurrentOtp);$("#resendOtp")&&$("#resendOtp").addEventListener("click",resendCurrentOtp);$("#link")&&$("#link").addEventListener("click",sendLink);$("#rotp")&&$("#rotp").addEventListener("click",sendResetOtp);$("#set")&&$("#set").addEventListener("click",setPassword);if(mode==="signupOtp")window.readSignupOtp=setupOtp("signupOtpBox");if(mode==="loginOtp")window.readLoginOtp=setupOtp("loginOtpBox");if(mode==="reset"&&resetStage===1)window.readResetOtp=setupOtp("resetOtpBox")}async function login(){try{if(!ready())return;var r=await sb.auth.signInWithPassword({email:$("#email").value.trim().toLowerCase(),password:$("#pass").value});if(r.error)throw r.error;location.href=APP}catch(e){msg(e.message||"Login failed","error")}}async function sendSignupOtp(){try{if(!ready())return;var email=$("#email").value.trim().toLowerCase(),user=normUser($("#user").value),name=$("#name").value.trim(),p=$("#pass").value,p2=$("#pass2").value;if(!email)return msg("Email डालें.","error");if(!/^[a-z0-9_.]{3,30}$/.test(user))return msg("Username 3–30 chars: lowercase a-z, numbers, _ or . only.","error");if(!(await usernameFree(user)))return msg("यह username पहले से लिया जा चुका है.","error");var pe=passwordPolicy(p);if(pe)return msg(pe,"error");if(p!==p2)return msg("Confirm password same रखें.","error");var r=await sb.auth.signUp({email:email,password:p,options:{data:{username:user,display_name:name||user}}});if(r.error)throw r.error;signupData={email:email,user:user,name:name};mode="signupOtp";render();msg("6-digit OTP आपके email पर भेजा गया है.","success")}catch(e){msg(e.message||"OTP भेजने में समस्या हुई","error")}}async function verifyCurrentOtp(){try{var code=mode==="signupOtp"?(window.readSignupOtp?window.readSignupOtp():""):mode==="loginOtp"?(window.readLoginOtp?window.readLoginOtp():""):(window.readResetOtp?window.readResetOtp():"");if(!/^\d{6}$/.test(code))return msg("पूरे 6 अंकों का OTP डालें.","error");if(mode==="loginOtp"){var lv=await sb.auth.verifyOtp({email:signupData.email,token:code,type:"email"});if(lv.error)throw lv.error;location.href=APP}else if(mode==="signupOtp"){var v=await sb.auth.verifyOtp({email:signupData.email,token:code,type:"email"});if(v.error)throw v.error;var pe=await sb.from("profiles").upsert({id:v.data.user.id,username:signupData.user,display_name:signupData.name||signupData.user},{onConflict:"id"});if(pe.error)throw pe.error;location.href=APP}else{var v2=await sb.auth.verifyOtp({email:signupData.email,token:code,type:"recovery"});if(v2.error)throw v2.error;resetStage=2;render();msg("OTP verified. अब नया password बनाइए.","success")}}catch(e){msg(e.message||"OTP verification failed","error")}}async function resendCurrentOtp(){try{var email=signupData.email,r=mode==="loginOtp"?await sb.auth.signInWithOtp({email:email,options:{shouldCreateUser:false}}):await sb.auth.resend({type:mode==="signupOtp"?"signup":"recovery",email:email});if(r.error)throw r.error;msg("6-digit OTP फिर से भेज दिया गया.","success")}catch(e){msg(e.message||"Resend failed
