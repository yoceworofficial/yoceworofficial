<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#090914">
<title>YOCEWOR — Your World. Your Voice.</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#080812;
  --panel:#11111d;
  --panel2:#171726;
  --card:#12121f;
  --text:#f7f7fb;
  --muted:#9292a8;
  --line:#29293b;
  --primary:#7c5cff;
  --primary2:#a855f7;
  --pink:#ec4899;
  --blue:#38bdf8;
  --danger:#ef4444;
  --success:#22c55e;
  --shadow:0 12px 40px rgba(0,0,0,.35);
  --radius:22px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 10% 0%,rgba(124,92,255,.13),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(236,72,153,.10),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
img,video{max-width:100%;display:block}

.hidden{display:none!important}
.app{min-height:100vh}

.topbar{
  height:68px;
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  background:rgba(8,8,18,.84);
  backdrop-filter:blur(22px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
}
.topbar-inner{
  width:min(1200px,100%);
  padding:0 18px;
  display:flex;
  align-items:center;
  gap:20px;
}
.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:-1px;
  background:linear-gradient(90deg,#fff,var(--primary),var(--pink));
  -webkit-background-clip:text;
  color:transparent;
  cursor:pointer;
}
.search{
  flex:1;
  max-width:460px;
  position:relative;
}
.search input{
  width:100%;
  background:var(--panel2);
  border:1px solid transparent;
  color:var(--text);
  border-radius:999px;
  padding:12px 18px 12px 42px;
  outline:none;
}
.search input:focus{border-color:var(--primary)}
.search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}
.top-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn{
  width:42px;height:42px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--text);
  display:grid;
  place-items:center;
}
.icon-btn:hover{background:var(--panel2)}
.icon-btn svg{width:22px;height:22px}
.badge-wrap{position:relative}
.badge{
  position:absolute;
  top:1px;right:1px;
  min-width:17px;height:17px;
  padding:0 4px;
  border-radius:99px;
  background:var(--pink);
  color:#fff;
  font-size:10px;
  display:grid;
  place-items:center;
  font-weight:800;
}

.layout{
  width:min(1200px,100%);
  margin:auto;
  padding:92px 18px 90px;
  display:grid;
  grid-template-columns:220px minmax(0,620px) 270px;
  gap:24px;
}

.sidebar{
  position:sticky;
  top:88px;
  height:max-content;
}
.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:13px 14px;
  border-radius:15px;
  text-align:left;
  display:flex;
  align-items:center;
  gap:13px;
  font-weight:700;
}
.nav button:hover,.nav button.active{
  color:#fff;
  background:linear-gradient(90deg,rgba(124,92,255,.18),rgba(236,72,153,.08));
}
.nav svg{width:22px;height:22px}

.main{min-width:0}
.rightbar{position:sticky;top:88px;height:max-content}

.card{
  background:rgba(18,18,31,.84);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.stories{
  padding:15px;
  display:flex;
  gap:14px;
  overflow-x:auto;
  scrollbar-width:none;
  margin-bottom:18px;
}
.stories::-webkit-scrollbar{display:none}
.story{
  min-width:72px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
  cursor:pointer;
}
.story-avatar{
  width:64px;height:64px;
  margin:auto auto 7px;
  border-radius:50%;
  padding:2px;
  background:linear-gradient(135deg,var(--primary),var(--pink),var(--blue));
}
.story-avatar-inner{
  width:100%;height:100%;
  border-radius:50%;
  overflow:hidden;
  background:var(--panel2);
  border:2px solid var(--bg);
}
.story-avatar img{
  width:100%;height:100%;
  object-fit:cover;
}
.add-story .story-avatar-inner{
  display:grid;
  place-items:center;
  font-size:27px;
  color:#fff;
}

.create-box{
  padding:15px;
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:18px;
}
.avatar{
  width:44px;height:44px;
  border-radius:50%;
  overflow:hidden;
  background:linear-gradient(135deg,var(--primary),var(--pink));
  flex:none;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.create-input{
  flex:1;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--muted);
  border-radius:999px;
  padding:12px 17px;
  cursor:pointer;
}
.create-input:hover{border-color:var(--primary)}

.post{
  margin-bottom:18px;
  overflow:hidden;
}
.post-head{
  padding:15px;
  display:flex;
  align-items:center;
  gap:11px;
}
.post-user{flex:1}
.post-user strong{display:block;font-size:14px}
.post-user span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.more{margin-left:auto}
.post-body{
  padding:0 15px 15px;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.55;
}
.post-media{
  width:100%;
  max-height:700px;
  object-fit:cover;
  background:#05050a;
}
.post-actions{
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:3px;
  border-top:1px solid rgba(255,255,255,.04);
}
.post-actions button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:5px;
}
.post-actions button:hover{background:var(--panel2);color:#fff}
.post-actions .liked{color:#ff4d79}
.post-actions .saved{color:var(--blue)}
.post-actions svg{width:22px;height:22px}
.post-actions .save{margin-left:auto}
.count-line{
  padding:0 15px 12px;
  color:var(--muted);
  font-size:13px;
}
.comment-preview{
  padding:0 15px 13px;
  color:var(--muted);
  font-size:13px;
}
.comment-preview strong{color:#fff;margin-right:5px}

.right-card{
  padding:17px;
  margin-bottom:16px;
}
.right-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}
.right-title strong{font-size:14px}
.right-title button{
  border:0;background:transparent;color:var(--primary);font-weight:800;
}
.person{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}
.person-info{flex:1;min-width:0}
.person-info strong{
  font-size:13px;
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.person-info span{font-size:11px;color:var(--muted)}
.follow-btn,.primary-btn{
  border:0;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;
  border-radius:10px;
  padding:8px 12px;
  font-weight:800;
}
.follow-btn.following{background:var(--panel2);border:1px solid var(--line)}

.bottom-nav{
  display:none;
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:100;
  height:66px;
  background:rgba(8,8,18,.94);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  justify-content:space-around;
}
.bottom-nav button{
  flex:1;border:0;background:transparent;color:var(--muted);
  display:grid;place-items:center;
}
.bottom-nav button.active{color:#fff}
.bottom-nav svg{width:23px;height:23px}

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(10px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.modal.show{display:flex}
.modal-box{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:#11111d;
  border:1px solid var(--line);
  border-radius:25px;
  box-shadow:0 25px 100px rgba(0,0,0,.6);
}
.modal-head{
  padding:17px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
}
.modal-head strong{font-size:17px}
.modal-head button{margin-left:auto}
.modal-content{padding:18px}

.close{
  border:0;background:var(--panel2);color:#fff;
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;
}

.form-group{margin-bottom:15px}
.form-group label{
  display:block;font-size:12px;color:var(--muted);
  margin-bottom:7px;font-weight:700;
}
.form-control{
  width:100%;
  background:var(--panel2);
  color:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px 13px;
  outline:none;
}
.form-control:focus{border-color:var(--primary)}
textarea.form-control{min-height:120px;resize:vertical}

.upload-area{
  border:1px dashed #44445d;
  border-radius:16px;
  padding:22px;
  text-align:center;
  color:var(--muted);
  cursor:pointer;
}
.upload-area:hover{border-color:var(--primary);color:#fff}
.preview{
  margin-top:12px;
  border-radius:15px;
  overflow:hidden;
}
.preview img,.preview video{width:100%;max-height:360px;object-fit:contain;background:#05050a}

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 20%,rgba(124,92,255,.25),transparent 35%),
    radial-gradient(circle at 80% 70%,rgba(236,72,153,.18),transparent 35%),
    var(--bg);
}
.auth-box{
  width:min(430px,100%);
  background:rgba(18,18,31,.92);
  border:1px solid var(--line);
  border-radius:28px;
  padding:30px;
  box-shadow:var(--shadow);
}
.auth-logo{text-align:center;margin-bottom:10px}
.auth-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:25px}
.auth-switch{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
.auth-switch button{
  border:0;background:transparent;color:var(--primary);font-weight:800;
}

.profile-cover{
  height:210px;
  background:
    linear-gradient(135deg,rgba(124,92,255,.8),rgba(236,72,153,.6)),
    #171726;
  background-size:cover;
  background-position:center;
}
.profile-info{padding:0 20px 20px}
.profile-avatar{
  width:104px;height:104px;
  border-radius:50%;
  border:5px solid var(--bg);
  margin-top:-52px;
  background:var(--panel2);
  overflow:hidden;
}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:10px;
}
.profile-row h2{font-size:21px}
.profile-actions{margin-left:auto;display:flex;gap:8px}
.profile-bio{color:var(--muted);font-size:14px;margin-top:9px;line-height:1.5}
.stats{
  display:flex;
  gap:25px;
  margin-top:15px;
}
.stats div{text-align:center}
.stats strong{display:block}
.stats span{color:var(--muted);font-size:12px}

.settings-item{
  padding:16px 0;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:12px;
}
.settings-item:last-child{border-bottom:0}
.settings-item .info{flex:1}
.settings-item strong{display:block;font-size:14px}
.settings-item span{font-size:12px;color:var(--muted)}
.switch{
  width:48px;height:27px;border-radius:99px;
  background:#343447;padding:3px;
  transition:.2s;
}
.switch i{
  display:block;width:21px;height:21px;
  border-radius:50%;background:#fff;transition:.2s;
}
.switch.on{background:var(--primary)}
.switch.on i{transform:translateX(21px)}

.comments-list{
  max-height:430px;
  overflow:auto;
}
.comment{
  display:flex;
  gap:10px;
  padding:10px 0;
}
.comment-content{flex:1}
.comment-content strong{font-size:13px}
.comment-content p{font-size:13px;color:#ddd;margin-top:3px;line-height:1.4}
.comment-content small{font-size:10px;color:var(--muted)}
.comment-input{
  display:flex;
  gap:8px;
  margin-top:14px;
}
.comment-input input{
  flex:1;
  background:var(--panel2);
  color:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  padding:11px 15px;
  outline:none;
}

.message-layout{
  display:grid;
  grid-template-columns:190px 1fr;
  min-height:620px;
}
.conversation-list{border-right:1px solid var(--line);padding:10px}
.conv{
  padding:11px;
  border-radius:13px;
  cursor:pointer;
  display:flex;
  gap:9px;
  align-items:center;
}
.conv:hover,.conv.active{background:var(--panel2)}
.chat{display:flex;flex-direction:column;min-width:0}
.chat-head{padding:13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.chat-messages{flex:1;padding:15px;overflow:auto;min-height:400px}
.bubble-row{display:flex;margin-bottom:9px}
.bubble-row.me{justify-content:flex-end}
.bubble{
  max-width:72%;
  padding:9px 12px;
  border-radius:17px;
  background:var(--panel2);
  font-size:13px;
  line-height:1.4;
}
.me .bubble{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
}
.chat-input{
  padding:12px;
  border-top:1px solid var(--line);
  display:flex;
  gap:8px;
}
.chat-input input{
  flex:1;background:var(--panel2);color:#fff;border:1px solid var(--line);
  border-radius:999px;padding:11px 15px;outline:none;
}

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%) translateY(20px);
  background:#202033;
  border:1px solid var(--line);
  color:#fff;
  padding:12px 17px;
  border-radius:999px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:1000;
  box-shadow:var(--shadow);
  font-size:13px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
}
.empty strong{display:block;color:#fff;margin-bottom:5px}

.loader{
  width:30px;height:30px;border:3px solid #333344;
  border-top-color:var(--primary);border-radius:50%;
  animation:spin .7s linear infinite;margin:30px auto;
}
@keyframes spin{to{transform:rotate(360deg)}}

.page-title{
  font-size:24px;
  margin-bottom:18px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}
.grid-item{
  aspect-ratio:1;
  overflow:hidden;
  background:var(--panel2);
  cursor:pointer;
}
.grid-item img,.grid-item video{
  width:100%;height:100%;object-fit:cover;
}

@media(max-width:1050px){
  .layout{grid-template-columns:70px minmax(0,620px);justify-content:center}
  .sidebar{width:70px}
  .nav button{justify-content:center;font-size:0}
  .nav svg{width:24px;height:24px}
  .rightbar{display:none}
}
@media(max-width:700px){
  .topbar{height:60px}
  .topbar-inner{padding:0 12px}
  .logo{font-size:21px}
  .search{display:none}
  .layout{
    display:block;
    padding:75px 8px 78px;
  }
  .sidebar{display:none}
  .bottom-nav{display:flex}
  .card{border-radius:18px}
  .stories{margin-left:-0px;margin-right:-0px}
  .post-media{max-height:600px}
  .message-layout{grid-template-columns:1fr}
  .conversation-list{
    border-right:0;
    border-bottom:1px solid var(--line);
    display:flex;
    overflow:auto;
  }
  .conv{min-width:130px}
  .chat-messages{min-height:350px}
}

svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

<body>

<div id="authScreen" class="auth">
  <div class="auth-box">
    <div class="auth-logo logo">YOCEWOR</div>
    <div class="auth-sub">Your World. Your Voice.</div>

    <form id="authForm">
      <div class="form-group" id="usernameGroup">
        <label>Username</label>
        <input id="authUsername" class="form-control" placeholder="your_username">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input id="authEmail" class="form-control" type="email" required placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input id="authPassword" class="form-control" type="password" required minlength="6" placeholder="••••••••">
      </div>

      <button id="authSubmit" class="primary-btn" style="width:100%;padding:13px">
        Create account
      </button>
    </form>

    <div class="auth-switch">
      <span id="authSwitchText">Already have an account?</span>
      <button id="authSwitch">Log in</button>
    </div>
  </div>
</div>

<div id="app" class="app hidden">

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo" onclick="navigate('home')">YOCEWOR</div>

    <div class="search">
      <span class="search-icon">
        <svg width="19" height="19"><use href="#i-search"/></svg>
      </span>
      <input id="searchInput" placeholder="Search people and posts...">
    </div>

    <div class="top-actions">
      <button class="icon-btn" onclick="navigate('messages')" title="Messages">
        <svg><use href="#i-message"/></svg>
      </button>

      <button class="icon-btn badge-wrap" onclick="navigate('notifications')" title="Notifications">
        <svg><use href="#i-bell"/></svg>
        <span id="notificationBadge" class="badge hidden">0</span>
      </button>

      <button class="icon-btn" onclick="navigate('profile')" title="Profile">
        <svg><use href="#i-user"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="layout">

<aside class="sidebar">
  <nav class="nav">
    <button data-nav="home" onclick="navigate('home')">
      <svg><use href="#i-home"/></svg><span>Home</span>
    </button>
    <button data-nav="explore" onclick="navigate('explore')">
      <svg><use href="#i-compass"/></svg><span>Explore</span>
    </button>
    <button data-nav="create" onclick="openPostModal()">
      <svg><use href="#i-plus"/></svg><span>Create</span>
    </button>
    <button data-nav="messages" onclick="navigate('messages')">
      <svg><use href="#i-message"/></svg><span>Messages</span>
    </button>
    <button data-nav="notifications" onclick="navigate('notifications')">
      <svg><use href="#i-bell"/></svg><span>Notifications</span>
    </button>
    <button data-nav="saved" onclick="navigate('saved')">
      <svg><use href="#i-bookmark"/></svg><span>Saved</span>
    </button>
    <button data-nav="profile" onclick="navigate('profile')">
      <svg><use href="#i-user"/></svg><span>Profile</span>
    </button>
    <button data-nav="settings" onclick="navigate('settings')">
      <svg><use href="#i-settings"/></svg><span>Settings</span>
    </button>
  </nav>
</aside>

<main id="main" class="main"></main>

<aside class="rightbar" id="rightbar"></aside>

</div>

<nav class="bottom-nav">
  <button data-nav="home" onclick="navigate('home')"><svg><use href="#i-home"/></svg></button>
  <button data-nav="explore" onclick="navigate('explore')"><svg><use href="#i-compass"/></svg></button>
  <button data-nav="create" onclick="openPostModal()"><svg><use href="#i-plus"/></svg></button>
  <button data-nav="messages" onclick="navigate('messages')"><svg><use href="#i-message"/></svg></button>
  <button data-nav="profile" onclick="navigate('profile')"><svg><use href="#i-user"/></svg></button>
</nav>

</div>

<!-- SVG ICONS -->
<svg style="display:none">
<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>

const $ = id => document.getElementById(id);

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function timeAgo(date){
  const sec = Math.floor((Date.now()-new Date(date).getTime())/1000);
  if(sec < 60) return "just now";
  const min = Math.floor(sec/60);
  if(min < 60) return min+"m";
  const hr = Math.floor(min/60);
  if(hr < 24) return hr+"h";
  const day = Math.floor(hr/24);
  if(day < 7) return day+"d";
  return new Date(date).toLocaleDateString();
}

function toast(message){
  const el=$("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.classList.remove("show"),2600);
}

function openModal(id){$(id).classList.add("show")}
function closeModal(id){$(id).classList.remove("show")}

function avatarHTML(profile,size=""){
  const url=profile?.avatar_url;
  return `<div class="avatar ${size}">
    ${url ? `<img src="${escapeHTML(url)}" alt="">` : `<div style="height:100%;display:grid;place-items:center;font-weight:900">${escapeHTML((profile?.display_name||profile?.username||"U")[0].toUpperCase())}</div>`}
  </div>`;
}

function safeUrl(url){
  if(!url)return "";
  try{
    const u=new URL(url);
    if(["http:","https:"].includes(u.protocol))return u.href;
  }catch(e){}
  return "";
}

function mediaHTML(post){
  if(post.image_url){
    return `<img class="post-media" src="${escapeHTML(safeUrl(post.image_url))}" alt="Post image" loading="lazy">`;
  }
  if(post.video_url){
    return `<video class="post-media" src="${escapeHTML(safeUrl(post.video_url))}" controls playsinline></video>`;
  }
  return "";
}

$("authForm").addEventListener("submit",async e=>{

  const username=$("authUsername").value.trim().toLowerCase();

  $("authSubmit").disabled=true;

  try{
    if(authMode==="signup"){
      if(!/^[a-z0-9_]{3,30}$/.test(username)){
        throw new Error("Username must be 3–30 characters using lowercase letters, numbers or _");
      }

      const {error}=await db.auth.signUp({
        email,
        password,
        options:{
          data:{
            username,
            display_name:username
          }
        }
      });

    }else{
      const {error}=await db.auth.signInWithPassword({email,password});
      if(error)throw error;
    }

    toast(err.message||"Authentication failed");
  }finally{
    $("authSubmit").disabled=false;
    $("authSubmit").textContent=authMode==="signup"?"Create account":"Log in";

});

/* =========================================================

   ========================================================= */

async function init(){
  const {data}=await db.auth.getSession();

  if(data.session){
    await startApp(data.session.user);
  }else{
    $("authScreen").classList.remove("hidden");
  }

  db.auth.onAuthStateChange(async(event,session)=>{
    if(session){
      setTimeout(()=>startApp(session.user),0);
    }else{
      currentUser=null;
      currentProfile=null;
      $("app").classList.add("hidden");
      $("authScreen").classList.remove("hidden");
    }
  });
}

async function startApp(user){
  currentUser=user;

  const {data:profile,error}=await db
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();

  if(error){
    toast(error.message);
    return;
  }

  if(!profile){
    await createFallbackProfile(user);
  }else{
    currentProfile=profile;
  }

  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");

  await loadNotificationsCount();
  await navigate(currentPage);
  subscribeRealtime();
}

async function createFallbackProfile(user){
  let base=(user.user_metadata?.username||user.email?.split("@")[0]||"user")
    .toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,24);

  if(base.length<3)base="user_"+user.id.replaceAll("-","").slice(0,8);

  let username=base;

  const {data:existing}=await db
    .from("profiles")
    .select("username")
    .eq("username",username)
    .maybeSingle();

  if(existing)username=base.slice(0,18)+"_"+user.id.replaceAll("-","").slice(0,6);

  const {data,error}=await db.from("profiles").insert({
    id:user.id,
    username,
    display_name:user.user_metadata?.display_name||username,
    bio:"Your voice. Your ideas. Your world."
  }).select().single();

  if(!error)currentProfile=data;

  await db.from("user_settings").upsert({user_id:user.id});
}

async function navigate(page){

  document.querySelectorAll("[data-nav]").forEach(x=>{
    x.classList.toggle("active",x.dataset.nav===page);
  });

  const main=$("main");
  main.innerHTML=`<div class="loader"></div>`;

  if(page==="home")await renderHome();
  else if(page==="explore")await renderExplore();
  else if(page==="profile")await renderProfile(currentUser.id);
  else if(page==="saved")await renderSaved();
  else if(page==="notifications")await renderNotifications();
  else if(page==="messages")await renderMessages();
  else if(page==="settings")await renderSettings();
  else if(page.startsWith("user:"))await renderProfile(page.split(":")[1]);

  await renderRightbar();
}

        <div class="story-avatar-inner">
          <span>+</span>

              ? `<img src="${escapeHTML(s.profiles.avatar_url)}">`

async function fetchPosts(){
  const {data,error}=await db
    .from("posts")
    .select(`
      *,
      profiles:user_id(id,username,display_name,avatar_url)
    `)
    .order("created_at",{ascending:false})
    .limit(100);

  if(error){
    toast(error.message);
    return [];
  }

  const postIds=(data||[]).map(x=>x.id);

  let likes=[];
  let comments=[];

  if(postIds.length){
    const l=await db.from("likes").select("post_id,user_id").in("post_id",postIds);
    likes=l.data||[];

    const c=await db
      .from("comments")
      .select("id,post_id,user_id,body,created_at,profiles:user_id(username,display_name,avatar_url)")
      .in("post_id",postIds)
      .order("created_at",{ascending:true});

    comments=c.data||[];
  }

  return (data||[]).map(post=>{
    const pl=likes.filter(x=>x.post_id===post.id);
    const pc=comments.filter(x=>x.post_id===post.id);

    return {
      ...post,
      likes:pl,
      comments:pc,
      liked:pl.some(x=>x.user_id===currentUser.id)
    };
  });
}

  </article>`;
}

/* =========================================================
   MEDIA UPLOAD
   ========================================================= */

async function uploadMedia(file,folder){
  const ext=file.name.split(".").pop().toLowerCase();
  const path=`${folder}/${currentUser.id}/${crypto.randomUUID()}.${ext}`;

  const {error}=await db.storage
    .from(MEDIA_BUCKET)
    .upload(path,file,{
      cacheControl:"3600",
      upsert:false,
      contentType:file.type
    });

  if(error)throw error;

  const {data}=db.storage
    .from(MEDIA_BUCKET)
    .getPublicUrl(path);

  if(!data?.publicUrl)throw new Error("Could not create media URL");

  return data.publicUrl;
}

  const url=URL.createObjectURL(postFile);

  preview.classList.remove("hidden");
  preview.innerHTML=postFile.type.startsWith("video/")
    ? `<video src="${url}" controls></video>`

});

    $("storyPreview").innerHTML="";
    $("storyPreview").classList.add("hidden");

    closeModal("storyModal");

async function openConversation(conversationId){
  currentConversation=conversationId;

  const {data:members}=await db
    .from("conversation_members")
    .select(`
      user_id,
      profiles:user_id(id,username,display_name,avatar_url)
    `)
    .eq("conversation_id",conversationId);

  const other=members?.find(x=>x.user_id!==currentUser.id)?.profiles;

  $("chat").innerHTML=`
    <div class="chat-head">
      ${avatarHTML(other)}
      <div class="person-info">
        <strong>${escapeHTML(other?.display_name||"Chat")}</strong>
        <span>@${escapeHTML(other?.username||"user")}</span>
      </div>
    </div>

    <div id="chatMessages" class="chat-messages"></div>

    <div class="chat-input">
      <input id="messageInput" placeholder="Write a message..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="primary-btn" onclick="sendMessage()">
        <svg width="20" height="20"><use href="#i-send"/></svg>
      </button>
    </div>
  `;

  await loadMessages(conversationId);
}

async function loadMessages(conversationId){
  const {data,error}=await db
    .from("messages")
    .select("*")
    .eq("conversation_id",conversationId)
    .order("created_at",{ascending:true});

  if(error){
    toast(error.message);
    return;
  }

  const el=$("chatMessages");
  if(!el)return;

  el.innerHTML=(data||[]).map(m=>`
    <div class="bubble-row ${m.sender_id===currentUser.id?"me":""}">
      <div class="bubble">${escapeHTML(m.body)}</div>
    </div>
  `).join("");

  el.scrollTop=el.scrollHeight;
}

async function sendMessage(){
  const input=$("messageInput");
  const body=input?.value.trim();

  if(!body||!currentConversation)return;

  const {error}=await db.from("messages").insert({
    conversation_id:currentConversation,
    sender_id:currentUser.id,
    body,
    message_type:"text"
  });

  if(error){
    toast(error.message);
    return;
  }

  input.value="";
  await loadMessages(currentConversation);
}

async function startConversation(){
  const username=$("messageUsername").value.trim().toLowerCase();

  if(!username)return;

  const {data:user,error}=await db
    .from("profiles")
    .select("*")
    .eq("username",username)
    .maybeSingle();

  if(error||!user){
    toast("User not found");
    return;
  }

  if(user.id===currentUser.id){
    toast("You cannot message yourself");
    return;
  }

  const {data:existing}=await db
    .from("conversation_members")
    .select(`
      conversation_id,
      conversations(
        conversation_members(user_id)
      )
    `)
    .eq("user_id",currentUser.id);

  let conversationId=null;

  for(const c of existing||[]){
    const ids=(c.conversations?.conversation_members||[]).map(x=>x.user_id);
    if(ids.includes(user.id)&&ids.length===2){
      conversationId=c.conversation_id;
      break;
    }
  }

  if(!conversationId){
    const {data:conv,error:convError}=await db
      .from("conversations")
      .insert({})
      .select()
      .single();

    if(convError){
      toast(convError.message);
      return;
    }

    conversationId=conv.id;

    const {error:memberError}=await db
      .from("conversation_members")
      .insert([
        {conversation_id:conversationId,user_id:currentUser.id},
        {conversation_id:conversationId,user_id:user.id}
      ]);

    if(memberError){
      toast(memberError.message);
      return;
    }
  }

  $("messageUsername").value="";
  closeModal("messageModal");
  await navigate("messages");
  await openConversation(conversationId);
}

/* =========================================================
   REALTIME
   ========================================================= */

let realtimeStarted=false;

function subscribeRealtime(){
  if(realtimeStarted)return;
  realtimeStarted=true;

  db.channel("yocewor-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"likes"},()=>{
      if(currentPage==="home")renderHome();
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"comments"},()=>{
      if(currentPage==="home")renderHome();
      if(currentCommentPost)loadComments(currentCommentPost);
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"posts"},()=>{
      if(currentPage==="home")renderHome();
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"stories"},()=>{
      if(currentPage==="home")renderHome();
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"notifications"},()=>{
      loadNotificationsCount();
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"messages"},payload=>{
      if(currentConversation&&payload.new?.conversation_id===currentConversation){
        loadMessages(currentConversation);
      }
    })
    .subscribe();
}
